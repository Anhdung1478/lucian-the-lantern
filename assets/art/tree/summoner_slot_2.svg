  <circle cx="47" cy="32" r="21" fill="url(#glow)"/>
  <path d="M 47 12 L 47 8 M 47 52 L 47 56 M 61 18 L 63.5 15.5 M 33 18 L 30.5 15.5 M 61 46 L 63.5 48.5 M 33 46 L 30.5 48.5" stroke="#ffe9a8" stroke-width="2" stroke-linecap="round"/>

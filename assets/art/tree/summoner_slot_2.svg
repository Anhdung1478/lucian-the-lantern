    <radialGradient id="face" cx="0.5" cy="0.4" r="0.6"><stop offset="0" stop-color="#22302c"/><stop offset="1" stop-color="#0a0f10"/></radialGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#ffcf5a" stop-opacity="0.75"/><stop offset="1" stop-color="#ffcf5a" stop-opacity="0"/></radialGradient>
    <radialGradient id="lit"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#ffe9a8"/><stop offset="1" stop-color="#e0a030"/></radialGradient>

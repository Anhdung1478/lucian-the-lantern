      <stop offset="0.62" stop-color="#b86414" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#b86414" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="domeFill" cx="26" cy="22" r="32" gradientUnits="userSpaceOnUse">

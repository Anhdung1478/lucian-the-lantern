  <path d="M 44 46.2 L 50 40.2 M 44 55.7 L 50 49.7" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M 56 34 L 56.9 36.4 L 59.3 37.3 L 56.9 38.2 L 56 40.6 L 55.1 38.2 L 52.7 37.3 L 55.1 36.4 Z" fill="#fffce6"/>

      <stop offset="0" stop-color="#86f592" stop-opacity="0.58"/>
      <stop offset="0.6" stop-color="#228836" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#228836" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heartFill" cx="22" cy="20" r="38" gradientUnits="userSpaceOnUse">

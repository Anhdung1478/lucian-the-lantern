<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64">
  <!-- Q – Piercing Light: a gold-white beam piercing three dark diamonds in a row -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d3328"/><stop offset="1" stop-color="#0c1018"/></linearGradient>
    <radialGradient id="spark"><stop offset="0" stop-color="#ffffff"/><stop offset="0.4" stop-color="#ffe9a8" stop-opacity="0.8"/><stop offset="1" stop-color="#ffcf5a" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="64" height="64" fill="url(#bg)"/>
  <g transform="rotate(-25 32 32)">
    <g fill="#4a3c6c">
      <path d="M 12 20 L 21 32 L 12 44 L 3 32 Z"/>
      <path d="M 32 20 L 41 32 L 32 44 L 23 32 Z"/>
      <path d="M 52 20 L 61 32 L 52 44 L 43 32 Z"/>
    </g>
    <g fill="#7e6cae">
      <path d="M 12 20 L 3 32 L 12 32 Z"/>
      <path d="M 32 20 L 23 32 L 32 32 Z"/>
      <path d="M 52 20 L 43 32 L 52 32 Z"/>
    </g>
    <g fill="none" stroke="#c4b6ec" stroke-width="1.6" stroke-linejoin="round">
      <path d="M 12 20 L 21 32 L 12 44 L 3 32 Z"/>
      <path d="M 32 20 L 41 32 L 32 44 L 23 32 Z"/>
      <path d="M 52 20 L 61 32 L 52 44 L 43 32 Z"/>
    </g>
    <path d="M -12 32 L 76 32" stroke="#ffcf5a" stroke-width="7" opacity="0.45"/>
    <path d="M -12 32 L 76 32" stroke="#ffe9a8" stroke-width="4" opacity="0.8"/>
    <path d="M -12 32 L 76 32" stroke="#fffbe8" stroke-width="2"/>
    <circle cx="12" cy="32" r="5" fill="url(#spark)"/>
    <circle cx="32" cy="32" r="5" fill="url(#spark)"/>
    <circle cx="52" cy="32" r="5" fill="url(#spark)"/>
  </g>
</svg>

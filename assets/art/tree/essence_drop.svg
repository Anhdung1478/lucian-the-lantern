<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64">
  <!-- Essence Drop V2.2: Trio of sculpted Blue, Orange, and Purple Essence relics hovering over a luminous pool -->
  <defs>
    <radialGradient id="aura" cx="32" cy="32" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c9a8ff" stop-opacity="0.54"/>
      <stop offset="0.52" stop-color="#4e8cff" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#4e8cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="purpLit" x1="22" y1="6" x2="42" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f5e0ff"/>
      <stop offset="0.45" stop-color="#bf70ff"/>
      <stop offset="1" stop-color="#45108c"/>
    </linearGradient>
    <linearGradient id="blueLit" x1="10" y1="18" x2="28" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e3f7ff"/>
      <stop offset="0.45" stop-color="#58b8ff"/>
      <stop offset="1" stop-color="#123a94"/>
    </linearGradient>
    <linearGradient id="orgLit" x1="36" y1="18" x2="54" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff4c8"/>
      <stop offset="0.45" stop-color="#ff9929"/>
      <stop offset="1" stop-color="#8f2706"/>
    </linearGradient>
    <radialGradient id="motePool" cx="32" cy="54" r="19" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff8d6" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#7eb8ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#aura)"/>
  <ellipse cx="32" cy="54" rx="20" ry="6" fill="url(#motePool)"/>
  <circle cx="15" cy="55" r="2" fill="#8fd6ff"/>
  <circle cx="32" cy="57" r="2.2" fill="#e6ccff"/>
  <circle cx="49" cy="55" r="2" fill="#ffcc7a"/>
  <!-- center-top Imperial Amethyst Purple relic -->
  <polygon points="32,6 43,17 44,25 32,40 20,25 21,17" fill="url(#purpLit)" stroke="#18082e" stroke-width="2.2" stroke-linejoin="round"/>
  <polygon points="32,6 21,17 28,23 32,19" fill="#f7e8ff" opacity="0.88"/>
  <polygon points="44,25 36,23 32,40" fill="#2e0a63" opacity="0.72"/>
  <polygon points="32,15 36,22 32,30 28,22" fill="#ffffff" opacity="0.8"/>
  <polygon points="32,6 43,17 44,25 32,40 20,25 21,17" fill="none" stroke="#18082e" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- front-left Sentinel Sapphire Blue crystal -->
  <polygon points="18,17 26,27 27,39 18,51 9,39 10,27" fill="url(#blueLit)" stroke="#0d192e" stroke-width="2.2" stroke-linejoin="round"/>
  <polygon points="18,17 10,27 18,32" fill="#f0fbff" opacity="0.88"/>
  <polygon points="18,32 27,39 18,51" fill="#0d2154" opacity="0.7"/>
  <polygon points="18,24 21.5,33 18,43 14.5,33" fill="#ffffff" opacity="0.78"/>
  <polygon points="18,17 26,27 27,39 18,51 9,39 10,27" fill="none" stroke="#0d192e" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- front-right Solar Ember Orange sunstone -->
  <polygon points="46,17 55,28 53,41 46,51 39,41 37,28" fill="url(#orgLit)" stroke="#240f06" stroke-width="2.2" stroke-linejoin="round"/>
  <polygon points="46,17 37,28 46,32" fill="#fff7d6" opacity="0.88"/>
  <polygon points="46,32 53,41 46,51" fill="#6b1a04" opacity="0.7"/>
  <polygon points="46,24 50,33 46,42 42,33" fill="#fff8d6" opacity="0.9"/>
  <polygon points="46,17 55,28 53,41 46,51 39,41 37,28" fill="none" stroke="#240f06" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- sparkles -->
  <path d="M 11 11 L 12 13.6 L 14.6 14.6 L 12 15.6 L 11 18.2 L 10 15.6 L 7.4 14.6 L 10 13.6 Z" fill="#dbf5ff"/>
  <path d="M 53 10 L 54 12.6 L 56.6 13.6 L 54 14.6 L 53 17.2 L 52 14.6 L 49.4 13.6 L 52 12.6 Z" fill="#fff2cc"/>
</svg>

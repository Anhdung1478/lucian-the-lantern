<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64">
  <!-- Passive – Lightslinger: two crossed relic pistols with a double muzzle spark -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d3328"/><stop offset="1" stop-color="#0c1018"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#ffffff"/><stop offset="0.4" stop-color="#ffe9a8" stop-opacity="0.85"/><stop offset="1" stop-color="#ffcf5a" stop-opacity="0"/></radialGradient>
    <g id="gun">
      <path d="M -44 -4.5 L -47 -7.5 L -43.5 -7.5 L -41 -4.3 Z" fill="#525a6a" stroke="#c9a45c" stroke-width="1.1" stroke-linejoin="round"/>
      <path d="M -44 -4.5 L -3 -3.5 L 0 -2 L 0 2.5 L -30 2.5 L -32 5 L -35 5 L -42 14 L -50 12.5 L -43 3 Z" fill="#525a6a" stroke="#c9a45c" stroke-width="1.3" stroke-linejoin="round"/>
      <path d="M -42 -1 L -4 -1" stroke="#c9a45c" stroke-width="1"/>
      <path d="M -42 -2.6 L -4 -2.4" stroke="#9aa3b2" stroke-width="0.8"/>
      <path d="M -24 2.5 C -24 7.5 -30 8 -32.5 5.5" fill="none" stroke="#c9a45c" stroke-width="1.1"/>
      <circle cx="-39" cy="0.5" r="1.6" fill="#fffbe8"/>
    </g>
    <path id="spark" d="M 0 -9 L 2 -2 L 9 0 L 2 2 L 0 9 L -2 2 L -9 0 L -2 -2 Z" fill="#fffbe8"/>
  </defs>
  <rect width="64" height="64" fill="url(#bg)"/>
  <use href="#gun" transform="translate(49 11) rotate(-45) scale(1.15)"/>
  <use href="#gun" transform="matrix(-1 0 0 1 64 0) translate(49 11) rotate(-45) scale(1.15)"/>
  <circle cx="50" cy="10" r="10" fill="url(#glow)"/>
  <circle cx="14" cy="10" r="10" fill="url(#glow)"/>
  <use href="#spark" transform="translate(50 10)"/>
  <use href="#spark" transform="translate(14 10)"/>
</svg>

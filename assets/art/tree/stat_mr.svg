<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64">
  <!-- Magic Resist: luminous sky-cyan arcane ward ring and runic barrier orb -->
  <defs>
    <radialGradient id="aura" cx="32" cy="32" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8ce0ff" stop-opacity="0.6"/>
      <stop offset="0.6" stop-color="#2280bf" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2280bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ward" cx="24" cy="22" r="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d9f6ff"/>
      <stop offset="0.5" stop-color="#6ecfff"/>
      <stop offset="1" stop-color="#2374b3"/>
    </radialGradient>
    <radialGradient id="core" cx="29" cy="28" r="14" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#b5ecff"/>
      <stop offset="1" stop-color="#3c9fd9"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#aura)"/>
  <!-- outer ward disc -->
  <circle cx="32" cy="32" r="24.5" fill="url(#ward)" stroke="#1a1d24" stroke-width="2.5"/>
  <!-- crescent shadow -->
  <path d="M 50.5 16 A 24.5 24.5 0 0 1 16 50.5 A 26.5 26.5 0 0 0 50.5 16 Z" fill="#1c5c94" opacity="0.65"/>
  <!-- subtle runic ring & cardinal notches -->
  <circle cx="32" cy="32" r="17.5" fill="none" stroke="#e3f8ff" stroke-width="1.3" opacity="0.7" stroke-dasharray="5 3.5"/>
  <path d="M 32 9.5 L 32 14 M 32 50 L 32 54.5 M 9.5 32 L 14 32 M 50 32 L 54.5 32" stroke="#ffffff" stroke-width="2.1" stroke-linecap="round" opacity="0.85"/>
  <!-- specular rim highlight -->
  <path d="M 13 29.5 A 19.5 19.5 0 0 1 26.5 13.5" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="32" cy="32" r="24.5" fill="none" stroke="#1a1d24" stroke-width="2.5"/>
  <!-- central barrier orb -->
  <circle cx="32" cy="32" r="11" fill="url(#core)" stroke="#1a1d24" stroke-width="2.4"/>
  <path d="M 39.5 24.5 A 11 11 0 0 1 24.5 39.5 A 12.5 12.5 0 0 0 39.5 24.5 Z" fill="#3c9fd9" opacity="0.7"/>
  <circle cx="28.8" cy="28.2" r="3" fill="#ffffff" opacity="0.95"/>
  <circle cx="32" cy="32" r="11" fill="none" stroke="#1a1d24" stroke-width="2.4"/>
  <!-- sparkle -->
  <path d="M 52 12 L 53.1 14.9 L 56 16 L 53.1 17.1 L 52 20 L 50.9 17.1 L 48 16 L 50.9 14.9 Z" fill="#e8f9ff"/>
</svg>

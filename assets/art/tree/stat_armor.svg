<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64">
  <!-- Armor: sculpted gold-bronze Sentinel heater shield with bevel highlight -->
  <defs>
    <radialGradient id="aura" cx="32" cy="32" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f7cf59" stop-opacity="0.56"/>
      <stop offset="0.6" stop-color="#a87618" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#a87618" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="10" y1="8" x2="54" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff0b5"/>
      <stop offset="0.45" stop-color="#e3ad34"/>
      <stop offset="1" stop-color="#7c4f0e"/>
    </linearGradient>
    <linearGradient id="faceLit" x1="12" y1="12" x2="32" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe79e"/>
      <stop offset="0.55" stop-color="#e6b038"/>
      <stop offset="1" stop-color="#b87f1c"/>
    </linearGradient>
    <linearGradient id="faceShade" x1="32" y1="12" x2="52" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c48c20"/>
      <stop offset="0.6" stop-color="#966212"/>
      <stop offset="1" stop-color="#613a0a"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#aura)"/>
  <!-- outer shield silhouette -->
  <path d="M 32 6 C 39 9 47 10.5 55 10.5 L 55 29 C 55 42.5 46 52 32 58.5 C 18 52 9 42.5 9 29 L 9 10.5 C 17 10.5 25 9 32 6 Z" fill="url(#rim)" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- recessed inner face -->
  <path d="M 32 11 C 38 13.4 44.5 14.7 50.5 14.8 L 50.5 29 C 50.5 39.8 43.2 47.6 32 53.2 C 20.8 47.6 13.5 39.8 13.5 29 L 13.5 14.8 C 19.5 14.7 26 13.4 32 11 Z" fill="url(#faceLit)"/>
  <path d="M 32 11 C 38 13.4 44.5 14.7 50.5 14.8 L 50.5 29 C 50.5 39.8 43.2 47.6 32 53.2 Z" fill="url(#faceShade)"/>
  <path d="M 32 11 C 38 13.4 44.5 14.7 50.5 14.8 L 50.5 29 C 50.5 39.8 43.2 47.6 32 53.2 C 20.8 47.6 13.5 39.8 13.5 29 L 13.5 14.8 C 19.5 14.7 26 13.4 32 11 Z" fill="none" stroke="#6e430b" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- central ridge & Sentinel crest -->
  <path d="M 32 11.5 L 32 52.5" stroke="#5e3809" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M 32 22 L 37.5 30 L 32 39 L 26.5 30 Z" fill="#fff2be" stroke="#7c4f0e" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M 32 22 L 37.5 30 L 32 39 Z" fill="#d49622"/>
  <!-- specular rim highlight -->
  <path d="M 12.2 28 L 12.2 13.5 C 17.5 13.2 22.8 12.2 28.5 10" fill="none" stroke="#fff8db" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- outer stroke crispness -->
  <path d="M 32 6 C 39 9 47 10.5 55 10.5 L 55 29 C 55 42.5 46 52 32 58.5 C 18 52 9 42.5 9 29 L 9 10.5 C 17 10.5 25 9 32 6 Z" fill="none" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- sparkle -->
  <path d="M 52 13 L 53.1 15.9 L 56 17 L 53.1 18.1 L 52 21 L 50.9 18.1 L 48 17 L 50.9 15.9 Z" fill="#fff8db"/>
</svg>

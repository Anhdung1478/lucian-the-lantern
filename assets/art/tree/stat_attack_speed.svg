    <g id="dagger">
      <path d="M 0 -27 L 4.5 -18 L 4 2 L -4 2 L -4.5 -18 Z" fill="#fff3a3" stroke="#1a1d24" stroke-width="2" stroke-linejoin="round"/>
      <path d="M 0 -24 L 0 0" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
      <rect x="-9" y="2" width="18" height="4.5" rx="1.5" fill="#c9a45c" stroke="#1a1d24" stroke-width="2"/>
      <rect x="-2.5" y="6.5" width="5" height="9" fill="#6a4a2a" stroke="#1a1d24" stroke-width="2"/>
      <circle cx="0" cy="18" r="2.8" fill="#c9a45c" stroke="#1a1d24" stroke-width="1.8"/>

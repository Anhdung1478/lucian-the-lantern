<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64">
  <!-- Attack Speed: twin golden aerodynamic speed chevrons (>>) with luminous streaks -->
  <defs>
    <radialGradient id="aura" cx="32" cy="32" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffef94" stop-opacity="0.58"/>
      <stop offset="0.6" stop-color="#c99524" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#c99524" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chevLit" x1="12" y1="10" x2="52" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffbe0"/>
      <stop offset="0.55" stop-color="#ffe578"/>
      <stop offset="1" stop-color="#e3ad2c"/>
    </linearGradient>
    <linearGradient id="chevShade" x1="16" y1="32" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#dba426"/>
      <stop offset="1" stop-color="#8c5b10"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#aura)"/>
  <!-- speed streaks -->
  <path d="M 5 22 L 15 22 M 3 32 L 17 32 M 6 42 L 15 42" stroke="#fff3a8" stroke-width="2.2" stroke-linecap="round" opacity="0.8"/>
  <!-- left chevron -->
  <path d="M 22 10 L 37 32 L 22 54 L 12 54 L 27 32 L 12 10 Z" fill="url(#chevLit)" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 37 32 L 22 54 L 12 54 L 27 32 Z" fill="url(#chevShade)"/>
  <path d="M 16.5 14 L 29.5 32" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>
  <path d="M 22 10 L 37 32 L 22 54 L 12 54 L 27 32 L 12 10 Z" fill="none" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- right chevron -->
  <path d="M 40 10 L 55 32 L 40 54 L 30 54 L 45 32 L 30 10 Z" fill="url(#chevLit)" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 55 32 L 40 54 L 30 54 L 45 32 Z" fill="url(#chevShade)"/>
  <path d="M 39.5 14 L 50.5 30" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M 40 10 L 55 32 L 40 54 L 30 54 L 45 32 L 30 10 Z" fill="none" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- sparkles -->
  <path d="M 55 12 L 56.1 14.9 L 59 16 L 56.1 17.1 L 55 20 L 53.9 17.1 L 51 16 L 53.9 14.9 Z" fill="#fffbe0"/>
  <path d="M 11 49 L 11.8 51.2 L 14 52 L 11.8 52.8 L 11 55 L 10.2 52.8 L 8 52 L 10.2 51.2 Z" fill="#ffe578"/>
</svg>

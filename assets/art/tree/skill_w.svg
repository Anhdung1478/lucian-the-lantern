<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64">
  <!-- W – Ardent Blaze: an orange flare bursting into a 4-way cross with a star mark at its center -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d3328"/><stop offset="1" stop-color="#0c1018"/></linearGradient>
    <radialGradient id="flare"><stop offset="0" stop-color="#ffd27a" stop-opacity="0.9"/><stop offset="0.5" stop-color="#ff7a1a" stop-opacity="0.45"/><stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/></radialGradient>
    <g id="arm">
      <path d="M 25 28 C 25 19 28 12 32 3 C 36 12 39 19 39 28 Z" fill="#ff7a1a" stroke="#1a1d24" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M 28.5 28 C 28.5 22 30 16 32 10 C 34 16 35.5 22 35.5 28 Z" fill="#ffd27a"/>
    </g>
  </defs>
  <rect width="64" height="64" fill="url(#bg)"/>
  <circle cx="32" cy="32" r="30" fill="url(#flare)"/>
  <use href="#arm"/>
  <use href="#arm" transform="rotate(90 32 32)"/>
  <use href="#arm" transform="rotate(180 32 32)"/>
  <use href="#arm" transform="rotate(270 32 32)"/>
  <circle cx="32" cy="32" r="11" fill="#ff9a3c" stroke="#1a1d24" stroke-width="1.5"/>
  <path d="M 32 22 L 34.6 28.4 L 41.5 28.9 L 36.2 33.3 L 37.9 40.1 L 32 36.4 L 26.1 40.1 L 27.8 33.3 L 22.5 28.9 L 29.4 28.4 Z" fill="#fff6dc" stroke="#a8401a" stroke-width="1.2" stroke-linejoin="round"/>
  <g fill="#ffd27a">
    <circle cx="14" cy="14" r="2"/>
    <circle cx="50" cy="14" r="1.6"/>
    <circle cx="50" cy="50" r="2"/>
    <circle cx="14" cy="50" r="1.6"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- Senna: seen from above, in a dark hooded coat edged with teal light, a long scarf of light trailing behind, a big relic cannon held forward (+X) with glowing teal-white coils and a bright muzzle. -->
  <defs>
    <radialGradient id="coat" cx="0.35" cy="0.4"><stop offset="0" stop-color="#2e4250"/><stop offset="1" stop-color="#18222b"/></radialGradient>
    <linearGradient id="barrel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6a7c88"/><stop offset="1" stop-color="#36424c"/></linearGradient>
  </defs>
  <g transform="translate(50 50)">
    <!-- scarf of light trailing behind -->
    <path d="M -22 -6 Q -34 -12 -40 -8 Q -34 -4 -42 0 Q -34 4 -40 8 Q -34 12 -22 6 Z" fill="#7be0d0" stroke="#1a1d24" stroke-width="2.6" stroke-linejoin="round" opacity="0.95"/>
    <path d="M -26 0 L -38 0" fill="none" stroke="#e6fffa" stroke-width="2.2" stroke-linecap="round"/>
    <!-- coat -->
    <path d="M -28 0 Q -28 -30 -4 -30 Q 10 -30 10 -18 L 10 18 Q 10 30 -4 30 Q -28 30 -28 0 Z" fill="url(#coat)" stroke="#1a1d24" stroke-width="3" stroke-linejoin="round"/>
    <path d="M -24 -12 Q -28 0 -24 12 M -8 -26 Q 2 -27 7 -20 M -8 26 Q 2 27 7 20" fill="none" stroke="#5fd8c8" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M -18 -18 Q -22 0 -18 18" fill="none" stroke="#0f161c" stroke-width="2.4" stroke-linecap="round"/>
    <!-- arms holding the cannon -->
    <path d="M 0 -20 L 18 -12" stroke="#1a1d24" stroke-width="9.5" stroke-linecap="round"/>
    <path d="M 0 -20 L 18 -12" stroke="#34495a" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M 0 20 L 22 10" stroke="#1a1d24" stroke-width="9.5" stroke-linecap="round"/>
    <path d="M 0 20 L 22 10" stroke="#34495a" stroke-width="5.5" stroke-linecap="round"/>
    <circle cx="19" cy="-12" r="3.6" fill="#d2a584" stroke="#1a1d24" stroke-width="2"/>
    <circle cx="23" cy="10" r="3.6" fill="#d2a584" stroke="#1a1d24" stroke-width="2"/>
    <!-- the relic cannon: heavy stock, long barrel, glowing coils, muzzle -->
    <path d="M -6 -12 L 14 -14 L 14 14 L -6 12 Q -12 0 -6 -12 Z" fill="#46545e" stroke="#1a1d24" stroke-width="3" stroke-linejoin="round"/>
    <rect x="12" y="-9" width="32" height="18" rx="4" fill="url(#barrel)" stroke="#1a1d24" stroke-width="3"/>
    <path d="M 14 -6 L 42 -6" fill="none" stroke="#c4d2da" stroke-width="2" stroke-linecap="round"/>
    <rect x="18" y="-11.5" width="5.5" height="23" rx="2" fill="#b8fff0" stroke="#1a1d24" stroke-width="2"/>
    <rect x="31" y="-11.5" width="5.5" height="23" rx="2" fill="#b8fff0" stroke="#1a1d24" stroke-width="2"/>
    <path d="M 44 -11 L 48 -7 L 48 7 L 44 11 Z" fill="#2c363e" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="4" cy="0" r="6" fill="#b8fff0" stroke="#1a1d24" stroke-width="2"/>
    <circle cx="4" cy="0" r="2.6" fill="#ffffff"/>
    <!-- muzzle light -->
    <circle cx="48" cy="0" r="8" fill="#b8fff0" opacity="0.35"/>
    <circle cx="48" cy="0" r="3.5" fill="#f0fffc"/>
    <!-- hood, her light inside -->
    <ellipse cx="-6" cy="0" rx="12.5" ry="13.5" fill="#2e4250" stroke="#1a1d24" stroke-width="3"/>
    <path d="M -12 -9 Q -6 -13 2 -9" fill="none" stroke="#5fd8c8" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M -2 -9 Q 6 0 -2 9" fill="none" stroke="#1a1d24" stroke-width="3" stroke-linecap="round"/>
    <circle cx="-8" cy="0" r="6" fill="#b8fff0" opacity="0.35"/>
    <path d="M -14 -4.5 Q -10 0 -14 4.5" fill="none" stroke="#e6fffa" stroke-width="2.4" stroke-linecap="round"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="88" height="88" viewBox="0 0 88 88">
  <!-- Chain Warden (top-down, facing +X): armored Shadow Isles Jailer with broad hunched dark-iron shoulders, forged iron chain links across his back, hooded dark-iron helm with eerie emerald visor glow, left hand gripping coiled spectral chain, right arm swinging a wicked curved iron hook-blade forward (+X). -->
  <defs>
    <linearGradient id="cwIron" x1="0.1" y1="0.1" x2="0.9" y2="0.9">
      <stop offset="0" stop-color="#6c7a85"/>
      <stop offset="0.45" stop-color="#37424a"/>
      <stop offset="1" stop-color="#171d24"/>
    </linearGradient>
    <linearGradient id="cwCoat" x1="0.2" y1="0.1" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#2c4a3e"/>
      <stop offset="0.55" stop-color="#182b24"/>
      <stop offset="1" stop-color="#0c1714"/>
    </linearGradient>
    <linearGradient id="cwBlade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cad6de"/>
      <stop offset="0.5" stop-color="#6d7c87"/>
      <stop offset="1" stop-color="#2a333b"/>
    </linearGradient>
    <radialGradient id="cwEmeraldGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7cffb2" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#1cc46e" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0b4d2e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g transform="translate(42 44)">
    <!-- Tattered jailer coat hem trailing behind (-X) -->
    <path d="M -14 -20 L -32 -18 L -26 -10 L -34 -2 L -26 6 L -33 15 L -14 20 Z" fill="url(#cwCoat)" stroke="#14171f" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M -18 -13 L -27 -12 M -18 11 L -26 11" stroke="#4f856e" stroke-width="1.3" stroke-linecap="round" opacity="0.7"/>

    <!-- Broad hunched armored torso -->
    <path d="M -22 0 C -22 -18, -10 -27, 5 -24 C 14 -22, 16 -10, 16 0 C 16 10, 14 22, 5 24 C -10 27, -22 18, -22 0 Z" fill="url(#cwCoat)" stroke="#14171f" stroke-width="2"/>

    <!-- Individually forged heavy iron chain links draped across his hunched back -->
    <g stroke="#14171f" stroke-width="1.5" fill="none">
      <ellipse cx="-10" cy="-19" rx="5.2" ry="3.2" transform="rotate(-48 -10 -19)" stroke="#14171f" stroke-width="4.4"/>
      <ellipse cx="-10" cy="-19" rx="5.2" ry="3.2" transform="rotate(-48 -10 -19)" stroke="#92a0ab" stroke-width="2"/>
      <ellipse cx="-16" cy="-11" rx="5.4" ry="3.2" transform="rotate(-70 -16 -11)" stroke="#14171f" stroke-width="4.4"/>
      <ellipse cx="-16" cy="-11" rx="5.4" ry="3.2" transform="rotate(-70 -16 -11)" stroke="#a8b6c2" stroke-width="2"/>
      <ellipse cx="-19" cy="0" rx="5.4" ry="3.3" transform="rotate(90 -19 0)" stroke="#14171f" stroke-width="4.4"/>
      <ellipse cx="-19" cy="0" rx="5.4" ry="3.3" transform="rotate(90 -19 0)" stroke="#8c9ba6" stroke-width="2"/>
      <ellipse cx="-16" cy="11" rx="5.4" ry="3.2" transform="rotate(70 -16 11)" stroke="#14171f" stroke-width="4.4"/>
      <ellipse cx="-16" cy="11" rx="5.4" ry="3.2" transform="rotate(70 -16 11)" stroke="#9aa8b3" stroke-width="2"/>
      <ellipse cx="-10" cy="19" rx="5.2" ry="3.2" transform="rotate(48 -10 19)" stroke="#14171f" stroke-width="4.4"/>
      <ellipse cx="-10" cy="19" rx="5.2" ry="3.2" transform="rotate(48 -10 19)" stroke="#7a8894" stroke-width="2"/>
    </g>

    <!-- Massive Spiked Dark-Iron Pauldrons -->
    <!-- Left pauldron (-Y) -->
    <polygon points="-10,-16 -5,-29 5,-32 13,-23 8,-14 -4,-13" fill="url(#cwIron)" stroke="#14171f" stroke-width="1.9" stroke-linejoin="round"/>
    <polygon points="-2,-29 1,-36 5,-30" fill="#8fa0ad" stroke="#14171f" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M -5 -24 L 4 -27 L 9 -21" fill="none" stroke="#b9c8d4" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Right pauldron (+Y) -->
    <polygon points="-10,16 -5,29 5,32 13,23 8,14 -4,13" fill="url(#cwIron)" stroke="#14171f" stroke-width="1.9" stroke-linejoin="round"/>
    <polygon points="-2,29 1,36 5,30" fill="#707f8c" stroke="#14171f" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M -5 24 L 4 27 L 9 21" fill="none" stroke="#8fa0ad" stroke-width="1.4" stroke-linecap="round"/>

    <!-- Left Armored Arm (-Y) gripping Coiled Spectral Chain -->
    <circle cx="21" cy="-18" r="11" fill="url(#cwEmeraldGlow)"/>
    <path d="M 8 -19 L 19 -17" stroke="#14171f" stroke-width="7.8" stroke-linecap="round"/>
    <path d="M 8 -19 L 19 -17" stroke="#4f5e69" stroke-width="4.4" stroke-linecap="round"/>
    <!-- Coiled spectral chain links held in left gauntlet -->
    <g fill="none">
      <ellipse cx="22" cy="-21" rx="6" ry="3.8" transform="rotate(-22 22 -21)" stroke="#14171f" stroke-width="4.2"/>
      <ellipse cx="22" cy="-21" rx="6" ry="3.8" transform="rotate(-22 22 -21)" stroke="#70f2ab" stroke-width="1.8"/>
      <ellipse cx="25" cy="-14" rx="5.5" ry="3.4" transform="rotate(28 25 -14)" stroke="#14171f" stroke-width="4.2"/>
      <ellipse cx="25" cy="-14" rx="5.5" ry="3.4" transform="rotate(28 25 -14)" stroke="#a8b8c4" stroke-width="1.8"/>
    </g>
    <circle cx="20" cy="-16.5" r="4" fill="url(#cwIron)" stroke="#14171f" stroke-width="1.6"/>

    <!-- Right Armored Arm (+Y) swinging a Wicked Curved Iron Hook-Blade forward (+X) -->
    <path d="M 8 19 L 20 15" stroke="#14171f" stroke-width="7.8" stroke-linecap="round"/>
    <path d="M 8 19 L 20 15" stroke="#4f5e69" stroke-width="4.4" stroke-linecap="round"/>
    <!-- Taut iron chain connecting right gauntlet to hook haft -->
    <ellipse cx="25" cy="13" rx="4.2" ry="2.4" transform="rotate(-18 25 13)" fill="none" stroke="#14171f" stroke-width="3.6"/>
    <ellipse cx="25" cy="13" rx="4.2" ry="2.4" transform="rotate(-18 25 13)" fill="none" stroke="#a6b5c2" stroke-width="1.6"/>
    <circle cx="20.5" cy="15" r="4.2" fill="url(#cwIron)" stroke="#14171f" stroke-width="1.6"/>

    <!-- Wicked curved iron scythe-hook blade extending forward (+X) -->
    <path d="M 27 11 L 34 14 C 41 12, 44 2, 42 -8 C 40 -16, 33 -20, 26 -19 L 31 -13 C 34 -12, 36 -7, 36 -1 C 36 4, 33 7, 29 7 Z" fill="url(#cwBlade)" stroke="#14171f" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- Inner barb tooth & eerie emerald edge gleam on the hook blade -->
    <polygon points="34,-12 29,-9 35,-6" fill="#46545e" stroke="#14171f" stroke-width="1.3" stroke-linejoin="round"/>
    <path d="M 39 10 C 42 4, 42 -6, 38 -13 C 35 -16, 32 -17, 29 -17" fill="none" stroke="#e4f2f7" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 35 -12 C 36 -6, 36 1, 33 6" fill="none" stroke="#63ffaa" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/>

    <!-- Hooded Dark-Iron Helm with Eerie Emerald Visor Glow -->
    <g>
      <circle cx="8" cy="0" r="10.5" fill="url(#cwEmeraldGlow)"/>
      <!-- Angular dark-iron hooded helm -->
      <path d="M -9 0 C -9 -10, -2 -14, 7 -12 L 15 -6 L 16 0 L 15 6 L 7 12 C -2 14, -9 10, -9 0 Z" fill="url(#cwIron)" stroke="#14171f" stroke-width="1.9" stroke-linejoin="round"/>
      <!-- Helm ridge crest & top-left highlight -->
      <path d="M -7 0 L 7 0" stroke="#9aaab8" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M -4 -9 C 1 -11, 7 -10, 12 -6" fill="none" stroke="#b6c6d4" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Deep iron cowl visor opening -->
      <path d="M 6 -6.5 L 14 -3.5 L 14.5 0 L 14 3.5 L 6 6.5 L 4 0 Z" fill="#09120e" stroke="#14171f" stroke-width="1.2"/>
      <!-- Sinister eerie emerald visor glow slits -->
      <polygon points="8.5,-4 13.5,-1.8 9.2,-1" fill="#70ffad"/>
      <polygon points="8.5,4 13.5,1.8 9.2,1" fill="#70ffad"/>
      <circle cx="11" cy="0" r="1.4" fill="#d4ffe6"/>
    </g>
  </g>
</svg>

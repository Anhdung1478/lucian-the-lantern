<svg xmlns="http://www.w3.org/2000/svg" width="88" height="88" viewBox="0 0 88 88">
  <!-- Chain Warden: a jailer in iron seen from above, broad spiked iron pauldrons over a dark-green cowl, a heavy chain of real links looped across the back, armoured arms holding a long chain forward (+X) that ends in a big iron hook, a hood with two glowing green eyes. -->
  <g transform="translate(40 44)">
    <!-- cowl and shoulders -->
    <ellipse cx="-5" cy="0" rx="22" ry="30" fill="#2f4a3c" stroke="#1a1d24" stroke-width="3.5"/>
    <path d="M -22 -12 Q -10 -22 2 -12 M -22 12 Q -10 22 2 12" fill="none" stroke="#6f9a82" stroke-width="2.4" stroke-linecap="round"/>
    <!-- chain looped across the back: links -->
    <path d="M -8 -26 Q -32 0 -8 26" fill="none" stroke="#1a1d24" stroke-width="8" stroke-linecap="round" stroke-dasharray="7 2"/>
    <path d="M -8 -26 Q -32 0 -8 26" fill="none" stroke="#b4c0ca" stroke-width="4.4" stroke-linecap="round" stroke-dasharray="7 2"/>
    <path d="M -8 -26 Q -32 0 -8 26" fill="none" stroke="#5a6672" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="3 6"/>
    <!-- iron pauldrons with spikes -->
    <path d="M 0 -22 L 2 -31 L 7 -23 M 0 22 L 2 31 L 7 23" fill="#8c98a4" stroke="#1a1d24" stroke-width="2.6" stroke-linejoin="round"/>
    <ellipse cx="2" cy="-19" rx="11" ry="8" fill="#7a8692" stroke="#1a1d24" stroke-width="3"/>
    <ellipse cx="2" cy="19" rx="11" ry="8" fill="#7a8692" stroke="#1a1d24" stroke-width="3"/>
    <path d="M -4 -22 Q 2 -25 8 -21 M -4 16 Q 2 13 8 17" fill="none" stroke="#d6dee6" stroke-width="2.4" stroke-linecap="round"/>
    <!-- arms forward -->
    <path d="M 8 -18 L 22 -12 L 30 -4 M 8 18 L 22 12 L 30 4" fill="none" stroke="#1a1d24" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 8 -18 L 22 -12 L 30 -4 M 8 18 L 22 12 L 30 4" fill="none" stroke="#6d7a86" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="30" cy="-4" r="4" fill="#9aa6b2" stroke="#1a1d24" stroke-width="2.4"/>
    <circle cx="30" cy="4" r="4" fill="#9aa6b2" stroke="#1a1d24" stroke-width="2.4"/>
    <!-- chain to the hook -->
    <path d="M 31 0 L 40 0" fill="none" stroke="#1a1d24" stroke-width="6" stroke-linecap="round" stroke-dasharray="5 2"/>
    <path d="M 31 0 L 40 0" fill="none" stroke="#c4cfd8" stroke-width="3" stroke-linecap="round" stroke-dasharray="5 2"/>
    <!-- hook -->
    <path d="M 38 -3 L 41 -3 Q 45 -3 43 4 Q 42 9 38 8" fill="none" stroke="#1a1d24" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 38 -3 L 41 -3 Q 45 -3 43 4 Q 42 9 38 8" fill="none" stroke="#dce4ec" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- hood with glowing eyes -->
    <circle cx="2" cy="0" r="13" fill="#233a2d" stroke="#1a1d24" stroke-width="3"/>
    <path d="M -8 -8 Q 0 -13 9 -9" fill="none" stroke="#6f9a82" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 4 -6 Q 13 -4 13 0 Q 13 4 4 6 Q 1 0 4 -6 Z" fill="#0e1612"/>
    <circle cx="9" cy="-2.6" r="2" fill="#6dffb0"/>
    <circle cx="9" cy="2.6" r="2" fill="#6dffb0"/>
  </g>
</svg>

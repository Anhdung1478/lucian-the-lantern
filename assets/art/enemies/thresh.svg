<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <!-- Thresh, the Chain Warden, seen from above, facing +X. As on the title screen: a dark green-black hooded jailer
       with a pale moonlit rim, green eyes in the hood, spiked pauldrons, a tattered robe trailing behind. His chain
       sickle is in his left hand (y < 0), its chain looped back over that shoulder; the green soul lantern hangs from
       his right hand (y > 0), lighting him from below. -->
  <defs>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#9dffc8" stop-opacity="0.7"/>
      <stop offset="0.45" stop-color="#4dff9a" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2fbf74" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#c8ffdc"/>
      <stop offset="1" stop-color="#4dd98a"/>
    </radialGradient>
    <radialGradient id="eye">
      <stop offset="0" stop-color="#7dffb8" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#4dff9a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="robe" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#22322b"/>
      <stop offset="1" stop-color="#121a16"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6f6ec"/>
      <stop offset="1" stop-color="#8fb8a2"/>
    </linearGradient>
  </defs>
  <g transform="translate(60 60)">
    <!-- tattered robe, trailing behind him -->
    <path d="M 6 -31 Q -14 -42 -32 -41 L -37 -48 L -41 -36 L -51 -33 L -46 -23 L -56 -15 L -48 -6 L -57 2 L -48 9 L -55 19 L -44 25 L -45 37 L -33 37 Q -14 43 6 31 Z" fill="url(#robe)" stroke="#1a1d24" stroke-width="4" stroke-linejoin="round"/>
    <path d="M 6 -31 Q -14 -42 -32 -41 L -37 -48 L -41 -36 L -51 -33 L -46 -23 L -56 -15 L -48 -6 L -57 2 L -48 9 L -55 19 L -44 25 L -45 37 L -33 37 Q -14 43 6 31" fill="none" stroke="#b6d3cc" stroke-width="2" stroke-linejoin="round" opacity="0.8"/>
    <!-- folds of the robe -->
    <path d="M -8 -30 Q -26 -30 -42 -22 M -12 -14 Q -30 -12 -46 -10 M -12 14 Q -30 12 -44 14 M -8 30 Q -24 32 -40 30" fill="none" stroke="#0b110e" stroke-width="3" stroke-linecap="round"/>
    <path d="M -10 -22 Q -28 -21 -44 -16 M -12 0 L -50 2 M -10 22 Q -26 22 -44 21" fill="none" stroke="#33493f" stroke-width="2.2" stroke-linecap="round"/>
    <!-- the sickle's chain, looped back over his left shoulder -->
    <path d="M 22 -34 Q 4 -54 -20 -48 Q -38 -43 -36 -27 Q -35 -18 -24 -16" fill="none" stroke="#1a1d24" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M 22 -34 Q 4 -54 -20 -48 Q -38 -43 -36 -27 Q -35 -18 -24 -16" fill="none" stroke="#8fe3b0" stroke-width="3" stroke-dasharray="4.5 2.5" stroke-linecap="butt"/>
    <!-- arms -->
    <path d="M 2 -24 L 22 -33 M 2 24 L 21 32" stroke="#1a1d24" stroke-width="12" stroke-linecap="round"/>
    <path d="M 2 -24 L 22 -33 M 2 24 L 21 32" stroke="#22302a" stroke-width="7.5" stroke-linecap="round"/>
    <path d="M 6 -28.5 L 20 -35" stroke="#b6d3cc" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <!-- torso -->
    <ellipse cx="0" cy="0" rx="17" ry="29" fill="#1b2721" stroke="#1a1d24" stroke-width="3.5"/>
    <path d="M -9 -22 Q -14 0 -9 22" fill="none" stroke="#33493f" stroke-width="2.5" stroke-linecap="round"/>
    <!-- the lantern's light falling on his right side -->
    <circle cx="35" cy="36" r="30" fill="url(#halo)"/>
    <!-- spiked pauldrons -->
    <g stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round">
      <path d="M -8 -30 L -22 -42 L -4 -36 Z M 0 -35 L -4 -53 L 8 -37 Z M 9 -34 L 16 -49 L 15 -31 Z" fill="#3e584b"/>
      <path d="M -8 30 L -22 42 L -4 36 Z M 0 35 L -4 53 L 8 37 Z M 9 34 L 16 49 L 15 31 Z" fill="#3e584b"/>
      <ellipse cx="1" cy="-25" rx="16" ry="12" fill="#2d4237"/>
      <ellipse cx="1" cy="25" rx="16" ry="12" fill="#2d4237"/>
    </g>
    <path d="M -4 -42 L -2 -50 M 13 -40 L 15 -46 M -4 42 L -2 50 M 13 40 L 15 46" stroke="#cfe8dc" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
    <path d="M -11 -28 Q -4 -35 8 -34 M -11 28 Q -4 35 8 34" fill="none" stroke="#b6d3cc" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <path d="M -8 -29 Q 2 -34 13 -30 M -8 29 Q 2 34 13 30" fill="none" stroke="#5f8573" stroke-width="2.2" stroke-linecap="round"/>
    <!-- hood, its point trailing back -->
    <path d="M 20 -8 Q 17 -18 3 -19 Q -11 -19 -18 -10 Q -22 -5 -31 0 Q -22 5 -18 10 Q -11 19 3 19 Q 17 18 20 8 Z" fill="#17221d" stroke="#1a1d24" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M -16 -9 Q -10 -16.5 3 -16.5 Q 13 -16 16.5 -9 M -16 9 Q -10 16.5 3 16.5 Q 13 16 16.5 9" fill="none" stroke="#c4ddd5" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
    <path d="M -18 -2 Q -6 -6 6 -5 M -18 2 Q -6 6 6 5" fill="none" stroke="#263a31" stroke-width="2.5" stroke-linecap="round"/>
    <!-- the dark of the hood's opening, green eyes in it -->
    <path d="M 9 -11 Q 21 -9 21 0 Q 21 9 9 11 Q 13 0 9 -11 Z" fill="#050807"/>
    <circle cx="16" cy="-4" r="5.5" fill="url(#eye)"/>
    <circle cx="16" cy="4" r="5.5" fill="url(#eye)"/>
    <circle cx="16" cy="-4" r="2.2" fill="#e6fff0"/>
    <circle cx="16" cy="4" r="2.2" fill="#e6fff0"/>
    <!-- the chain sickle, forward in his left hand: a haft, then a curved green-steel blade -->
    <path d="M 20 -35 L 44 -27" stroke="#1a1d24" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M 20 -35 L 44 -27" stroke="#5e6e64" stroke-width="3" stroke-linecap="round"/>
    <path d="M 41 -31 Q 58 -30 55 -9 Q 50 -21 37 -22 Z" fill="url(#steel)" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 45 -27 Q 53 -24 53 -14" fill="none" stroke="#4dff9a" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <circle cx="22" cy="-34" r="4.5" fill="#26352e" stroke="#1a1d24" stroke-width="2"/>
    <!-- the soul lantern, on a short chain from his right hand -->
    <path d="M 22 33 L 31 32" stroke="#1a1d24" stroke-width="5" stroke-linecap="round"/>
    <path d="M 22 33 L 31 32" stroke="#8fe3b0" stroke-width="2.2" stroke-dasharray="2.5 1.5"/>
    <circle cx="21" cy="32" r="4.5" fill="#26352e" stroke="#1a1d24" stroke-width="2"/>
    <path d="M 35 25 L 42 28 L 45 35 L 42 42 L 35 45 L 28 42 L 25 35 L 28 28 Z" fill="#1f2d26" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="35" cy="35" r="6.5" fill="url(#core)"/>
    <path d="M 35 27.5 L 35 42.5 M 27.5 35 L 42.5 35" stroke="#1f2d26" stroke-width="2" opacity="0.85"/>
    <path d="M 28 28 L 35 25 L 42 28" fill="none" stroke="#b6d3cc" stroke-width="2" stroke-linejoin="round" opacity="0.8"/>
    <circle cx="35" cy="35" r="2.6" fill="#ffffff"/>
  </g>
</svg>

      <stop offset="0.5" stop-color="#f2edfb"/>
      <stop offset="1" stop-color="#d9cff0"/>
    </linearGradient>
    <linearGradient id="horn" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#f6f0ff"/>
      <stop offset="1" stop-color="#9a7ad8"/>
    </linearGradient>
    <radialGradient id="flare">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#d4b8ff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#9a6cff" stop-opacity="0"/>
    </radialGradient>

<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <!-- Elder Dragon, top-down facing +X: commanding pale violet-white ancient dragon with sweeping crown of horns,
       refined ink outline weights (1.8-2.2px), enriched iridescent arcane wing-membrane gradients, luminous rune-vein
       highlights along wings and armored spine plates, white-hot eyes, and burning arcane tail tip. -->
  <defs>
    <linearGradient id="ed_membrane" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#4e368a"/>
      <stop offset="0.45" stop-color="#7c5cc4"/>
      <stop offset="0.78" stop-color="#b494f2"/>
      <stop offset="1" stop-color="#c4e6ff"/>
    </linearGradient>
    <linearGradient id="ed_hide" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0" stop-color="#f7f2ff"/>
      <stop offset="0.48" stop-color="#e3daf5"/>
      <stop offset="1" stop-color="#b7a4db"/>
    </linearGradient>
    <linearGradient id="ed_plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d5c6f2"/>
      <stop offset="0.55" stop-color="#a893d4"/>
      <stop offset="1" stop-color="#7761ab"/>
    </linearGradient>
    <linearGradient id="ed_horn" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#c9b4f2"/>
      <stop offset="1" stop-color="#7a58c2"/>
    </linearGradient>
    <radialGradient id="ed_flare">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#dfc7ff" stop-opacity="0.9"/>
      <stop offset="0.75" stop-color="#9e6eff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#6b3ee0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g transform="translate(90 90)">
    <!-- tail, its tip burning white-violet -->
    <path d="M -32 -11 Q -56 -12 -74 -4 Q -78 0 -74 4 Q -56 12 -32 11 Z" fill="url(#ed_hide)" stroke="#14171f" stroke-width="2.1" stroke-linejoin="round"/>
    <path d="M -38 -6 Q -54 -7 -68 -2 M -38 6 Q -54 7 -68 2" fill="none" stroke="#9e8bc7" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M -36 -5 L -42 0 L -36 5 M -50 -4 L -56 0 L -50 4 M -62 -3 L -67 0 L -62 3" fill="none" stroke="#7d5cc9" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="-80" cy="0" r="11" fill="url(#ed_flare)"/>
    <path d="M -72 -5 Q -80 -14 -88 -10 Q -83 -6 -87 -2 L -81 0 L -87 2 Q -83 6 -88 10 Q -80 14 -72 5 Z" fill="#9a6cff" stroke="#14171f" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M -72 -3 Q -78 -8 -82 -6 Q -79 -3 -80 0 Q -79 3 -82 6 Q -78 8 -72 3 Z" fill="#ffffff"/>

    <!-- hind legs -->
    <g>
      <path d="M -24 -14 L -31 -29" stroke="#14171f" stroke-width="9.5" stroke-linecap="round"/>
      <path d="M -24 -14 L -31 -29" stroke="#d9cef2" stroke-width="6" stroke-linecap="round"/>
      <path d="M -31 -29 L -38 -33 M -31 -29 L -31 -37 M -31 -29 L -25 -35" stroke="#14171f" stroke-width="3.2" stroke-linecap="round"/>
    </g>
    <g transform="scale(1 -1)">
      <path d="M -24 -14 L -31 -29" stroke="#14171f" stroke-width="9.5" stroke-linecap="round"/>
      <path d="M -24 -14 L -31 -29" stroke="#c3b4e6" stroke-width="6" stroke-linecap="round"/>
      <path d="M -31 -29 L -38 -33 M -31 -29 L -31 -37 M -31 -29 L -25 -35" stroke="#14171f" stroke-width="3.2" stroke-linecap="round"/>
    </g>

    <!-- commanding pale-violet & iridescent arcane wings -->
    <g>
      <path d="M 5 -16 L 24 -42 L 10 -64 L -2 -86 Q -10 -74 -28 -80 Q -32 -66 -50 -62 Q -44 -50 -54 -38 Q -38 -32 -24 -16 Z" fill="url(#ed_membrane)" stroke="#14171f" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M 2 -22 L 12 -54 L -6 -74 Q -14 -68 -26 -72 Q -30 -60 -42 -57 Q -38 -47 -45 -40 Q -32 -32 -18 -20 Z" fill="#462e82" opacity="0.44"/>
      <!-- iridescent scalloped rim highlights -->
      <path d="M -4 -83 Q -11 -75 -26 -78 M -30 -77 Q -34 -66 -48 -61 M -49 -59 Q -45 -49 -52 -39" fill="none" stroke="#e4f2ff" stroke-width="2" stroke-linecap="round" opacity="0.92"/>
      <!-- luminous arcane rune-vein highlights branching through wing membrane -->
      <path d="M -5 -28 L -12 -42 L -7 -52 L -16 -64 M -12 -42 L -22 -44 M -22 -34 L -30 -44 L -28 -57 M -35 -34 L -44 -42 M -16 -64 L -22 -70" stroke="#b98cff" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.62"/>
      <path d="M -5 -28 L -12 -42 L -7 -52 L -16 -64 M -12 -42 L -22 -44 M -22 -34 L -30 -44 L -28 -57 M -35 -34 L -44 -42 M -16 -64 L -22 -70" stroke="#f7f2ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <!-- small arcane diamond rune nodes on wing veins -->
      <polygon points="-12,-45 -9.5,-42 -12,-39 -14.5,-42" fill="#e6f7ff"/>
      <polygon points="-30,-47 -27.5,-44 -30,-41 -32.5,-44" fill="#e6f7ff"/>
      <!-- ivory wing finger bones -->
      <path d="M 10 -64 L -28 -80 M 10 -64 L -50 -62 M 10 -64 L -54 -38" fill="none" stroke="#14171f" stroke-width="4.8" stroke-linecap="round"/>
      <path d="M 10 -64 L -28 -80 M 10 -64 L -50 -62 M 10 -64 L -54 -38" fill="none" stroke="#ede6fa" stroke-width="2.4" stroke-linecap="round"/>
      <!-- ivory leading wing bone -->
      <path d="M 5 -16 L 24 -42 L 10 -64 L -2 -86" fill="none" stroke="#14171f" stroke-width="7.6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 5 -16 L 24 -42 L 10 -64 L -2 -86" fill="none" stroke="#ece4fa" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 7 -20 L 22 -41 L 11 -59" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 24 -42 L 30 -48 L 26 -38 Z M 10 -64 L 15 -70 L 14 -61 Z M -2 -86 L 2 -89 L 3 -83 Z" fill="#f7f2ff" stroke="#14171f" stroke-width="1.8" stroke-linejoin="round"/>
    </g>
    <g transform="scale(1 -1)">
      <path d="M 5 -16 L 24 -42 L 10 -64 L -2 -86 Q -10 -74 -28 -80 Q -32 -66 -50 -62 Q -44 -50 -54 -38 Q -38 -32 -24 -16 Z" fill="url(#ed_membrane)" stroke="#14171f" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M 2 -22 L 12 -54 L -6 -74 Q -14 -68 -26 -72 Q -30 -60 -42 -57 Q -38 -47 -45 -40 Q -32 -32 -18 -20 Z" fill="#462e82" opacity="0.44"/>
      <path d="M -4 -83 Q -11 -75 -26 -78 M -30 -77 Q -34 -66 -48 -61 M -49 -59 Q -45 -49 -52 -39" fill="none" stroke="#e4f2ff" stroke-width="2" stroke-linecap="round" opacity="0.92"/>
      <path d="M -5 -28 L -12 -42 L -7 -52 L -16 -64 M -12 -42 L -22 -44 M -22 -34 L -30 -44 L -28 -57 M -35 -34 L -44 -42 M -16 -64 L -22 -70" stroke="#b98cff" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.62"/>
      <path d="M -5 -28 L -12 -42 L -7 -52 L -16 -64 M -12 -42 L -22 -44 M -22 -34 L -30 -44 L -28 -57 M -35 -34 L -44 -42 M -16 -64 L -22 -70" stroke="#f7f2ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <polygon points="-12,-45 -9.5,-42 -12,-39 -14.5,-42" fill="#e6f7ff"/>
      <polygon points="-30,-47 -27.5,-44 -30,-41 -32.5,-44" fill="#e6f7ff"/>
      <path d="M 10 -64 L -28 -80 M 10 -64 L -50 -62 M 10 -64 L -54 -38" fill="none" stroke="#14171f" stroke-width="4.8" stroke-linecap="round"/>
      <path d="M 10 -64 L -28 -80 M 10 -64 L -50 -62 M 10 -64 L -54 -38" fill="none" stroke="#dcd2f0" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M 5 -16 L 24 -42 L 10 -64 L -2 -86" fill="none" stroke="#14171f" stroke-width="7.6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 5 -16 L 24 -42 L 10 -64 L -2 -86" fill="none" stroke="#ddd3f2" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 24 -42 L 30 -48 L 26 -38 Z M 10 -64 L 15 -70 L 14 -61 Z M -2 -86 L 2 -89 L 3 -83 Z" fill="#ebe2fc" stroke="#14171f" stroke-width="1.8" stroke-linejoin="round"/>
    </g>

    <!-- fore legs -->
    <g>
      <path d="M 15 -12 L 27 -23" stroke="#14171f" stroke-width="8.8" stroke-linecap="round"/>
      <path d="M 15 -12 L 27 -23" stroke="#e2d8f5" stroke-width="5.2" stroke-linecap="round"/>
      <path d="M 27 -23 L 34 -24 M 27 -23 L 31 -29 M 27 -23 L 24 -30" stroke="#14171f" stroke-width="3.2" stroke-linecap="round"/>
    </g>
    <g transform="scale(1 -1)">
      <path d="M 15 -12 L 27 -23" stroke="#14171f" stroke-width="8.8" stroke-linecap="round"/>
      <path d="M 15 -12 L 27 -23" stroke="#ccc0e8" stroke-width="5.2" stroke-linecap="round"/>
      <path d="M 27 -23 L 34 -24 M 27 -23 L 31 -29 M 27 -23 L 24 -30" stroke="#14171f" stroke-width="3.2" stroke-linecap="round"/>
    </g>

    <!-- pale scaled body & armored dorsal plates with luminous arcane rune filigree -->
    <ellipse cx="-6" cy="0" rx="35" ry="22" fill="url(#ed_hide)" stroke="#14171f" stroke-width="2.2"/>
    <path d="M -34 -10 Q -8 -20 20 -10 M -34 10 Q -8 20 20 10" fill="none" stroke="#9e8bc7" stroke-width="2" stroke-linecap="round"/>
    <path d="M -32 -15 q 4 -4 8 0 M -20 -18 q 4 -4 8 0 M -8 -19 q 4 -4 8 0 M 4 -17 q 4 -4 8 0 M -32 15 q 4 4 8 0 M -20 18 q 4 4 8 0 M -8 19 q 4 4 8 0 M 4 17 q 4 4 8 0" stroke="#856fc0" stroke-width="1.7" stroke-linecap="round" fill="none"/>
    <path d="M 22 -8 L 10 -11 L -2 -8 L -14 -11 L -26 -8 L -36 -9 L -38 0 L -36 9 L -26 8 L -14 11 L -2 8 L 10 11 L 22 8 Z" fill="url(#ed_plate)" stroke="#14171f" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- luminous arcane rune-veins etched along dorsal armor plates -->
    <path d="M 14 -7 L 10 -9 L 6 -7 M 2 -7 L -2 -9 L -6 -7 M -10 -7 L -14 -9 L -18 -7 M -22 -6 L -26 -8 L -30 -6" fill="none" stroke="#e8f5ff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
    <path d="M 14 7 L 10 9 L 6 7 M 2 7 L -2 9 L -6 7 M -10 7 L -14 9 L -18 7 M -22 6 L -26 8 L -30 6" fill="none" stroke="#e8f5ff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

    <!-- mane of violet-white arcane flame down the spine -->
    <path d="M 22 0 Q 16 -7 6 -6 Q 10 -2 2 0 Q 10 2 6 6 Q 16 7 22 0 Z M 4 0 Q -2 -7 -12 -6 Q -8 -2 -16 0 Q -8 2 -12 6 Q -2 7 4 0 Z M -14 0 Q -20 -7 -30 -6 Q -26 -2 -34 0 Q -26 2 -30 6 Q -20 7 -14 0 Z M -32 0 Q -38 -6 -46 -5 Q -43 -2 -50 0 Q -43 2 -46 5 Q -38 6 -32 0 Z" fill="#9a6cff" stroke="#14171f" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M 18 0 Q 12 -3 7 -3 Q 9 0 7 3 Q 12 3 18 0 Z M 0 0 Q -6 -3 -11 -3 Q -9 0 -11 3 Q -6 3 0 0 Z M -18 0 Q -24 -3 -29 -3 Q -27 0 -29 3 Q -24 3 -18 0 Z M -35 0 Q -40 -2.5 -44 -2.5 Q -42 0 -44 2.5 Q -40 2.5 -35 0 Z" fill="#ffffff"/>

    <!-- neck -->
    <path d="M 16 -12 Q 32 -11 46 -9 L 46 9 Q 32 11 16 12 Z" fill="url(#ed_hide)" stroke="#14171f" stroke-width="2.1" stroke-linejoin="round"/>
    <path d="M 22 -5 L 27 0 L 22 5 M 32 -5 L 37 0 L 32 5" fill="none" stroke="#8a63d6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 23.5 -3.5 L 27 0 L 23.5 3.5 M 33.5 -3.5 L 37 0 L 33.5 3.5" fill="none" stroke="#ffffff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- sweeping crown of horns -->
    <g>
      <path d="M 52 -10 Q 38 -26 14 -35 Q 30 -22 42 -6 Z" fill="url(#ed_horn)" stroke="#14171f" stroke-width="1.9" stroke-linejoin="round"/>
      <path d="M 58 -12 Q 53 -29 38 -42 Q 46 -27 49 -10 Z" fill="url(#ed_horn)" stroke="#14171f" stroke-width="1.9" stroke-linejoin="round"/>
      <path d="M 46 -6 Q 34 -12 24 -12 Q 32 -8 38 -3 Z" fill="url(#ed_horn)" stroke="#14171f" stroke-width="1.7" stroke-linejoin="round"/>
      <path d="M 64 -11 Q 67 -21 63 -29 Q 59 -20 56 -11 Z" fill="url(#ed_horn)" stroke="#14171f" stroke-width="1.7" stroke-linejoin="round"/>
      <path d="M 47 -9 Q 36 -21 22 -29 M 53 -12 Q 49 -25 42 -34" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>
    </g>
    <g transform="scale(1 -1)">
      <path d="M 52 -10 Q 38 -26 14 -35 Q 30 -22 42 -6 Z" fill="url(#ed_horn)" stroke="#14171f" stroke-width="1.9" stroke-linejoin="round"/>
      <path d="M 58 -12 Q 53 -29 38 -42 Q 46 -27 49 -10 Z" fill="url(#ed_horn)" stroke="#14171f" stroke-width="1.9" stroke-linejoin="round"/>
      <path d="M 46 -6 Q 34 -12 24 -12 Q 32 -8 38 -3 Z" fill="url(#ed_horn)" stroke="#14171f" stroke-width="1.7" stroke-linejoin="round"/>
      <path d="M 64 -11 Q 67 -21 63 -29 Q 59 -20 56 -11 Z" fill="url(#ed_horn)" stroke="#14171f" stroke-width="1.7" stroke-linejoin="round"/>
      <path d="M 47 -9 Q 36 -21 22 -29 M 53 -12 Q 49 -25 42 -34" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>
    </g>

    <!-- ancient dragon head -->
    <path d="M 40 -12 Q 52 -17 64 -12 L 79 -6 Q 85 0 79 6 L 64 12 Q 52 17 40 12 Z" fill="url(#ed_hide)" stroke="#14171f" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M 46 -8 Q 56 -11 66 -7" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
    <!-- arcane forehead rune & nasal crest -->
    <path d="M 46 0 L 72 0" stroke="#9376cf" stroke-width="2.2" stroke-linecap="round"/>
    <polygon points="48,0 53,-3.2 58,0 53,3.2" fill="#e6f5ff" stroke="#7d5cc9" stroke-width="1"/>
    <path d="M 66 -7 L 72 -5 M 66 7 L 72 5" stroke="#856cc2" stroke-width="1.8" stroke-linecap="round"/>
    <!-- white-hot arcane eyes -->
    <circle cx="58" cy="-7.5" r="7" fill="url(#ed_flare)"/>
    <circle cx="58" cy="7.5" r="7" fill="url(#ed_flare)"/>
    <path d="M 52 -12 Q 60 -13 66 -9 M 52 12 Q 60 13 66 9" fill="none" stroke="#14171f" stroke-width="2" stroke-linecap="round"/>
    <path d="M 54 -9.5 L 63 -7.5 L 55 -5.5 Z M 54 9.5 L 63 7.5 L 55 5.5 Z" fill="#ffffff" stroke="#6f4fc0" stroke-width="1.4" stroke-linejoin="round"/>
    <circle cx="77" cy="-3" r="1.4" fill="#14171f"/>
    <circle cx="77" cy="3" r="1.4" fill="#14171f"/>
    <!-- white-violet arcane fire curling from jaws -->
    <circle cx="84" cy="0" r="6.5" fill="url(#ed_flare)"/>
  </g>
</svg>

    <!-- neck and head -->
    <path d="M 16 -11 L 42 -9 L 42 9 L 16 11 Z" fill="#241a33" stroke="#1a1d24" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 48 -9 L 22 -31 L 31 -28 L 42 -5 Z M 48 9 L 22 31 L 31 28 L 42 5 Z" fill="#d8ccef" stroke="#1a1d24" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 44 -12 L 32 -20 L 40 -9 Z M 44 12 L 32 20 L 40 9 Z" fill="#a898c8" stroke="#1a1d24" stroke-width="1.5" stroke-linejoin="round"/>
    <ellipse cx="54" cy="0" rx="17" ry="13" fill="#2c2040" stroke="#1a1d24" stroke-width="3"/>
    <path d="M 63 -9 Q 79 -7 85 0 Q 79 7 63 9 Z" fill="#2c2040" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 44 0 L 60 0" stroke="#5e3f8f" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="59" cy="-7" r="5.5" fill="#b48cff" opacity="0.5"/>
    <circle cx="59" cy="7" r="5.5" fill="#b48cff" opacity="0.5"/>
    <circle cx="59" cy="-7" r="2.6" fill="#f4eeff"/>
    <circle cx="59" cy="7" r="2.6" fill="#f4eeff"/>
    <circle cx="81" cy="-3" r="1.3" fill="#1a1d24"/>
    <circle cx="81" cy="3" r="1.3" fill="#1a1d24"/>

    <path d="M 8 -19 L -2 -86 M 8 -19 L -32 -74 M 8 -19 L -54 -53 M 8 -19 L -61 -30 M 8 19 L -2 86 M 8 19 L -32 74 M 8 19 L -54 53 M 8 19 L -61 30" stroke="#5a3f82" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- white-violet flame glowing through the wings -->
    <path d="M -6 -30 L -12 -42 L -8 -52 L -16 -62 M -22 -34 L -30 -44 L -28 -54 M -36 -30 L -46 -38 M -6 30 L -12 42 L -8 52 L -16 62 M -22 34 L -30 44 L -28 54 M -36 30 L -46 38" stroke="#9a6cff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.55"/>
    <path d="M -6 -30 L -12 -42 L -8 -52 L -16 -62 M -22 -34 L -30 -44 L -28 -54 M -36 -30 L -46 -38 M -6 30 L -12 42 L -8 52 L -16 62 M -22 34 L -30 44 L -28 54 M -36 30 L -46 38" stroke="#efe6ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

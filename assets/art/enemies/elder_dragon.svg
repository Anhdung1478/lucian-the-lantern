<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <!-- Elder Dragon: a huge purple-black dragon seen from above, wings spread wide, white-violet flame along its back, in its wings and on its tail, horns swept back, head forward (+X). -->

    </g>
    <path d="M 4 -24 Q 12 -54 -8 -74 Q -18 -64 -30 -66 Q -32 -52 -46 -48 Q -42 -36 -50 -30 Q -36 -24 -26 -18 Z" fill="#1d1230" opacity="0.7"/>

<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Murk Wolf: a grey-blue jungle wolf seen from above, snout forward (+X), glowing teal eyes, bushy tail behind. -->
  <g transform="translate(32 32)">
    <ellipse cx="-2" cy="2" rx="29" ry="20" fill="#000000" opacity="0.25"/>
    <!-- tail -->
    <path d="M -16 -2 Q -26 -6 -30 0 Q -26 6 -16 3 Z" fill="#4c5a70" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- legs -->
    <ellipse cx="-11" cy="-12" rx="5" ry="4" fill="#4c5a70" stroke="#1a1d24" stroke-width="2"/>
    <ellipse cx="-11" cy="12" rx="5" ry="4" fill="#4c5a70" stroke="#1a1d24" stroke-width="2"/>
    <ellipse cx="8" cy="-12" rx="5" ry="4" fill="#4c5a70" stroke="#1a1d24" stroke-width="2"/>
    <ellipse cx="8" cy="12" rx="5" ry="4" fill="#4c5a70" stroke="#1a1d24" stroke-width="2"/>
    <!-- body -->
    <ellipse cx="-3" cy="0" rx="16" ry="12" fill="#6d7f98" stroke="#1a1d24" stroke-width="2.5"/>
    <path d="M -16 0 L 6 0" stroke="#465570" stroke-width="3" stroke-linecap="round"/>
    <path d="M -10 -6 L -6 -2 M -4 -6 L 0 -2 M -10 6 L -6 2 M -4 6 L 0 2" stroke="#465570" stroke-width="1.5" stroke-linecap="round"/>
    <!-- head and snout -->
    <path d="M 8 -8 Q 15 -9 19 -4 L 27 -2.5 Q 29 0 27 2.5 L 19 4 Q 15 9 8 8 Q 5 0 8 -8 Z" fill="#7a8ca6" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- ears -->
    <path d="M 10 -7 L 6 -13 L 14 -8 Z" fill="#5a6a82" stroke="#1a1d24" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M 10 7 L 6 13 L 14 8 Z" fill="#5a6a82" stroke="#1a1d24" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- glowing teal eyes -->
    <circle cx="18" cy="-3.5" r="4" fill="#3ff5d8" opacity="0.35"/>
    <circle cx="18" cy="3.5" r="4" fill="#3ff5d8" opacity="0.35"/>
    <circle cx="18" cy="-3.5" r="1.9" fill="#7dfde8"/>
    <circle cx="18" cy="3.5" r="1.9" fill="#7dfde8"/>
    <circle cx="28" cy="0" r="1.6" fill="#1a1d24"/>
  </g>
</svg>

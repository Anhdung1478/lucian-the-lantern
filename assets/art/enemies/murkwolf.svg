<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Murk Wolf: sleek predatory top-down shadow wolf facing +X, dark slate-grey canine torso, spiky shoulder ruff, bushy tail trailing -X, swept wolf ears, tapered snout with pale fangs, narrow glowing cyan eyes. -->
  <defs>
    <linearGradient id="mw-fur" x1="0.15" y1="0.05" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#768ba4"/>
      <stop offset="0.45" stop-color="#48586e"/>
      <stop offset="1" stop-color="#252e3c"/>
    </linearGradient>
    <linearGradient id="mw-ruff" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#98aec7"/>
      <stop offset="0.5" stop-color="#586a82"/>
      <stop offset="1" stop-color="#293344"/>
    </linearGradient>
    <linearGradient id="mw-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3c4a5e"/>
      <stop offset="1" stop-color="#1b222e"/>
    </linearGradient>
    <linearGradient id="mw-tail" x1="1" y1="0.2" x2="0" y2="0.8">
      <stop offset="0" stop-color="#344052"/>
      <stop offset="0.6" stop-color="#4f6178"/>
      <stop offset="1" stop-color="#8da4bf"/>
    </linearGradient>
    <radialGradient id="mw-eye-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c4fffb" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#4ef2e6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1cb5b8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g transform="translate(32 32)">
    <!-- Bushy dark tail trailing behind (-X) with dynamic S-sweep -->
    <path d="M -12 -2.5 C -17 -5.5, -22 -6.5, -29 -1.5 L -26.5 0.5 L -30 3 C -23 6.5, -17 5.5, -12 2.5 Z" fill="url(#mw-tail)" stroke="#14171f" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M -16 -1.5 Q -22 -3 -26.5 0 M -16 1.5 Q -21 3 -25.5 2" fill="none" stroke="#9db5cf" stroke-width="1.2" stroke-linecap="round" opacity="0.75"/>

    <!-- Predatory striding legs & clawed paws -->
    <g stroke="#14171f" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
      <!-- Hind legs -->
      <path d="M -12 -7 L -18 -13.5 L -12 -15 L -6 -9.5 Z" fill="url(#mw-dark)"/>
      <path d="M -12 7 L -18 13.5 L -12 15 L -6 9.5 Z" fill="url(#mw-dark)"/>
      <!-- Forelegs lunging forward -->
      <path d="M 5 -8 L 15 -14 L 19 -11 L 11 -5 Z" fill="url(#mw-dark)"/>
      <path d="M 5 8 L 15 14 L 19 11 L 11 5 Z" fill="url(#mw-dark)"/>
    </g>
    <!-- Pale claw tips on forepaws -->
    <path d="M 18 -12.5 L 21 -13.2 M 18.5 -10.5 L 21.5 -10.5 M 18 12.5 L 21 13.2 M 18.5 10.5 L 21.5 10.5" stroke="#d8e3ee" stroke-width="1.3" stroke-linecap="round"/>

    <!-- Lean muscular canine torso (narrow waist, athletic ribcage) -->
    <path d="M -16 0 C -15 -6.5, -9 -9, -2 -8.5 C 4 -9.5, 10 -8.5, 14 -4.5 L 14 4.5 C 10 8.5, 4 9.5, -2 8.5 C -9 9, -15 6.5, -16 0 Z" fill="url(#mw-fur)" stroke="#14171f" stroke-width="2" stroke-linejoin="round"/>
    <!-- Dark dorsal spine stripe & top-left fur highlights -->
    <path d="M -13 0 L 9 0" stroke="#1e2533" stroke-width="3.2" stroke-linecap="round" opacity="0.8"/>
    <path d="M -9 -5.5 Q -3 -7 4 -6" fill="none" stroke="#9db4ce" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>

    <!-- Spiky layered fur shoulder ruff -->
    <path d="M 12 -6 L 7 -13 L 3 -9.5 L -2 -13.5 L -3 -7.5 L -8 -9 L -4 -3 L -7 0 L -4 3 L -8 9 L -3 7.5 L -2 13.5 L 3 9.5 L 7 13 L 12 6 Z" fill="url(#mw-ruff)" stroke="#14171f" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M 5 -10.5 L 1 -7 M 0 -10.5 L -2 -6.5 M 5 10.5 L 1 7 M 0 10.5 L -2 6.5" stroke="#b5cae0" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>

    <!-- Pointed swept-back wolf ears -->
    <path d="M 10 -5.5 L 2.5 -14.5 L 14.5 -8.5 Z" fill="url(#mw-dark)" stroke="#14171f" stroke-width="1.7" stroke-linejoin="round"/>
    <path d="M 10 5.5 L 2.5 14.5 L 14.5 8.5 Z" fill="url(#mw-dark)" stroke="#14171f" stroke-width="1.7" stroke-linejoin="round"/>
    <path d="M 9.5 -7 L 5.5 -12 L 12 -8.5 Z M 9.5 7 L 5.5 12 L 12 8.5 Z" fill="#181e29"/>

    <!-- Pale fangs peeking along the tapered jaw -->
    <path d="M 22 -3.8 L 26 -5 L 24.5 -2.2 Z M 22 3.8 L 26 5 L 24.5 2.2 Z" fill="#f0f4f8" stroke="#14171f" stroke-width="1.2" stroke-linejoin="round"/>

    <!-- Angular lupine head & tapered snout (+X) -->
    <path d="M 7 -6.5 L 13 -8.5 L 20 -4.8 L 28.5 -2.4 Q 30.5 0 28.5 2.4 L 20 4.8 L 13 8.5 L 7 6.5 L 9.5 0 Z" fill="url(#mw-fur)" stroke="#14171f" stroke-width="2" stroke-linejoin="round"/>
    <!-- Sleek silver-slate muzzle bridge highlight -->
    <path d="M 12 -2.6 L 26 -1.2 L 26 1.2 L 12 2.6 Z" fill="#a5bcd4" opacity="0.5"/>
    <path d="M 13 -5.5 Q 17 -6.2 21 -3.5" fill="none" stroke="#b7cde3" stroke-width="1.2" stroke-linecap="round" opacity="0.65"/>
    <!-- Dark wet wolf nose -->
    <path d="M 27.5 -2 L 30.2 -1 Q 31 0 30.2 1 L 27.5 2 Z" fill="#10131a"/>

    <!-- Narrow fierce glowing cyan eyes -->
    <circle cx="17.5" cy="-4.2" r="4.2" fill="url(#mw-eye-glow)"/>
    <circle cx="17.5" cy="4.2" r="4.2" fill="url(#mw-eye-glow)"/>
    <path d="M 14.5 -5.4 L 20.2 -3.6 L 16.4 -2.8 Z" fill="#5cf7ec" stroke="#14171f" stroke-width="0.9" stroke-linejoin="round"/>
    <path d="M 14.5 5.4 L 20.2 3.6 L 16.4 2.8 Z" fill="#5cf7ec" stroke="#14171f" stroke-width="0.9" stroke-linejoin="round"/>
    <circle cx="17.6" cy="-4.1" r="1" fill="#e6ffff"/>
    <circle cx="17.6" cy="4.1" r="1" fill="#e6ffff"/>
  </g>
</svg>

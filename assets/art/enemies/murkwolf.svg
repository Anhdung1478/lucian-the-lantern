<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Murk Wolf: a grey-blue jungle wolf from above, snout forward (+X), glowing teal eyes, four paws, bushy tail behind. -->
  <g transform="translate(32 32)">
    <g transform="translate(-2 0) scale(1.0)">
    <!-- tail -->
    <path d="M -17 -3.5 Q -26 -9 -30 0 Q -26 8 -17 3.5 Z" fill="#6f8196" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M -25 -4 Q -29 0 -25 4" fill="none" stroke="#9db2c8" stroke-width="2.4" stroke-linecap="round"/>
    <!-- legs and paws -->
    <ellipse cx="9" cy="-11.5" rx="7" ry="3.8" transform="rotate(-12 9 -11.5)" fill="#46566a" stroke="#1a1d24" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <ellipse cx="9" cy="11.5" rx="7" ry="3.8" transform="rotate(12 9 11.5)" fill="#46566a" stroke="#1a1d24" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <ellipse cx="-12" cy="-12" rx="7" ry="3.8" transform="rotate(10 -12 -12)" fill="#46566a" stroke="#1a1d24" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <ellipse cx="-12" cy="12" rx="7" ry="3.8" transform="rotate(-10 -12 12)" fill="#46566a" stroke="#1a1d24" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- body -->
    <ellipse cx="-3" cy="0" rx="19" ry="10.5" fill="#6f8196" stroke="#1a1d24" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M -19 0 L 8 0" stroke="#46566a" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M -12 -7.5 L -14 -4 M -5 -8.5 L -7 -5 M 2 -8 L 0 -5 M -12 7.5 L -14 4 M -5 8.5 L -7 5 M 2 8 L 0 5" stroke="#9db2c8" stroke-width="2.4" stroke-linecap="round"/>
    
    
    <!-- ears -->
    <path d="M 11 -5.5 L 8 -13 L 17 -8 Z M 11 5.5 L 8 13 L 17 8 Z" fill="#46566a" stroke="#1a1d24" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- head and snout -->
    <path d="M 8 -8 Q 17 -10 22 -4.5 L 29 -3 Q 32 0 29 3 L 22 4.5 Q 17 10 8 8 Z" fill="#6f8196" stroke="#1a1d24" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="30" cy="0" r="2.6" fill="#101319"/>
    
    <path d="M 12 -3 L 25 -1.5 L 25 1.5 L 12 3 Z" fill="#9db2c8" opacity="0.55"/>
    <!-- glowing teal eyes -->
    <circle cx="19" cy="-4.8" r="4.5" fill="#5ff0e0" opacity="0.3"/><circle cx="19" cy="4.8" r="4.5" fill="#5ff0e0" opacity="0.3"/>
    <circle cx="19" cy="-4.8" r="2.3" fill="#5ff0e0"/><circle cx="19" cy="4.8" r="2.3" fill="#5ff0e0"/>
    </g>
  </g>
</svg>

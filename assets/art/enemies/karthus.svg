<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- Karthus, the Deathsinger Lich, top-down facing +X: horned dark spectral crown & deep hooded mantle trailing
       ragged amethyst-and-teal necromantic robes behind (-X), bone-pale skeletal shoulders with glowing spectral chest
       ribs, right hand (+Y) extending a tall gnarled dark-iron Lich Staff with blazing emerald-violet soul orb (+X),
       and left hand (-Y) holding an open glowing rune-etched Grimoire radiating violet-teal light. -->
  <defs>
    <linearGradient id="ka_robe" x1="1" y1="0" x2="0" y2="0.2">
      <stop offset="0" stop-color="#604894"/>
      <stop offset="0.55" stop-color="#352659"/>
      <stop offset="1" stop-color="#171d36"/>
    </linearGradient>
    <linearGradient id="ka_mantle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c63b5"/>
      <stop offset="0.55" stop-color="#43326e"/>
      <stop offset="1" stop-color="#22193b"/>
    </linearGradient>
    <linearGradient id="ka_crown" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5e3a6"/>
      <stop offset="0.5" stop-color="#b5964c"/>
      <stop offset="1" stop-color="#5e4b22"/>
    </linearGradient>
    <radialGradient id="ka_orb">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#8affc4" stop-opacity="0.95"/>
      <stop offset="0.7" stop-color="#9e5cff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#5422b8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ka_book_glow">
      <stop offset="0" stop-color="#b8fff0" stop-opacity="0.82"/>
      <stop offset="0.55" stop-color="#9a64ff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#4b2699" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g transform="translate(50 50)">
    <!-- ghostly wisps drifting from tattered hem -->
    <ellipse cx="-41" cy="-16" rx="8" ry="6" fill="url(#ka_book_glow)" opacity="0.6"/>
    <ellipse cx="-42" cy="12" rx="8" ry="6" fill="url(#ka_book_glow)" opacity="0.6"/>

    <!-- ragged amethyst-and-teal necromantic robes trailing far behind (-X) -->
    <path d="M 4 -25 C -12 -36 -28 -36 -41 -29 L -46 -22 L -39 -16 L -47 -9 L -40 -2 L -47 6 L -39 13 L -45 22 L -37 26 L -38 34 C -24 36 -10 35 4 25 Z" fill="url(#ka_robe)" stroke="#14171f" stroke-width="2" stroke-linejoin="round"/>
    <!-- ghostly teal tattered hem rim & folds -->
    <path d="M -40 -28 L -44 -22 L -37.5 -16 L -45 -9 L -38.5 -2 L -45 6 L -37.5 13 L -43 21.5 L -36 25.5 L -36.5 32.5" fill="none" stroke="#64f0cc" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
    <path d="M -8 -24 Q -24 -26 -38 -19 M -12 -10 Q -26 -11 -41 -7 M -12 10 Q -26 11 -41 8 M -8 24 Q -23 26 -36 22" fill="none" stroke="#18122b" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M -10 -17 Q -24 -18 -37 -13 M -12 0 L -41 1 M -10 17 Q -23 18 -37 15" fill="none" stroke="#8f78cc" stroke-width="1.5" stroke-linecap="round"/>

    <!-- right hand (+Y): tall gnarled dark-iron Lich Staff with blazing emerald-violet soul orb -->
    <path d="M -15 32 L 38 14" stroke="#14171f" stroke-width="5.6" stroke-linecap="round"/>
    <path d="M -15 32 L 38 14" stroke="#4d596b" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M -6 29 L -2 27.5 M 10 23.5 L 14 22" stroke="#a6b8cc" stroke-width="1.4" stroke-linecap="round"/>
    <!-- glowing soul orb aura -->
    <circle cx="41" cy="13" r="11.5" fill="url(#ka_orb)"/>
    <!-- gnarled iron staff claws cradling orb -->
    <path d="M 33 9 Q 40 5 46 9 L 42 12 Q 38 10 35 12 Z M 35 18 Q 42 21 47 16 L 42 14 Q 39 16 36 15 Z" fill="#3a4554" stroke="#14171f" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="41" cy="13" r="4.4" fill="#8affc4" stroke="#14171f" stroke-width="1.4"/>
    <circle cx="41" cy="13" r="2.1" fill="#ffffff"/>

    <!-- left hand (-Y): open glowing rune-etched Grimoire radiating violet-teal light -->
    <circle cx="28" cy="-21" r="14" fill="url(#ka_book_glow)"/>
    <g transform="translate(27 -21) rotate(-14)">
      <!-- ornate dark leather & bronze cover -->
      <path d="M -11 -9 L 11 -10 L 12 9 L -10 10 Z" fill="#2d1c3d" stroke="#14171f" stroke-width="1.8" stroke-linejoin="round"/>
      <!-- open luminous pages -->
      <path d="M -9 -7.5 L 0 -6.5 L 0 7.5 L -8.5 8 Z M 0 -6.5 L 9.5 -8 L 10 7.5 L 0 7.5 Z" fill="#dffef7" stroke="#5b3b96" stroke-width="0.9" stroke-linejoin="round"/>
      <path d="M 0 -6.5 L 0 7.5" stroke="#4a3178" stroke-width="1.5"/>
      <!-- glowing violet-teal arcane rune sigils -->
      <circle cx="-4.5" cy="0.5" r="2.3" fill="none" stroke="#8f4dff" stroke-width="1.2"/>
      <path d="M 2.5 -4 L 7.5 -4.5 M 2.5 -0.5 L 7.5 -1 M 2.5 3 L 6.5 2.5" stroke="#22cc9e" stroke-width="1.4" stroke-linecap="round"/>
    </g>

    <!-- skeletal arms & bony claws -->
    <path d="M 2 18 L 15 21.5 M 2 -18 L 16 -20" stroke="#14171f" stroke-width="7.2" stroke-linecap="round"/>
    <path d="M 2 18 L 15 21.5 M 2 -18 L 16 -20" stroke="#3c2c61" stroke-width="4.2" stroke-linecap="round"/>
    <circle cx="16.5" cy="21.5" r="3.4" fill="#ece5d3" stroke="#14171f" stroke-width="1.4"/>
    <circle cx="17" cy="-20" r="3.4" fill="#ece5d3" stroke="#14171f" stroke-width="1.4"/>

    <!-- high necromantic mantle & bone-pale skeletal shoulders with glowing spectral chest ribs -->
    <path d="M 9 -10 Q 8 -26 -5 -27 Q -16 -25 -17 -11 L -17 11 Q -16 25 -5 27 Q 8 26 9 10 Z" fill="url(#ka_mantle)" stroke="#14171f" stroke-width="2" stroke-linejoin="round"/>
    <!-- glowing spectral core & bone-pale skeletal ribs across upper torso -->
    <ellipse cx="-6" cy="0" rx="6" ry="12" fill="#4af0c4" opacity="0.45"/>
    <path d="M -11 -10 Q -5 -8 -1 -11 M -12 -4 Q -5 -3 0 -5 M -12 4 Q -5 3 0 5 M -11 10 Q -5 8 -1 11" fill="none" stroke="#efe9d8" stroke-width="2.1" stroke-linecap="round"/>
    <!-- bone-pale skeletal shoulder spikes -->
    <path d="M 2 -23 L -5 -34 L 7 -24 Z M -7 -22 L -17 -30 L -5 -17 Z" fill="#efe9d8" stroke="#14171f" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M 2 23 L -5 34 L 7 24 Z M -7 22 L -17 30 L -5 17 Z" fill="#d9d1be" stroke="#14171f" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M -13 -15 Q -15 0 -13 15" fill="none" stroke="#b59ee6" stroke-width="1.6" stroke-linecap="round"/>

    <!-- deep hooded cowl tapering behind + horned dark spectral Lich Crown -->
    <path d="M 15 -9 Q 12 -16 1 -16 Q -11 -16 -17 -7 L -24 0 L -17 7 Q -11 16 1 16 Q 12 16 15 9 Z" fill="#2a2047" stroke="#14171f" stroke-width="2" stroke-linejoin="round"/>
    <path d="M -17 -4 Q -9 -13.5 4 -13.5 Q 11 -13 13 -8" fill="none" stroke="#9982cc" stroke-width="1.5" stroke-linecap="round"/>
    <!-- tall horned Lich Crown sweeping outward/back -->
    <path d="M 6 -9 L -4 -20 L 2 -11 L -9 -14 L -1 -7 Z" fill="url(#ka_crown)" stroke="#14171f" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M 6 9 L -4 20 L 2 11 L -9 14 L -1 7 Z" fill="url(#ka_crown)" stroke="#14171f" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M 9 -8 L 12 -14 L 13 -6 Z M 9 8 L 12 14 L 13 6 Z" fill="url(#ka_crown)" stroke="#14171f" stroke-width="1.3" stroke-linejoin="round"/>

    <!-- gaunt shadowed lich skull peeking at front (+X) with piercing emerald eye slits -->
    <path d="M 7 -7.5 Q 16 -7 20 -2.5 Q 21.5 0 20 2.5 Q 16 7 7 7.5 Q 4 0 7 -7.5 Z" fill="#130e21" stroke="#14171f" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M 10 -5.5 Q 16 -5 19 -1.5 Q 20 0 19 1.5 Q 16 5 10 5.5 Q 12 0 10 -5.5 Z" fill="#dcd5c3" stroke="#14171f" stroke-width="1.1"/>
    <circle cx="15" cy="-2.8" r="3.2" fill="url(#ka_orb)"/>
    <circle cx="15" cy="2.8" r="3.2" fill="url(#ka_orb)"/>
    <path d="M 13.5 -3.8 L 17 -2.4 M 13.5 3.8 L 17 2.4" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
  </g>
</svg>

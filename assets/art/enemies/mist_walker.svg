<svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 56 56">
  <!-- Mist Walker: a hooded spectre seen from above, a peaked slate hood with a pale rim and two glowing teal eyes, long sleeves reaching forward (+X) with bony hands, and a ragged wake of pale mist streaming behind. -->
  <g transform="translate(28 28)">
    <!-- trailing mist -->
    <path d="M -6 -13 Q -20 -24 -27 -14 L -21 -10 L -28 -4 L -21 1 L -28 7 L -21 11 L -27 17 Q -20 24 -6 13 Z" fill="#cfdde2" stroke="#1a1d24" stroke-width="2.4" stroke-linejoin="round" opacity="0.85"/>
    <path d="M -10 -8 L -22 -6 M -10 0 L -24 1 M -10 8 L -22 6" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" opacity="0.9"/>
    <!-- sleeves and hands -->
    <path d="M 2 -10 L 15 -14 L 22 -9 M 2 10 L 15 14 L 22 9" fill="none" stroke="#1a1d24" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 2 -10 L 15 -14 L 22 -9 M 2 10 L 15 14 L 22 9" fill="none" stroke="#6a7882" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 22 -9 L 26 -11 M 22 -9 L 26 -6 M 22 9 L 26 11 M 22 9 L 26 6" fill="none" stroke="#1a1d24" stroke-width="3.6" stroke-linecap="round"/>
    <path d="M 22 -9 L 26 -11 M 22 -9 L 26 -6 M 22 9 L 26 11 M 22 9 L 26 6" fill="none" stroke="#e6eef0" stroke-width="1.8" stroke-linecap="round"/>
    <!-- cloaked body -->
    <ellipse cx="-3" cy="0" rx="12" ry="14" fill="#56636e" stroke="#1a1d24" stroke-width="3"/>
    <path d="M -10 -8 L -3 0 L -10 8" fill="none" stroke="#38424c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M -8 -12 Q -2 -14 4 -11" fill="none" stroke="#b7c8d0" stroke-width="2.2" stroke-linecap="round"/>
    <!-- peaked hood -->
    <path d="M -4 -9 Q 6 -12 15 -4 L 17 0 L 15 4 Q 6 12 -4 9 Q -8 0 -4 -9 Z" fill="#46535e" stroke="#1a1d24" stroke-width="3" stroke-linejoin="round"/>
    <path d="M -2 -7 Q 6 -10 13 -4" fill="none" stroke="#c4d4da" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 6 -5 Q 15 -3 15 0 Q 15 3 6 5 Q 3 0 6 -5 Z" fill="#12151b"/>
    <ellipse cx="11" cy="-2.2" rx="1.9" ry="1.4" fill="#8ffcff"/>
    <ellipse cx="11" cy="2.2" rx="1.9" ry="1.4" fill="#8ffcff"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 56 56">
  <!-- Mist Walker (top-down, facing +X): eerie Shadow Isles mist stalker with tattered dark charcoal-blue shroud trailing ragged mist tendrils (-X), hunched shadowy shoulders, twin hooked spectral claws glowing pale cyan forward (+X), hollow shadowed hood. -->
  <defs>
    <linearGradient id="mwMist" x1="1" y1="0.5" x2="0" y2="0.5">
      <stop offset="0" stop-color="#5ec7d4" stop-opacity="0.72"/>
      <stop offset="0.55" stop-color="#29596b" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#11222e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mwShroud" x1="0.8" y1="0.15" x2="0.1" y2="0.85">
      <stop offset="0" stop-color="#344659"/>
      <stop offset="0.5" stop-color="#1e2a38"/>
      <stop offset="1" stop-color="#0e141c"/>
    </linearGradient>
    <linearGradient id="mwClawGlow" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0" stop-color="#3fa8b8"/>
      <stop offset="0.55" stop-color="#9cf7ff"/>
      <stop offset="1" stop-color="#efffff"/>
    </linearGradient>
    <radialGradient id="mwClawAura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9cfaff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2a9bb0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g transform="translate(28 28)">
    <!-- Swirling spectral mist tendrils trailing behind (-X) -->
    <path d="M -6 -12 C -15 -20, -22 -18, -27 -11 L -20 -8 L -28 -2 L -20 3 L -27 9 L -19 11 L -25 17 C -18 20, -11 17, -6 12 Z" fill="url(#mwMist)"/>
    <!-- Tattered dark charcoal-blue shroud tails -->
    <path d="M -3 -13 C -13 -18, -21 -14, -25 -9 L -17 -5 L -26 0 L -17 5 L -24 11 C -18 16, -11 16, -3 13 Z" fill="url(#mwShroud)" stroke="#14171f" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M -7 -9 C -14 -10, -19 -9, -22 -7 M -7 9 C -14 10, -19 9, -21 8" fill="none" stroke="#629bb0" stroke-width="1.1" stroke-linecap="round" opacity="0.65"/>

    <!-- Twin hooked spectral claws glowing pale cyan forward (+X) -->
    <circle cx="22" cy="-11" r="6.5" fill="url(#mwClawAura)"/>
    <circle cx="22" cy="11" r="6.5" fill="url(#mwClawAura)"/>
    <!-- Tattered shadowy sleeves thrusting forward -->
    <path d="M 1 -11 L 13 -15 L 18 -11 L 11 -7 Z" fill="url(#mwShroud)" stroke="#14171f" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M 1 11 L 13 15 L 18 11 L 11 7 Z" fill="url(#mwShroud)" stroke="#14171f" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Wicked curved hooked pale-cyan spectral claws -->
    <path d="M 16 -12 C 21 -14, 25 -12, 27 -7 C 24 -9, 21 -9, 17 -8 Z" fill="url(#mwClawGlow)" stroke="#14171f" stroke-width="1.3" stroke-linejoin="round"/>
    <path d="M 15 -9 C 20 -9, 24 -7, 25 -3 C 22 -5, 19 -6, 15 -6 Z" fill="url(#mwClawGlow)" stroke="#14171f" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M 16 12 C 21 14, 25 12, 27 7 C 24 9, 21 9, 17 8 Z" fill="url(#mwClawGlow)" stroke="#14171f" stroke-width="1.3" stroke-linejoin="round"/>
    <path d="M 15 9 C 20 9, 24 7, 25 3 C 22 5, 19 6, 15 6 Z" fill="url(#mwClawGlow)" stroke="#14171f" stroke-width="1.2" stroke-linejoin="round"/>

    <!-- Hunched shadowy shoulders & layered mantle -->
    <path d="M -12 0 C -12 -11, -4 -16, 6 -13 C 11 -11, 12 -5, 12 0 C 12 5, 11 11, 6 13 C -4 16, -12 11, -12 0 Z" fill="url(#mwShroud)" stroke="#14171f" stroke-width="1.7" stroke-linejoin="round"/>
    <path d="M -8 -10 C -2 -13, 4 -12, 8 -9" fill="none" stroke="#85b4c7" stroke-width="1.4" stroke-linecap="round" opacity="0.8"/>
    <path d="M -9 -5 L -2 0 L -9 5" fill="none" stroke="#0d131a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Sharp peaked hollow shadowed hood -->
    <path d="M -7 0 C -7 -8, 1 -11, 10 -8 L 17 -3 L 18 0 L 17 3 L 10 8 C 1 11, -7 8, -7 0 Z" fill="url(#mwShroud)" stroke="#14171f" stroke-width="1.7" stroke-linejoin="round"/>
    <!-- Hood peak highlight -->
    <path d="M -3 -6 C 3 -9, 9 -7, 14 -3" fill="none" stroke="#9ec9db" stroke-width="1.3" stroke-linecap="round" opacity="0.85"/>
    <!-- Deep pitch-black hollow void inside hood -->
    <path d="M 6 -5.5 L 15 -2.5 L 15.5 0 L 15 2.5 L 6 5.5 C 4 2, 4 -2, 6 -5.5 Z" fill="#070a0f"/>
    <!-- Sinister narrow pale-cyan eye slits lurking in shadow -->
    <polygon points="9,-3.2 13.5,-1.6 9.8,-1.1" fill="#99fcff"/>
    <polygon points="9,3.2 13.5,1.6 9.8,1.1" fill="#99fcff"/>
  </g>
</svg>

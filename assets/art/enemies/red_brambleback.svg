<svg xmlns="http://www.w3.org/2000/svg" width="112" height="112" viewBox="0 0 112 112">
  <!-- Red Brambleback: fierce Cindered Brambleback Treant from above facing +X, jagged scorched dark-crimson bark plates, thorny briar shoulder spines, blazing ember-orange magma core cracks along back crest, heavy gnarled claw-fists. -->
  <defs>
    <linearGradient id="rb-bark" x1="0.1" y1="0.05" x2="0.9" y2="0.95">
      <stop offset="0" stop-color="#b8422d"/>
      <stop offset="0.48" stop-color="#78221d"/>
      <stop offset="1" stop-color="#351112"/>
    </linearGradient>
    <linearGradient id="rb-bark-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b221b"/>
      <stop offset="0.55" stop-color="#421513"/>
      <stop offset="1" stop-color="#210a0a"/>
    </linearGradient>
    <linearGradient id="rb-thorn" x1="0.1" y1="0.1" x2="0.9" y2="0.9">
      <stop offset="0" stop-color="#f7ebd0"/>
      <stop offset="0.6" stop-color="#bfa882"/>
      <stop offset="1" stop-color="#695338"/>
    </linearGradient>
    <linearGradient id="rb-flame" x1="1" y1="0.5" x2="0" y2="0.5">
      <stop offset="0" stop-color="#fff49c"/>
      <stop offset="0.45" stop-color="#ff8d1f"/>
      <stop offset="1" stop-color="#c92914"/>
    </linearGradient>
    <radialGradient id="rb-magma" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff8b0"/>
      <stop offset="0.4" stop-color="#ff8b1f" stop-opacity="0.88"/>
      <stop offset="0.8" stop-color="#d42b12" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8a1008" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g transform="translate(56 56)">
    <!-- Heavy gnarled bark arms reaching forward (+X) -->
    <path d="M -2 -34 L 28 -32 L 30 -19 L 0 -20 Z" fill="url(#rb-bark-dark)" stroke="#14171f" stroke-width="2" stroke-linejoin="round"/>
    <path d="M -2 34 L 28 32 L 30 19 L 0 20 Z" fill="url(#rb-bark-dark)" stroke="#14171f" stroke-width="2" stroke-linejoin="round"/>
    <!-- Glowing ember fissures along forearms -->
    <path d="M 8 -27 L 23 -25 M 8 27 L 23 25" stroke="#ff8e24" stroke-width="2.2" stroke-linecap="round"/>

    <!-- HEAVY GNARLED CLAW-FISTS forward (+X) -->
    <!-- Upper claw-fist -->
    <g>
      <path d="M 37 -33 L 50 -36 L 42 -28 Z M 39 -26 L 53 -26 L 42 -22 Z M 37 -19 L 49 -16 L 41 -22 Z" fill="url(#rb-thorn)" stroke="#14171f" stroke-width="1.6" stroke-linejoin="round"/>
      <polygon points="22,-34 34,-36 42,-28 41,-19 32,-16 22,-21" fill="url(#rb-bark)" stroke="#14171f" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M 26 -31 L 36 -31 M 26 -25 L 38 -24" stroke="#ff9a2e" stroke-width="1.6" stroke-linecap="round"/>
    </g>
    <!-- Lower claw-fist -->
    <g>
      <path d="M 37 19 L 49 16 L 41 22 Z M 39 26 L 53 26 L 42 22 Z M 37 33 L 50 36 L 42 28 Z" fill="url(#rb-thorn)" stroke="#14171f" stroke-width="1.6" stroke-linejoin="round"/>
      <polygon points="22,34 34,36 42,28 41,19 32,16 22,21" fill="url(#rb-bark)" stroke="#14171f" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M 26 31 L 36 31 M 26 25 L 38 24" stroke="#ff9a2e" stroke-width="1.6" stroke-linecap="round"/>
    </g>

    <!-- Jagged thorny briar spines jutting out from back and flanks -->
    <g fill="url(#rb-thorn)" stroke="#14171f" stroke-width="1.6" stroke-linejoin="round">
      <polygon points="-28,-22 -36,-38 -19,-26"/>
      <polygon points="-16,-28 -21,-44 -7,-30"/>
      <polygon points="-28,22 -36,38 -19,26"/>
      <polygon points="-16,28 -21,44 -7,30"/>
      <polygon points="-31,-8 -46,-11 -33,-1"/>
      <polygon points="-31,8 -46,11 -33,1"/>
      <polygon points="-33,-4 -49,0 -33,4"/>
    </g>

    <!-- HULKING JAGGED SCORCHED BARK TORSO (irregular organic treant plates) -->
    <path d="M -35 0 L -31 -18 L -21 -33 L -4 -37 L 13 -32 L 21 -16 L 21 16 L 13 32 L -4 37 L -21 33 L -31 18 Z" fill="url(#rb-bark)" stroke="#14171f" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- Dark scorched bark plates & split wood grooves -->
    <path d="M -27 -17 L -16 -28 L 2 -25 L -6 -10 L -24 -9 Z" fill="#a83b27" opacity="0.65"/>
    <path d="M -27 17 L -16 28 L 2 25 L -6 10 L -24 9 Z" fill="#2e0d0d" opacity="0.55"/>

    <!-- BLAZING EMBER-ORANGE MAGMA CORE CRACKS pulsing along back & spine -->
    <circle cx="-9" cy="0" r="18" fill="url(#rb-magma)" opacity="0.85"/>
    <path d="M -29 0 L -15 -4 L -4 0 L 8 -5 M -15 -4 L -21 -17 M -14 2 L -20 16 M -4 0 L 4 14 M -4 0 L 3 -15" fill="none" stroke="#14171f" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M -29 0 L -15 -4 L -4 0 L 8 -5 M -15 -4 L -21 -17 M -14 2 L -20 16 M -4 0 L 4 14 M -4 0 L 3 -15" fill="none" stroke="#ff821a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M -24 0 L -15 -4 L -4 0 L 4 -3 M -15 -4 L -18 -11 M -14 2 L -17 10" fill="none" stroke="#fff3a0" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Tangled thorny briar vines wrapped across lower back -->
    <path d="M -30 -15 Q -18 -9 -14 0 Q -18 9 -30 15" fill="none" stroke="#14171f" stroke-width="5.2" stroke-linecap="round"/>
    <path d="M -30 -15 Q -18 -9 -14 0 Q -18 9 -30 15" fill="none" stroke="#59281d" stroke-width="2.6" stroke-linecap="round"/>

    <!-- BROAD JAGGED BARK SHOULDERS with thorny briar horns -->
    <g>
      <polygon points="2,-39 14,-49 11,-34" fill="url(#rb-thorn)" stroke="#14171f" stroke-width="1.6" stroke-linejoin="round"/>
      <polygon points="-12,-33 0,-42 14,-35 14,-22 1,-19 -11,-23" fill="url(#rb-bark)" stroke="#14171f" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M -7 -31 L 2 -36 L 9 -31" fill="none" stroke="#d45d3b" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M -3 -27 L 5 -26" stroke="#ff9b2e" stroke-width="1.6" stroke-linecap="round"/>
    </g>
    <g>
      <polygon points="2,39 14,49 11,34" fill="url(#rb-thorn)" stroke="#14171f" stroke-width="1.6" stroke-linejoin="round"/>
      <polygon points="-12,33 0,42 14,35 14,22 1,19 -11,23" fill="url(#rb-bark)" stroke="#14171f" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M -7 31 L 2 36 L 9 31" fill="none" stroke="#a63c28" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M -3 27 L 5 26" stroke="#ff9b2e" stroke-width="1.6" stroke-linecap="round"/>
    </g>

    <!-- Blazing ember-flame crest sweeping back from the head -->
    <path d="M 10 -8 Q 0 -17 -12 -14 Q -4 -8 -16 -4 Q -6 -1 -19 2 Q -5 4 -13 11 Q -1 9 10 8 Z" fill="url(#rb-flame)" stroke="#14171f" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M 9 -4 Q 1 -8 -6 -5 Q 0 -1 -10 0 Q 0 2 -5 6 Q 2 4 9 4 Z" fill="#fff194"/>

    <!-- FIERCE TREANT HEAD with curved thorn-tusks and molten-gold eyes (+X) -->
    <g>
      <polygon points="24,-8 39,-12 29,-3" fill="url(#rb-thorn)" stroke="#14171f" stroke-width="1.6" stroke-linejoin="round"/>
      <polygon points="24,8 39,12 29,3" fill="url(#rb-thorn)" stroke="#14171f" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M 7 -13 L 19 -16 L 29 -9 L 32 0 L 29 9 L 19 16 L 7 13 L 2 0 Z" fill="url(#rb-bark)" stroke="#14171f" stroke-width="2.2" stroke-linejoin="round"/>
      <!-- Bark brow ridges & glowing forehead fissure -->
      <path d="M 9 -10 L 20 -11 M 9 10 L 20 11" stroke="#d95e3a" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M 7 0 L 18 0" stroke="#ffaa2e" stroke-width="2" stroke-linecap="round"/>
      <!-- Molten-gold eyes -->
      <circle cx="21" cy="-5.8" r="4.2" fill="url(#rb-magma)"/>
      <circle cx="21" cy="5.8" r="4.2" fill="url(#rb-magma)"/>
      <path d="M 18 -7.6 L 24.5 -5 L 19.5 -3.6 Z" fill="#fff280" stroke="#14171f" stroke-width="0.9" stroke-linejoin="round"/>
      <path d="M 18 7.6 L 24.5 5 L 19.5 3.6 Z" fill="#fff280" stroke="#14171f" stroke-width="0.9" stroke-linejoin="round"/>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="112" height="112" viewBox="0 0 112 112">
  <!-- Red Brambleback: a hulking red beast seen from above, bone thorns down its back, a burning crest on its head, clawed arms forward (+X). -->
  <g transform="translate(56 56)">
    <ellipse cx="-2" cy="5" rx="47" ry="42" fill="#000000" opacity="0.25"/>
    <!-- arms and claws -->
    <path d="M 0 -30 L 32 -26 M 0 30 L 32 26" stroke="#1a1d24" stroke-width="18" stroke-linecap="round"/>
    <path d="M 0 -30 L 32 -26 M 0 30 L 32 26" stroke="#7a2420" stroke-width="12" stroke-linecap="round"/>
    <path d="M 34 -32 L 48 -34 M 36 -26 L 50 -25 M 34 -20 L 47 -16" stroke="#1a1d24" stroke-width="6" stroke-linecap="round"/>
    <path d="M 34 -32 L 48 -34 M 36 -26 L 50 -25 M 34 -20 L 47 -16" stroke="#efe0bc" stroke-width="3" stroke-linecap="round"/>
    <path d="M 34 32 L 48 34 M 36 26 L 50 25 M 34 20 L 47 16" stroke="#1a1d24" stroke-width="6" stroke-linecap="round"/>
    <path d="M 34 32 L 48 34 M 36 26 L 50 25 M 34 20 L 47 16" stroke="#efe0bc" stroke-width="3" stroke-linecap="round"/>
    <!-- body -->
    <ellipse cx="-6" cy="0" rx="34" ry="38" fill="#a8322a" stroke="#1a1d24" stroke-width="3"/>
    <ellipse cx="-10" cy="0" rx="22" ry="26" fill="#7a2420"/>
    <!-- bone thorns down its back and shoulders -->
    <g fill="#efe0bc" stroke="#1a1d24" stroke-width="2" stroke-linejoin="round">
      <path d="M -30 -6 L -46 -10 L -32 2 Z"/>
      <path d="M -30 6 L -46 10 L -32 -2 Z"/>
      <path d="M -18 -18 L -28 -32 L -12 -22 Z"/>
      <path d="M -18 18 L -28 32 L -12 22 Z"/>
      <path d="M -2 -28 L -6 -46 L 6 -30 Z"/>
      <path d="M -2 28 L -6 46 L 6 30 Z"/>
      <path d="M -20 -4 L -30 0 L -20 4 Z"/>
    </g>
    <!-- head -->
    <ellipse cx="16" cy="0" rx="14" ry="15" fill="#c03a30" stroke="#1a1d24" stroke-width="3"/>
    <!-- burning crest, flames swept back -->
    <path d="M 22 0 L 12 -10 L 10 -4 L -2 -14 L 2 -4 L -10 -8 L -4 0 L -10 8 L 2 4 L -2 14 L 10 4 L 12 10 Z" fill="#ff9a2a" stroke="#1a1d24" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 18 0 L 10 -5 L 8 -1 L 0 -5 L 2 0 L 0 5 L 8 1 L 10 5 Z" fill="#ffe14a"/>
    <!-- eyes and tusks -->
    <circle cx="24" cy="-6" r="2.2" fill="#ffe14a"/>
    <circle cx="24" cy="6" r="2.2" fill="#ffe14a"/>
    <path d="M 27 -9 L 34 -11 M 27 9 L 34 11" stroke="#1a1d24" stroke-width="5" stroke-linecap="round"/>
    <path d="M 27 -9 L 34 -11 M 27 9 L 34 11" stroke="#efe0bc" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>

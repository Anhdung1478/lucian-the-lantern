<svg xmlns="http://www.w3.org/2000/svg" width="92" height="92" viewBox="0 0 92 92">
  <!-- Maiden of the Mist (top-down, facing +X): haunting elongated dark-teal & spectral-black tattered veil, sharp horned shadowy crown, hollow shadowed face with faint slit glow, slender skeletal arms sweeping forward into ghostly claws, glowing cyan-green soul-vortex heart. -->
  <defs>
    <linearGradient id="mmOuterVeil" x1="0.85" y1="0.2" x2="0.05" y2="0.8">
      <stop offset="0" stop-color="#194a54"/>
      <stop offset="0.5" stop-color="#0d2630"/>
      <stop offset="1" stop-color="#071117"/>
    </linearGradient>
    <linearGradient id="mmInnerVeil" x1="0.85" y1="0.3" x2="0.1" y2="0.75">
      <stop offset="0" stop-color="#2c757d"/>
      <stop offset="0.55" stop-color="#133d47"/>
      <stop offset="1" stop-color="#0a1c24"/>
    </linearGradient>
    <radialGradient id="mmVortex" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#eafffc" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#5cf5dc" stop-opacity="0.75"/>
      <stop offset="0.72" stop-color="#149e96" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#0b3b42" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mmClaw" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0" stop-color="#4ba6ab"/>
      <stop offset="0.6" stop-color="#9cf2eb"/>
      <stop offset="1" stop-color="#eafffd"/>
    </linearGradient>
    <linearGradient id="mmCrown" x1="0.2" y1="0.1" x2="0.8" y2="0.9">
      <stop offset="0" stop-color="#4e6975"/>
      <stop offset="0.5" stop-color="#22313b"/>
      <stop offset="1" stop-color="#0d141a"/>
    </linearGradient>
  </defs>

  <g transform="translate(46 46)">
    <!-- Elongated tattered spectral-black & dark-teal outer veil billowing behind (-X) -->
    <path d="M 4 -22 C -12 -33, -28 -34, -42 -22 L -31 -17 L -44 -10 L -32 -4 L -45 2 L -31 7 L -43 14 L -30 18 L -40 25 C -26 35, -10 32, 4 22 Z" fill="url(#mmOuterVeil)" stroke="#14171f" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- Spectral cyan veins rippling through tattered veil -->
    <path d="M -6 -20 C -18 -24, -29 -22, -37 -18 M -10 -7 C -21 -8, -31 -8, -39 -7 M -10 7 C -21 8, -30 9, -38 11 M -6 20 C -18 23, -27 22, -35 20" fill="none" stroke="#4cd4cc" stroke-width="1.3" stroke-linecap="round" opacity="0.6"/>

    <!-- Inner torn dark-teal shawl layer -->
    <path d="M 6 -17 C -8 -23, -22 -20, -32 -12 L -23 -7 L -34 -1 L -24 5 L -32 12 C -21 20, -8 22, 6 17 Z" fill="url(#mmInnerVeil)" stroke="#14171f" stroke-width="1.6" stroke-linejoin="round"/>

    <!-- Slender skeletal spectral arms sweeping forward (+X) into predatory claws -->
    <!-- Dripping tattered sleeve drapes -->
    <path d="M 2 -16 C 12 -21, 21 -19, 27 -13 C 20 -13, 13 -11, 6 -9 Z" fill="#143842" stroke="#14171f" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M 2 16 C 12 21, 21 19, 27 13 C 20 13, 13 11, 6 9 Z" fill="#143842" stroke="#14171f" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Gaunt bony forearms curving forward-inward -->
    <path d="M 4 -15 C 15 -18, 24 -16, 31 -10 M 4 15 C 15 18, 24 16, 31 10" fill="none" stroke="#14171f" stroke-width="5.6" stroke-linecap="round"/>
    <path d="M 4 -15 C 15 -18, 24 -16, 31 -10 M 4 15 C 15 18, 24 16, 31 10" fill="none" stroke="url(#mmClaw)" stroke-width="2.8" stroke-linecap="round"/>
    <!-- Razor-sharp curved ghostly claws reaching to +X -->
    <path d="M 30 -11 L 41 -14 L 33 -8 L 43 -9 L 33 -5 L 39 -4 L 29 -7 Z" fill="url(#mmClaw)" stroke="#14171f" stroke-width="1.3" stroke-linejoin="round"/>
    <path d="M 30 11 L 41 14 L 33 8 L 43 9 L 33 5 L 39 4 L 29 7 Z" fill="url(#mmClaw)" stroke="#14171f" stroke-width="1.3" stroke-linejoin="round"/>

    <!-- Hollow spectral torso & glowing eerie cyan-green soul-vortex heart -->
    <path d="M -14 0 C -14 -14, -2 -20, 12 -14 C 19 -10, 20 10, 12 14 C -2 20, -14 14, -14 0 Z" fill="#0d222b" stroke="#14171f" stroke-width="1.8"/>
    <!-- Soul-vortex ambient aura & swirling core -->
    <circle cx="-2" cy="0" r="14" fill="url(#mmVortex)"/>
    <path d="M -8 -6 C -2 -11, 7 -6, 6 1 C 5 7, -3 9, -7 4 M -5 -2 C -1 -5, 4 -3, 3 1" fill="none" stroke="#9efff2" stroke-width="1.6" stroke-linecap="round" opacity="0.9"/>
    <circle cx="-1" cy="0" r="3.2" fill="#effffc"/>

    <!-- Shadowed wraith hood & hollow void head -->
    <path d="M -3 0 C -3 -11, 7 -15, 18 -11 C 24 -8, 26 -3, 26 0 C 26 3, 24 8, 18 11 C 7 15, -3 11, -3 0 Z" fill="url(#mmInnerVeil)" stroke="#14171f" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- Top-left spectral highlight on hood crest -->
    <path d="M 2 -10 C 8 -13, 15 -12, 20 -8" fill="none" stroke="#76deda" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
    <!-- Deep recessed hollow face void -->
    <path d="M 12 -7.5 C 19 -6.5, 24 -3.5, 24.5 0 C 24 3.5, 19 6.5, 12 7.5 C 9 3.5, 9 -3.5, 12 -7.5 Z" fill="#060c10" stroke="#14171f" stroke-width="1.2"/>
    <!-- Faint eerie narrow slit-glow eyes inside the shadowed void -->
    <polygon points="16,-4.4 21.5,-2.6 17,-1.9" fill="#94fff8"/>
    <polygon points="16,4.4 21.5,2.6 17,1.9" fill="#94fff8"/>

    <!-- Sharp horned shadowy obsidian crown arching back over her veiled brow -->
    <path d="M 10 -11 L -2 -23 L 6 -12 L -5 -16 L 4 -7 L 1 -2 L 4 0 L 1 2 L 4 7 L -5 16 L 6 12 L -2 23 L 10 11 L 14 7 L 10 0 L 14 -7 Z" fill="url(#mmCrown)" stroke="#14171f" stroke-width="1.6" stroke-linejoin="round"/>
    <!-- Crisp pale rim glints on crown horns -->
    <path d="M 9 -10 L 0 -20 M 6 -10 L -3 -14 M 9 10 L 0 20" stroke="#8ad9d9" stroke-width="1.1" stroke-linecap="round" opacity="0.85"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="104" height="104" viewBox="0 0 104 104">
  <!-- Broodmother: a heavy bone-white spider seen from above, a swollen abdomen studded with glowing egg-sacs behind, eight thick jointed legs, a ridged carapace, red-tipped fangs and a cluster of green eyes forward (+X). -->
  <g transform="translate(52 52)">
    <!-- legs -->
    <path d="M 10 -12 L 26 -28 L 42 -36 M 4 -14 L 12 -36 L 12 -46 M -4 -14 L -20 -34 L -30 -42 M -10 -10 L -32 -18 L -46 -16 M 10 12 L 26 28 L 42 36 M 4 14 L 12 36 L 12 46 M -4 14 L -20 34 L -30 42 M -10 10 L -32 18 L -46 16" fill="none" stroke="#1a1d24" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 10 -12 L 26 -28 L 42 -36 M 4 -14 L 12 -36 L 12 -46 M -4 -14 L -20 -34 L -30 -42 M -10 -10 L -32 -18 L -46 -16 M 10 12 L 26 28 L 42 36 M 4 14 L 12 36 L 12 46 M -4 14 L -20 34 L -30 42 M -10 10 L -32 18 L -46 16" fill="none" stroke="#d6cfb8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#8a826a" stroke="#1a1d24" stroke-width="2"><circle cx="26" cy="-28" r="3.4"/><circle cx="26" cy="28" r="3.4"/><circle cx="-20" cy="-34" r="3.4"/><circle cx="-20" cy="34" r="3.4"/></g>
    <!-- abdomen -->
    <ellipse cx="-21" cy="0" rx="28" ry="24" fill="#e8e2cf" stroke="#1a1d24" stroke-width="3.5"/>
    <ellipse cx="-24" cy="-8" rx="16" ry="7" fill="#fbf7ea" opacity="0.8"/>
    <path d="M -44 0 L -10 0 M -42 -10 Q -26 -4 -12 -10 M -42 10 Q -26 4 -12 10" fill="none" stroke="#a89f84" stroke-width="2.4" stroke-linecap="round"/>
    <!-- egg-sacs -->
    <g stroke="#1a1d24" stroke-width="2">
      <circle cx="-36" cy="-9" r="6.5" fill="#b9e7a0"/><circle cx="-36" cy="9" r="6.5" fill="#b9e7a0"/>
      <circle cx="-27" cy="0" r="7.5" fill="#d9f2b8"/><circle cx="-17" cy="-11" r="5.5" fill="#b9e7a0"/><circle cx="-17" cy="11" r="5.5" fill="#b9e7a0"/>
    </g>
    <g fill="#7b2f9a"><circle cx="-36" cy="-9" r="2.6"/><circle cx="-36" cy="9" r="2.6"/><circle cx="-27" cy="0" r="3"/><circle cx="-17" cy="-11" r="2.2"/><circle cx="-17" cy="11" r="2.2"/></g>
    <!-- carapace -->
    <ellipse cx="14" cy="0" rx="20" ry="17" fill="#f4efdf" stroke="#1a1d24" stroke-width="3.5"/>
    <ellipse cx="10" cy="-6" rx="9" ry="4" fill="#ffffff" opacity="0.7"/>
    <path d="M 2 -10 L 14 0 L 2 10 M 6 0 L 22 0" fill="none" stroke="#a89f84" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- fangs -->
    <path d="M 30 -7 L 41 -5 M 30 7 L 41 5" fill="none" stroke="#1a1d24" stroke-width="7" stroke-linecap="round"/>
    <path d="M 30 -7 L 41 -5 M 30 7 L 41 5" fill="none" stroke="#e8e2cf" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M 38 -5 L 41 -5 M 38 5 L 41 5" fill="none" stroke="#d94a3a" stroke-width="3.4" stroke-linecap="round"/>
    <!-- eyes -->
    <circle cx="28" cy="-9" r="3.4" fill="#8dff6a" stroke="#1a1d24" stroke-width="1.6"/>
    <circle cx="28" cy="9" r="3.4" fill="#8dff6a" stroke="#1a1d24" stroke-width="1.6"/>
    <circle cx="23" cy="-5" r="2.6" fill="#8dff6a" stroke="#1a1d24" stroke-width="1.4"/>
    <circle cx="23" cy="5" r="2.6" fill="#8dff6a" stroke="#1a1d24" stroke-width="1.4"/>
    <circle cx="19" cy="-10" r="2.2" fill="#8dff6a" stroke="#1a1d24" stroke-width="1.2"/>
    <circle cx="19" cy="10" r="2.2" fill="#8dff6a" stroke="#1a1d24" stroke-width="1.2"/>
  </g>
</svg>

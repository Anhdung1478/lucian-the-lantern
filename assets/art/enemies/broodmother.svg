<svg xmlns="http://www.w3.org/2000/svg" width="104" height="104" viewBox="0 0 104 104">
  <!-- Broodmother: a huge spider seen from above with a bone-white carapace, a swollen ridged abdomen behind, eight jointed legs, fangs and a cluster of green eyes forward (+X). -->
  <g transform="translate(52 52)">
    <ellipse cx="-2" cy="4" rx="46" ry="42" fill="#000000" opacity="0.25"/>
    <!-- legs -->
    <path d="M 10 -12 L 28 -30 L 42 -36 M 4 -14 L 12 -38 L 8 -46 M -4 -14 L -22 -36 L -32 -40 M -10 -10 L -34 -18 L -46 -14 M 10 12 L 28 30 L 42 36 M 4 14 L 12 38 L 8 46 M -4 14 L -22 36 L -32 40 M -10 10 L -34 18 L -46 14" fill="none" stroke="#1a1d24" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 10 -12 L 28 -30 L 42 -36 M 4 -14 L 12 -38 L 8 -46 M -4 -14 L -22 -36 L -32 -40 M -10 -10 L -34 -18 L -46 -14 M 10 12 L 28 30 L 42 36 M 4 14 L 12 38 L 8 46 M -4 14 L -22 36 L -32 40 M -10 10 L -34 18 L -46 14" fill="none" stroke="#c9c2ad" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- abdomen -->
    <ellipse cx="-20" cy="0" rx="27" ry="23" fill="#e8e2cf" stroke="#1a1d24" stroke-width="3.5"/>
    <path d="M -36 0 L -8 0 M -34 -9 Q -22 -4 -10 -9 M -34 9 Q -22 4 -10 9" fill="none" stroke="#a89f84" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="-26" cy="0" r="4" fill="#7b2f9a" opacity="0.75"/>
    <!-- carapace -->
    <ellipse cx="14" cy="0" rx="19" ry="16" fill="#f4efdf" stroke="#1a1d24" stroke-width="3.5"/>
    <path d="M 4 -9 L 14 0 L 4 9" fill="none" stroke="#a89f84" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- fangs -->
    <path d="M 30 -6 L 40 -4 M 30 6 L 40 4" fill="none" stroke="#1a1d24" stroke-width="6" stroke-linecap="round"/>
    <path d="M 30 -6 L 40 -4 M 30 6 L 40 4" fill="none" stroke="#d94a3a" stroke-width="2.4" stroke-linecap="round"/>
    <!-- eyes -->
    <circle cx="27" cy="-8" r="3.2" fill="#8dff6a" stroke="#1a1d24" stroke-width="1.5"/>
    <circle cx="27" cy="8" r="3.2" fill="#8dff6a" stroke="#1a1d24" stroke-width="1.5"/>
    <circle cx="22" cy="-4" r="2.2" fill="#8dff6a" stroke="#1a1d24" stroke-width="1.2"/>
    <circle cx="22" cy="4" r="2.2" fill="#8dff6a" stroke="#1a1d24" stroke-width="1.2"/>
  </g>
</svg>

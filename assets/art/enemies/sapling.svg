<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- Sapling (top-down, facing +X): gnarled twisted-bark Shadow Isles sprout with asymmetrical scraggly root legs, tiny dead-forest leaves, and a pulsing toxic-emerald seed core. -->
  <defs>
    <linearGradient id="spBark" x1="0.15" y1="0.1" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#7d644c"/>
      <stop offset="0.5" stop-color="#4d3a2b"/>
      <stop offset="1" stop-color="#241a14"/>
    </linearGradient>
    <linearGradient id="spLeaf" x1="0.1" y1="0.1" x2="0.9" y2="0.9">
      <stop offset="0" stop-color="#69ba68"/>
      <stop offset="0.55" stop-color="#356e40"/>
      <stop offset="1" stop-color="#1b3826"/>
    </linearGradient>
    <radialGradient id="spCoreGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#eaffd9" stop-opacity="0.98"/>
      <stop offset="0.4" stop-color="#5eff87" stop-opacity="0.78"/>
      <stop offset="0.78" stop-color="#179c4c" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#0b3b22" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g transform="translate(24 24)">
    <!-- Asymmetrical gnarled root legs sprawling out -->
    <!-- Forward lunging gnarled roots (+X) -->
    <path d="M 6 -6 C 12 -9, 15 -14, 21 -12 M 8 5 C 14 7, 17 12, 22 9 M 9 0 C 14 -1, 17 2, 20 1" fill="none" stroke="#14171f" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 6 -6 C 12 -9, 15 -14, 21 -12 M 8 5 C 14 7, 17 12, 22 9 M 9 0 C 14 -1, 17 2, 20 1" fill="none" stroke="#6b543e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Crooked trailing roots & twisted rear twigs (-X) -->
    <path d="M -6 -6 C -11 -11, -15 -16, -12 -20 M -12 -13 L -19 -14 M -7 6 C -12 10, -17 14, -14 19 M -12 11 L -20 12 M -9 1 C -15 0, -18 -4, -22 -2" fill="none" stroke="#14171f" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M -6 -6 C -11 -11, -15 -16, -12 -20 M -12 -13 L -19 -14 M -7 6 C -12 10, -17 14, -14 19 M -12 11 L -20 12 M -9 1 C -15 0, -18 -4, -22 -2" fill="none" stroke="#5e4936" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Tiny asymmetrical dead-forest Shadow Isles leaf clusters -->
    <path d="M -12 -18 C -16 -22, -10 -24, -7 -19 C -8 -17, -10 -17, -12 -18 Z" fill="url(#spLeaf)" stroke="#14171f" stroke-width="1.3"/>
    <path d="M -19 -14 C -24 -16, -23 -10, -17 -11 C -16 -12, -17 -13, -19 -14 Z" fill="url(#spLeaf)" stroke="#14171f" stroke-width="1.3"/>
    <path d="M -14 18 C -17 23, -10 23, -9 18 C -10 16, -12 16, -14 18 Z" fill="url(#spLeaf)" stroke="#14171f" stroke-width="1.3"/>
    <path d="M -19 11 C -24 10, -23 16, -17 14 C -16 13, -17 11, -19 11 Z" fill="url(#spLeaf)" stroke="#14171f" stroke-width="1.3"/>
    <path d="M -21 -2 C -24 -6, -24 2, -19 1 Z" fill="#4f9952" stroke="#14171f" stroke-width="1.2"/>

    <!-- Gnarled irregular twisted-bark burl body (organic asymmetric path) -->
    <path d="M -11 -4 C -12 -10, -6 -14, 2 -12 C 9 -11, 13 -6, 13 0 C 13 7, 8 12, 1 13 C -6 14, -12 9, -12 3 C -13 0, -12 -2, -11 -4 Z" fill="url(#spBark)" stroke="#14171f" stroke-width="1.7" stroke-linejoin="round"/>
    <!-- Twisted bark grain ridges & top-left highlight -->
    <path d="M -8 -8 C -3 -11, 4 -10, 8 -7" fill="none" stroke="#ab9072" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
    <path d="M -9 -2 C -6 -5, -4 5, -8 7 M 5 -9 C 8 -5, 8 4, 4 9" fill="none" stroke="#241a13" stroke-width="1.4" stroke-linecap="round"/>

    <!-- Pulsing toxic-emerald seed core nestled in deep bark fissures -->
    <circle cx="0" cy="0" r="9.5" fill="url(#spCoreGlow)"/>
    <!-- Glowing toxic sap cracks radiating from the heart -->
    <path d="M 0 0 L -7 -5 M 0 0 L -8 4 M 0 0 L 6 -6 M 0 0 L 6 6" stroke="#6bff8e" stroke-width="1.6" stroke-linecap="round"/>
    <polygon points="-4,0 0,-4.8 4.8,0 0,4.5" fill="#d9ffde" stroke="#1a7a3e" stroke-width="1.2" stroke-linejoin="round"/>
    <circle cx="0.5" cy="-0.5" r="1.8" fill="#ffffff"/>

    <!-- Tiny fierce toxic-emerald eye-slits peeking from the forward bark notch (+X) -->
    <polygon points="8.5,-4.4 12.2,-2.6 9,-2" fill="#8cff8c"/>
    <polygon points="8.5,4.4 12.2,2.6 9,2" fill="#8cff8c"/>
  </g>
</svg>

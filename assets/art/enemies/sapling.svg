<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- Sapling: a little walking dead tree seen from above: a knotted bark body split by glowing green cracks round a bright core, twisted branches with leaf clumps behind and grasping root-feet forward (+X). -->
  <g transform="translate(24 24)">
    <!-- branches behind -->
    <path d="M -4 -5 L -11 -13 L -10 -19 M -11 -13 L -18 -14 M -4 5 L -11 13 L -10 19 M -11 13 L -18 14 M -5 0 L -17 0 L -21 -4" fill="none" stroke="#1a1d24" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M -4 -5 L -11 -13 L -10 -19 M -11 -13 L -18 -14 M -4 5 L -11 13 L -10 19 M -11 13 L -18 14 M -5 0 L -17 0 L -21 -4" fill="none" stroke="#8a7254" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- leaf clumps -->
    <g fill="#5fb04a" stroke="#1a1d24" stroke-width="2.2">
      <ellipse cx="-11" cy="-19" rx="5" ry="3.6" transform="rotate(-30 -11 -19)"/>
      <ellipse cx="-19" cy="-14" rx="4.6" ry="3.2" transform="rotate(20 -19 -14)"/>
      <ellipse cx="-11" cy="19" rx="5" ry="3.6" transform="rotate(30 -11 19)"/>
      <ellipse cx="-19" cy="14" rx="4.6" ry="3.2" transform="rotate(-20 -19 14)"/>
      <ellipse cx="-21" cy="-3" rx="4.2" ry="3.4"/>
    </g>
    <g fill="#a6e882">
      <ellipse cx="-12" cy="-20" rx="2.4" ry="1.4"/><ellipse cx="-12" cy="20" rx="2.4" ry="1.4"/><ellipse cx="-20" cy="-15" rx="2.2" ry="1.3"/><ellipse cx="-20" cy="13" rx="2.2" ry="1.3"/>
    </g>
    <!-- root feet forward -->
    <path d="M 8 -7 L 15 -11 L 20 -9 M 9 0 L 20 0 M 8 7 L 15 11 L 20 9" fill="none" stroke="#1a1d24" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 8 -7 L 15 -11 L 20 -9 M 9 0 L 20 0 M 8 7 L 15 11 L 20 9" fill="none" stroke="#8a7254" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- bark body -->
    <circle cx="0" cy="0" r="13" fill="#7a6048" stroke="#1a1d24" stroke-width="3"/>
    <path d="M -9 -9 Q 0 -13 9 -8" fill="none" stroke="#b09a76" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="1" cy="1" r="8.5" fill="#5a4632"/>
    <path d="M -9 -4 Q -6 0 -9 5 M 9 -5 Q 6 0 9 5" fill="none" stroke="#3a2c1e" stroke-width="2" stroke-linecap="round"/>
    <!-- glowing cracks and core -->
    <path d="M 1 0 L -6 -6 M 1 0 L -7 5 M 1 0 L 8 -5 M 1 0 L 8 6" fill="none" stroke="#6dff8a" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="1" cy="0" r="6.5" fill="#6dff8a" opacity="0.4"/>
    <circle cx="1" cy="0" r="4" fill="#d4ffd9" stroke="#2f9a4a" stroke-width="1.6"/>
  </g>
</svg>

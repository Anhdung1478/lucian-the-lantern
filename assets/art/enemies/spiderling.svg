<svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44">
  <!-- Spiderling: a quick dark spider seen from above, eight clear bent legs with a pale rim, a round glossy abdomen with a bone mark behind, and a head with red eyes and fangs forward (+X). -->
  <g transform="translate(22 22)">
    <!-- legs: four a side -->
    <path d="M 5 -4 L 11 -12 L 18 -16 M 2 -5 L 4 -15 L 8 -21 M -2 -5 L -9 -14 L -13 -20 M -5 -3 L -15 -8 L -21 -7 M 5 4 L 11 12 L 18 16 M 2 5 L 4 15 L 8 21 M -2 5 L -9 14 L -13 20 M -5 3 L -15 8 L -21 7" fill="none" stroke="#1a1d24" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 5 -4 L 11 -12 L 18 -16 M 2 -5 L 4 -15 L 8 -21 M -2 -5 L -9 -14 L -13 -20 M -5 -3 L -15 -8 L -21 -7 M 5 4 L 11 12 L 18 16 M 2 5 L 4 15 L 8 21 M -2 5 L -9 14 L -13 20 M -5 3 L -15 8 L -21 7" fill="none" stroke="#aab9bd" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- abdomen -->
    <ellipse cx="-8" cy="0" rx="11" ry="9.5" fill="#33364a" stroke="#1a1d24" stroke-width="2.6"/>
    <ellipse cx="-10" cy="-3" rx="6" ry="3" fill="#5a6078" opacity="0.8"/>
    <path d="M -14 -4 L -9 0 L -14 4 M -3 -4 L -7 0 L -3 4" fill="none" stroke="#e6dfc6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- head -->
    <ellipse cx="6" cy="0" rx="7.5" ry="6.5" fill="#4a4f66" stroke="#1a1d24" stroke-width="2.6"/>
    <path d="M 11 -3 L 16 -2 M 11 3 L 16 2" fill="none" stroke="#1a1d24" stroke-width="3.6" stroke-linecap="round"/>
    <path d="M 11 -3 L 16 -2 M 11 3 L 16 2" fill="none" stroke="#e6dfc6" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="9.5" cy="-3" r="2" fill="#ff3b30"/>
    <circle cx="9.5" cy="3" r="2" fill="#ff3b30"/>
    <circle cx="5.5" cy="-4.2" r="1.3" fill="#ff7a6a"/>
    <circle cx="5.5" cy="4.2" r="1.3" fill="#ff7a6a"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44">
  <!-- Spiderling: a small black spider seen from above, eight bent legs, a round abdomen behind and a head with red eyes forward (+X). -->
  <g transform="translate(22 22)">
    <ellipse cx="-1" cy="2" rx="19" ry="17" fill="#000000" opacity="0.25"/>
    <!-- legs -->
    <path d="M 4 -4 L 12 -14 L 17 -17 M 2 -5 L 4 -17 L 2 -21 M -2 -5 L -10 -16 L -14 -18 M -5 -3 L -16 -9 L -20 -8 M 4 4 L 12 14 L 17 17 M 2 5 L 4 17 L 2 21 M -2 5 L -10 16 L -14 18 M -5 3 L -16 9 L -20 8" fill="none" stroke="#1a1d24" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 4 -4 L 12 -14 L 17 -17 M 2 -5 L 4 -17 L 2 -21 M -2 -5 L -10 -16 L -14 -18 M -5 -3 L -16 -9 L -20 -8 M 4 4 L 12 14 L 17 17 M 2 5 L 4 17 L 2 21 M -2 5 L -10 16 L -14 18 M -5 3 L -16 9 L -20 8" fill="none" stroke="#3a3d48" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- abdomen -->
    <ellipse cx="-7" cy="0" rx="10" ry="8.5" fill="#23252d" stroke="#1a1d24" stroke-width="2.5"/>
    <path d="M -12 0 L -5 0" stroke="#4a4e5c" stroke-width="1.5" stroke-linecap="round"/>
    <!-- head -->
    <ellipse cx="6" cy="0" rx="7" ry="6" fill="#2b2e38" stroke="#1a1d24" stroke-width="2.5"/>
    <circle cx="10" cy="-2.6" r="1.8" fill="#ff3b30"/>
    <circle cx="10" cy="2.6" r="1.8" fill="#ff3b30"/>
    <circle cx="7" cy="-3.6" r="1" fill="#ff3b30"/>
    <circle cx="7" cy="3.6" r="1" fill="#ff3b30"/>
  </g>
</svg>

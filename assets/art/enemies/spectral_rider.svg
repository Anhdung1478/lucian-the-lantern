<svg xmlns="http://www.w3.org/2000/svg" width="92" height="92" viewBox="0 0 92 92">
  <!-- Spectral Rider: a ghost knight on a spectral horse seen from above, the pale horse stretched along +X with a flowing mane and tail of mist, the armoured rider crouched low with a lance levelled forward. -->
  <g transform="translate(46 46)">
    <ellipse cx="-2" cy="3" rx="40" ry="22" fill="#000000" opacity="0.25"/>
    <!-- tail of mist -->
    <path d="M -26 -4 Q -42 -10 -44 -2 Q -38 0 -44 4 Q -42 10 -26 4 Z" fill="#9fc4e8" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round" opacity="0.9"/>
    <!-- horse body -->
    <ellipse cx="-6" cy="0" rx="28" ry="15" fill="#b9d3ee" stroke="#1a1d24" stroke-width="3.5"/>
    <!-- legs flung out -->
    <path d="M 8 -12 L 18 -20 M 8 12 L 18 20 M -20 -12 L -28 -20 M -20 12 L -28 20" fill="none" stroke="#1a1d24" stroke-width="5" stroke-linecap="round"/>
    <path d="M 8 -12 L 18 -20 M 8 12 L 18 20 M -20 -12 L -28 -20 M -20 12 L -28 20" fill="none" stroke="#b9d3ee" stroke-width="2.4" stroke-linecap="round"/>
    <!-- neck and head -->
    <path d="M 14 -6 L 30 -5 L 38 -2 L 38 3 L 30 6 L 14 7 Z" fill="#cfe2f4" stroke="#1a1d24" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 12 -7 Q 20 -12 28 -8 M 12 7 Q 20 12 28 8" fill="none" stroke="#6fa3d6" stroke-width="2" stroke-linecap="round"/>
    <circle cx="33" cy="-2.5" r="1.5" fill="#6dd6ff"/>
    <circle cx="33" cy="2.5" r="1.5" fill="#6dd6ff"/>
    <!-- lance -->
    <path d="M 4 0 L 44 0" fill="none" stroke="#1a1d24" stroke-width="4" stroke-linecap="round"/>
    <path d="M 4 0 L 44 0" fill="none" stroke="#d8e4ee" stroke-width="1.6" stroke-linecap="round"/>
    <!-- rider: armoured shoulders and a helm -->
    <ellipse cx="-8" cy="0" rx="9" ry="13" fill="#4f6a8a" stroke="#1a1d24" stroke-width="3"/>
    <circle cx="-4" cy="0" r="7" fill="#64809f" stroke="#1a1d24" stroke-width="3"/>
    <path d="M -1 -3 L 2 0 L -1 3" fill="none" stroke="#6dd6ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="92" height="92" viewBox="0 0 92 92">
  <!-- Spectral Rider: a ghost knight on a pale spectral horse seen from above, the horse stretched along +X with a streaming mane and a tail of mist, the armoured rider crouched low with a long glowing lance levelled forward. -->
  <g transform="translate(46 46)">
    <!-- tail of mist -->
    <path d="M -24 -4 Q -36 -12 -44 -8 L -38 -4 L -45 0 L -38 4 L -44 8 Q -36 12 -24 4 Z" fill="#a8cdee" stroke="#1a1d24" stroke-width="2.6" stroke-linejoin="round" opacity="0.92"/>
    <path d="M -28 0 L -40 0" fill="none" stroke="#e8f6ff" stroke-width="2.4" stroke-linecap="round"/>
    <!-- legs flung out -->
    <path d="M 8 -11 L 17 -19 L 24 -18 M 8 11 L 17 19 L 24 18 M -20 -11 L -27 -19 L -33 -18 M -20 11 L -27 19 L -33 18" fill="none" stroke="#1a1d24" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 8 -11 L 17 -19 L 24 -18 M 8 11 L 17 19 L 24 18 M -20 -11 L -27 -19 L -33 -18 M -20 11 L -27 19 L -33 18" fill="none" stroke="#c4dcf0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- horse body -->
    <ellipse cx="-6" cy="0" rx="28" ry="15" fill="#b4d0ec" stroke="#1a1d24" stroke-width="3.5"/>
    <ellipse cx="-8" cy="-7" rx="18" ry="4" fill="#eaf5ff" opacity="0.8"/>
    <!-- neck, head and mane -->
    <path d="M 14 -7 L 30 -6 L 40 -2 L 40 3 L 30 7 L 14 8 Z" fill="#d4e6f6" stroke="#1a1d24" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 12 -8 L 18 -13 L 21 -8 L 26 -12 L 29 -7 M 12 8 L 18 13 L 21 8 L 26 12 L 29 7" fill="none" stroke="#6fa3d6" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="34" cy="-3" r="2" fill="#6dd6ff"/>
    <circle cx="34" cy="3" r="2" fill="#6dd6ff"/>
    <!-- lance with glowing head -->
    <path d="M 2 0 L 44 0" fill="none" stroke="#1a1d24" stroke-width="5" stroke-linecap="round"/>
    <path d="M 2 0 L 44 0" fill="none" stroke="#e8f2fa" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 38 -4 L 45 0 L 38 4 Z" fill="#8ffcff" stroke="#1a1d24" stroke-width="2" stroke-linejoin="round"/>
    <!-- rider -->
    <ellipse cx="-9" cy="0" rx="9" ry="14" fill="#4a6688" stroke="#1a1d24" stroke-width="3"/>
    <path d="M -10 -11 Q -4 -13 2 -9" fill="none" stroke="#a6c4e6" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M -3 -9 L 4 -8 M -3 9 L 4 8" fill="none" stroke="#1a1d24" stroke-width="5" stroke-linecap="round"/>
    <path d="M -3 -9 L 4 -8 M -3 9 L 4 8" fill="none" stroke="#6f8cb0" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="-4" cy="0" r="7.5" fill="#6683a6" stroke="#1a1d24" stroke-width="3"/>
    <path d="M -4 -6 Q 0 0 -4 6" fill="none" stroke="#b6d0ee" stroke-width="2" stroke-linecap="round"/>
    <path d="M -1 -3.5 L 3 0 L -1 3.5" fill="none" stroke="#8ffcff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>

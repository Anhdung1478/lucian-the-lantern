    <circle cx="0" cy="-30" r="14" fill="#d8c9a3" stroke="#1a1d24" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M -7 -34 l 5 5 M -2 -34 l -5 5 M 2 -34 l 5 5 M 7 -34 l -5 5" stroke="#1a1d24" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M -6 -23 Q 0 -20 6 -23" fill="none" stroke="#1a1d24" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 3"/>
    <path d="M -9 -38 Q -3 -43 4 -41" fill="none" stroke="#f0e6c8" stroke-width="2.5" stroke-linecap="round"/>

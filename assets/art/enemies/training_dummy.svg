<svg xmlns="http://www.w3.org/2000/svg" width="112" height="112" viewBox="0 0 112 112">
  <!-- Training Dummy: high-angle top-down 3/4 view of a weathered wooden cross-post dummy with straw-stuffed burlap torso, wrapped red-and-white bullseye target, and top-gathered burlap sack head. -->
  <defs>
    <linearGradient id="td-wood-base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b623c"/>
      <stop offset="0.55" stop-color="#5e4026"/>
      <stop offset="1" stop-color="#3c2716"/>
    </linearGradient>
    <linearGradient id="td-beam-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a87b4d"/>
      <stop offset="0.55" stop-color="#7c5532"/>
      <stop offset="1" stop-color="#4e341d"/>
    </linearGradient>
    <linearGradient id="td-iron" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c8596"/>
      <stop offset="0.5" stop-color="#464d5c"/>
      <stop offset="1" stop-color="#272b36"/>
    </linearGradient>
    <radialGradient id="td-burlap-body" cx="0.35" cy="0.3" r="0.72">
      <stop offset="0" stop-color="#e2c68c"/>
      <stop offset="0.52" stop-color="#bc975a"/>
      <stop offset="1" stop-color="#785a32"/>
    </radialGradient>
    <radialGradient id="td-burlap-head" cx="0.34" cy="0.28" r="0.72">
      <stop offset="0" stop-color="#eee0ba"/>
      <stop offset="0.55" stop-color="#ccb078"/>
      <stop offset="1" stop-color="#876b40"/>
    </radialGradient>
    <linearGradient id="td-straw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7de8c"/>
      <stop offset="0.6" stop-color="#cfa64c"/>
      <stop offset="1" stop-color="#8f6b28"/>
    </linearGradient>
    <linearGradient id="td-rope" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9a566"/>
      <stop offset="0.55" stop-color="#8c6a38"/>
      <stop offset="1" stop-color="#563e1e"/>
    </linearGradient>
    <radialGradient id="td-target-white" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#faf6eb"/>
      <stop offset="0.7" stop-color="#e3dac2"/>
      <stop offset="1" stop-color="#bcae8e"/>
    </radialGradient>
    <radialGradient id="td-target-red" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#e2433a"/>
      <stop offset="0.65" stop-color="#b52422"/>
      <stop offset="1" stop-color="#781517"/>
    </radialGradient>
  </defs>

  <g transform="translate(56 56)">
    <!-- Circular iron-banded wooden post-ring base visible beneath in high-angle 3/4 -->
    <ellipse cx="0" cy="24" rx="26" ry="18" fill="url(#td-iron)" stroke="#14171f" stroke-width="2.2" stroke-linejoin="round"/>
    <ellipse cx="0" cy="22" rx="22" ry="14.5" fill="url(#td-wood-base)" stroke="#14171f" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M -18 22 L 18 22 M -11 10 L -11 34 M 11 10 L 11 34" stroke="#3a2414" stroke-width="1.4" stroke-linecap="round" opacity="0.75"/>
    <!-- Base iron bracket rivets -->
    <circle cx="-18" cy="29" r="1.6" fill="#9ea7b8"/>
    <circle cx="0" cy="35" r="1.6" fill="#7c8596"/>
    <circle cx="18" cy="29" r="1.6" fill="#7c8596"/>

    <!-- Center vertical wooden post visible slightly behind neck & below waist -->
    <rect x="-6.5" y="18" width="13" height="11" rx="2" fill="url(#td-wood-base)" stroke="#14171f" stroke-width="1.8"/>

    <!-- Straw tufts bursting out both ends of the wooden crossbeam -->
    <g stroke="#14171f" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
      <!-- Left straw tuft -->
      <path d="M -39 -10 L -51 -17 L -44 -7 L -53 -6 L -44 -1 L -51 6 L -38 2 Z" fill="url(#td-straw)"/>
      <!-- Right straw tuft -->
      <path d="M 39 -10 L 51 -17 L 44 -7 L 53 -6 L 44 -1 L 51 6 L 38 2 Z" fill="url(#td-straw)"/>
    </g>
    <path d="M -41 -8 L -48 -13 M -42 -4 L -50 -4 M -41 -1 L -48 3 M 41 -8 L 48 -13 M 42 -4 L 50 -4 M 41 -1 L 48 3" stroke="#78561e" stroke-width="1.1" stroke-linecap="round"/>

    <!-- Weathered wooden crossbeam arms seen from high top-down angle -->
    <rect x="-43" y="-12" width="86" height="14" rx="3.5" fill="url(#td-beam-top)" stroke="#14171f" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- Top lit timber bevel & grain -->
    <path d="M -40 -9 L 40 -9" stroke="#caa06b" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
    <path d="M -38 -4 L -24 -4 M 25 -5 L 38 -5 M -36 -1 L -26 -1 M 24 -1 L 37 -1" stroke="#472d18" stroke-width="1.3" stroke-linecap="round" opacity="0.8"/>

    <!-- Hemp rope wrappings tying straw sleeves onto the crossbeam -->
    <g fill="url(#td-rope)" stroke="#14171f" stroke-width="1.6" stroke-linejoin="round">
      <rect x="-38" y="-13.5" width="4.5" height="17" rx="2"/>
      <rect x="-34" y="-13" width="4" height="16" rx="1.8"/>
      <rect x="33.5" y="-13.5" width="4.5" height="17" rx="2"/>
      <rect x="30" y="-13" width="4" height="16" rx="1.8"/>
    </g>

    <!-- Bottom straw wisps peeking below burlap torso -->
    <path d="M -18 22 L -22 29 L -13 24 L -14 31 L -6 25 L -2 32 L 3 25 L 10 31 L 12 24 L 21 28 L 17 21 Z" fill="url(#td-straw)" stroke="#14171f" stroke-width="1.6" stroke-linejoin="round"/>

    <!-- Thick bound burlap-sack torso (high top-down 3/4 barrel silhouette) -->
    <path d="M -23 -15 C -29 -5, -30 10, -23 20 C -13 27, 13 27, 23 20 C 30 10, 29 -5, 23 -15 C 12 -22, -12 -22, -23 -15 Z" fill="url(#td-burlap-body)" stroke="#14171f" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- Subtle burlap weave & side crease shadows -->
    <path d="M -21 -6 Q -24 5 -19 15 M 21 -6 Q 24 5 19 15" fill="none" stroke="#684c27" stroke-width="1.6" stroke-linecap="round" opacity="0.75"/>
    <path d="M -17 -13 Q -6 -17 7 -15" fill="none" stroke="#f0d9a8" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
    <!-- Stitched burlap patch on left shoulder -->
    <path d="M -23 -2 L -16 -5 L -15 4 L -22 6 Z" fill="#b38d52" stroke="#5e4322" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M -22 -1 L -17 -4 M -21 3 L -16 1" stroke="#473117" stroke-width="1" stroke-linecap="round"/>

    <!-- Cinched braided rope waist belt with side knot -->
    <path d="M -25 14 Q 0 24 25 14" fill="none" stroke="#14171f" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M -25 14 Q 0 24 25 14" fill="none" stroke="url(#td-rope)" stroke-width="3.6" stroke-linecap="round"/>
    <path d="M -18 17 L -14 19 M -8 19.5 L -3 20.5 M 4 20.5 L 9 19.5 M 15 18.5 L 19 16.5" stroke="#4a3318" stroke-width="1.3" stroke-linecap="round"/>
    <!-- Side rope knot & dangling ends -->
    <path d="M 19 17 L 25 24 M 21 16 L 28 21" stroke="#14171f" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M 19 17 L 25 24 M 21 16 L 28 21" stroke="#b59052" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="19.5" cy="16.5" r="3.4" fill="url(#td-rope)" stroke="#14171f" stroke-width="1.5"/>

    <!-- Crisp painted red-and-white archery bullseye target wrapped across top/front torso face -->
    <g transform="translate(0 5)">
      <ellipse cx="0" cy="0" rx="17.5" ry="15" fill="url(#td-target-white)" stroke="#14171f" stroke-width="2" stroke-linejoin="round"/>
      <ellipse cx="0" cy="0" rx="13.2" ry="11.2" fill="url(#td-target-red)"/>
      <ellipse cx="0" cy="0" rx="8.6" ry="7.3" fill="url(#td-target-white)"/>
      <ellipse cx="0" cy="0" rx="4.2" ry="3.6" fill="url(#td-target-red)"/>
      <!-- Subtle painted highlight and combat scuff mark -->
      <path d="M -10 -7 Q -3 -11 5 -9" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.45"/>
      <path d="M 6 3 L 11 5 M -8 5 L -5 8" stroke="#5a3e22" stroke-width="1.1" stroke-linecap="round" opacity="0.5"/>
    </g>

    <!-- Rope collar tying the burlap sack head to the post -->
    <ellipse cx="0" cy="-14" rx="13.5" ry="9" fill="url(#td-rope)" stroke="#14171f" stroke-width="1.8"/>

    <!-- Round straw-stuffed burlap sack head seen from high top-down angle -->
    <ellipse cx="0" cy="-21" rx="16.5" ry="15" fill="url(#td-burlap-head)" stroke="#14171f" stroke-width="2.2"/>
    <!-- Curved radial burlap gather folds converging to the top-knot crown -->
    <path d="M -11 -28 Q -5 -24 -2 -23 M 11 -28 Q 5 -24 2 -23 M -13 -16 Q -6 -19 -2 -21 M 13 -16 Q 6 -19 2 -21 M 0 -9 L 0 -18" fill="none" stroke="#7d6138" stroke-width="1.4" stroke-linecap="round" opacity="0.8"/>
    <!-- Top-left directional rim highlight on sack head -->
    <path d="M -11 -29 Q -4 -34 6 -31" fill="none" stroke="#fff4d6" stroke-width="2" stroke-linecap="round" opacity="0.65"/>
    <!-- Subtle stitched sack seam along front brow (top-down view, no goofy XX eyes) -->
    <path d="M -8 -10 Q 0 -7 8 -10" fill="none" stroke="#5a4122" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2.5 2.5"/>
    <!-- Gathered sack top-knot & tiny tuft of straw crowning the top -->
    <path d="M -3 -24 L -7 -32 L -1 -27 L 2 -33 L 4 -26 L 8 -30 L 3 -23 Z" fill="url(#td-straw)" stroke="#14171f" stroke-width="1.5" stroke-linejoin="round"/>
    <ellipse cx="0" cy="-23.5" rx="4.6" ry="3.2" fill="url(#td-rope)" stroke="#14171f" stroke-width="1.6"/>
    <circle cx="-1" cy="-24" r="1.2" fill="#e8cd8e" opacity="0.7"/>
  </g>
</svg>

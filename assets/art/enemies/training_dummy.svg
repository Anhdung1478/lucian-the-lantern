<svg xmlns="http://www.w3.org/2000/svg" width="112" height="112" viewBox="0 0 112 112">
  <!-- Practice dummy: a straw target on a wooden cross-beam with a burlap sack head, seen from above at a slight angle. -->
  <g transform="translate(56 60)">
    <!-- wooden cross-beam arms -->
    <rect x="-50" y="-14" width="100" height="12" rx="3" fill="#7a5230" stroke="#1a1d24" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M -44 -9 L 44 -9" stroke="#9a6e44" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M -50 -13 L -58 -18 M -50 -8 L -59 -8 M -50 -3 L -58 2 M 50 -13 L 58 -18 M 50 -8 L 59 -8 M 50 -3 L 58 2" stroke="#1a1d24" stroke-width="5" stroke-linecap="round"/>
    <path d="M -50 -13 L -58 -18 M -50 -8 L -59 -8 M -50 -3 L -58 2 M 50 -13 L 58 -18 M 50 -8 L 59 -8 M 50 -3 L 58 2" stroke="#e0c47a" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M -36 -15 L -36 -1 M 36 -15 L 36 -1" stroke="#5e4a2a" stroke-width="4" stroke-linecap="round"/>
    <!-- straw body -->
    <ellipse cx="0" cy="4" rx="27" ry="29" fill="#c9a45c" stroke="#1a1d24" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M -19 -14 L -13 -6 M 17 -16 L 12 -8 M -21 14 L -14 20 M 20 12 L 13 20 M -4 26 L 0 31 M 6 -22 L 3 -16" stroke="#8a6a2c" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="-8" cy="-6" r="9" fill="#ffffff" opacity="0.18"/>
    <!-- rope belt -->
    <path d="M -26 13 Q 0 21 26 13" fill="none" stroke="#1a1d24" stroke-width="6" stroke-linecap="round"/>
    <path d="M -26 13 Q 0 21 26 13" fill="none" stroke="#7a6038" stroke-width="3" stroke-linecap="round"/>
    <!-- target on the chest -->
    <circle cx="0" cy="2" r="15" fill="#f2efe6" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="0" cy="2" r="11" fill="#c8312b"/>
    <circle cx="0" cy="2" r="6.5" fill="#f2efe6"/>
    <circle cx="0" cy="2" r="2.8" fill="#c8312b"/>

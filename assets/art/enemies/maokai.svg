      <circle cx="-31.1" cy="0.1" r="8.8"/>
      <circle cx="-24.5" cy="22.5" r="7.7"/>
      <circle cx="-10.8" cy="-31.2" r="6.6"/>
      <circle cx="-8.8" cy="27.8" r="6.6"/>
      <circle cx="-11.5" cy="-13.5" r="7.7"/>
      <circle cx="-12.5" cy="9.5" r="7.7"/>
      <circle cx="-43.0" cy="-8.0" r="6.1"/>
      <circle cx="-42.4" cy="13.4" r="5.0"/>
      <circle cx="0.8" cy="-21.8" r="5.5"/>
      <circle cx="0.8" cy="18.2" r="5.5"/>

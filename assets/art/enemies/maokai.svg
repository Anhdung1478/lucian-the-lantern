    <path d="M -36 -24 Q -30 -30 -22 -28 M -40 -2 Q -34 -8 -26 -6 M -32 22 Q -26 16 -18 18 M -20 -14 Q -14 -20 -6 -18 M -20 8 Q -14 2 -6 4 M -50 -10 Q -46 -14 -40 -12" fill="none" stroke="#7fb466" stroke-width="2" stroke-linecap="round"/>
    <path d="M -24 -4 Q -32 -14 -40 -12 M -24 4 Q -30 14 -38 18" fill="none" stroke="#1f3f1f" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="-26" cy="-14" r="2.4" fill="#d8ff8a"/>
    <circle cx="-38" cy="8" r="2.2" fill="#d8ff8a"/>
    <circle cx="-14" cy="24" r="2.2" fill="#d8ff8a"/>
    <!-- head: a stump of bark, its top split by grooves, a hollow face glowing green -->
    <path d="M 2 -16 Q 14 -21 28 -16 Q 39 -10 39 0 Q 39 10 28 16 Q 14 21 2 16 Q -3 8 -3 0 Q -3 -8 2 -16 Z" fill="url(#bark)" stroke="#1a1d24" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M 2 -9 Q 12 -6 18 -10 M 0 0 Q 10 2 18 0 M 2 9 Q 12 6 18 10" fill="none" stroke="#3c2815" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 6 -15 Q 18 -18 28 -13" fill="none" stroke="#b08a58" stroke-width="2" stroke-linecap="round"/>
    <circle cx="31" cy="0" r="12" fill="url(#glow)" opacity="0.75"/>
    <path d="M 21 -12 L 34 -6 M 21 12 L 34 6" stroke="#1a1d24" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 23 -9 L 33 -5 L 25 -2 Z M 23 9 L 33 5 L 25 2 Z" fill="#0a0d07" stroke="#1a1d24" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="28" cy="-5" r="2.3" fill="#e8ffa0"/>
    <circle cx="28" cy="5" r="2.3" fill="#e8ffa0"/>
    <path d="M 33 -4 L 39 -2 L 36 0 L 39 2 L 33 4 Z" fill="#0a0d07" stroke="#1a1d24" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M 34 -1.5 L 36.5 0 L 34 1.5" fill="none" stroke="#c8ff6a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

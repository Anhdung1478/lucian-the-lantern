<svg xmlns="http://www.w3.org/2000/svg" width="116" height="116" viewBox="0 0 116 116">
  <!-- Maokai, seen from above, facing +X: a huge walking tree. A crown of dark leaves covers his back and shoulders,
       twisted dead branches jut out of it, two thick branch arms reach forward with twig claws, and in front his head
       is a stump of bark with a hollow face: dark sockets and a gaping mouth, a sickly green light glowing inside. -->
  <defs>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#f2ffb0"/>
      <stop offset="0.45" stop-color="#b9f26a" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#6fbf4a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#86603a"/>
      <stop offset="0.5" stop-color="#5e4128"/>
      <stop offset="1" stop-color="#86603a"/>
    </linearGradient>
  </defs>
  <g transform="translate(58 58)">
    <!-- twisted dead branches jutting out of the crown -->
    <path d="M -30 -12 L -48 -26 L -56 -24 M -48 -26 L -50 -34 M -22 18 L -38 38 L -46 38 M -38 10 L -54 18 M -16 -28 L -22 -46 L -18 -52" fill="none" stroke="#1a1d24" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M -30 -12 L -48 -26 L -56 -24 M -48 -26 L -50 -34 M -22 18 L -38 38 L -46 38 M -38 10 L -54 18 M -16 -28 L -22 -46 L -18 -52" fill="none" stroke="#6a4a2c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- branch arms reaching forward, knotted, twig claws -->
    <g stroke="#1a1d24" stroke-linejoin="round" stroke-linecap="round">
      <path d="M -4 -20 Q 8 -40 28 -40 Q 37 -40 38 -32 Q 28 -31 20 -24 Q 10 -14 0 -12 Z" fill="url(#bark)" stroke-width="3"/>
      <path d="M -4 20 Q 8 40 28 40 Q 37 40 38 32 Q 28 31 20 24 Q 10 14 0 12 Z" fill="url(#bark)" stroke-width="3"/>
      <path d="M 34 -38 L 43 -45 M 37 -35 L 49 -37 M 37 -32 L 47 -27 M 34 38 L 43 45 M 37 35 L 49 37 M 37 32 L 47 27" fill="none" stroke-width="5"/>
    </g>
    <path d="M 34 -38 L 43 -45 M 37 -35 L 49 -37 M 37 -32 L 47 -27 M 34 38 L 43 45 M 37 35 L 49 37 M 37 32 L 47 27" fill="none" stroke="#86603a" stroke-width="2" stroke-linecap="round"/>
    <path d="M 6 -31 Q 16 -38 28 -37 M 6 31 Q 16 38 28 37" fill="none" stroke="#a88050" stroke-width="2" stroke-linecap="round"/>
    <circle cx="16" cy="-30" r="3" fill="#4a3320" stroke="#1a1d24" stroke-width="1.5"/>
    <circle cx="16" cy="30" r="3" fill="#4a3320" stroke="#1a1d24" stroke-width="1.5"/>
    <!-- the crown of leaves -->
    <g fill="#1a1d24">
      <circle cx="-30" cy="-20" r="15"/>
      <circle cx="-34" cy="3" r="16"/>
      <circle cx="-27" cy="25" r="14"/>
      <circle cx="-13" cy="-29" r="12"/>
      <circle cx="-11" cy="30" r="12"/>
      <circle cx="-14" cy="-11" r="14"/>
      <circle cx="-15" cy="12" r="14"/>
      <circle cx="-45" cy="-6" r="11"/>
      <circle cx="-44" cy="15" r="9"/>
      <circle cx="-1" cy="-20" r="10"/>
      <circle cx="-1" cy="20" r="10"/>
    </g>
    <g fill="#2b5029">
      <circle cx="-30" cy="-20" r="13.2"/>
      <circle cx="-34" cy="3" r="14.2"/>
      <circle cx="-27" cy="25" r="12.2"/>
      <circle cx="-13" cy="-29" r="10.2"/>
      <circle cx="-11" cy="30" r="10.2"/>
      <circle cx="-14" cy="-11" r="12.2"/>
      <circle cx="-15" cy="12" r="12.2"/>
      <circle cx="-45" cy="-6" r="9.2"/>
      <circle cx="-44" cy="15" r="7.2"/>
      <circle cx="-1" cy="-20" r="8.2"/>
      <circle cx="-1" cy="20" r="8.2"/>
    </g>
    <g fill="#3a6a35">

<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!-- Shadow Siege Minion: Darkness-corrupted Armored Siege Cannon from above facing +X, obsidian-iron carriage wheels, dark-violet & obsidian riveted hull, shadow crew gunner behind, forged obsidian cannon barrel with blazing void-violet charge core at breech and muzzle. -->
  <defs>
    <linearGradient id="ssg-wheel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#665c8a"/>
      <stop offset="0.35" stop-color="#312948"/>
      <stop offset="1" stop-color="#151122"/>
    </linearGradient>
    <linearGradient id="ssg-hull" x1="0.15" y1="0.05" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#5d428f"/>
      <stop offset="0.52" stop-color="#301f52"/>
      <stop offset="1" stop-color="#150d26"/>
    </linearGradient>
    <linearGradient id="ssg-amethyst" x1="0.15" y1="0.05" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#e4c2ff"/>
      <stop offset="0.5" stop-color="#9e5cf0"/>
      <stop offset="1" stop-color="#4c2085"/>
    </linearGradient>
    <linearGradient id="ssg-iron" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b84b0"/>
      <stop offset="0.32" stop-color="#4d456b"/>
      <stop offset="0.75" stop-color="#26203b"/>
      <stop offset="1" stop-color="#120f1f"/>
    </linearGradient>
    <radialGradient id="ssg-void" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fcf2ff"/>
      <stop offset="0.42" stop-color="#cf8aff"/>
      <stop offset="0.8" stop-color="#8032eb" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#4c12a8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g transform="translate(48 48)">
    <!-- Heavy dark iron axles -->
    <rect x="-20" y="-34" width="6" height="68" rx="1.5" fill="#1e1930" stroke="#14171f" stroke-width="1.6"/>
    <rect x="9" y="-34" width="6" height="68" rx="1.5" fill="#1e1930" stroke="#14171f" stroke-width="1.6"/>

    <!-- Heavy obsidian-iron carriage wheels -->
    <g stroke="#14171f" stroke-width="2" stroke-linejoin="round">
      <rect x="-29" y="-40" width="23" height="11" rx="3" fill="url(#ssg-wheel)"/>
      <rect x="1" y="-40" width="23" height="11" rx="3" fill="url(#ssg-wheel)"/>
      <rect x="-29" y="29" width="23" height="11" rx="3" fill="url(#ssg-wheel)"/>
      <rect x="1" y="29" width="23" height="11" rx="3" fill="url(#ssg-wheel)"/>
    </g>
    <path d="M -25 -34.5 L -10 -34.5 M 5 -34.5 L 20 -34.5 M -25 34.5 L -10 34.5 M 5 34.5 L 20 34.5" stroke="#9d94c4" stroke-width="1.8" stroke-linecap="round"/>
    <g fill="url(#ssg-amethyst)" stroke="#14171f" stroke-width="1">
      <circle cx="-17.5" cy="-34.5" r="2.2"/>
      <circle cx="12.5" cy="-34.5" r="2.2"/>
      <circle cx="-17.5" cy="34.5" r="2.2"/>
      <circle cx="12.5" cy="34.5" r="2.2"/>
    </g>

    <!-- Front jagged obsidian ram-plate bumper -->
    <path d="M 18 -23 L 28 -17 L 28 17 L 18 23 Z" fill="url(#ssg-iron)" stroke="#14171f" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 27 -14 L 34 -11.5 L 27 -8 Z M 27 14 L 34 11.5 L 27 8 Z" fill="url(#ssg-amethyst)" stroke="#14171f" stroke-width="1.4" stroke-linejoin="round"/>

    <!-- Reinforced dark-violet & obsidian armored hull -->
    <path d="M -34 -20 L -26 -28 L 19 -28 L 25 -20 L 25 20 L 19 28 L -26 28 L -34 20 Z" fill="url(#ssg-hull)" stroke="#14171f" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M -29 -17 L -23 -23 L 16 -23 L 20 -17 L 20 17 L 16 23 L -23 23 L -29 17 Z" fill="none" stroke="url(#ssg-amethyst)" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M -26 -10 L 17 -10 M -26 10 L 17 10" stroke="#180e2b" stroke-width="1.6" stroke-linecap="round"/>
    <!-- Glowing amethyst hull rivets -->
    <g fill="#e6c4ff" stroke="#14171f" stroke-width="0.9">
      <circle cx="-24" cy="-22" r="1.8"/>
      <circle cx="15" cy="-22" r="1.8"/>
      <circle cx="-24" cy="22" r="1.8"/>
      <circle cx="15" cy="22" r="1.8"/>
      <circle cx="-5" cy="-23" r="1.6"/>
      <circle cx="-5" cy="23" r="1.6"/>
    </g>

    <!-- Shadow-hooded crew gunner braced behind breech (-X) -->
    <g>
      <ellipse cx="-26" cy="0" rx="6.5" ry="12" fill="url(#ssg-hull)" stroke="#14171f" stroke-width="1.8"/>
      <circle cx="-23" cy="0" r="8.5" fill="url(#ssg-hull)" stroke="#14171f" stroke-width="2"/>
      <path d="M -30 0 L -15 0" stroke="#14171f" stroke-width="5.2" stroke-linecap="round"/>
      <path d="M -30 0 L -15 0" stroke="url(#ssg-amethyst)" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M -27 -5 Q -23 -8 -18 -5" fill="none" stroke="#c8a8f5" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>
    </g>

    <!-- Obsidian swivel mount beneath cannon -->
    <circle cx="1" cy="0" r="14.5" fill="url(#ssg-iron)" stroke="#14171f" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="1" cy="0" r="10.5" fill="none" stroke="url(#ssg-amethyst)" stroke-width="2"/>

    <!-- THICK FORGED OBSIDIAN-IRON CANNON BARREL (+X) -->
    <path d="M -13 -11 L 34 -9 L 37 -13 L 45 -13 L 45 13 L 37 13 L 34 9 L -13 11 Z" fill="url(#ssg-iron)" stroke="#14171f" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M -9 -6.5 L 33 -5.5" stroke="#c0b8e6" stroke-width="2.4" stroke-linecap="round" opacity="0.7"/>
    <path d="M -9 6.5 L 33 5.5" stroke="#0d0a17" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
    <!-- Amethyst-etched reinforcing barrel bands -->
    <rect x="6" y="-11" width="5.5" height="22" rx="1.5" fill="url(#ssg-amethyst)" stroke="#14171f" stroke-width="1.7"/>
    <rect x="23" y="-10.5" width="5" height="21" rx="1.5" fill="url(#ssg-amethyst)" stroke="#14171f" stroke-width="1.7"/>
    <rect x="37" y="-13" width="4" height="26" rx="1.2" fill="url(#ssg-amethyst)" stroke="#14171f" stroke-width="1.5"/>
    <!-- Subtle void rune streak along barrel -->
    <path d="M 14 0 L 21 0" stroke="#e8ccff" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Glowing void-violet muzzle core (+X tip) -->
    <ellipse cx="44" cy="0" rx="2.6" ry="8.5" fill="#0d071a" stroke="#14171f" stroke-width="1.2"/>
    <circle cx="43.5" cy="0" r="6.5" fill="url(#ssg-void)" opacity="0.9"/>
    <ellipse cx="44.2" cy="0" rx="1.6" ry="4.8" fill="#ebd2ff"/>

    <!-- Blazing void-violet charge core in breech chamber -->
    <circle cx="-7" cy="0" r="8.5" fill="url(#ssg-iron)" stroke="#14171f" stroke-width="2"/>
    <circle cx="-7" cy="0" r="7.5" fill="url(#ssg-void)"/>
    <circle cx="-7" cy="0" r="4.2" fill="#efd4ff" stroke="#6d29c7" stroke-width="1.3"/>
    <circle cx="-7.8" cy="-0.8" r="1.6" fill="#ffffff"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!-- Shadow Siege Minion: the siege minion in black-purple with violet glows, same shape and facing (+X). -->
  <g transform="translate(48 48)">
    <circle cx="0" cy="0" r="40" fill="none" stroke="#8a4fe0" stroke-width="3" opacity="0.45"/>
    <ellipse cx="0" cy="4" rx="38" ry="34" fill="#000000" opacity="0.25"/>
    <!-- wheels -->
    <rect x="-22" y="-37" width="30" height="11" rx="5" fill="#1e1530" stroke="#1a1d24" stroke-width="3"/>
    <rect x="-22" y="26" width="30" height="11" rx="5" fill="#1e1530" stroke="#1a1d24" stroke-width="3"/>
    <path d="M -14 -37 v 11 M -4 -37 v 11 M -14 26 v 11 M -4 26 v 11" stroke="#1a1d24" stroke-width="2"/>
    <!-- cart bed -->
    <rect x="-34" y="-24" width="52" height="48" rx="8" fill="#2a1a3d" stroke="#1a1d24" stroke-width="3"/>
    <path d="M -34 -10 H 18 M -34 10 H 18" stroke="#140c20" stroke-width="3"/>
    <!-- barrel -->
    <rect x="2" y="-10" width="44" height="20" rx="5" fill="#3a3050" stroke="#1a1d24" stroke-width="3"/>
    <rect x="32" y="-12" width="9" height="24" rx="3" fill="#5a4a80" stroke="#1a1d24" stroke-width="3"/>
    <rect x="43" y="-8" width="5" height="16" rx="2" fill="#0a0710" stroke="#1a1d24" stroke-width="2"/>
    <!-- breech and fuse -->
    <circle cx="4" cy="0" r="10" fill="#5a4a80" stroke="#1a1d24" stroke-width="3"/>
    <circle cx="4" cy="0" r="3.5" fill="#c47cff"/>
    <!-- red crest -->
    <path d="M -34 0 L -26 -14 L -18 0 L -26 14 Z" fill="#9a5cf0" stroke="#1a1d24" stroke-width="3" stroke-linejoin="round"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="0 0 72 72">
  <!-- Melee Minion: red-team minion seen from above, round crimson helmet, short blade forward (+X). -->
  <g transform="translate(36 36)">
    <ellipse cx="0" cy="3" rx="26" ry="24" fill="#000000" opacity="0.25"/>
    <!-- back arm -->
    <ellipse cx="6" cy="-19" rx="8" ry="6" fill="#8a2a2a" stroke="#1a1d24" stroke-width="3"/>
    <!-- shoulders and body -->
    <ellipse cx="-2" cy="0" rx="14" ry="23" fill="#a83232" stroke="#1a1d24" stroke-width="3"/>
    <path d="M -10 -14 Q -4 0 -10 14" fill="none" stroke="#5c1a1a" stroke-width="3" stroke-linecap="round"/>
    <!-- short blade held forward -->
    <path d="M 14 14 L 38 14 L 33 10.5 L 14 10.5 Z" fill="#d9dde4" stroke="#1a1d24" stroke-width="3" stroke-linejoin="round"/>
    <rect x="8" y="8" width="7" height="9" rx="2" fill="#5c1a1a" stroke="#1a1d24" stroke-width="3"/>
    <!-- front arm -->
    <ellipse cx="12" cy="13" rx="7" ry="6" fill="#8a2a2a" stroke="#1a1d24" stroke-width="3"/>
    <!-- round crimson helmet -->
    <circle cx="2" cy="0" r="13" fill="#d03a3a" stroke="#1a1d24" stroke-width="3"/>
    <path d="M -10 0 L 12 0" stroke="#7a1c1c" stroke-width="4" stroke-linecap="round"/>
    <path d="M 8 -7 Q 13 0 8 7" fill="none" stroke="#1a1d24" stroke-width="3" stroke-linecap="round"/>
    <circle cx="-2" cy="-6" r="3" fill="#ff8a7a" opacity="0.7"/>
  </g>
</svg>

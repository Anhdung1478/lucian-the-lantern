<svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="0 0 72 72">
  <!-- Melee Minion: crimson sword-and-shield soldier from above, crested helmet, blade forward (+X). -->
  <g transform="translate(36 36)">
    
    <!-- sword arm and blade -->
    <ellipse cx="9" cy="18" rx="8" ry="5.5" fill="#6e1e22" stroke="#1a1d24" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M 17 14.5 L 38 14.5 L 45 17.5 L 38 20.5 L 17 20.5 Z" fill="#e6eaf0" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M 20 17.5 L 39 17.5" stroke="#a9afbc" stroke-width="2" stroke-linecap="round"/>
    <rect x="13" y="11" width="5" height="13" rx="2" fill="#f2c14e" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="13" cy="17.5" r="4.5" fill="#d03a3a" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- shield arm -->
    <ellipse cx="3" cy="-18" rx="8" ry="5.5" fill="#6e1e22" stroke="#1a1d24" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- body, back plate -->
    <ellipse cx="-3" cy="0" rx="12.5" ry="22" fill="#a83232" stroke="#1a1d24" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M -9 -15 Q -13 0 -9 15" fill="none" stroke="#6e1e22" stroke-width="3" stroke-linecap="round"/>
    <circle cx="-1" cy="-19" r="7" fill="#d03a3a" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="-1" cy="19" r="7" fill="#d03a3a" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- round shield -->
    <circle cx="9" cy="-21" r="9.5" fill="#6e1e22" stroke="#1a1d24" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="9" cy="-21" r="6" fill="#a83232" stroke="#ff9a8a" stroke-width="2" stroke-opacity="0.7"/>
    <circle cx="9" cy="-21" r="2.6" fill="#f2c14e" stroke="#1a1d24" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- helmet with crest -->
    <ellipse cx="-12" cy="0" rx="5" ry="4" fill="#ff5a4a" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="1" cy="0" r="12.5" fill="#d03a3a" stroke="#1a1d24" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M -10 0 L 11 0" stroke="#1a1d24" stroke-width="8.5" stroke-linecap="round"/>
    <path d="M -10 0 L 11 0" stroke="#ff5a4a" stroke-width="4" stroke-linecap="round"/>
    <path d="M 8 -6.5 Q 13 0 8 6.5" fill="none" stroke="#1a1d24" stroke-width="3" stroke-linecap="round"/>
    <path d="M -6 -9 Q -1 -12 5 -10" fill="none" stroke="#ff9a8a" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
    <circle cx="-3" cy="-5" r="3.2" fill="#ffffff" opacity="0.3"/>
  </g>
</svg>

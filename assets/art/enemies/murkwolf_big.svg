<svg xmlns="http://www.w3.org/2000/svg" width="88" height="88" viewBox="0 0 88 88">
  <!-- Greater Murk Wolf: two-headed alpha shadow wolf seen from above facing +X, muscular dark shaggy body, spiked silver-grey mane, streaming tail behind (-X), two distinct fierce wolf heads angled slightly apart at +X with glowing cyan eyes and fangs. -->
  <defs>
    <linearGradient id="gmw-body" x1="0.15" y1="0.05" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#6e839d"/>
      <stop offset="0.48" stop-color="#3f4f64"/>
      <stop offset="1" stop-color="#1f2734"/>
    </linearGradient>
    <linearGradient id="gmw-mane" x1="0.15" y1="0.05" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#b4cae0"/>
      <stop offset="0.45" stop-color="#687c96"/>
      <stop offset="1" stop-color="#2a3446"/>
    </linearGradient>
    <linearGradient id="gmw-head" x1="0.15" y1="0.1" x2="0.85" y2="0.9">
      <stop offset="0" stop-color="#8399b4"/>
      <stop offset="0.5" stop-color="#4c5d74"/>
      <stop offset="1" stop-color="#232c3b"/>
    </linearGradient>
    <linearGradient id="gmw-limb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3c4a5e"/>
      <stop offset="1" stop-color="#19202b"/>
    </linearGradient>
    <linearGradient id="gmw-tail" x1="1" y1="0.2" x2="0" y2="0.8">
      <stop offset="0" stop-color="#2d3848"/>
      <stop offset="0.55" stop-color="#53667e"/>
      <stop offset="1" stop-color="#9cb5cf"/>
    </linearGradient>
    <radialGradient id="gmw-cyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d2fffd" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#48f5ea" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#18aeb5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g transform="translate(44 44)">
    <!-- Bushy streaming alpha tail (-X) -->
    <path d="M -18 -4 C -25 -9, -33 -10, -40 -2.5 L -36 0 L -41 4.5 C -33 10.5, -24 9, -18 4 Z" fill="url(#gmw-tail)" stroke="#14171f" stroke-width="2" stroke-linejoin="round"/>
    <path d="M -22 -2.5 Q -30 -5 -36 -1 M -23 2 Q -30 4.5 -36 2.5" fill="none" stroke="#adc4dc" stroke-width="1.5" stroke-linecap="round" opacity="0.75"/>

    <!-- Heavy clawed legs braced in alpha lunge -->
    <g stroke="#14171f" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round">
      <!-- Hind haunches -->
      <path d="M -16 -10 L -26 -20 L -17 -23 L -7 -13 Z" fill="url(#gmw-limb)"/>
      <path d="M -16 10 L -26 20 L -17 23 L -7 13 Z" fill="url(#gmw-limb)"/>
      <!-- Muscular forelegs -->
      <path d="M 0 -14 L 12 -26 L 19 -23 L 10 -12 Z" fill="url(#gmw-limb)"/>
      <path d="M 0 14 L 12 26 L 19 23 L 10 12 Z" fill="url(#gmw-limb)"/>
    </g>
    <!-- Claws on forepaws -->
    <path d="M 16.5 -25 L 21.5 -27 M 18.5 -22.5 L 23.5 -23.5 M 16.5 25 L 21.5 27 M 18.5 22.5 L 23.5 23.5" stroke="#dde7f2" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Powerful muscular canine torso -->
    <path d="M -22 0 C -21 -10, -12 -15, -2 -15.5 C 7 -17, 15 -14, 18 -7 L 18 7 C 15 14, 7 17, -2 15.5 C -12 15, -21 10, -22 0 Z" fill="url(#gmw-body)" stroke="#14171f" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- Dark dorsal fur ridge & battle scar -->
    <path d="M -18 0 L 10 0" stroke="#1a212e" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
    <path d="M -12 -10 Q -4 -12 5 -11" fill="none" stroke="#9eb5ce" stroke-width="1.8" stroke-linecap="round" opacity="0.65"/>
    <path d="M -12 -7 L -4 4" stroke="#b9cce0" stroke-width="1.6" stroke-linecap="round" opacity="0.75"/>

    <!-- Spiked silver-grey alpha mane/ruff fanning across broad shoulders -->
    <path d="M 15 -12 L 10 -24 L 4 -18 L -2 -26 L -5 -17 L -13 -21 L -9 -11 L -15 -7 L -10 0 L -15 7 L -9 11 L -13 21 L -5 17 L -2 26 L 4 18 L 10 24 L 15 12 Z" fill="url(#gmw-mane)" stroke="#14171f" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 8 -19 L 3 -12 M -1 -21 L -3 -13 M -9 -17 L -6 -10 M 8 19 L 3 12 M -1 21 L -3 13 M -9 17 L -6 10" stroke="#d0e2f2" stroke-width="1.4" stroke-linecap="round" opacity="0.75"/>

    <!-- UPPER WOLF HEAD (angled slightly upward -14 deg) -->
    <g transform="translate(15 -12.5) rotate(-13)">
      <!-- Ears -->
      <path d="M -1 -5.5 L -9.5 -14 L 3.5 -8.5 Z" fill="url(#gmw-limb)" stroke="#14171f" stroke-width="1.7" stroke-linejoin="round"/>
      <path d="M -1 5.5 L -8.5 13 L 3.5 8 Z" fill="url(#gmw-limb)" stroke="#14171f" stroke-width="1.7" stroke-linejoin="round"/>
      <!-- Snarling fangs -->
      <path d="M 14.5 -3.6 L 19.5 -4.8 L 17 -1.8 Z M 14.5 3.6 L 19.5 4.8 L 17 1.8 Z" fill="#f3f6fa" stroke="#14171f" stroke-width="1.2" stroke-linejoin="round"/>
      <!-- Head & tapered snout -->
      <path d="M -4 -6.5 L 3.5 -9 L 12 -5 L 22 -2.4 Q 24.5 0 22 2.4 L 12 5 L 3.5 9 L -4 6.5 L -1 0 Z" fill="url(#gmw-head)" stroke="#14171f" stroke-width="2" stroke-linejoin="round"/>
      <path d="M 2 -2.5 L 18.5 -1.1 L 18.5 1.1 L 2 2.5 Z" fill="#b4cae0" opacity="0.5"/>
      <path d="M 21 -2 L 24 -0.9 Q 24.8 0 24 0.9 L 21 2 Z" fill="#0f1218"/>
      <!-- Glowing cyan eyes -->
      <circle cx="8.8" cy="-4.3" r="4.3" fill="url(#gmw-cyan)"/>
      <circle cx="8.8" cy="4.3" r="4.3" fill="url(#gmw-cyan)"/>
      <path d="M 5.6 -5.6 L 11.8 -3.7 L 7.6 -2.8 Z" fill="#5cf7ec" stroke="#14171f" stroke-width="0.9" stroke-linejoin="round"/>
      <path d="M 5.6 5.6 L 11.8 3.7 L 7.6 2.8 Z" fill="#5cf7ec" stroke="#14171f" stroke-width="0.9" stroke-linejoin="round"/>
      <circle cx="9" cy="-4.2" r="1.1" fill="#ecffff"/>
      <circle cx="9" cy="4.2" r="1.1" fill="#ecffff"/>
    </g>

    <!-- LOWER WOLF HEAD (angled slightly downward +14 deg) -->
    <g transform="translate(15 12.5) rotate(13)">
      <!-- Ears -->
      <path d="M -1 -5.5 L -8.5 -13 L 3.5 -8 Z" fill="url(#gmw-limb)" stroke="#14171f" stroke-width="1.7" stroke-linejoin="round"/>
      <path d="M -1 5.5 L -9.5 14 L 3.5 8.5 Z" fill="url(#gmw-limb)" stroke="#14171f" stroke-width="1.7" stroke-linejoin="round"/>
      <!-- Snarling fangs -->
      <path d="M 14.5 -3.6 L 19.5 -4.8 L 17 -1.8 Z M 14.5 3.6 L 19.5 4.8 L 17 1.8 Z" fill="#f3f6fa" stroke="#14171f" stroke-width="1.2" stroke-linejoin="round"/>
      <!-- Head & tapered snout -->
      <path d="M -4 -6.5 L 3.5 -9 L 12 -5 L 22 -2.4 Q 24.5 0 22 2.4 L 12 5 L 3.5 9 L -4 6.5 L -1 0 Z" fill="url(#gmw-head)" stroke="#14171f" stroke-width="2" stroke-linejoin="round"/>
      <path d="M 2 -2.5 L 18.5 -1.1 L 18.5 1.1 L 2 2.5 Z" fill="#b4cae0" opacity="0.5"/>
      <path d="M 21 -2 L 24 -0.9 Q 24.8 0 24 0.9 L 21 2 Z" fill="#0f1218"/>
      <!-- Subtle snout scar on lower head -->
      <path d="M 12 -3.5 L 15 2.5" stroke="#d0e0f0" stroke-width="1.1" stroke-linecap="round" opacity="0.7"/>
      <!-- Glowing cyan eyes -->
      <circle cx="8.8" cy="-4.3" r="4.3" fill="url(#gmw-cyan)"/>
      <circle cx="8.8" cy="4.3" r="4.3" fill="url(#gmw-cyan)"/>
      <path d="M 5.6 -5.6 L 11.8 -3.7 L 7.6 -2.8 Z" fill="#5cf7ec" stroke="#14171f" stroke-width="0.9" stroke-linejoin="round"/>
      <path d="M 5.6 5.6 L 11.8 3.7 L 7.6 2.8 Z" fill="#5cf7ec" stroke="#14171f" stroke-width="0.9" stroke-linejoin="round"/>
      <circle cx="9" cy="-4.2" r="1.1" fill="#ecffff"/>
      <circle cx="9" cy="4.2" r="1.1" fill="#ecffff"/>
    </g>

    <!-- Central neck fur tuft bridging the two heads -->
    <path d="M 7 -5 L 17 0 L 7 5 L 10 0 Z" fill="url(#gmw-mane)" stroke="#14171f" stroke-width="1.6" stroke-linejoin="round"/>
  </g>
</svg>

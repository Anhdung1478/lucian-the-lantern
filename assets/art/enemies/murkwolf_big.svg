<svg xmlns="http://www.w3.org/2000/svg" width="88" height="88" viewBox="0 0 88 88">
  <!-- Greater Murk Wolf: the pack's big grey-blue wolf seen from above, a shaggy dark mane, snout forward (+X), glowing teal eyes. -->
  <g transform="translate(44 44)">
    <ellipse cx="-3" cy="3" rx="40" ry="24" fill="#000000" opacity="0.25"/>
    <!-- tail -->
    <path d="M -22 -3 Q -36 -9 -42 0 Q -36 8 -22 4 Z" fill="#3e4a5e" stroke="#1a1d24" stroke-width="3" stroke-linejoin="round"/>
    <!-- legs -->
    <ellipse cx="-15" cy="-14" rx="6" ry="5" fill="#3e4a5e" stroke="#1a1d24" stroke-width="2.5"/>
    <ellipse cx="-15" cy="14" rx="6" ry="5" fill="#3e4a5e" stroke="#1a1d24" stroke-width="2.5"/>
    <ellipse cx="12" cy="-15" rx="6" ry="5" fill="#3e4a5e" stroke="#1a1d24" stroke-width="2.5"/>
    <ellipse cx="12" cy="15" rx="6" ry="5" fill="#3e4a5e" stroke="#1a1d24" stroke-width="2.5"/>
    <!-- body -->
    <ellipse cx="-5" cy="0" rx="22" ry="14" fill="#5b6c86" stroke="#1a1d24" stroke-width="3"/>
    <path d="M -24 0 L -4 0" stroke="#3a465c" stroke-width="4" stroke-linecap="round"/>
    <!-- shaggy mane round the neck and shoulders -->
    <path d="M 12 -17 L 6 -21 L 4 -15 L -3 -18 L -2 -11 L -8 -9 L -3 -4 L -9 0 L -3 4 L -8 9 L -2 11 L -3 18 L 4 15 L 6 21 L 12 17 L 16 0 Z" fill="#2f3a4c" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 2 -11 L 8 -8 M 2 11 L 8 8 M 0 -4 L 6 -2 M 0 4 L 6 2" stroke="#55657e" stroke-width="1.5" stroke-linecap="round"/>
    <!-- head and snout -->
    <path d="M 11 -11 Q 20 -12 25 -5 L 37 -3 Q 40 0 37 3 L 25 5 Q 20 12 11 11 Q 7 0 11 -11 Z" fill="#6b7d98" stroke="#1a1d24" stroke-width="3" stroke-linejoin="round"/>
    <!-- ears -->
    <path d="M 14 -10 L 8 -18 L 19 -11 Z" fill="#46546c" stroke="#1a1d24" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 14 10 L 8 18 L 19 11 Z" fill="#46546c" stroke="#1a1d24" stroke-width="2" stroke-linejoin="round"/>
    <!-- glowing teal eyes -->
    <circle cx="24" cy="-5" r="5.5" fill="#3ff5d8" opacity="0.35"/>
    <circle cx="24" cy="5" r="5.5" fill="#3ff5d8" opacity="0.35"/>
    <circle cx="24" cy="-5" r="2.6" fill="#7dfde8"/>
    <circle cx="24" cy="5" r="2.6" fill="#7dfde8"/>
    <circle cx="38" cy="0" r="2.2" fill="#1a1d24"/>
  </g>
</svg>

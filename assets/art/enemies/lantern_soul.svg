<svg xmlns="http://www.w3.org/2000/svg" width="52" height="52" viewBox="0 0 52 52">
  <!-- Lantern Soul: a small bright teal soul seen from above, a round glowing head with a sad face looking forward (+X), a wavering tail of light behind ending in two iron chain links that bind it. -->
  <g transform="translate(26 26)">
    <!-- glow -->
    <circle cx="2" cy="0" r="23" fill="#6dffc0" opacity="0.2"/>
    <circle cx="3" cy="0" r="19" fill="#9dffd8" opacity="0.2"/>
    <!-- chain links -->
    <rect x="-24" y="-4" width="11" height="8" rx="4" fill="none" stroke="#1a1d24" stroke-width="5"/>
    <rect x="-24" y="-4" width="11" height="8" rx="4" fill="none" stroke="#b4c0c8" stroke-width="2.4"/>
    <rect x="-17" y="-3.5" width="9" height="7" rx="3.5" fill="none" stroke="#1a1d24" stroke-width="5"/>
    <rect x="-17" y="-3.5" width="9" height="7" rx="3.5" fill="none" stroke="#8a97a0" stroke-width="2.4"/>
    <!-- wavering tail -->
    <path d="M -2 -11 Q -11 -13 -14 -7 Q -9 -4 -17 0 Q -9 4 -14 7 Q -11 13 -2 11 Z" fill="#3fc9a0" stroke="#1a1d24" stroke-width="2.6" stroke-linejoin="round"/>
    <path d="M -4 -6 Q -10 -4 -12 0" fill="none" stroke="#a8ffe0" stroke-width="2" stroke-linecap="round"/>
    <!-- head -->
    <circle cx="5" cy="0" r="15" fill="#7fe8c4" stroke="#1a1d24" stroke-width="3"/>
    <circle cx="6" cy="0" r="10.5" fill="#c4ffec" opacity="0.8"/>
    <circle cx="1" cy="-7" r="3.2" fill="#ffffff" opacity="0.85"/>
    <!-- sad face -->
    <circle cx="10" cy="-4.5" r="2" fill="#1a1d24"/>
    <circle cx="10" cy="4.5" r="2" fill="#1a1d24"/>
    <path d="M 7 -8.5 L 12 -6.5 M 7 8.5 L 12 6.5" fill="none" stroke="#1a1d24" stroke-width="2" stroke-linecap="round"/>
    <path d="M 14 -3 Q 12 0 14 3" fill="none" stroke="#1a1d24" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>

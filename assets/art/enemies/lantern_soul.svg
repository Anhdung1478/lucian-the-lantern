<svg xmlns="http://www.w3.org/2000/svg" width="52" height="52" viewBox="0 0 52 52">
  <!-- Lantern Soul: a teal-green wisp seen from above, a round glowing head with a sad face looking forward (+X) and a wavering tail of light behind. -->
  <g transform="translate(26 26)">
    <ellipse cx="-1" cy="2" rx="21" ry="18" fill="#000000" opacity="0.2"/>
    <!-- glow -->
    <circle cx="2" cy="0" r="21" fill="#6dffc0" opacity="0.18"/>
    <!-- wavering tail -->
    <path d="M -2 -10 Q -14 -12 -18 -6 Q -12 -4 -23 0 Q -12 4 -18 6 Q -14 12 -2 10 Z" fill="#3fc9a0" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- head -->
    <circle cx="4" cy="0" r="14" fill="#7fe8c4" stroke="#1a1d24" stroke-width="3"/>
    <circle cx="5" cy="0" r="9" fill="#b8fbe2" opacity="0.7"/>
    <!-- sad face: eyes, drooping brows, a small downturned mouth -->
    <circle cx="9" cy="-4.5" r="1.8" fill="#1a1d24"/>
    <circle cx="9" cy="4.5" r="1.8" fill="#1a1d24"/>
    <path d="M 6.5 -8 L 11 -6 M 6.5 8 L 11 6" fill="none" stroke="#1a1d24" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M 12 -2.5 Q 10 0 12 2.5" fill="none" stroke="#1a1d24" stroke-width="1.6" stroke-linecap="round"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80">
  <!-- Crimson Raptor Leader: alpha Jungle Raptor from above facing +X, royal-crimson layered plumage, bold sweeping tail plumes with gold tips, razor-swept predatory wings, hooked golden-black war-beak, fiery golden war-crest. -->
  <defs>
    <linearGradient id="rbig-body" x1="0.15" y1="0.05" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#e34d42"/>
      <stop offset="0.5" stop-color="#9e1e26"/>
      <stop offset="1" stop-color="#4d0d16"/>
    </linearGradient>
    <linearGradient id="rbig-wing" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#c42b30"/>
      <stop offset="0.55" stop-color="#781620"/>
      <stop offset="1" stop-color="#360911"/>
    </linearGradient>
    <linearGradient id="rbig-crest" x1="1" y1="0.5" x2="0" y2="0.5">
      <stop offset="0" stop-color="#fff085"/>
      <stop offset="0.4" stop-color="#ff8c24"/>
      <stop offset="0.78" stop-color="#e02b24"/>
      <stop offset="1" stop-color="#871018"/>
    </linearGradient>
    <linearGradient id="rbig-beak" x1="0" y1="0.25" x2="1" y2="0.75">
      <stop offset="0" stop-color="#ffea7a"/>
      <stop offset="0.55" stop-color="#d99324"/>
      <stop offset="0.85" stop-color="#4a3118"/>
      <stop offset="1" stop-color="#181416"/>
    </linearGradient>
  </defs>

  <g transform="translate(40 40)">
    <!-- Bold royal-crimson fanning tail plumes with golden tips (-X) -->
    <g stroke="#14171f" stroke-width="1.7" stroke-linejoin="round">
      <path d="M -12 -3 L -33 -19 L -26 -6 Z" fill="#701520"/>
      <path d="M -12 3 L -33 19 L -26 6 Z" fill="#701520"/>
      <path d="M -13 -2 L -36 -10 L -25 -2 Z" fill="#ad242c"/>
      <path d="M -13 2 L -36 10 L -25 2 Z" fill="#ad242c"/>
      <path d="M -13 -3 L -38 0 L -13 3 Z" fill="#d93b36"/>
    </g>
    <!-- Golden royal eye-tips on tail feathers -->
    <path d="M -29 -16 L -33 -19 L -28 -11 Z M -29 16 L -33 19 L -28 11 Z M -31 -8.5 L -36 -10 L -30 -5 Z M -31 8.5 L -36 10 L -30 5 Z M -31 -1.8 L -38 0 L -31 1.8 Z" fill="#ffd954"/>

    <!-- Razor-sharp predatory talons reaching forward (+X) -->
    <g stroke="#14171f" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 6 -10 L 16 -16 L 23 -19 M 16 -16 L 22 -12.5" fill="none" stroke-width="4.4"/>
      <path d="M 6 -10 L 16 -16 L 23 -19 M 16 -16 L 22 -12.5" fill="none" stroke="#f5d46c" stroke-width="2"/>
      <path d="M 6 10 L 16 16 L 23 19 M 16 16 L 22 12.5" fill="none" stroke-width="4.4"/>
      <path d="M 6 10 L 16 16 L 23 19 M 16 16 L 22 12.5" fill="none" stroke="#f5d46c" stroke-width="2"/>
    </g>

    <!-- Broad razor-swept predatory wings with layered feather tiers -->
    <g stroke="#14171f" stroke-width="2" stroke-linejoin="round">
      <path d="M 10 -7 C 4 -20, -10 -34, -30 -33 L -22 -24 L -32 -19 L -21 -14 L -28 -8 L -17 -6 L 4 -4 Z" fill="url(#rbig-wing)"/>
      <path d="M 10 7 C 4 20, -10 34, -30 33 L -22 24 L -32 19 L -21 14 L -28 8 L -17 6 L 4 4 Z" fill="url(#rbig-wing)"/>
    </g>
    <!-- Layered amber-gold wing covert highlights -->
    <path d="M 4 -11 Q -8 -22 -24 -27 M 1 -10 L -21 -17 M -4 -7 L -19 -10 M 4 11 Q -8 22 -24 27 M 1 10 L -21 17 M -4 7 L -19 10" fill="none" stroke="#f58b42" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/>

    <!-- Sleek powerful royal-crimson torso -->
    <path d="M -18 0 C -16 -9.5, -5 -14, 9 -11 L 17 -5 L 17 5 L 9 11 C -5 14, -16 9.5, -18 0 Z" fill="url(#rbig-body)" stroke="#14171f" stroke-width="2.1" stroke-linejoin="round"/>
    <path d="M -10 -6 Q 0 -9.5 10 -7" fill="none" stroke="#ff9678" stroke-width="1.8" stroke-linecap="round" opacity="0.65"/>

    <!-- Spiky crimson & gold neck hackles/ruff -->
    <path d="M 13 -8 L 7 -18 L 15 -14 L 14 -21 L 21 -13 L 24 -15 L 22 -7 Z M 13 8 L 7 18 L 15 14 L 14 21 L 21 13 L 24 15 L 22 7 Z" fill="#821622" stroke="#14171f" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M 11 -14 L 17 -11 M 11 14 L 17 11" stroke="#ffb84d" stroke-width="1.3" stroke-linecap="round"/>

    <!-- Fierce hooked golden-black war-beak (+X) -->
    <path d="M 22 -6 C 29 -5.4, 35 -2.2, 37.5 0 C 35 2.2, 29 5.4, 22 6 Z" fill="url(#rbig-beak)" stroke="#14171f" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 24 -1.4 L 33 0" stroke="#fff7c4" stroke-width="1.4" stroke-linecap="round" opacity="0.85"/>

    <!-- Angular alpha raptor head -->
    <path d="M 9 -8 L 18 -9.5 L 26 -5 L 26 5 L 18 9.5 L 9 8 Z" fill="url(#rbig-body)" stroke="#14171f" stroke-width="2" stroke-linejoin="round"/>

    <!-- Bold golden-and-flame royal war-crest sweeping back -->
    <path d="M 22 0 L 13 -5.5 L 15 -2 L 1 -11.5 L 6 -2.5 L -11 -7 L -2 -1 L -14 0 L -2 1 L -11 7 L 6 2.5 L 1 11.5 L 15 2 L 13 5.5 Z" fill="url(#rbig-crest)" stroke="#14171f" stroke-width="1.7" stroke-linejoin="round"/>
    <path d="M -8 0 L 18 0" stroke="#fff4a3" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Fierce glowing molten-gold eyes under angled brow -->
    <path d="M 17 -7.4 L 24 -4.6 L 19.2 -3.7 Z" fill="#fff070" stroke="#14171f" stroke-width="1" stroke-linejoin="round"/>
    <path d="M 17 7.4 L 24 4.6 L 19.2 3.7 Z" fill="#fff070" stroke="#14171f" stroke-width="1" stroke-linejoin="round"/>
    <circle cx="20.4" cy="-5.2" r="0.9" fill="#ffffff"/>
    <circle cx="20.4" cy="5.2" r="0.9" fill="#ffffff"/>
  </g>
</svg>

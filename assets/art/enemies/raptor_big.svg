<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80">
  <!-- Crimson Raptor: the pack's leader from above, dark crimson, a ruff and a tall flaming crest, gold beak, beak forward (+X), talons out front. -->
  <g transform="translate(40 40)">
    <g transform="scale(1.4)">
    <!-- tail feathers -->
    <ellipse cx="0" cy="0" rx="9.5" ry="3.6" transform="rotate(-30) translate(-17 0)" fill="#7a2228" stroke="#1a1d24" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="0" cy="0" rx="3" ry="2.4" transform="rotate(-30) translate(-23 0)" fill="#ffcf4a"/><ellipse cx="0" cy="0" rx="9.5" ry="3.6" transform="rotate(30) translate(-17 0)" fill="#7a2228" stroke="#1a1d24" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="0" cy="0" rx="3" ry="2.4" transform="rotate(30) translate(-23 0)" fill="#ffcf4a"/><ellipse cx="0" cy="0" rx="9.5" ry="3.6" transform="rotate(-15) translate(-17 0)" fill="#7a2228" stroke="#1a1d24" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="0" cy="0" rx="3" ry="2.4" transform="rotate(-15) translate(-23 0)" fill="#ffcf4a"/><ellipse cx="0" cy="0" rx="9.5" ry="3.6" transform="rotate(15) translate(-17 0)" fill="#7a2228" stroke="#1a1d24" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="0" cy="0" rx="3" ry="2.4" transform="rotate(15) translate(-23 0)" fill="#ffcf4a"/><ellipse cx="0" cy="0" rx="9.5" ry="3.6" transform="rotate(0) translate(-17 0)" fill="#7a2228" stroke="#1a1d24" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="0" cy="0" rx="3" ry="2.4" transform="rotate(0) translate(-23 0)" fill="#ffcf4a"/>
    <!-- legs and talons reaching forward -->
    <path d="M 2 -8 L 10 -12 M 2 8 L 10 12" stroke="#1a1d24" stroke-width="6" stroke-linecap="round"/>
    <path d="M 2 -8 L 10 -12 M 2 8 L 10 12" stroke="#e8c25a" stroke-width="3" stroke-linecap="round"/>
    <path d="M 10 -12 L 15 -15 M 10 -12 L 15 -11 M 10 12 L 15 15 M 10 12 L 15 11" stroke="#1a1d24" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 10 -12 L 15 -15 M 10 -12 L 15 -11 M 10 12 L 15 15 M 10 12 L 15 11" stroke="#f4e6b0" stroke-width="2" stroke-linecap="round"/>
    <!-- body -->
    <ellipse cx="-1" cy="0" rx="12.5" ry="11.5" fill="#a8323a" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <ellipse cx="1" cy="-1" rx="6" ry="5" fill="#e0707a" opacity="0.6"/>
    <!-- folded wings with feather tips -->
    <path d="M 6 -8 Q -2 -20 -20 -18 L -15 -14 L -21 -11 L -14 -8 L -18 -4 Q -6 -4 4 -3 Z" fill="#7a2228" stroke="#1a1d24" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M 6 8 Q -2 20 -20 18 L -15 14 L -21 11 L -14 8 L -18 4 Q -6 4 4 3 Z" fill="#7a2228" stroke="#1a1d24" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M 0 -9 L -13 -13 M 0 9 L -13 13" stroke="#c24a50" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M 6 -9 L 2 -14 L 9 -12 L 8 -17 L 14 -11 L 17 -14 L 18 -8 Z M 6 9 L 2 14 L 9 12 L 8 17 L 14 11 L 17 14 L 18 8 Z" fill="#7a2228" stroke="#1a1d24" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- head, beak, crest -->
    <circle cx="12" cy="0" r="7" fill="#c04048" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M 17.5 -4 L 26 0 L 17.5 4 Z" fill="#ffcf4a" stroke="#1a1d24" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M 15 0 L 8 -4 L 9 -1 L -1 -8 L 3 -1 L -8 -5 L -2 1 L -8 0 L -2 4 L -8 5 L 3 1 L -1 8 L 9 1 L 8 4 Z" fill="#ff4a2a" stroke="#1a1d24" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M -3 0 L 11 0" stroke="#ffcf4a" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="14.5" cy="-4.5" r="2.2" fill="#ff7a2a"/><circle cx="14.5" cy="4.5" r="2.2" fill="#ff7a2a"/>
    <circle cx="-2" cy="-4" r="3.5" fill="#ffffff" opacity="0.28"/>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="0 0 72 72">
  <!-- Shadow Melee Minion: the melee minion in black-purple with violet glows, same shape and facing (+X). -->
  <g transform="translate(36 36)">
    <circle cx="0" cy="0" r="27" fill="none" stroke="#8a4fe0" stroke-width="3" opacity="0.45"/>
    <ellipse cx="0" cy="3" rx="26" ry="24" fill="#000000" opacity="0.25"/>
    <!-- back arm -->
    <ellipse cx="6" cy="-19" rx="8" ry="6" fill="#2a1a3d" stroke="#1a1d24" stroke-width="3"/>
    <!-- shoulders and body -->
    <ellipse cx="-2" cy="0" rx="14" ry="23" fill="#33204a" stroke="#1a1d24" stroke-width="3"/>
    <path d="M -10 -14 Q -4 0 -10 14" fill="none" stroke="#150d22" stroke-width="3" stroke-linecap="round"/>
    <!-- short blade held forward -->
    <path d="M 14 14 L 38 14 L 33 10.5 L 14 10.5 Z" fill="#b89cff" stroke="#1a1d24" stroke-width="3" stroke-linejoin="round"/>
    <rect x="8" y="8" width="7" height="9" rx="2" fill="#150d22" stroke="#1a1d24" stroke-width="3"/>
    <!-- front arm -->
    <ellipse cx="12" cy="13" rx="7" ry="6" fill="#2a1a3d" stroke="#1a1d24" stroke-width="3"/>
    <!-- round crimson helmet -->
    <circle cx="2" cy="0" r="13" fill="#3d2660" stroke="#1a1d24" stroke-width="3"/>
    <path d="M -10 0 L 12 0" stroke="#9a5cf0" stroke-width="4" stroke-linecap="round"/>
    <path d="M 8 -7 Q 13 0 8 7" fill="none" stroke="#1a1d24" stroke-width="3" stroke-linecap="round"/>
    <circle cx="-2" cy="-6" r="3" fill="#c9a4ff" opacity="0.7"/>
  </g>
</svg>

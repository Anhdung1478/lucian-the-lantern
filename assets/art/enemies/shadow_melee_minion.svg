<svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="0 0 72 72">
  <!-- Shadow Melee Minion: black-purple with violet glows sword-and-shield soldier from above, crested helmet, blade forward (+X). -->
  <g transform="translate(36 36)">
    <path d="M -16 -4 Q -26 -2 -30 -8 Q -24 0 -30 6 Q -22 4 -16 5 Z" fill="#8a5ad8" opacity="0.8" stroke="#1a1d24" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- sword arm and blade -->
    <ellipse cx="9" cy="18" rx="8" ry="5.5" fill="#221838" stroke="#1a1d24" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M 17 14.5 L 38 14.5 L 45 17.5 L 38 20.5 L 17 20.5 Z" fill="#b9b4d6" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M 20 17.5 L 39 17.5" stroke="#7d7aa0" stroke-width="2" stroke-linecap="round"/>
    <rect x="13" y="11" width="5" height="13" rx="2" fill="#c9a0ff" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="13" cy="17.5" r="4.5" fill="#56407e" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- shield arm -->
    <ellipse cx="3" cy="-18" rx="8" ry="5.5" fill="#221838" stroke="#1a1d24" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- body, back plate -->
    <ellipse cx="-3" cy="0" rx="12.5" ry="22" fill="#3a2a56" stroke="#1a1d24" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M -9 -15 Q -13 0 -9 15" fill="none" stroke="#221838" stroke-width="3" stroke-linecap="round"/>
    <circle cx="-1" cy="-19" r="7" fill="#56407e" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="-1" cy="19" r="7" fill="#56407e" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- round shield -->
    <circle cx="9" cy="-21" r="9.5" fill="#221838" stroke="#1a1d24" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="9" cy="-21" r="6" fill="#3a2a56" stroke="#c9a4ff" stroke-width="2" stroke-opacity="0.95"/>
    <circle cx="9" cy="-21" r="2.6" fill="#c9a0ff" stroke="#1a1d24" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- helmet with crest -->
    <ellipse cx="-12" cy="0" rx="5" ry="4" fill="#b98cff" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="1" cy="0" r="12.5" fill="#56407e" stroke="#1a1d24" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M -10 0 L 11 0" stroke="#1a1d24" stroke-width="8.5" stroke-linecap="round"/>
    <path d="M -10 0 L 11 0" stroke="#b98cff" stroke-width="4" stroke-linecap="round"/>
    <path d="M 8 -6.5 Q 13 0 8 6.5" fill="none" stroke="#1a1d24" stroke-width="3" stroke-linecap="round"/>
    <path d="M -6 -9 Q -1 -12 5 -10" fill="none" stroke="#c9a4ff" stroke-width="2.5" stroke-linecap="round" opacity="0.95"/>
    <circle cx="-3" cy="-5" r="3.2" fill="#ffffff" opacity="0.3"/>

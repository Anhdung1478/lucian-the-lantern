<svg xmlns="http://www.w3.org/2000/svg" width="112" height="112" viewBox="0 0 112 112">
  <!-- Shadow Super Minion: Darkness-corrupted Juggernaut from above facing +X, jagged torn violet cape tails (-X), dark obsidian-indigo armor, glowing amethyst horned pauldrons & runes, shadowed iron war-hood with bright violet-white eyes, massive corrupted gauntlets forward (+X). -->
  <defs>
    <linearGradient id="ssm-cape" x1="0.85" y1="0.1" x2="0.1" y2="0.9">
      <stop offset="0" stop-color="#4e2e7e"/>
      <stop offset="0.55" stop-color="#291746"/>
      <stop offset="1" stop-color="#140b24"/>
    </linearGradient>
    <linearGradient id="ssm-obsidian" x1="0.15" y1="0.05" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#584980"/>
      <stop offset="0.5" stop-color="#2e2348"/>
      <stop offset="1" stop-color="#140f24"/>
    </linearGradient>
    <linearGradient id="ssm-amethyst" x1="0.15" y1="0.05" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#e4c2ff"/>
      <stop offset="0.5" stop-color="#9e5cf0"/>
      <stop offset="1" stop-color="#4e2088"/>
    </linearGradient>
    <linearGradient id="ssm-steel" x1="0.15" y1="0.05" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#76729c"/>
      <stop offset="0.5" stop-color="#3c3757"/>
      <stop offset="1" stop-color="#1a1728"/>
    </linearGradient>
    <linearGradient id="ssm-hood" x1="0.1" y1="0.1" x2="0.9" y2="0.9">
      <stop offset="0" stop-color="#463c66"/>
      <stop offset="0.5" stop-color="#221c36"/>
      <stop offset="1" stop-color="#0f0c1a"/>
    </linearGradient>
    <radialGradient id="ssm-core-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbf2ff"/>
      <stop offset="0.4" stop-color="#d292ff"/>
      <stop offset="0.78" stop-color="#8b3cf0" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#5a18b8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g transform="translate(56 56)">
    <!-- Jagged torn violet cape tails shredding behind (-X) -->
    <path d="M -14 -24 C -28 -27, -38 -25, -51 -20 L -42 -11 L -52 -5 L -41 0 L -52 5 L -42 11 L -51 20 C -38 25, -28 27, -14 24 Z" fill="url(#ssm-cape)" stroke="#14171f" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- Spectral amethyst glowing edge wisps on torn cape -->
    <path d="M -48 -18 L -40 -10 L -49 -5 L -39 0 L -49 5 L -40 10 L -48 18" fill="none" stroke="#b67aff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
    <path d="M -20 -15 Q -32 -14 -40 -11 M -18 0 L -38 0 M -20 15 Q -32 14 -40 11" fill="none" stroke="#180e2b" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Corrupted obsidian forearms -->
    <path d="M 2 -28 L 28 -25 L 28 -14 L 4 -15 Z" fill="url(#ssm-steel)" stroke="#14171f" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 2 28 L 28 25 L 28 14 L 4 15 Z" fill="url(#ssm-steel)" stroke="#14171f" stroke-width="2" stroke-linejoin="round"/>

    <!-- MASSIVE CORRUPTED SIEGE-GAUNTLETS clenched forward (+X) -->
    <!-- Upper gauntlet -->
    <g transform="translate(34 -20)">
      <path d="M -10 -10 L 6 -12 L 14 -6 L 14 7 L 6 11 L -10 9 Z" fill="url(#ssm-steel)" stroke="#14171f" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M -6 -8 L 5 -9 L 10 -4 L 10 4 L 5 8 L -6 7 Z" fill="url(#ssm-obsidian)" stroke="#14171f" stroke-width="1.6" stroke-linejoin="round"/>
      <!-- Void-amethyst knuckle spikes -->
      <path d="M 13 -7 L 20 -5.5 L 14 -2 Z M 14 2 L 20 5.5 L 13 7 Z" fill="url(#ssm-amethyst)" stroke="#14171f" stroke-width="1.5" stroke-linejoin="round"/>
      <!-- Pulsing corrupted amethyst core -->
      <circle cx="1" cy="-0.5" r="8" fill="url(#ssm-core-glow)"/>
      <polygon points="-2.8,-0.5 1,-4.2 4.8,-0.5 1,3.2" fill="#f6e6ff" stroke="#893ee8" stroke-width="1.2"/>
    </g>
    <!-- Lower gauntlet -->
    <g transform="translate(34 20)">
      <path d="M -10 -9 L 6 -11 L 14 -7 L 14 6 L 6 12 L -10 10 Z" fill="url(#ssm-steel)" stroke="#14171f" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M -6 -7 L 5 -8 L 10 -4 L 10 4 L 5 9 L -6 8 Z" fill="url(#ssm-obsidian)" stroke="#14171f" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M 13 -7 L 20 -5.5 L 14 -2 Z M 14 2 L 20 5.5 L 13 7 Z" fill="url(#ssm-amethyst)" stroke="#14171f" stroke-width="1.5" stroke-linejoin="round"/>
      <circle cx="1" cy="0.5" r="8" fill="url(#ssm-core-glow)"/>
      <polygon points="-2.8,0.5 1,-3.2 4.8,0.5 1,4.2" fill="#f6e6ff" stroke="#893ee8" stroke-width="1.2"/>
    </g>

    <!-- Broad dark obsidian-indigo armored cuirass -->
    <path d="M -21 -22 L -6 -32 L 13 -26 L 19 -12 L 19 12 L 13 26 L -6 32 L -21 22 L -24 0 Z" fill="url(#ssm-obsidian)" stroke="#14171f" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- Glowing amethyst void-runes etched across back plate -->
    <path d="M -17 -19 L 4 -10 L 4 10 L -17 19" fill="none" stroke="url(#ssm-amethyst)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M -17 0 L -5 0" stroke="#e4c2ff" stroke-width="3.2" stroke-linecap="round"/>
    <circle cx="-11" cy="0" r="5" fill="url(#ssm-core-glow)"/>
    <circle cx="-11" cy="0" r="2.8" fill="#f8ebff" stroke="#14171f" stroke-width="1.3"/>

    <!-- HORNED OBSIDIAN WAR-PAULDRONS with glowing amethyst runes -->
    <!-- Upper pauldron -->
    <g>
      <path d="M -4 -36 C -1 -45, 12 -50, 25 -44 C 15 -41, 10 -36, 9 -30 Z" fill="url(#ssm-amethyst)" stroke="#14171f" stroke-width="2" stroke-linejoin="round"/>
      <path d="M -18 -20 C -20 -34, -8 -41, 6 -38 C 16 -35, 19 -24, 13 -16 C 4 -13, -10 -14, -18 -20 Z" fill="url(#ssm-obsidian)" stroke="#14171f" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M -14 -24 C -13 -33, -4 -36, 6 -34 C 12 -32, 14 -25, 10 -20" fill="none" stroke="url(#ssm-amethyst)" stroke-width="2.8" stroke-linecap="round"/>
      <path d="M -6 -25 L 0 -30 L 5 -24" fill="none" stroke="#efd8ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="-11" cy="-21" r="1.8" fill="#e6c4ff" stroke="#14171f" stroke-width="1"/>
      <circle cx="8" cy="-21" r="1.8" fill="#e6c4ff" stroke="#14171f" stroke-width="1"/>
    </g>
    <!-- Lower pauldron -->
    <g>
      <path d="M -4 36 C -1 45, 12 50, 25 44 C 15 41, 10 36, 9 30 Z" fill="url(#ssm-amethyst)" stroke="#14171f" stroke-width="2" stroke-linejoin="round"/>
      <path d="M -18 20 C -20 34, -8 41, 6 38 C 16 35, 19 24, 13 16 C 4 13, -10 14, -18 20 Z" fill="url(#ssm-obsidian)" stroke="#14171f" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M -14 24 C -13 33, -4 36, 6 34 C 12 32, 14 25, 10 20" fill="none" stroke="url(#ssm-amethyst)" stroke-width="2.8" stroke-linecap="round"/>
      <path d="M -6 25 L 0 30 L 5 24" fill="none" stroke="#efd8ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="-11" cy="21" r="1.8" fill="#e6c4ff" stroke="#14171f" stroke-width="1"/>
      <circle cx="8" cy="21" r="1.8" fill="#e6c4ff" stroke="#14171f" stroke-width="1"/>
    </g>

    <!-- DARK OBSIDIAN WAR-HOOD over blazing violet-white visor eyes -->
    <g>
      <path d="M -11 -11 C -5 -18, 9 -18, 19 -10 L 25 0 L 19 10 C 9 18, -5 18, -11 11 C -15 5, -15 -5, -11 -11 Z" fill="url(#ssm-hood)" stroke="#14171f" stroke-width="2.2" stroke-linejoin="round"/>
      <!-- Glowing amethyst hood crest -->
      <path d="M -11 0 L 20 0" stroke="url(#ssm-amethyst)" stroke-width="3.6" stroke-linecap="round"/>
      <path d="M -7 -9 Q 4 -14 15 -8" fill="none" stroke="#9682c4" stroke-width="1.6" stroke-linecap="round" opacity="0.65"/>
      <!-- Deep dark cowl cavity -->
      <path d="M 11 -9 L 22 -5 L 23.5 0 L 22 5 L 11 9 Q 15 0 11 -9 Z" fill="#090612" stroke="#14171f" stroke-width="1.5" stroke-linejoin="round"/>
      <!-- Bright violet-white eyes -->
      <circle cx="17.5" cy="-3.6" r="4.4" fill="url(#ssm-core-glow)"/>
      <circle cx="17.5" cy="3.6" r="4.4" fill="url(#ssm-core-glow)"/>
      <path d="M 14.8 -5.4 L 20.6 -3.2 L 16.5 -1.9 Z" fill="#f3e0ff"/>
      <path d="M 14.8 5.4 L 20.6 3.2 L 16.5 1.9 Z" fill="#f3e0ff"/>
      <circle cx="18" cy="-3.5" r="1.1" fill="#ffffff"/>
      <circle cx="18" cy="3.5" r="1.1" fill="#ffffff"/>
      <!-- Jagged amethyst brow trim -->
      <path d="M 12 -11 L 24 0 L 12 11" fill="none" stroke="url(#ssm-amethyst)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>

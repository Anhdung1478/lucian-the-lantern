<svg xmlns="http://www.w3.org/2000/svg" width="112" height="112" viewBox="0 0 112 112">
  <!-- Blue Sentinel: ancient Runeterran Mossy Stone Golem from above facing +X, chiseled faceted slate-blue boulders, dark jungle moss in crevices, glowing carved cyan arcane rune rings across crest, back, and crushing stone fists. -->
  <defs>
    <linearGradient id="bs-stone" x1="0.1" y1="0.05" x2="0.9" y2="0.95">
      <stop offset="0" stop-color="#87acd6"/>
      <stop offset="0.45" stop-color="#4e709e"/>
      <stop offset="1" stop-color="#223552"/>
    </linearGradient>
    <linearGradient id="bs-stone-dark" x1="0.1" y1="0.1" x2="0.9" y2="0.9">
      <stop offset="0" stop-color="#587aa8"/>
      <stop offset="0.55" stop-color="#324b70"/>
      <stop offset="1" stop-color="#19263b"/>
    </linearGradient>
    <linearGradient id="bs-stone-lit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#aecce8"/>
      <stop offset="1" stop-color="#5f84b3"/>
    </linearGradient>
    <linearGradient id="bs-moss" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ca354"/>
      <stop offset="0.55" stop-color="#3d6b38"/>
      <stop offset="1" stop-color="#1e3b22"/>
    </linearGradient>
    <radialGradient id="bs-rune-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e2ffff"/>
      <stop offset="0.42" stop-color="#60e6ff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#1cb4e8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g transform="translate(56 56)">
    <!-- Heavy chiseled stone forearms connecting shoulders to crushing fists -->
    <path d="M 4 -35 L 30 -31 L 28 -18 L 4 -20 Z" fill="url(#bs-stone-dark)" stroke="#14171f" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 4 35 L 30 31 L 28 18 L 4 20 Z" fill="url(#bs-stone-dark)" stroke="#14171f" stroke-width="2" stroke-linejoin="round"/>
    <!-- Glowing arcane seams along forearms -->
    <path d="M 12 -27 L 23 -25 M 12 27 L 23 25" stroke="#6ce8ff" stroke-width="2.2" stroke-linecap="round"/>

    <!-- CRUSHING FACETED STONE FISTS forward (+X) -->
    <!-- Upper stone fist -->
    <g>
      <polygon points="22,-36 37,-39 47,-30 46,-17 34,-12 21,-18" fill="url(#bs-stone)" stroke="#14171f" stroke-width="2.2" stroke-linejoin="round"/>
      <!-- Chiseled top bevel facet -->
      <polygon points="24,-34 36,-37 43,-29 33,-25 23,-28" fill="url(#bs-stone-lit)" opacity="0.8"/>
      <!-- Shadowed lower facet & stone knuckle cracks -->
      <polygon points="33,-25 46,-17 34,-12 21,-18" fill="#21334f" opacity="0.55"/>
      <path d="M 38,-35 L 35,-24 L 44,-22 M 35,-24 L 31,-14" fill="none" stroke="#182538" stroke-width="1.6" stroke-linecap="round"/>
      <!-- Glowing cyan rune ring on fist -->
      <circle cx="31" cy="-25" r="7" fill="url(#bs-rune-glow)"/>
      <circle cx="31" cy="-25" r="3.6" fill="none" stroke="#a6f7ff" stroke-width="1.8"/>
      <circle cx="31" cy="-25" r="1.4" fill="#ffffff"/>
    </g>
    <!-- Lower stone fist -->
    <g>
      <polygon points="22,36 37,39 47,30 46,17 34,12 21,18" fill="url(#bs-stone)" stroke="#14171f" stroke-width="2.2" stroke-linejoin="round"/>
      <polygon points="24,19 35,14 44,19 36,24 23,23" fill="url(#bs-stone-lit)" opacity="0.65"/>
      <polygon points="34,24 47,30 37,39 22,36" fill="#1e2e47" opacity="0.55"/>
      <path d="M 38,35 L 35,24 L 44,22 M 35,24 L 31,14" fill="none" stroke="#182538" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="31" cy="25" r="7" fill="url(#bs-rune-glow)"/>
      <circle cx="31" cy="25" r="3.6" fill="none" stroke="#a6f7ff" stroke-width="1.8"/>
      <circle cx="31" cy="25" r="1.4" fill="#ffffff"/>
    </g>

    <!-- MONOLITHIC CHISELED STONE TORSO -->
    <polygon points="-34,-15 -24,-34 -3,-39 16,-31 23,-13 23,13 16,31 -3,39 -24,34 -34,15" fill="url(#bs-stone)" stroke="#14171f" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- Sharp top-left lit planar rock facets -->
    <polygon points="-24,-34 -3,-39 7,-21 -14,-15 -31,-14" fill="url(#bs-stone-lit)" opacity="0.72"/>
    <polygon points="-14,-15 7,-21 17,-10 5,3 -14,5" fill="#6f94c4" opacity="0.45"/>
    <!-- Deep shadow bottom-right rock facets -->
    <polygon points="-34,15 -14,5 5,3 16,31 -3,39 -24,34" fill="#1c2c44" opacity="0.5"/>
    <!-- Weathered chisel fracture lines -->
    <path d="M -24 -34 L -14 -15 L -17 16 L -24 34 M -14 -15 L 7 -21 L 16 -31 M 5 3 L 16 31 M 5 3 L 22 -12" fill="none" stroke="#1a2940" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Patches of dark jungle moss nestled in stone crevices -->
    <g stroke="#14171f" stroke-width="1.4" stroke-linejoin="round">
      <path d="M -30 -16 C -26 -24, -18 -27, -13 -21 C -16 -15, -24 -11, -30 -16 Z" fill="url(#bs-moss)"/>
      <path d="M -28 15 C -23 23, -14 28, -9 22 C -12 16, -20 12, -28 15 Z" fill="url(#bs-moss)"/>
      <path d="M -19 -4 C -15 -8, -9 -7, -8 -2 C -12 3, -18 2, -19 -4 Z" fill="url(#bs-moss)"/>
      <path d="M 3 22 C 9 19, 15 22, 14 28 C 8 30, 2 27, 3 22 Z" fill="url(#bs-moss)"/>
    </g>
    <circle cx="-23" cy="-19" r="1.4" fill="#8bc76b"/>
    <circle cx="-18" cy="-21" r="1.1" fill="#8bc76b"/>
    <circle cx="-20" cy="20" r="1.3" fill="#7ab85c"/>

    <!-- Glowing carved cyan arcane rune rings & channels on back boulder -->
    <circle cx="-10" cy="0" r="12" fill="url(#bs-rune-glow)" opacity="0.8"/>
    <path d="M -28 0 L -16 0 M -4 0 L 6 0" stroke="#14171f" stroke-width="4.4" stroke-linecap="round"/>
    <path d="M -28 0 L -16 0 M -4 0 L 6 0" stroke="#78eeff" stroke-width="2.1" stroke-linecap="round"/>
    <circle cx="-10" cy="0" r="6.2" fill="none" stroke="#14171f" stroke-width="3.6"/>
    <circle cx="-10" cy="0" r="6.2" fill="none" stroke="#8ff4ff" stroke-width="1.9"/>
    <circle cx="-10" cy="0" r="2.2" fill="#e8ffff"/>
    <circle cx="-10" cy="-17" r="4" fill="none" stroke="#6ce8ff" stroke-width="1.8"/>
    <circle cx="-10" cy="17" r="4" fill="none" stroke="#6ce8ff" stroke-width="1.8"/>

    <!-- MASSIVE FACETED SHOULDER MONOLITH BOULDERS -->
    <!-- Upper shoulder boulder -->
    <g>
      <polygon points="-14,-35 -1,-46 14,-39 16,-25 3,-19 -11,-24" fill="url(#bs-stone)" stroke="#14171f" stroke-width="2.2" stroke-linejoin="round"/>
      <polygon points="-11,-34 -1,-44 11,-38 2,-31 -8,-30" fill="url(#bs-stone-lit)" opacity="0.8"/>
      <!-- Moss patch tucked on shoulder ledge -->
      <path d="M -12 -32 C -8 -39, -1 -41, 2 -36 C -2 -32, -8 -29, -12 -32 Z" fill="url(#bs-moss)" stroke="#14171f" stroke-width="1.3"/>
      <circle cx="4" cy="-31" r="6" fill="url(#bs-rune-glow)"/>
      <circle cx="4" cy="-31" r="2.6" fill="#baf9ff" stroke="#14171f" stroke-width="1.2"/>
    </g>
    <!-- Lower shoulder boulder -->
    <g>
      <polygon points="-14,35 -1,46 14,39 16,25 3,19 -11,24" fill="url(#bs-stone)" stroke="#14171f" stroke-width="2.2" stroke-linejoin="round"/>
      <polygon points="-11,25 2,21 13,26 4,32 -8,31" fill="url(#bs-stone-lit)" opacity="0.6"/>
      <path d="M -11 33 C -7 39, 0 41, 3 36 C -1 32, -7 30, -11 33 Z" fill="url(#bs-moss)" stroke="#14171f" stroke-width="1.3"/>
      <circle cx="4" cy="31" r="6" fill="url(#bs-rune-glow)"/>
      <circle cx="4" cy="31" r="2.6" fill="#baf9ff" stroke="#14171f" stroke-width="1.2"/>
    </g>

    <!-- CARVED MONOLITHIC HEAD CREST with glowing cyan rune ring & eyes (+X) -->
    <g>
      <polygon points="2,-14 17,-12 26,0 17,12 2,14 -4,0" fill="url(#bs-stone)" stroke="#14171f" stroke-width="2.2" stroke-linejoin="round"/>
      <polygon points="3,-12 16,-10 22,-2 9,-2 0,-6" fill="url(#bs-stone-lit)" opacity="0.75"/>
      <!-- Glowing carved rune crest chevron -->
      <circle cx="11" cy="0" r="11" fill="url(#bs-rune-glow)" opacity="0.75"/>
      <path d="M 6 -9 L 15 0 L 6 9" fill="none" stroke="#14171f" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 6 -9 L 15 0 L 6 9" fill="none" stroke="#9cf6ff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="4" cy="0" r="3.2" fill="#dcffff" stroke="#14171f" stroke-width="1.4"/>
      <!-- Glowing cyan eye slits at front brow -->
      <path d="M 18 -6 L 23.5 -2.5 M 18 6 L 23.5 2.5" stroke="#14171f" stroke-width="4" stroke-linecap="round"/>
      <path d="M 18 -6 L 23.5 -2.5 M 18 6 L 23.5 2.5" stroke="#a8f9ff" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>
</svg>

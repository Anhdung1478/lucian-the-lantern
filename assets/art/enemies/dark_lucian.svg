<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- Dark Lucian, seen from above, facing +X: Lucian's own shape and pose (lucian_body.svg, drawn at 0.87 so his
       guns sit at y = -13 and +13), but black and violet: a black coat with a pale violet rim and violet seams,
       violet smoke trailing off its tails, shadowed skin, red eyes, and his two guns made dark, lit violet, with
       violet light at the muzzles. -->
  <defs>
    <linearGradient id="coat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#07050c"/>
      <stop offset="1" stop-color="#2a1a46"/>
    </linearGradient>
    <radialGradient id="muzzle">
      <stop offset="0" stop-color="#f6ecff"/>
      <stop offset="0.4" stop-color="#c08cff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#7a3fd0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="smoke">
      <stop offset="0" stop-color="#8a4fe0" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8a4fe0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eye">
      <stop offset="0" stop-color="#ff5a6a" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ff2a3c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g transform="translate(50 50) scale(0.87)">
    <!-- violet smoke off the coat's tails -->
    <ellipse cx="-44" cy="-20" rx="12" ry="10" fill="url(#smoke)"/>
    <ellipse cx="-44" cy="20" rx="12" ry="10" fill="url(#smoke)"/>
    <!-- long coat flaring out behind him, split in the middle -->
    <path d="M -4 -23 L -38 -33 Q -47 -16 -45 -3 L -16 -2 Z" fill="url(#coat)" stroke="#1a1d24" stroke-width="4" stroke-linejoin="round"/>
    <path d="M -4 23 L -38 33 Q -47 16 -45 3 L -16 2 Z" fill="url(#coat)" stroke="#1a1d24" stroke-width="4" stroke-linejoin="round"/>
    <path d="M -4 -23 L -38 -33 Q -47 -16 -45 -3 L -16 -2 Z M -4 23 L -38 33 Q -47 16 -45 3 L -16 2 Z" fill="none" stroke="#c9a8ff" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M -12 -20 L -36 -27 M -14 20 L -36 27" stroke="#8a4fe0" stroke-width="2.4" stroke-linecap="round" opacity="0.9"/>
    <path d="M -20 -12 L -40 -15 M -20 12 L -40 15" stroke="#3c2466" stroke-width="2.4" stroke-linecap="round"/>
    <!-- arms reaching forward -->
    <path d="M 0 -20 L 20 -15" stroke="#1a1d24" stroke-width="12" stroke-linecap="round"/>
    <path d="M 0 20 L 20 15" stroke="#1a1d24" stroke-width="12" stroke-linecap="round"/>
    <path d="M 0 -20 L 20 -15" stroke="#1a1426" stroke-width="8" stroke-linecap="round"/>
    <path d="M 0 20 L 20 15" stroke="#1a1426" stroke-width="8" stroke-linecap="round"/>
    <path d="M 4 -21.5 L 18 -18 M 4 21.5 L 18 18" stroke="#c9a8ff" stroke-width="2.3" stroke-linecap="round"/>
    <!-- his own relic pistol (left), made dark -->
    <path d="M 18 -19 L 42 -18 L 44 -15 L 42 -12 L 18 -11 Z" fill="#463a62" stroke="#1a1d24" stroke-width="2.3" stroke-linejoin="round"/>
    <path d="M 20 -19 L 42 -18 L 44 -15" fill="none" stroke="#c9a8ff" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M 26 -15 L 40 -15" stroke="#d6b4ff" stroke-width="2.4" stroke-linecap="round"/>
    <!-- Senna's relic gun (right), made dark: heavy stock, thick barrel, two violet rings, a muzzle cap -->
    <rect x="25" y="6.5" width="16" height="17" rx="5" fill="#b57cff" opacity="0.3"/>
    <path d="M 12 9 L 25 7.5 L 25 22.5 L 12 21 Q 8.5 15 12 9 Z" fill="#3a2f52" stroke="#1a1d24" stroke-width="2" stroke-linejoin="round"/>
    <rect x="24" y="10" width="19" height="10" rx="2" fill="#4c3f6c" stroke="#1a1d24" stroke-width="2"/>
    <rect x="27.5" y="7.5" width="3.8" height="15" rx="1.3" fill="#d6b4ff" stroke="#1a1d24" stroke-width="1.2"/>
    <rect x="35" y="7.5" width="3.8" height="15" rx="1.3" fill="#d6b4ff" stroke="#1a1d24" stroke-width="1.2"/>
    <path d="M 42 9 L 46 11.5 L 46 18.5 L 42 21 Z" fill="#3a2f52" stroke="#1a1d24" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- hands, gloved in shadow -->
    <circle cx="20" cy="-15" r="4.8" fill="#3a2a4c" stroke="#1a1d24" stroke-width="1.5"/>
    <circle cx="20" cy="15" r="4.8" fill="#3a2a4c" stroke="#1a1d24" stroke-width="1.5"/>
    <!-- violet muzzle light -->
    <circle cx="46" cy="-15" r="7.5" fill="url(#muzzle)"/>
    <circle cx="46" cy="15" r="7.5" fill="url(#muzzle)"/>
    <!-- shoulders and torso, a pale violet rim -->
    <ellipse cx="0" cy="0" rx="15" ry="26" fill="#120e1a" stroke="#1a1d24" stroke-width="4"/>
    <ellipse cx="0" cy="0" rx="15" ry="26" fill="none" stroke="#c9a8ff" stroke-width="2.3"/>
    <path d="M -10 -20 L -10 20" stroke="#3c2466" stroke-width="3"/>
    <!-- high collar -->
    <path d="M -7 -15 Q 6 0 -7 15" fill="none" stroke="#b57cff" stroke-width="2.8" stroke-linecap="round"/>
    <!-- head: shadowed skin, black hair, red eyes -->
    <circle cx="2" cy="0" r="11" fill="#2e2040"/>
    <circle cx="0" cy="0" r="9.5" fill="#07050b"/>
    <circle cx="9.5" cy="-4" r="4.5" fill="url(#eye)"/>
    <circle cx="9.5" cy="4" r="4.5" fill="url(#eye)"/>
    <path d="M 8 -5.5 L 11.5 -3.5 M 8 5.5 L 11.5 3.5" stroke="#ff4a5a" stroke-width="2.4" stroke-linecap="round"/>
  </g>
</svg>

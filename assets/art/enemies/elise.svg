<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!-- Elise, the Spider Queen, top-down facing +X: regal, lethal obsidian-and-crimson arachnid queen. Sleek sculpted
       glossy obsidian-and-crimson carapace with an ornate blood-ruby hourglass/crown marking on the abdomen, 8 long
       razor-sharp articulated armored arachnid legs splayed predatorily outward with dark crimson joints, gleaming
       venomous crimson fangs & glowing ruby multi-eye cluster at the front (+X). -->
  <defs>
    <linearGradient id="el_obsidian" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#443852"/>
      <stop offset="0.45" stop-color="#201929"/>
      <stop offset="1" stop-color="#0d0a12"/>
    </linearGradient>
    <linearGradient id="el_crimson" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5770"/>
      <stop offset="0.5" stop-color="#c41a34"/>
      <stop offset="1" stop-color="#690a1b"/>
    </linearGradient>
    <radialGradient id="el_ruby_glow">
      <stop offset="0" stop-color="#ff6680" stop-opacity="0.88"/>
      <stop offset="0.55" stop-color="#d61538" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#800820" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g transform="translate(48 48)">
    <!-- 8 LONG RAZOR-SHARP ARTICULATED ARMORED ARACHNID LEGS (upper 4 + mirrored lower 4) -->
    <!-- Leg Pair 1 (Front predatory sweeping +X/-Y) -->
    <g>
      <path d="M 10 -8 L 24 -28 L 43 -22 L 26 -22 L 13 -5 Z" fill="url(#el_obsidian)" stroke="#14171f" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M 24 -28 L 43 -22 L 32 -23 Z" fill="url(#el_crimson)" stroke="#14171f" stroke-width="1.2" stroke-linejoin="round"/>
      <circle cx="24" cy="-25" r="2.7" fill="#c41a34" stroke="#14171f" stroke-width="1.2"/>

      <!-- Leg Pair 2 (Mid-front splayed wide) -->
      <path d="M 4 -10 L 12 -34 L 27 -44 L 15 -31 L 7 -7 Z" fill="url(#el_obsidian)" stroke="#14171f" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M 12 -34 L 27 -44 L 17 -34 Z" fill="url(#el_crimson)" stroke="#14171f" stroke-width="1.2" stroke-linejoin="round"/>
      <circle cx="13" cy="-32" r="2.7" fill="#c41a34" stroke="#14171f" stroke-width="1.2"/>

      <!-- Leg Pair 3 (Mid-rear sweeping wide-back) -->
      <path d="M -2 -10 L -14 -34 L -29 -43 L -11 -31 L 1 -7 Z" fill="url(#el_obsidian)" stroke="#14171f" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M -14 -34 L -29 -43 L -16 -32 Z" fill="url(#el_crimson)" stroke="#14171f" stroke-width="1.2" stroke-linejoin="round"/>
      <circle cx="-13" cy="-32" r="2.6" fill="#c41a34" stroke="#14171f" stroke-width="1.2"/>

      <!-- Leg Pair 4 (Rear sweeping far back -X) -->
      <path d="M -7 -8 L -27 -27 L -45 -24 L -25 -22 L -5 -5 Z" fill="url(#el_obsidian)" stroke="#14171f" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M -27 -27 L -45 -24 L -29 -23 Z" fill="url(#el_crimson)" stroke="#14171f" stroke-width="1.2" stroke-linejoin="round"/>
      <circle cx="-26" cy="-24.5" r="2.6" fill="#c41a34" stroke="#14171f" stroke-width="1.2"/>
    </g>
    <!-- Mirrored lower 4 legs -->
    <g transform="scale(1 -1)">
      <path d="M 10 -8 L 24 -28 L 43 -22 L 26 -22 L 13 -5 Z" fill="url(#el_obsidian)" stroke="#14171f" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M 24 -28 L 43 -22 L 32 -23 Z" fill="url(#el_crimson)" stroke="#14171f" stroke-width="1.2" stroke-linejoin="round"/>
      <circle cx="24" cy="-25" r="2.7" fill="#c41a34" stroke="#14171f" stroke-width="1.2"/>

      <path d="M 4 -10 L 12 -34 L 27 -44 L 15 -31 L 7 -7 Z" fill="url(#el_obsidian)" stroke="#14171f" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M 12 -34 L 27 -44 L 17 -34 Z" fill="url(#el_crimson)" stroke="#14171f" stroke-width="1.2" stroke-linejoin="round"/>
      <circle cx="13" cy="-32" r="2.7" fill="#c41a34" stroke="#14171f" stroke-width="1.2"/>

      <path d="M -2 -10 L -14 -34 L -29 -43 L -11 -31 L 1 -7 Z" fill="url(#el_obsidian)" stroke="#14171f" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M -14 -34 L -29 -43 L -16 -32 Z" fill="url(#el_crimson)" stroke="#14171f" stroke-width="1.2" stroke-linejoin="round"/>
      <circle cx="-13" cy="-32" r="2.6" fill="#c41a34" stroke="#14171f" stroke-width="1.2"/>

      <path d="M -7 -8 L -27 -27 L -45 -24 L -25 -22 L -5 -5 Z" fill="url(#el_obsidian)" stroke="#14171f" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M -27 -27 L -45 -24 L -29 -23 Z" fill="url(#el_crimson)" stroke="#14171f" stroke-width="1.2" stroke-linejoin="round"/>
      <circle cx="-26" cy="-24.5" r="2.6" fill="#c41a34" stroke="#14171f" stroke-width="1.2"/>
    </g>

    <!-- sleek sculpted glossy obsidian-and-crimson spider abdomen (-X) -->
    <path d="M -4 -8 C -12 -18 -29 -18 -38 -8 C -42 -4 -44 0 -44 0 C -44 0 -42 4 -38 8 C -29 18 -12 18 -4 8 Q -1 0 -4 -8 Z" fill="url(#el_obsidian)" stroke="#14171f" stroke-width="2" stroke-linejoin="round"/>
    <!-- sculpted crimson armored flank plates & glossy obsidian highlight -->
    <path d="M -10 -12 C -19 -16 -30 -14 -36 -7" fill="none" stroke="#85709e" stroke-width="1.7" stroke-linecap="round"/>
    <path d="M -10 12 C -19 16 -30 14 -36 7" fill="none" stroke="#691224" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M -8 -10 Q -15 -14 -24 -12 L -19 -7 Q -12 -8 -8 -10 Z M -8 10 Q -15 14 -24 12 L -19 7 Q -12 8 -8 10 Z" fill="#9e142d" stroke="#14171f" stroke-width="1.1" stroke-linejoin="round"/>

    <!-- ornate blood-ruby hourglass / royal crown marking on abdomen -->
    <path d="M -35 -6 L -22 0 L -35 6 L -31 0 Z M -11 -5.5 L -22 0 L -11 5.5 L -15 0 Z" fill="url(#el_crimson)" stroke="#14171f" stroke-width="1.3" stroke-linejoin="round"/>
    <path d="M -25 -6 L -22 -2 L -19 -6 L -22 -10 Z M -25 6 L -22 2 L -19 6 L -22 10 Z" fill="#ff4766" stroke="#14171f" stroke-width="1" stroke-linejoin="round"/>
    <circle cx="-22" cy="0" r="2.2" fill="#ffd4dc"/>

    <!-- gleaming venomous crimson fangs & armored pedipalps at the front (+X) -->
    <!-- pedipalps flanking fangs -->
    <path d="M 18 -9 Q 29 -15 36 -8" fill="none" stroke="#14171f" stroke-width="4.4" stroke-linecap="round"/>
    <path d="M 18 -9 Q 29 -15 36 -8" fill="none" stroke="#362a42" stroke-width="2" stroke-linecap="round"/>
    <path d="M 18 9 Q 29 15 36 8" fill="none" stroke="#14171f" stroke-width="4.4" stroke-linecap="round"/>
    <path d="M 18 9 Q 29 15 36 8" fill="none" stroke="#362a42" stroke-width="2" stroke-linecap="round"/>
    <!-- razor-sharp curved venomous crimson fangs -->
    <path d="M 22 -7 Q 34 -9 42 -2 Q 33 -2 24 -1.5 Z" fill="url(#el_crimson)" stroke="#14171f" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M 22 7 Q 34 9 42 2 Q 33 2 24 1.5 Z" fill="url(#el_crimson)" stroke="#14171f" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M 28 -5.5 Q 35 -5.5 40 -2.5 M 28 5.5 Q 35 5.5 40 2.5" fill="none" stroke="#ffd4dc" stroke-width="1.2" stroke-linecap="round"/>

    <!-- sculpted obsidian-and-crimson cephalothorax with royal crown crest -->
    <path d="M -6 -6 C -1 -14 14 -14 23 -8 C 27 -4 27 4 23 8 C 14 14 -1 14 -6 6 Z" fill="url(#el_obsidian)" stroke="#14171f" stroke-width="2" stroke-linejoin="round"/>
    <!-- regal crimson spine-crown ridge -->
    <path d="M 13 -10 L 1 -15 L 7 -6 L -5 -8 L 4 0 L -5 8 L 7 6 L 1 15 L 13 10 L 15 0 Z" fill="url(#el_crimson)" stroke="#14171f" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M 4 -9 Q 12 -11 20 -6" fill="none" stroke="#8f78ab" stroke-width="1.5" stroke-linecap="round"/>

    <!-- glowing ruby multi-eye cluster at front carapace (+X) -->
    <circle cx="21" cy="0" r="8" fill="url(#el_ruby_glow)"/>
    <circle cx="22.5" cy="-3.2" r="2.1" fill="#ff3b5c" stroke="#14171f" stroke-width="0.9"/>
    <circle cx="22.5" cy="3.2" r="2.1" fill="#ff3b5c" stroke="#14171f" stroke-width="0.9"/>
    <circle cx="19.5" cy="-6.2" r="1.5" fill="#ff5775" stroke="#14171f" stroke-width="0.8"/>
    <circle cx="19.5" cy="6.2" r="1.5" fill="#ff5775" stroke="#14171f" stroke-width="0.8"/>
    <circle cx="17.5" cy="-2.2" r="1.2" fill="#ff758f"/>
    <circle cx="17.5" cy="2.2" r="1.2" fill="#ff758f"/>
    <circle cx="23" cy="-3.4" r="0.8" fill="#ffffff"/>
    <circle cx="23" cy="3.4" r="0.8" fill="#ffffff"/>
  </g>
</svg>

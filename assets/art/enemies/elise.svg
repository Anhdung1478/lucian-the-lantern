<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!-- Elise: a spider queen seen from above, a black and crimson carapace, a swollen abdomen marked with a red hourglass, eight long legs, pale eyes and fangs forward (+X). -->
  <g transform="translate(48 48)">
    <ellipse cx="-2" cy="4" rx="42" ry="40" fill="#000000" opacity="0.25"/>
    <!-- legs -->
    <path d="M 8 -10 L 26 -28 L 40 -34 M 2 -12 L 10 -36 L 6 -44 M -6 -12 L -22 -34 L -32 -38 M -10 -8 L -32 -16 L -44 -12 M 8 10 L 26 28 L 40 34 M 2 12 L 10 36 L 6 44 M -6 12 L -22 34 L -32 38 M -10 8 L -32 16 L -44 12" fill="none" stroke="#1a1d24" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 8 -10 L 26 -28 L 40 -34 M 2 -12 L 10 -36 L 6 -44 M -6 -12 L -22 -34 L -32 -38 M -10 -8 L -32 -16 L -44 -12 M 8 10 L 26 28 L 40 34 M 2 12 L 10 36 L 6 44 M -6 12 L -22 34 L -32 38 M -10 8 L -32 16 L -44 12" fill="none" stroke="#a3202d" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- abdomen -->
    <ellipse cx="-18" cy="0" rx="22" ry="17" fill="#201a22" stroke="#1a1d24" stroke-width="3"/>
    <path d="M -30 0 Q -18 -8 -6 0 Q -18 8 -30 0 Z" fill="#c4263a"/>
    <path d="M -22 -10 L -14 10 M -22 10 L -14 -10" stroke="#c4263a" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <!-- carapace -->
    <ellipse cx="6" cy="0" rx="17" ry="14" fill="#7b1626" stroke="#1a1d24" stroke-width="3"/>
    <path d="M -4 -8 Q 8 -12 16 -6 M -4 8 Q 8 12 16 6" fill="none" stroke="#1a1d24" stroke-width="2" stroke-linecap="round"/>
    <!-- head, eyes and fangs -->
    <ellipse cx="22" cy="0" rx="9" ry="8" fill="#201a22" stroke="#1a1d24" stroke-width="2.5"/>
    <g fill="#f4eaea" stroke="#1a1d24" stroke-width="1">
      <circle cx="26" cy="-4" r="2.2"/>
      <circle cx="26" cy="4" r="2.2"/>
      <circle cx="22" cy="-6" r="1.6"/>
      <circle cx="22" cy="6" r="1.6"/>
    </g>
    <path d="M 30 -3 L 38 -2 L 31 0 Z M 30 3 L 38 2 L 31 0 Z" fill="#e8e2d0" stroke="#1a1d24" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!-- Gromp: a fat green-purple toad seen from above, spotted back, bulging yellow eyes and a wide mouth forward (+X). -->
  <g transform="translate(48 48)">
    <ellipse cx="-2" cy="4" rx="42" ry="38" fill="#000000" opacity="0.25"/>
    <!-- back legs, folded -->
    <ellipse cx="-24" cy="-27" rx="14" ry="9" fill="#4f8a3e" stroke="#1a1d24" stroke-width="3"/>
    <ellipse cx="-24" cy="27" rx="14" ry="9" fill="#4f8a3e" stroke="#1a1d24" stroke-width="3"/>
    <path d="M -12 -33 L -6 -38 M -12 -31 L -4 -33 M -12 33 L -6 38 M -12 31 L -4 33" stroke="#1a1d24" stroke-width="3" stroke-linecap="round"/>
    <!-- front legs -->
    <ellipse cx="18" cy="-25" rx="7" ry="5" fill="#4f8a3e" stroke="#1a1d24" stroke-width="2.5"/>
    <ellipse cx="18" cy="25" rx="7" ry="5" fill="#4f8a3e" stroke="#1a1d24" stroke-width="2.5"/>
    <!-- fat body -->
    <ellipse cx="-4" cy="0" rx="34" ry="30" fill="#6aaa50" stroke="#1a1d24" stroke-width="3"/>
    <!-- purple back with spots -->
    <ellipse cx="-10" cy="0" rx="22" ry="19" fill="#7a52a6" stroke="#4e3270" stroke-width="2"/>
    <circle cx="-16" cy="-8" r="4" fill="#c49ae8"/>
    <circle cx="-4" cy="7" r="5" fill="#c49ae8"/>
    <circle cx="-20" cy="9" r="3" fill="#c49ae8"/>
    <circle cx="-6" cy="-10" r="2.5" fill="#c49ae8"/>
    <circle cx="10" cy="-18" r="3" fill="#3f7a34"/>
    <circle cx="8" cy="20" r="3.5" fill="#3f7a34"/>
    <circle cx="-30" cy="-2" r="2.5" fill="#3f7a34"/>
    <!-- wide mouth -->
    <path d="M 22 -20 Q 36 0 22 20" fill="none" stroke="#1a1d24" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 24 -14 Q 32 0 24 14" fill="none" stroke="#b5e08a" stroke-width="2" stroke-linecap="round"/>
    <!-- bulging eyes -->
    <circle cx="14" cy="-13" r="8" fill="#f2d24a" stroke="#1a1d24" stroke-width="3"/>
    <circle cx="14" cy="13" r="8" fill="#f2d24a" stroke="#1a1d24" stroke-width="3"/>
    <ellipse cx="16" cy="-13" rx="2" ry="5" fill="#1a1d24"/>
    <ellipse cx="16" cy="13" rx="2" ry="5" fill="#1a1d24"/>
  </g>
</svg>

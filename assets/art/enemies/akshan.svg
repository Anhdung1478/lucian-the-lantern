<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- Akshan: the rogue sentinel seen from above, scarf trailing behind, his boomerang-gun held forward (+X). -->
  <g transform="translate(50 50)">
    <ellipse cx="-2" cy="4" rx="38" ry="36" fill="#000000" opacity="0.25"/>
    <!-- scarf trailing behind -->
    <path d="M -20 -8 L -42 -14 L -34 -4 L -44 4 L -32 8 L -40 18 L -18 12 Z" fill="#b8453a" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- shoulders and coat -->
    <ellipse cx="-2" cy="0" rx="22" ry="30" fill="#3a3f4d" stroke="#1a1d24" stroke-width="3"/>
    <path d="M -14 -18 Q -18 0 -14 18" fill="none" stroke="#565d70" stroke-width="3" stroke-linecap="round"/>
    <!-- arms reaching forward -->
    <path d="M 4 -22 L 26 -8" stroke="#1a1d24" stroke-width="10" stroke-linecap="round"/>
    <path d="M 4 -22 L 26 -8" stroke="#5a4636" stroke-width="6" stroke-linecap="round"/>
    <path d="M 4 22 L 26 8" stroke="#1a1d24" stroke-width="10" stroke-linecap="round"/>
    <path d="M 4 22 L 26 8" stroke="#5a4636" stroke-width="6" stroke-linecap="round"/>
    <!-- the Avengerang -->
    <path d="M 24 -12 L 40 0 L 24 12 L 30 0 Z" fill="#ffe08a" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- head, hair and mask -->
    <circle cx="2" cy="0" r="12" fill="#d9a77a" stroke="#1a1d24" stroke-width="3"/>
    <path d="M -10 0 Q -8 -12 4 -12 Q -2 -2 4 12 Q -8 12 -10 0 Z" fill="#23262e" stroke="#1a1d24" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 6 -6 L 12 -4 L 12 4 L 6 6 Z" fill="#1a1d24"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- Akshan, the Rogue Sentinel, top-down facing +X: dramatic sweeping turquoise-and-gold Sentinel cape flowing
       asymmetrically over his left shoulder (-X), athletic shoulders with bronze/gold pauldrons, dark wavy hair with
       bandana, right arm (+Y) aiming his gleaming brass-and-ivory Absolver grappling pistol forward (+X), and left arm
       (-Y) wielding his coiled golden Avengerang grappling hook/boomerang crescent. -->
  <defs>
    <linearGradient id="ak_cape" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fa8b5"/>
      <stop offset="0.55" stop-color="#1e6f7d"/>
      <stop offset="1" stop-color="#11404c"/>
    </linearGradient>
    <linearGradient id="ak_gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4c2"/>
      <stop offset="0.45" stop-color="#e8b84b"/>
      <stop offset="1" stop-color="#9e6d1c"/>
    </linearGradient>
    <linearGradient id="ak_ivory" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf5"/>
      <stop offset="0.6" stop-color="#e8dfd0"/>
      <stop offset="1" stop-color="#b8aa94"/>
    </linearGradient>
    <linearGradient id="ak_hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3c2f2d"/>
      <stop offset="0.6" stop-color="#1b1518"/>
      <stop offset="1" stop-color="#0d0a0d"/>
    </linearGradient>
    <radialGradient id="ak_core">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#fff2a8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#5cf2e6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g transform="translate(50 50)">
    <!-- dramatic sweeping turquoise-and-gold Sentinel cape flowing asymmetrically over left shoulder (-X/-Y to +Y) -->
    <path d="M 4 -22 C -12 -32 -30 -38 -44 -32 C -38 -20 -46 -8 -44 6 C -38 14 -32 24 -22 25 C -12 24 -4 17 2 14 Z" fill="url(#ak_cape)" stroke="#14171f" stroke-width="2" stroke-linejoin="round"/>
    <!-- billowing cape folds -->
    <path d="M -4 -18 Q -22 -24 -40 -26 M -8 -6 Q -25 -9 -41 -6 M -10 6 Q -24 10 -36 10" fill="none" stroke="#0d323d" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M -2 -20 Q -18 -29 -37 -30 M -6 -12 Q -22 -17 -39 -16" fill="none" stroke="#64d2de" stroke-width="1.6" stroke-linecap="round"/>
    <!-- embossed gold Sentinel filigree trim along cape hem -->
    <path d="M -43 -31 C -37 -20 -44.5 -8 -42.5 5.5 C -37 13 -31 22.5 -22 23.5" fill="none" stroke="#f5d276" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M -38 -28 L -34 -24 L -38 -19 M -40 -4 L -35 0 L -39 5" fill="none" stroke="#f5d276" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- crimson-terracotta sash/bandana ribbon fluttering behind -->
    <path d="M -6 -4 Q -18 -6 -32 -14 L -27 -8 L -34 -2 Q -20 1 -6 2 Z" fill="#c94038" stroke="#14171f" stroke-width="1.7" stroke-linejoin="round"/>
    <path d="M -8 -3 Q -19 -5 -28 -11" fill="none" stroke="#f58a76" stroke-width="1.3" stroke-linecap="round"/>

    <!-- coiled golden grapple cable connecting waist to left boomerang/Absolver -->
    <path d="M 8 -14 Q 20 -26 26 -24 Q 16 -14 22 -4" fill="none" stroke="#14171f" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M 8 -14 Q 20 -26 26 -24 Q 16 -14 22 -4" fill="none" stroke="#f2cc68" stroke-width="1.6" stroke-linecap="round"/>

    <!-- left arm (-Y) extended forward-out holding the coiled golden Avengerang crescent boomerang -->
    <path d="M 1 -18 L 15 -24" stroke="#14171f" stroke-width="9.5" stroke-linecap="round"/>
    <path d="M 1 -18 L 15 -24" stroke="#c28357" stroke-width="6.2" stroke-linecap="round"/>
    <path d="M 10 -22 L 15 -24" stroke="#2c3b45" stroke-width="6.2" stroke-linecap="round"/>
    <!-- Avengerang golden grappling boomerang crescent (clearly visible at +X/-Y) -->
    <path d="M 12 -39 Q 28 -44 37 -32 Q 41 -22 33 -12 Q 33 -23 27 -29 Q 20 -35 12 -39 Z" fill="url(#ak_gold)" stroke="#14171f" stroke-width="1.9" stroke-linejoin="round"/>
    <path d="M 17 -38 Q 29 -41 35 -31 Q 38 -23 34 -16" fill="none" stroke="#fffbe0" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 27 -33 L 33 -28" stroke="#85f7ed" stroke-width="2" stroke-linecap="round"/>
    <!-- coiled golden grapple hook ring on left wrist -->
    <circle cx="17" cy="-24" r="3.8" fill="#c28357" stroke="#14171f" stroke-width="1.5"/>
    <circle cx="22" cy="-26" r="4.2" fill="none" stroke="#f5d276" stroke-width="1.8"/>

    <!-- right arm (+Y) aiming the gleaming brass-and-ivory Absolver grappling pistol forward (+X) -->
    <path d="M 1 18 L 17 14" stroke="#14171f" stroke-width="9.5" stroke-linecap="round"/>
    <path d="M 1 18 L 17 14" stroke="#c28357" stroke-width="6.2" stroke-linecap="round"/>
    <path d="M 11 15.5 L 16.5 14" stroke="#2c3b45" stroke-width="6.2" stroke-linecap="round"/>

    <!-- Absolver grappling pistol (ivory & burnished brass/gold, cable reel, 3-prong hook nozzle) -->
    <circle cx="38" cy="14" r="7.5" fill="url(#ak_core)" opacity="0.65"/>
    <!-- side cable reel -->
    <circle cx="24" cy="22.5" r="5" fill="#4f3d2d" stroke="#14171f" stroke-width="1.7"/>
    <circle cx="24" cy="22.5" r="2.6" fill="url(#ak_gold)" stroke="#14171f" stroke-width="1"/>
    <!-- Absolver chassis -->
    <path d="M 14 8.5 L 35 9.2 L 40 14 L 35 18.8 L 14 19.5 Q 10.5 14 14 8.5 Z" fill="url(#ak_ivory)" stroke="#14171f" stroke-width="1.9" stroke-linejoin="round"/>
    <path d="M 16 9 L 34 9.5 L 36 12 L 16 12 Z" fill="url(#ak_gold)" stroke="#14171f" stroke-width="1.1" stroke-linejoin="round"/>
    <path d="M 16 16 L 36 16 L 34 18.5 L 16 19 Z" fill="url(#ak_gold)" stroke="#14171f" stroke-width="1.1" stroke-linejoin="round"/>
    <!-- glowing relic core channel -->
    <path d="M 20 14 L 34 14" stroke="#fff9c9" stroke-width="2.2" stroke-linecap="round"/>
    <!-- 3-prong gleaming silver-gold grappling hook muzzle -->
    <path d="M 39 14 L 44.5 7.5 M 40 14 L 47 14 M 39 14 L 44.5 20.5" stroke="#14171f" stroke-width="4.4" stroke-linecap="round"/>
    <path d="M 39 14 L 44.5 7.5 M 40 14 L 47 14 M 39 14 L 44.5 20.5" stroke="#f5f8fc" stroke-width="2" stroke-linecap="round"/>
    <circle cx="17.5" cy="14" r="3.8" fill="#c28357" stroke="#14171f" stroke-width="1.5"/>

    <!-- athletic torso & Sentinel harness -->
    <path d="M -9 -17 Q -2 -23 6 -20 Q 12 -16 12 0 Q 12 16 6 20 Q -2 23 -9 17 Q -13 9 -13 0 Q -13 -9 -9 -17 Z" fill="#214d59" stroke="#14171f" stroke-width="2" stroke-linejoin="round"/>
    <!-- ivory Sentinel vest trim & leather bandolier -->
    <path d="M -6 -15 L 6 15" stroke="#14171f" stroke-width="4.8" stroke-linecap="round"/>
    <path d="M -6 -15 L 6 15" stroke="#8c5a36" stroke-width="2.4" stroke-linecap="round"/>
    <rect x="-2" y="-3" width="4.5" height="6" rx="1" fill="url(#ak_gold)" stroke="#14171f" stroke-width="1"/>

    <!-- bronze & gold Sentinel pauldrons -->
    <!-- ornate larger left Sentinel pauldron (-Y) -->
    <path d="M -11 -15 Q -4 -26 8 -23 L 12 -15 Q 5 -12 -3 -12 Q -8 -12 -11 -15 Z" fill="url(#ak_gold)" stroke="#14171f" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M -8 -17 Q -1 -23 7 -20.5" fill="none" stroke="#fffbe0" stroke-width="1.5" stroke-linecap="round"/>
    <!-- agile right bronze guard (+Y) -->
    <path d="M -9 15 Q -2 24 8 21 L 11 14 Q 4 12 -3 12 Z" fill="url(#ak_gold)" stroke="#14171f" stroke-width="1.8" stroke-linejoin="round"/>

    <!-- head: tanned brow/nose facing +X, dark wavy hair & crimson-gold bandana -->
    <circle cx="3" cy="0" r="9.5" fill="#c28357" stroke="#14171f" stroke-width="1.8"/>
    <path d="M 11.8 -1.8 Q 14.2 0 11.8 1.8 Z" fill="#ad7148" stroke="#14171f" stroke-width="0.9" stroke-linejoin="round"/>
    <!-- crimson-gold bandana wrapping forehead -->
    <path d="M 6 -8.6 Q 10.5 -4.5 10.5 0 Q 10.5 4.5 6 8.6 L 3.5 7.5 Q 7.5 4 7.5 0 Q 7.5 -4 3.5 -7.5 Z" fill="#c94038" stroke="#14171f" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M 6.8 -6 Q 9 0 6.8 6" fill="none" stroke="#f5d276" stroke-width="1.2" stroke-linecap="round"/>
    <!-- windswept dark wavy hair -->
    <path d="M 5.5 -8.5 Q -1 -11.5 -8 -7.5 L -12 -4 L -9.5 0 L -12.5 4.5 L -7.5 8 Q -1 11.5 5.5 8.5 Q 8 4 8 0 Q 8 -4 5.5 -8.5 Z" fill="url(#ak_hair)" stroke="#14171f" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M -6 -5 Q -1 -8 4 -5.5 M -7 1 Q -2 -1 4 0 M -5 6 Q 0 7.5 4 5.5" fill="none" stroke="#524240" stroke-width="1.4" stroke-linecap="round"/>
  </g>
</svg>

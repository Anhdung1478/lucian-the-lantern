<svg xmlns="http://www.w3.org/2000/svg" width="150" height="150" viewBox="0 0 150 150">
  <!-- Infernal Drake: an orange-red drake seen from above, wings spread wide, lava glowing through cracks in its hide, head forward (+X). -->
  <g transform="translate(75 75)">
    <ellipse cx="-4" cy="4" rx="58" ry="62" fill="#000000" opacity="0.22"/>
    <!-- wings, spread -->
    <g stroke="#1a1d24" stroke-width="3" stroke-linejoin="round">
      <path d="M 8 -15 Q 28 -44 -2 -71 Q -10 -57 -24 -60 Q -26 -47 -40 -42 Q -32 -30 -22 -13 Z" fill="#c9482a"/>
      <path d="M 8 15 Q 28 44 -2 71 Q -10 57 -24 60 Q -26 47 -40 42 Q -32 30 -22 13 Z" fill="#c9482a"/>
    </g>
    <path d="M 2 -20 Q 6 -44 -8 -58 Q -16 -50 -26 -50 Q -26 -38 -32 -36 Q -24 -26 -18 -18 Z" fill="#8f2c16" opacity="0.55"/>
    <path d="M 2 20 Q 6 44 -8 58 Q -16 50 -26 50 Q -26 38 -32 36 Q -24 26 -18 18 Z" fill="#8f2c16" opacity="0.55"/>
    <!-- wing bones -->
    <path d="M 6 -15 L -2 -70 M 6 -15 L -24 -59 M 6 -15 L -39 -42 M 6 15 L -2 70 M 6 15 L -24 59 M 6 15 L -39 42" stroke="#1a1d24" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M 6 -15 L -2 -70 M 6 -15 L -24 -59 M 6 -15 L -39 -42 M 6 15 L -2 70 M 6 15 L -24 59 M 6 15 L -39 42" stroke="#6e2212" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- lava cracks in the wings -->
    <path d="M -4 -26 L -10 -36 L -6 -44 L -14 -52 M -18 -30 L -26 -38 M -4 26 L -10 36 L -6 44 L -14 52 M -18 30 L -26 38" stroke="#ff7a2a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.6"/>
    <path d="M -4 -26 L -10 -36 L -6 -44 L -14 -52 M -18 -30 L -26 -38 M -4 26 L -10 36 L -6 44 L -14 52 M -18 30 L -26 38" stroke="#ffd04a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- tail with a spade tip -->
    <path d="M -24 -9 Q -48 -6 -62 0 Q -48 6 -24 9 Z" fill="#b83c22" stroke="#1a1d24" stroke-width="3" stroke-linejoin="round"/>
    <path d="M -58 0 L -68 -9 L -74 0 L -68 9 Z" fill="#8f2c16" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- body -->
    <ellipse cx="-6" cy="0" rx="30" ry="19" fill="#c2401f" stroke="#1a1d24" stroke-width="3"/>
    <ellipse cx="-8" cy="0" rx="20" ry="11" fill="#9c3219"/>
    <!-- lava cracks in the hide -->
    <path d="M -28 -5 L -20 -2 L -14 -9 L -6 -4 L 2 -10 L 10 -6 M -26 7 L -16 4 L -10 11 L -2 6 L 8 9" stroke="#ff7a2a" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.6"/>
    <path d="M -28 -5 L -20 -2 L -14 -9 L -6 -4 L 2 -10 L 10 -6 M -26 7 L -16 4 L -10 11 L -2 6 L 8 9" stroke="#ffd04a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- spines down the back -->
    <g fill="#3a1a12" stroke="#1a1d24" stroke-width="1.5" stroke-linejoin="round">
      <path d="M -30 -3 L -40 0 L -30 3 Z"/>
      <path d="M -18 -3 L -27 0 L -18 3 Z"/>
      <path d="M -6 -3 L -15 0 L -6 3 Z"/>
      <path d="M 6 -3 L -3 0 L 6 3 Z"/>
    </g>
    <!-- neck and head -->
    <path d="M 14 -9 L 34 -7 L 34 7 L 14 9 Z" fill="#c2401f" stroke="#1a1d24" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 36 -9 L 22 -20 L 31 -5 Z M 36 9 L 22 20 L 31 5 Z" fill="#3a1a12" stroke="#1a1d24" stroke-width="2" stroke-linejoin="round"/>
    <ellipse cx="42" cy="0" rx="14" ry="11" fill="#d24a24" stroke="#1a1d24" stroke-width="3"/>
    <path d="M 50 -7 Q 62 -5 66 0 Q 62 5 50 7 Z" fill="#d24a24" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 38 0 L 48 0" stroke="#ff7a2a" stroke-width="2" stroke-linecap="round"/>
    <circle cx="46" cy="-6" r="2.4" fill="#ffe14a"/>
    <circle cx="46" cy="6" r="2.4" fill="#ffe14a"/>
    <circle cx="62" cy="-2.5" r="1.2" fill="#1a1d24"/>
    <circle cx="62" cy="2.5" r="1.2" fill="#1a1d24"/>
  </g>
</svg>

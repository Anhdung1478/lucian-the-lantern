  <!-- Infernal Drake, seen from above, head forward (+X): a red-orange drake with its wings spread, lava glowing
       through cracks in its hide and wings, flames streaming back along its spine, dark horns swept back, embers at
       its jaws and a burning spade at the tip of its tail. -->

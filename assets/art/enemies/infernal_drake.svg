      <stop offset="0" stop-color="#c2401f"/>
      <stop offset="1" stop-color="#e05a2a"/>
    </linearGradient>
    <linearGradient id="hide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d24a24"/>
      <stop offset="0.5" stop-color="#b23a1c"/>
      <stop offset="1" stop-color="#d24a24"/>
    </linearGradient>
    <radialGradient id="ember">
      <stop offset="0" stop-color="#fff2a0"/>
      <stop offset="0.5" stop-color="#ffb43a" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ff5a1a" stop-opacity="0"/>
    </radialGradient>
  </defs>

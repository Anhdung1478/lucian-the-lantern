    <path d="M 8 0 Q -10 -2 -44 0" fill="none" stroke="#3fb5b0" stroke-width="2" stroke-linecap="round"/>
    <!-- neck and head, gill fans and barbels -->
    <path d="M 12 -10 Q 26 -9 38 -8 L 38 8 Q 26 9 12 10 Z" fill="url(#hide)" stroke="#1a1d24" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 40 -9 Q 30 -24 18 -22 Q 22 -18 20 -15 Q 26 -15 26 -11 Q 32 -12 34 -6 Z" fill="#7ee0d8" stroke="#1a1d24" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 36 -9 Q 29 -19 21 -19" fill="none" stroke="#e8fbff" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <path d="M 62 -4 Q 56 -14 44 -18 Q 34 -22 26 -30" fill="none" stroke="#1a1d24" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 62 -4 Q 56 -14 44 -18 Q 34 -22 26 -30" fill="none" stroke="#bff6f0" stroke-width="2" stroke-linecap="round"/>
    <g transform="scale(1 -1)">
    <path d="M 40 -9 Q 30 -24 18 -22 Q 22 -18 20 -15 Q 26 -15 26 -11 Q 32 -12 34 -6 Z" fill="#7ee0d8" stroke="#1a1d24" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 36 -9 Q 29 -19 21 -19" fill="none" stroke="#e8fbff" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <path d="M 62 -4 Q 56 -14 44 -18 Q 34 -22 26 -30" fill="none" stroke="#1a1d24" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 62 -4 Q 56 -14 44 -18 Q 34 -22 26 -30" fill="none" stroke="#bff6f0" stroke-width="2" stroke-linecap="round"/>
    </g>
    <path d="M 34 -10 Q 46 -14 56 -8 Q 66 -5 66 0 Q 66 5 56 8 Q 46 14 34 10 Z" fill="#35aaa6" stroke="#1a1d24" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 38 -7 Q 48 -10 58 -5" fill="none" stroke="#9ff0e8" stroke-width="2" stroke-linecap="round"/>
    <path d="M 38 0 Q 48 -2 56 0" fill="none" stroke="#1b6b6e" stroke-width="2" stroke-linecap="round"/>
    <circle cx="48" cy="-6.5" r="2.8" fill="#e8fbff" stroke="#1a1d24" stroke-width="1.5"/>
    <circle cx="48" cy="6.5" r="2.8" fill="#e8fbff" stroke="#1a1d24" stroke-width="1.5"/>
    <circle cx="62" cy="-2.5" r="1.3" fill="#1a1d24"/>
    <circle cx="62" cy="2.5" r="1.3" fill="#1a1d24"/>
    <!-- water drops -->
    <g fill="#bff0ff" stroke="#1a1d24" stroke-width="1.5" stroke-linejoin="round">
      <path d="M 34 -38 Q 39 -31 34 -28 Q 29 -31 34 -38 Z"/>
      <path d="M 38 34 Q 43 41 38 44 Q 33 41 38 34 Z"/>

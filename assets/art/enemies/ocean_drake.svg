<svg xmlns="http://www.w3.org/2000/svg" width="150" height="150" viewBox="0 0 150 150">
  <!-- Ocean Drake, regal abyssal sea-dragon, top-down facing +X: sleek elongated horned aquatic dragon head with
       luminous teal barbels & gill crests, translucent iridescent ribbed fin-wings with layered cyan-emerald veining,
       and a graceful flowing finned tail. (No static raindrop stickers!) -->
  <defs>
    <linearGradient id="od_fin" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#14636e"/>
      <stop offset="0.38" stop-color="#28a8a8"/>
      <stop offset="0.72" stop-color="#6ee8d8"/>
      <stop offset="1" stop-color="#c9fff7"/>
    </linearGradient>
    <linearGradient id="od_hide" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0" stop-color="#48c4be"/>
      <stop offset="0.48" stop-color="#1f8587"/>
      <stop offset="1" stop-color="#125059"/>
    </linearGradient>
    <linearGradient id="od_crest" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#e8fffd"/>
      <stop offset="0.55" stop-color="#7ef2e2"/>
      <stop offset="1" stop-color="#279c99"/>
    </linearGradient>
    <radialGradient id="od_glow">
      <stop offset="0" stop-color="#eafffd" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#6ef5e3" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#1ca3a8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g transform="translate(75 75)">
    <!-- graceful flowing finned aquatic tail & sweeping abyssal fluke (-X) -->
    <path d="M -22 -9 Q -42 -10 -58 -3 L -58 3 Q -42 10 -22 9 Z" fill="url(#od_hide)" stroke="#14171f" stroke-width="2" stroke-linejoin="round"/>
    <!-- sweeping crescent abyssal tail fluke -->
    <path d="M -52 0 Q -60 -9 -64 -24 Q -73 -17 -72 -5 Q -66 0 -72 5 Q -73 17 -64 24 Q -60 9 -52 0 Z" fill="url(#od_fin)" stroke="#14171f" stroke-width="1.9" stroke-linejoin="round"/>
    <path d="M -55 -2 Q -62 -10 -64 -19 M -55 2 Q -62 10 -64 19 M -57 -1 L -68 -6 M -57 1 L -68 6" fill="none" stroke="#cffffa" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M -27 -5 Q -41 -4.5 -53 -1.5 M -27 5 Q -41 4.5 -53 1.5" fill="none" stroke="#7ef2e2" stroke-width="1.4" stroke-linecap="round"/>

    <!-- webbed aquatic hind flippers -->
    <g>
      <path d="M -18 -12 L -26 -24" stroke="#14171f" stroke-width="8" stroke-linecap="round"/>
      <path d="M -18 -12 L -26 -24" stroke="#259696" stroke-width="4.6" stroke-linecap="round"/>
      <path d="M -26 -24 Q -36 -27 -34 -33 Q -27 -32 -25 -24 Z" fill="#82f2e4" stroke="#14171f" stroke-width="1.6" stroke-linejoin="round"/>
    </g>
    <g transform="scale(1 -1)">
      <path d="M -18 -12 L -26 -24" stroke="#14171f" stroke-width="8" stroke-linecap="round"/>
      <path d="M -18 -12 L -26 -24" stroke="#1d7a7d" stroke-width="4.6" stroke-linecap="round"/>
      <path d="M -26 -24 Q -36 -27 -34 -33 Q -27 -32 -25 -24 Z" fill="#6ad9cc" stroke="#14171f" stroke-width="1.6" stroke-linejoin="round"/>
    </g>

    <!-- TRANSLUCENT IRIDESCENT RIBBED FIN-WINGS WITH LAYERED CYAN-EMERALD VEINING -->
    <g>
      <path d="M 7 -13 Q 25 -38 17 -61 Q 9 -58 3 -70 Q -5 -62 -14 -70 Q -19 -60 -30 -63 Q -31 -51 -41 -49 Q -37 -38 -45 -33 Q -36 -25 -38 -20 Q -26 -17 -16 -12 Z" fill="url(#od_fin)" stroke="#14171f" stroke-width="2" stroke-linejoin="round"/>
      <!-- deep abyssal translucent inner membrane layer -->
      <path d="M 3 -18 Q 14 -36 10 -52 Q -12 -62 -32 -47 Q -36 -30 -14 -16 Z" fill="#126870" opacity="0.42"/>
      <!-- delicate curved dark-teal fin spines / ribs -->
      <path d="M 1 -15 Q 6 -40 3 -66 M 0 -15 Q -5 -40 -13 -66 M -2 -15 Q -14 -38 -28 -59 M -4 -15 Q -20 -34 -38 -46 M -6 -15 Q -25 -28 -41 -32 M -8 -14 Q -24 -20 -35 -20" fill="none" stroke="#105761" stroke-width="1.9" stroke-linecap="round"/>
      <!-- luminous iridescent cyan-emerald veining & seafoam scalloped highlights -->
      <path d="M 6 -28 Q -4 -36 -12 -32 Q -22 -36 -30 -28 M 10 -46 Q -4 -52 -18 -47 Q -28 -48 -36 -40" fill="none" stroke="#9effef" stroke-width="1.5" stroke-linecap="round" opacity="0.82"/>
      <path d="M 4 -67 Q -3 -61 -12 -67 M -16 -66 Q -21 -58 -28 -61 M -32 -59 Q -33 -49 -39 -48" fill="none" stroke="#f0fffe" stroke-width="1.6" stroke-linecap="round" opacity="0.9"/>
      <!-- leading wing bone ridge -->
      <path d="M 7 -13 Q 25 -38 17 -61" fill="none" stroke="#14171f" stroke-width="6.2" stroke-linecap="round"/>
      <path d="M 7 -13 Q 25 -38 17 -61" fill="none" stroke="#2ca8a4" stroke-width="3.4" stroke-linecap="round"/>
      <path d="M 10 -19 Q 21 -36 17 -54" fill="none" stroke="#c9fff7" stroke-width="1.6" stroke-linecap="round"/>
    </g>
    <g transform="scale(1 -1)">
      <path d="M 7 -13 Q 25 -38 17 -61 Q 9 -58 3 -70 Q -5 -62 -14 -70 Q -19 -60 -30 -63 Q -31 -51 -41 -49 Q -37 -38 -45 -33 Q -36 -25 -38 -20 Q -26 -17 -16 -12 Z" fill="url(#od_fin)" stroke="#14171f" stroke-width="2" stroke-linejoin="round"/>
      <path d="M 3 -18 Q 14 -36 10 -52 Q -12 -62 -32 -47 Q -36 -30 -14 -16 Z" fill="#126870" opacity="0.42"/>
      <path d="M 1 -15 Q 6 -40 3 -66 M 0 -15 Q -5 -40 -13 -66 M -2 -15 Q -14 -38 -28 -59 M -4 -15 Q -20 -34 -38 -46 M -6 -15 Q -25 -28 -41 -32 M -8 -14 Q -24 -20 -35 -20" fill="none" stroke="#105761" stroke-width="1.9" stroke-linecap="round"/>
      <path d="M 6 -28 Q -4 -36 -12 -32 Q -22 -36 -30 -28 M 10 -46 Q -4 -52 -18 -47 Q -28 -48 -36 -40" fill="none" stroke="#9effef" stroke-width="1.5" stroke-linecap="round" opacity="0.82"/>
      <path d="M 4 -67 Q -3 -61 -12 -67 M -16 -66 Q -21 -58 -28 -61 M -32 -59 Q -33 -49 -39 -48" fill="none" stroke="#f0fffe" stroke-width="1.6" stroke-linecap="round" opacity="0.9"/>
      <path d="M 7 -13 Q 25 -38 17 -61" fill="none" stroke="#14171f" stroke-width="6.2" stroke-linecap="round"/>
      <path d="M 7 -13 Q 25 -38 17 -61" fill="none" stroke="#228c8c" stroke-width="3.4" stroke-linecap="round"/>
    </g>

    <!-- webbed fore flippers -->
    <g>
      <path d="M 13 -10 L 23 -20" stroke="#14171f" stroke-width="7.5" stroke-linecap="round"/>
      <path d="M 13 -10 L 23 -20" stroke="#2da6a4" stroke-width="4.2" stroke-linecap="round"/>
      <path d="M 23 -20 Q 32 -21 31 -27 Q 25 -27 23 -20 Z" fill="#82f2e4" stroke="#14171f" stroke-width="1.6" stroke-linejoin="round"/>
    </g>
    <g transform="scale(1 -1)">
      <path d="M 13 -10 L 23 -20" stroke="#14171f" stroke-width="7.5" stroke-linecap="round"/>
      <path d="M 13 -10 L 23 -20" stroke="#228a8a" stroke-width="4.2" stroke-linecap="round"/>
      <path d="M 23 -20 Q 32 -21 31 -27 Q 25 -27 23 -20 Z" fill="#6ad9cc" stroke="#14171f" stroke-width="1.6" stroke-linejoin="round"/>
    </g>

    <!-- sleek abyssal scaled body -->
    <ellipse cx="-4" cy="0" rx="29" ry="17" fill="url(#od_hide)" stroke="#14171f" stroke-width="2"/>
    <path d="M -25 -9 Q -21 -5 -17 -9 Q -13 -5 -9 -9 Q -5 -5 -1 -9 Q 3 -5 7 -9 M -25 9 Q -21 5 -17 9 Q -13 5 -9 9 Q -5 5 -1 9 Q 3 5 7 9" stroke="#8ff7eb" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.85"/>
    <path d="M -22 -12 Q -6 -16 11 -12" fill="none" stroke="#c9fff7" stroke-width="1.5" stroke-linecap="round" opacity="0.78"/>

    <!-- flowing luminous pearlescent dorsal crest-fin down back and tail -->
    <path d="M 17 0 Q 6 -6 -7 -4 Q -20 -7 -33 -3 Q -45 -4.5 -54 0 Q -45 4.5 -33 3 Q -20 7 -7 4 Q 6 6 17 0 Z" fill="url(#od_crest)" stroke="#14171f" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M 11 0 Q -12 -1.5 -48 0" fill="none" stroke="#1e8285" stroke-width="1.5" stroke-linecap="round"/>

    <!-- sleek elongated neck & horned aquatic sea-dragon head (+X) -->
    <path d="M 12 -9.5 Q 27 -8.5 40 -7 L 40 7 Q 27 8.5 12 9.5 Z" fill="url(#od_hide)" stroke="#14171f" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 18 -4 L 24 0 L 18 4 M 28 -4 L 34 0 L 28 4" fill="none" stroke="#9effef" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- sweeping aquatic horns, gill-crest fans & long luminous teal barbels -->
    <g>
      <!-- gill-crest fan -->
      <path d="M 41 -8 Q 31 -25 16 -24 Q 21 -19 18 -15 Q 25 -15 25 -11 Q 32 -11 35 -5 Z" fill="url(#od_crest)" stroke="#14171f" stroke-width="1.7" stroke-linejoin="round"/>
      <path d="M 38 -8 Q 29 -19 20 -20" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" opacity="0.88"/>
      <!-- sleek swept sea-dragon horn -->
      <path d="M 48 -8 Q 39 -19 26 -24 Q 35 -14 41 -5 Z" fill="#186e75" stroke="#14171f" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M 45 -8 Q 38 -15 30 -19" fill="none" stroke="#b8fff6" stroke-width="1.2" stroke-linecap="round"/>
      <!-- long sinuous luminous teal barbel streaming smoothly back from snout -->
      <path d="M 65 -3.5 Q 58 -15 44 -19 Q 32 -23 23 -32" fill="none" stroke="#14171f" stroke-width="4" stroke-linecap="round"/>
      <path d="M 65 -3.5 Q 58 -15 44 -19 Q 32 -23 23 -32" fill="none" stroke="#a6fff5" stroke-width="1.9" stroke-linecap="round"/>
    </g>
    <g transform="scale(1 -1)">
      <path d="M 41 -8 Q 31 -25 16 -24 Q 21 -19 18 -15 Q 25 -15 25 -11 Q 32 -11 35 -5 Z" fill="url(#od_crest)" stroke="#14171f" stroke-width="1.7" stroke-linejoin="round"/>
      <path d="M 38 -8 Q 29 -19 20 -20" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" opacity="0.88"/>
      <path d="M 48 -8 Q 39 -19 26 -24 Q 35 -14 41 -5 Z" fill="#186e75" stroke="#14171f" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M 65 -3.5 Q 58 -15 44 -19 Q 32 -23 23 -32" fill="none" stroke="#14171f" stroke-width="4" stroke-linecap="round"/>
      <path d="M 65 -3.5 Q 58 -15 44 -19 Q 32 -23 23 -32" fill="none" stroke="#8ef2e8" stroke-width="1.9" stroke-linecap="round"/>
    </g>

    <!-- sleek elongated aquatic sea-dragon snout -->
    <path d="M 35 -9.5 Q 47 -13 58 -7.5 L 69 -3.2 Q 72 0 69 3.2 L 58 7.5 Q 47 13 35 9.5 Z" fill="url(#od_hide)" stroke="#14171f" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 39 -6.5 Q 49 -9.5 60 -4.8" fill="none" stroke="#c9fff7" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 40 0 L 63 0" fill="none" stroke="#104e54" stroke-width="1.6" stroke-linecap="round"/>
    <!-- luminous aquamarine eyes -->
    <circle cx="50" cy="-6.2" r="4.8" fill="url(#od_glow)"/>
    <circle cx="50" cy="6.2" r="4.8" fill="url(#od_glow)"/>
    <path d="M 46 -7.8 L 54 -5.8 L 47.5 -4.2 Z M 46 7.8 L 54 5.8 L 47.5 4.2 Z" fill="#f0fffe" stroke="#14171f" stroke-width="1.2" stroke-linejoin="round"/>
    <circle cx="65" cy="-2.2" r="1.2" fill="#14171f"/>
    <circle cx="65" cy="2.2" r="1.2" fill="#14171f"/>
  </g>
</svg>

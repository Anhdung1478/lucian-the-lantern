    <path d="M -4 -66 Q -6 -58 -4 -50 M -18 -64 Q -18 -56 -14 -50 M -31 -56 Q -28 -48 -24 -44" fill="none" stroke="#e8fbff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <path d="M 6 -13 Q 22 -38 14 -58" fill="none" stroke="#1a1d24" stroke-width="7" stroke-linecap="round"/>
    <path d="M 6 -13 Q 22 -38 14 -58" fill="none" stroke="#2a9d9a" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 9 -20 Q 18 -36 15 -50" fill="none" stroke="#9ff0e8" stroke-width="2" stroke-linecap="round"/>
    </g>
    <path d="M 12 -10 L 22 -19" stroke="#1a1d24" stroke-width="8.5" stroke-linecap="round"/>
    <path d="M 12 -10 L 22 -19" stroke="#2fa8a4" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 22 -19 Q 30 -20 30 -25 Q 24 -26 22 -19 Z" fill="#7ee0d8" stroke="#1a1d24" stroke-width="2" stroke-linejoin="round"/>
    <g transform="scale(1 -1)">
    <path d="M 12 -10 L 22 -19" stroke="#1a1d24" stroke-width="8.5" stroke-linecap="round"/>
    <path d="M 12 -10 L 22 -19" stroke="#2fa8a4" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 22 -19 Q 30 -20 30 -25 Q 24 -26 22 -19 Z" fill="#7ee0d8" stroke="#1a1d24" stroke-width="2" stroke-linejoin="round"/>
    </g>
    <!-- body, pale scales down its flanks -->
    <ellipse cx="-4" cy="0" rx="28" ry="17" fill="url(#hide)" stroke="#1a1d24" stroke-width="3"/>
    <path d="M -24 -9 Q -20 -5 -16 -9 Q -12 -5 -8 -9 Q -4 -5 0 -9 Q 4 -5 8 -9 M -24 9 Q -20 5 -16 9 Q -12 5 -8 9 Q -4 5 0 9 Q 4 5 8 9" stroke="#8fe8e0" stroke-width="2" stroke-linecap="round" fill="none"/>

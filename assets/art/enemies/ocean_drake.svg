<svg xmlns="http://www.w3.org/2000/svg" width="150" height="150" viewBox="0 0 150 150">
  <!-- Ocean Drake, seen from above, head forward (+X): a teal sea drake whose wings are wide ribbed fins, clear at
       their scalloped edges, a pale frill running down its back, gill fans and long barbels flowing back from its
       head, a whale's fluke for a tail, and drops of water falling round it. -->
  <defs>
    <linearGradient id="fin" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2fa8a4"/>
      <stop offset="0.6" stop-color="#4cc8c0"/>
      <stop offset="1" stop-color="#9ff0e8"/>
    </linearGradient>
    <linearGradient id="hide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#36b0ac"/>
      <stop offset="0.5" stop-color="#1f8582"/>
      <stop offset="1" stop-color="#36b0ac"/>
    </linearGradient>
  </defs>
  <g transform="translate(75 75)">
    <!-- tail and its fluke -->
    <path d="M -24 -9 Q -44 -9 -56 -3 L -56 3 Q -44 9 -24 9 Z" fill="url(#hide)" stroke="#1a1d24" stroke-width="3" stroke-linejoin="round"/>
    <path d="M -52 0 Q -60 -6 -64 -18 Q -72 -14 -72 -4 Q -68 0 -72 4 Q -72 14 -64 18 Q -60 6 -52 0 Z" fill="#3fb5b0" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M -56 -2 Q -62 -8 -64 -14 M -56 2 Q -62 8 -64 14" fill="none" stroke="#9ff0e8" stroke-width="2" stroke-linecap="round"/>
    <path d="M -28 -5 Q -40 -4 -50 -1 M -28 5 Q -40 4 -50 1" fill="none" stroke="#6fd6cf" stroke-width="2" stroke-linecap="round"/>
    <!-- hind legs, fin wings, fore legs -->
    <path d="M -18 -12 L -25 -23" stroke="#1a1d24" stroke-width="9" stroke-linecap="round"/>
    <path d="M -18 -12 L -25 -23" stroke="#2a9d9a" stroke-width="5" stroke-linecap="round"/>
    <path d="M -25 -23 Q -33 -26 -32 -31 Q -26 -30 -25 -23 Z" fill="#7ee0d8" stroke="#1a1d24" stroke-width="2" stroke-linejoin="round"/>
    <g transform="scale(1 -1)">
    <path d="M -18 -12 L -25 -23" stroke="#1a1d24" stroke-width="9" stroke-linecap="round"/>
    <path d="M -18 -12 L -25 -23" stroke="#2a9d9a" stroke-width="5" stroke-linecap="round"/>
    <path d="M -25 -23 Q -33 -26 -32 -31 Q -26 -30 -25 -23 Z" fill="#7ee0d8" stroke="#1a1d24" stroke-width="2" stroke-linejoin="round"/>
    </g>
    <path d="M 6 -13 Q 22 -38 14 -58 Q 7.0 -56.7 2 -67 Q -4.4 -61.1 -12 -68 Q -16.7 -58.9 -26 -62 Q -27.3 -51.0 -36 -50 Q -33.4 -39.5 -40 -36 Q -32.6 -27.2 -34 -22 Q -24 -18 -16 -12 Z" fill="url(#fin)" stroke="#1a1d24" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 2 -18 Q 12 -34 8 -50 Q -14 -60 -30 -46 Q -34 -30 -14 -16 Z" fill="#1f8a88" opacity="0.45"/>
    <path d="M 0 -14 L 1.9 -63.0 M 0 -14 L -11.3 -63.9 M 0 -14 L -24.4 -58.3 M 0 -14 L -33.8 -47.0 M 0 -14 L -37.6 -33.8 M 0 -14 L -32.0 -20.7" fill="none" stroke="#17676a" stroke-width="2.2" stroke-linecap="round"/>

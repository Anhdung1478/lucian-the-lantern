<svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 56 56">
  <!-- Raptor: a small jungle bird raptor from above, red-crested, beak and talons forward (+X), a fan of tail feathers behind. -->
  <g transform="translate(28 28)">
    <g transform="scale(1.0)">
    <!-- tail feathers -->
    <ellipse cx="0" cy="0" rx="9.5" ry="3.6" transform="rotate(-30) translate(-17 0)" fill="#a8452a" stroke="#1a1d24" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="0" cy="0" rx="3" ry="2.4" transform="rotate(-30) translate(-23 0)" fill="#ff3b3b"/><ellipse cx="0" cy="0" rx="9.5" ry="3.6" transform="rotate(30) translate(-17 0)" fill="#a8452a" stroke="#1a1d24" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="0" cy="0" rx="3" ry="2.4" transform="rotate(30) translate(-23 0)" fill="#ff3b3b"/><ellipse cx="0" cy="0" rx="9.5" ry="3.6" transform="rotate(-15) translate(-17 0)" fill="#a8452a" stroke="#1a1d24" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="0" cy="0" rx="3" ry="2.4" transform="rotate(-15) translate(-23 0)" fill="#ff3b3b"/><ellipse cx="0" cy="0" rx="9.5" ry="3.6" transform="rotate(15) translate(-17 0)" fill="#a8452a" stroke="#1a1d24" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="0" cy="0" rx="3" ry="2.4" transform="rotate(15) translate(-23 0)" fill="#ff3b3b"/><ellipse cx="0" cy="0" rx="9.5" ry="3.6" transform="rotate(0) translate(-17 0)" fill="#a8452a" stroke="#1a1d24" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="0" cy="0" rx="3" ry="2.4" transform="rotate(0) translate(-23 0)" fill="#ff3b3b"/>
    <!-- legs and talons reaching forward -->
    <path d="M 2 -8 L 10 -12 M 2 8 L 10 12" stroke="#1a1d24" stroke-width="6" stroke-linecap="round"/>
    <path d="M 2 -8 L 10 -12 M 2 8 L 10 12" stroke="#e8c25a" stroke-width="3" stroke-linecap="round"/>
    <path d="M 10 -12 L 15 -15 M 10 -12 L 15 -11 M 10 12 L 15 15 M 10 12 L 15 11" stroke="#1a1d24" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 10 -12 L 15 -15 M 10 -12 L 15 -11 M 10 12 L 15 15 M 10 12 L 15 11" stroke="#f4e6b0" stroke-width="2" stroke-linecap="round"/>
    <!-- body -->
    <ellipse cx="-1" cy="0" rx="12.5" ry="11.5" fill="#d0643a" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <ellipse cx="1" cy="-1" rx="6" ry="5" fill="#e88a5a" opacity="0.6"/>
    <!-- folded wings with feather tips -->
    <path d="M 6 -8 Q -2 -20 -20 -18 L -15 -14 L -21 -11 L -14 -8 L -18 -4 Q -6 -4 4 -3 Z" fill="#a8452a" stroke="#1a1d24" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M 6 8 Q -2 20 -20 18 L -15 14 L -21 11 L -14 8 L -18 4 Q -6 4 4 3 Z" fill="#a8452a" stroke="#1a1d24" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M 0 -9 L -13 -13 M 0 9 L -13 13" stroke="#d0643a" stroke-width="2.4" stroke-linecap="round"/>
    
    <!-- head, beak, crest -->
    <circle cx="12" cy="0" r="7" fill="#e07444" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M 17.5 -4 L 26 0 L 17.5 4 Z" fill="#ffcf4a" stroke="#1a1d24" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M 15 0 L 9 -4.5 L 10 -1.5 L 1 -7 L 4 0 L 1 7 L 10 1.5 L 9 4.5 Z" fill="#ff3b3b" stroke="#1a1d24" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="14.5" cy="-4.5" r="2.2" fill="#ffe066"/><circle cx="14.5" cy="4.5" r="2.2" fill="#ffe066"/>
    <circle cx="-2" cy="-4" r="3.5" fill="#ffffff" opacity="0.28"/>
    </g>
  </g>
</svg>

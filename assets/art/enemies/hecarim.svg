<svg xmlns="http://www.w3.org/2000/svg" width="136" height="112" viewBox="0 0 136 112">
  <!-- Hecarim, the Shadow of War, top-down facing +X: massive armored spectral centaur warlord. Muscular armored
       equine body in dark-iron barding with ghostly cyan seams, dynamic galloping legs with spectral hooves, blazing
       teal-cyan flame tail and streaming mane, armored centaur rider with spiked dark-steel pauldrons & horned helm,
       and a huge gleaming curved spectral Shadow Glaive swept forward-right (+X/+Y). -->
  <defs>
    <linearGradient id="hc_barding" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#4e6882"/>
      <stop offset="0.4" stop-color="#2c3d4f"/>
      <stop offset="1" stop-color="#18222e"/>
    </linearGradient>
    <linearGradient id="hc_steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c98b5"/>
      <stop offset="0.5" stop-color="#3c5268"/>
      <stop offset="1" stop-color="#1e2a38"/>
    </linearGradient>
    <linearGradient id="hc_flame" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#c6ffef"/>
      <stop offset="0.45" stop-color="#45f0cf"/>
      <stop offset="1" stop-color="#1996c9"/>
    </linearGradient>
    <linearGradient id="hc_blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c8dde8"/>
      <stop offset="0.55" stop-color="#5d7c94"/>
      <stop offset="1" stop-color="#2a3d4f"/>
    </linearGradient>
    <radialGradient id="hc_ghost">
      <stop offset="0" stop-color="#e8fff8" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#42f0ce" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1588b8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g transform="translate(68 56)">
    <!-- blazing ghostly teal-cyan flame tail streaming behind (-X) -->
    <ellipse cx="-52" cy="0" rx="14" ry="12" fill="url(#hc_ghost)"/>
    <path d="M -38 -8 Q -50 -20 -63 -14 Q -55 -8 -65 -2 Q -56 1 -64 7 Q -54 11 -61 17 Q -48 18 -38 8 Z" fill="url(#hc_flame)" stroke="#14171f" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M -40 -4 Q -50 -10 -57 -6 Q -51 -2 -59 1 Q -51 4 -56 8 Q -48 9 -40 4 Z" fill="#e2fff7"/>

    <!-- dynamic galloping armored equine legs (asymmetric stride so it reads as a charging warhorse) -->
    <!-- hind-left leg driving back (-X, -Y) -->
    <path d="M -28 -14 L -40 -26 L -54 -28" fill="none" stroke="#14171f" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M -28 -14 L -40 -26 L -54 -28" fill="none" stroke="#314459" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M -31 -17 L -40 -26" fill="none" stroke="#85a4c2" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="-55" cy="-28" r="6.5" fill="url(#hc_ghost)"/>
    <path d="M -51 -31 L -59 -29 L -55 -24 Z" fill="#70ffe0" stroke="#14171f" stroke-width="1.6" stroke-linejoin="round"/>

    <!-- hind-right leg tucked slightly forward (-X, +Y) -->
    <path d="M -24 14 L -31 27 L -42 34" fill="none" stroke="#14171f" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M -24 14 L -31 27 L -42 34" fill="none" stroke="#253445" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="-43" cy="34" r="6.5" fill="url(#hc_ghost)"/>
    <path d="M -39 31 L -47 34 L -42 38 Z" fill="#5ce8cc" stroke="#14171f" stroke-width="1.6" stroke-linejoin="round"/>

    <!-- fore-left leg charging far forward (+X, -Y) -->
    <path d="M 10 -14 L 24 -27 L 38 -31" fill="none" stroke="#14171f" stroke-width="11.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 10 -14 L 24 -27 L 38 -31" fill="none" stroke="#3c536b" stroke-width="7.4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 13 -17 L 24 -27 L 35 -30" fill="none" stroke="#99b8d4" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="39" cy="-31" r="7" fill="url(#hc_ghost)"/>
    <path d="M 35 -34 L 44 -32 L 39 -27 Z" fill="#70ffe0" stroke="#14171f" stroke-width="1.6" stroke-linejoin="round"/>

    <!-- fore-right leg striding (+X, +Y) -->
    <path d="M 8 15 L 18 28 L 28 34" fill="none" stroke="#14171f" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 8 15 L 18 28 L 28 34" fill="none" stroke="#2b3d50" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="29" cy="34" r="6.5" fill="url(#hc_ghost)"/>
    <path d="M 26 30 L 33 34 L 27 38 Z" fill="#5ce8cc" stroke="#14171f" stroke-width="1.6" stroke-linejoin="round"/>

    <!-- muscular armored equine body & dark-iron barding flanks -->
    <path d="M 24 -12 C 16 -22 -4 -23 -24 -20 C -38 -18 -47 -10 -47 0 C -47 10 -38 18 -24 20 C -4 23 16 22 24 12 Z" fill="url(#hc_barding)" stroke="#14171f" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- segmented dark-iron flank barding plates -->
    <path d="M 8 -19 Q 4 -10 7 -2 M -8 -20 Q -12 -10 -9 -2 M -24 -19 Q -28 -10 -25 -2" fill="none" stroke="#14171f" stroke-width="2" stroke-linecap="round"/>
    <path d="M 8 19 Q 4 10 7 2 M -8 20 Q -12 10 -9 2 M -24 19 Q -28 10 -25 2" fill="none" stroke="#14171f" stroke-width="2" stroke-linecap="round"/>
    <!-- steel top-left barding rim highlights & rivets -->
    <path d="M 16 -14 C 6 -19 -12 -20 -34 -15" fill="none" stroke="#99b7d4" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 16 14 C 6 19 -12 20 -34 15" fill="none" stroke="#536e8a" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="0" cy="-15" r="1.5" fill="#b4d0e8"/>
    <circle cx="-16" cy="-15" r="1.5" fill="#b4d0e8"/>
    <circle cx="-32" cy="-12" r="1.5" fill="#b4d0e8"/>
    <!-- ghostly cyan flank energy seams -->
    <path d="M -4 -11 Q -20 -13 -37 -8 M -4 11 Q -20 13 -37 8" fill="none" stroke="#48f5d4" stroke-width="2" stroke-linecap="round" opacity="0.88"/>
    <!-- rear iron saddle-plate & spine crest -->
    <path d="M -38 -6 L -45 0 L -38 6 L -28 5 L -28 -5 Z" fill="url(#hc_steel)" stroke="#14171f" stroke-width="1.6" stroke-linejoin="round"/>

    <!-- blazing ghostly teal-cyan mane streaming back over horse's back -->
    <path d="M 22 -8 Q 8 -14 -8 -10 Q -2 -6 -18 -5 Q -8 -1 -31 0 Q -8 1 -18 5 Q -2 6 -8 10 Q 8 14 22 8 Z" fill="url(#hc_flame)" stroke="#14171f" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M 19 -4 Q 8 -7 -4 -4 Q 0 -1 -17 0 Q 0 1 -4 4 Q 8 7 19 4 Z" fill="#e2fff7"/>

    <!-- HUGE gleaming curved spectral Shadow Glaive / Halberd swept forward-right (+X/+Y) -->
    <!-- heavy dark-iron polearm shaft -->
    <path d="M -18 33 L 46 16" stroke="#14171f" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M -18 33 L 46 16" stroke="#4c5c6e" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M -16 32 L 42 16.5" stroke="#9ab4cc" stroke-width="1.2" stroke-linecap="round"/>
    <!-- rear pommel spike -->
    <path d="M -18 33 L -26 37 L -20 29 Z" fill="#7c98b5" stroke="#14171f" stroke-width="1.6" stroke-linejoin="round"/>
    <!-- glowing aura behind glaive blade -->
    <ellipse cx="52" cy="18" rx="16" ry="22" fill="url(#hc_ghost)" opacity="0.72"/>
    <!-- ornate spiked cross-collar & crescent halberd blade -->
    <path d="M 38 14 L 46 25 L 42 18 L 36 9 Z" fill="#2c3d4f" stroke="#14171f" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M 41 14 Q 56 0 65 -6 Q 63 8 64 21 Q 59 35 46 43 Q 51 30 48 20 Q 45 17 41 14 Z" fill="url(#hc_blade)" stroke="#14171f" stroke-width="2" stroke-linejoin="round"/>
    <!-- bright glowing cyan-mint razor edge along the sweeping glaive blade -->
    <path d="M 55 2 Q 62 -2 64 -4 Q 62 10 62.5 21 Q 58 32 48 40" fill="none" stroke="#66ffe2" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 58 0 Q 62.5 -2 63.5 -3 Q 61.5 11 62 20 Q 57.5 30 50 37" fill="none" stroke="#eafffa" stroke-width="1.2" stroke-linecap="round"/>
    <!-- dark bevel cut-out in halberd head -->
    <path d="M 48 16 L 56 12 L 54 22 Z" fill="#18222e" stroke="#42f0ce" stroke-width="1"/>

    <!-- armored centaur rider torso & arms gripping glaive -->
    <path d="M 14 -12 L 24 4 L 22 21" fill="none" stroke="#14171f" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 14 -12 L 24 4 L 22 21" fill="none" stroke="#3b5269" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 12 13 L 10 24" fill="none" stroke="#14171f" stroke-width="8.5" stroke-linecap="round"/>
    <path d="M 12 13 L 10 24" fill="none" stroke="#31465c" stroke-width="5" stroke-linecap="round"/>
    <!-- gauntlets on haft -->
    <circle cx="22" cy="22" r="4.2" fill="#7c98b5" stroke="#14171f" stroke-width="1.6"/>
    <circle cx="9.5" cy="25.5" r="4.2" fill="#7c98b5" stroke="#14171f" stroke-width="1.6"/>

    <!-- rider upper armor chest/back -->
    <ellipse cx="16" cy="0" rx="12" ry="18" fill="url(#hc_steel)" stroke="#14171f" stroke-width="2"/>
    <path d="M 8 -10 Q 5 0 8 10" fill="none" stroke="#48f5d4" stroke-width="1.8" stroke-linecap="round"/>

    <!-- massive spiked dark-steel pauldrons -->
    <path d="M 27 -7 Q 26 -22 15 -25 Q 4 -25 2 -15 Q 9 -9 20 -7 Z" fill="url(#hc_steel)" stroke="#14171f" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 13 -22 L 5 -33 L 18 -24 Z M 22 -20 L 23 -32 L 27 -16 Z M 5 -18 L -5 -26 L 8 -13 Z" fill="#a8c4de" stroke="#14171f" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M 7 -17 Q 15 -22 24 -17" fill="none" stroke="#cde2f5" stroke-width="1.6" stroke-linecap="round"/>

    <path d="M 27 7 Q 26 22 15 25 Q 4 25 2 15 Q 9 9 20 7 Z" fill="url(#hc_steel)" stroke="#14171f" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 13 22 L 5 33 L 18 24 Z M 22 20 L 23 32 L 27 16 Z M 5 18 L -5 26 L 8 13 Z" fill="#8ca8c4" stroke="#14171f" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M 7 17 Q 15 22 24 17" fill="none" stroke="#99b8d4" stroke-width="1.5" stroke-linecap="round"/>

    <!-- horned ghostly warlord helm -->
    <path d="M 33 -6 Q 27 -17 12 -20 Q 22 -12 26 -3 Z" fill="#c2d9ed" stroke="#14171f" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M 33 6 Q 27 17 12 20 Q 22 12 26 3 Z" fill="#99b5cf" stroke="#14171f" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M 16 -3 Q 20 -11 30 -9 L 38 -4 Q 40 0 38 4 L 30 9 Q 20 11 16 3 Z" fill="url(#hc_steel)" stroke="#14171f" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 19 -5 Q 26 -8 33 -5" fill="none" stroke="#d4e8fa" stroke-width="1.5" stroke-linecap="round"/>
    <!-- blazing ghostly cyan visor glow -->
    <circle cx="34" cy="0" r="6.5" fill="url(#hc_ghost)"/>
    <path d="M 30 -4 L 36 -2.2 M 30 4 L 36 2.2" stroke="#e4fff8" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>

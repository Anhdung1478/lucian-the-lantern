<svg xmlns="http://www.w3.org/2000/svg" width="136" height="112" viewBox="0 0 136 112">
  <!-- Hecarim, the Shadow of War, seen from above, facing +X: an armoured spectral centaur. A horse's body in dark
       blue-steel barding, plated and riveted, its legs flung out at the gallop on hooves of teal ghost-fire; a tail of
       teal flame behind and a mane of teal flame streaming back from the rider's horned helm over the horse's back;
       the rider's spiked pauldrons, green-teal eyes, and his glaive levelled forward in both hands. -->
  <defs>
    <radialGradient id="ghost">
      <stop offset="0" stop-color="#d8fff2" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#4de8c0" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#36b6e8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="barding" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4f68"/>
      <stop offset="0.5" stop-color="#25323f"/>
      <stop offset="1" stop-color="#3a4f68"/>
    </linearGradient>
    <linearGradient id="flame" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#7ff5d2"/>
      <stop offset="1" stop-color="#36b6e8"/>
    </linearGradient>
  </defs>
  <g transform="translate(68 56)">
    <!-- tail of teal flame -->
    <path d="M -44 -7 Q -54 -18 -64 -12 Q -57 -8 -66 -3 Q -58 0 -66 3 Q -57 8 -64 12 Q -54 18 -44 7 Z" fill="url(#flame)" stroke="#1a1d24" stroke-width="2.8" stroke-linejoin="round"/>
    <path d="M -46 -3 Q -54 -8 -59 -5 Q -54 -2 -60 0 Q -54 2 -59 5 Q -54 8 -46 3 Z" fill="#d8fff2"/>
    <!-- legs at the gallop -->
    <path d="M 6 -11 L 16 -22 M -34 -11 L -42 -20" fill="none" stroke="#1a1d24" stroke-width="13" stroke-linecap="round"/>
    <path d="M 16 -22 L 26 -29 M -42 -20 L -52 -24" fill="none" stroke="#1a1d24" stroke-width="8" stroke-linecap="round"/>
    <path d="M 6 -11 L 16 -22 M -34 -11 L -42 -20" fill="none" stroke="#3a4d64" stroke-width="8.5" stroke-linecap="round"/>
    <path d="M 16 -22 L 26 -29 M -42 -20 L -52 -24" fill="none" stroke="#2e3e52" stroke-width="4" stroke-linecap="round"/>
    <path d="M 8 -14 L 15 -22 M -35 -14 L -41 -20" stroke="#8aa4c0" stroke-width="2" stroke-linecap="round"/>
    <circle cx="27" cy="-29.5" r="6" fill="url(#ghost)"/>
    <circle cx="-53" cy="-24.5" r="6" fill="url(#ghost)"/>
    <path d="M 23 -32 L 30 -30 L 28 -26 Z M -49 -27 L -56 -26 L -53 -21 Z" fill="#7ff5d2" stroke="#1a1d24" stroke-width="2" stroke-linejoin="round"/>
    <g transform="scale(1 -1)">
    <path d="M 6 -11 L 16 -22 M -34 -11 L -42 -20" fill="none" stroke="#1a1d24" stroke-width="13" stroke-linecap="round"/>
    <path d="M 16 -22 L 26 -29 M -42 -20 L -52 -24" fill="none" stroke="#1a1d24" stroke-width="8" stroke-linecap="round"/>
    <path d="M 6 -11 L 16 -22 M -34 -11 L -42 -20" fill="none" stroke="#3a4d64" stroke-width="8.5" stroke-linecap="round"/>
    <path d="M 16 -22 L 26 -29 M -42 -20 L -52 -24" fill="none" stroke="#2e3e52" stroke-width="4" stroke-linecap="round"/>
    <path d="M 8 -14 L 15 -22 M -35 -14 L -41 -20" stroke="#8aa4c0" stroke-width="2" stroke-linecap="round"/>
    <circle cx="27" cy="-29.5" r="6" fill="url(#ghost)"/>
    <circle cx="-53" cy="-24.5" r="6" fill="url(#ghost)"/>
    <path d="M 23 -32 L 30 -30 L 28 -26 Z M -49 -27 L -56 -26 L -53 -21 Z" fill="#7ff5d2" stroke="#1a1d24" stroke-width="2" stroke-linejoin="round"/>
    </g>
    <!-- the horse's body in barding -->
    <path d="M 18 -10 Q 12 -18 -6 -18 Q -30 -18 -42 -15 Q -51 -9 -51 0 Q -51 9 -42 15 Q -30 18 -6 18 Q 12 18 18 10 Z" fill="url(#barding)" stroke="#1a1d24" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M 12 -11 Q 2 -15 -14 -15 Q -32 -15 -42 -11" fill="none" stroke="#9fb6cc" stroke-width="2" stroke-linecap="round"/>
    <path d="M 4 -15 Q 2 -8 4 -2 M -12 -16 Q -14 -8 -12 -2 M -28 -16 Q -30 -8 -28 -2" fill="none" stroke="#1a1d24" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="-4" cy="-12" r="1.6" fill="#9fb6cc"/>
    <circle cx="-20" cy="-12" r="1.6" fill="#9fb6cc"/>
    <path d="M -8 -8 Q -24 -10 -40 -7" fill="none" stroke="#4de8c0" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <g transform="scale(1 -1)">
    <path d="M 12 -11 Q 2 -15 -14 -15 Q -32 -15 -42 -11" fill="none" stroke="#9fb6cc" stroke-width="2" stroke-linecap="round"/>
    <path d="M 4 -15 Q 2 -8 4 -2 M -12 -16 Q -14 -8 -12 -2 M -28 -16 Q -30 -8 -28 -2" fill="none" stroke="#1a1d24" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="-4" cy="-12" r="1.6" fill="#9fb6cc"/>
    <circle cx="-20" cy="-12" r="1.6" fill="#9fb6cc"/>
    <path d="M -8 -8 Q -24 -10 -40 -7" fill="none" stroke="#4de8c0" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    </g>
    <path d="M -50 0 L -38 0" stroke="#1a1d24" stroke-width="2.5" stroke-linecap="round"/>
    <!-- the flame mane, streaming back over the horse's back -->
    <path d="M 20 -7 Q 8 -12 -8 -9 Q -4 -6 -16 -5 Q -10 -2 -28 0 Q -10 2 -16 5 Q -4 6 -8 9 Q 8 12 20 7 Z" fill="url(#flame)" stroke="#1a1d24" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M 18 -3.5 Q 8 -6 -4 -4 Q -2 -2 -14 0 Q -2 2 -4 4 Q 8 6 18 3.5 Z" fill="#d8fff2"/>
    <!-- the glaive: a long haft, a curved blade -->
    <path d="M -10 20 L 50 9" stroke="#1a1d24" stroke-width="6" stroke-linecap="round"/>
    <path d="M -10 20 L 50 9" stroke="#4a3a34" stroke-width="3" stroke-linecap="round"/>
    <path d="M 46 7 Q 58 -2 66 2 Q 62 6 64 12 Q 56 9 48 13 Z" fill="#d6e2ea" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 52 4 Q 59 1 63 3" fill="none" stroke="#4de8c0" stroke-width="2" stroke-linecap="round"/>
    <path d="M 44 8 L 48 15 M 44 12 L 40 4" stroke="#1a1d24" stroke-width="3" stroke-linecap="round"/>
    <!-- the rider: arms to the haft, spiked pauldrons, a horned helm with teal eyes -->
    <path d="M 18 -10 L 30 -2 M 18 10 L 28 12" stroke="#1a1d24" stroke-width="8" stroke-linecap="round"/>
    <path d="M 18 -10 L 30 -2 M 18 10 L 28 12" stroke="#46607c" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="30" cy="12" r="3.6" fill="#9fb6cc" stroke="#1a1d24" stroke-width="1.5"/>
    <circle cx="32" cy="10.5" r="3.6" fill="#9fb6cc" stroke="#1a1d24" stroke-width="1.5"/>
    <ellipse cx="18" cy="0" rx="10" ry="15" fill="#34485e" stroke="#1a1d24" stroke-width="3.5"/>
    <path d="M 26 -6 Q 26 -18 16 -20 Q 8 -20 6 -12 Q 12 -8 20 -6 Z" fill="#46607c" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 14 -18 L 8 -27 L 18 -20 Z M 22 -16 L 22 -25 L 25 -13 Z" fill="#9fb6cc" stroke="#1a1d24" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M 10 -14 Q 16 -18 23 -14" fill="none" stroke="#b8cce0" stroke-width="2" stroke-linecap="round"/>
    <g transform="scale(1 -1)">
    <path d="M 26 -6 Q 26 -18 16 -20 Q 8 -20 6 -12 Q 12 -8 20 -6 Z" fill="#46607c" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 14 -18 L 8 -27 L 18 -20 Z M 22 -16 L 22 -25 L 25 -13 Z" fill="#9fb6cc" stroke="#1a1d24" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M 10 -14 Q 16 -18 23 -14" fill="none" stroke="#b8cce0" stroke-width="2" stroke-linecap="round"/>
    </g>
    <path d="M 32 -5 Q 26 -14 14 -16 Q 22 -10 26 -3 Z" fill="#c9d6e0" stroke="#1a1d24" stroke-width="2" stroke-linejoin="round"/>
    <g transform="scale(1 -1)">
    <path d="M 32 -5 Q 26 -14 14 -16 Q 22 -10 26 -3 Z" fill="#c9d6e0" stroke="#1a1d24" stroke-width="2" stroke-linejoin="round"/>
    </g>
    <ellipse cx="25" cy="0" rx="8.5" ry="8" fill="#566f88" stroke="#1a1d24" stroke-width="3"/>
    <path d="M 19 -4 Q 25 -6.5 30 -4" fill="none" stroke="#b8cce0" stroke-width="2" stroke-linecap="round"/>
    <circle cx="30" cy="0" r="6" fill="url(#ghost)"/>
    <path d="M 27 -3 L 32 -2 M 27 3 L 32 2" stroke="#d8fff2" stroke-width="2.2" stroke-linecap="round"/>
  </g>
</svg>

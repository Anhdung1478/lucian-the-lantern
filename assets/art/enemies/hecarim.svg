<svg xmlns="http://www.w3.org/2000/svg" width="136" height="112" viewBox="0 0 136 112">
  <!-- Hecarim: a spectral centaur seen from above, a dark armoured horse body stretched along +X with a green-blue flame for mane and tail, the armoured rider's torso up front and a long lance levelled forward. -->
  <g transform="translate(68 56)">
    <ellipse cx="-4" cy="4" rx="54" ry="30" fill="#000000" opacity="0.25"/>
    <!-- flame tail -->
    <path d="M -34 -6 Q -52 -18 -62 -8 Q -52 -4 -60 0 Q -52 4 -62 8 Q -52 18 -34 6 Z" fill="#36b6e8" stroke="#1a1d24" stroke-width="3" stroke-linejoin="round" opacity="0.92"/>
    <path d="M -36 -3 Q -48 -8 -54 -3 Q -48 0 -54 3 Q -48 8 -36 3 Z" fill="#7ff5d2" opacity="0.9"/>
    <!-- legs flung out -->
    <path d="M 12 -16 L 24 -28 M 12 16 L 24 28 M -24 -16 L -34 -28 M -24 16 L -34 28" fill="none" stroke="#1a1d24" stroke-width="8" stroke-linecap="round"/>
    <path d="M 12 -16 L 24 -28 M 12 16 L 24 28 M -24 -16 L -34 -28 M -24 16 L -34 28" fill="none" stroke="#33465a" stroke-width="4" stroke-linecap="round"/>
    <!-- horse body -->
    <ellipse cx="-8" cy="0" rx="34" ry="21" fill="#2b3a4a" stroke="#1a1d24" stroke-width="3.5"/>
    <path d="M -34 -8 Q -8 -16 18 -8 M -34 8 Q -8 16 18 8" fill="none" stroke="#4de8c0" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <!-- flame mane streaming off the shoulders -->
    <path d="M 8 -14 Q 14 -30 26 -26 Q 22 -20 32 -16 Q 22 -14 28 -8 L 28 8 Q 22 14 32 16 Q 22 20 26 26 Q 14 30 8 14 Z" fill="#36b6e8" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round" opacity="0.92"/>
    <path d="M 12 -12 Q 18 -22 26 -19 Q 22 -14 28 -10 L 28 10 Q 22 14 26 19 Q 18 22 12 12 Z" fill="#7ff5d2" opacity="0.85"/>
    <!-- lance -->
    <path d="M 4 0 L 58 0" fill="none" stroke="#1a1d24" stroke-width="5" stroke-linecap="round"/>
    <path d="M 4 0 L 58 0" fill="none" stroke="#c9d6e0" stroke-width="2" stroke-linecap="round"/>
    <path d="M 52 -5 L 64 0 L 52 5 Z" fill="#c9d6e0" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- rider: armoured shoulders, helm with a flame crest -->
    <ellipse cx="22" cy="0" rx="10" ry="16" fill="#3d566e" stroke="#1a1d24" stroke-width="3.5"/>
    <path d="M 17 -10 L 22 -6 M 17 10 L 22 6" fill="none" stroke="#1a1d24" stroke-width="2" stroke-linecap="round"/>
    <circle cx="26" cy="0" r="8.5" fill="#566f88" stroke="#1a1d24" stroke-width="3"/>
    <path d="M 19 0 Q 13 -4 6 0 Q 13 4 19 0 Z" fill="#4de8c0" stroke="#1a1d24" stroke-width="1.5"/>
    <path d="M 28 -3 L 32 0 L 28 3" fill="none" stroke="#7ff5d2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>

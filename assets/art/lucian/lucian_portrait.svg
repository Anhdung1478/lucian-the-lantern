      <stop offset="0.45" stop-color="#11282e"/>
      <stop offset="1" stop-color="#070b10"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b8fff0" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#5fe8cf" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#5fe8cf" stop-opacity="0"/>

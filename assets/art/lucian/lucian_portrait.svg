    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7d8592"/>
      <stop offset="0.5" stop-color="#eef1f5"/>
      <stop offset="1" stop-color="#9aa3b0"/>
    </linearGradient>
  </defs>

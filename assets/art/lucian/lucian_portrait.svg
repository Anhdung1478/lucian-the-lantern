<svg xmlns="http://www.w3.org/2000/svg" width="384" height="384" viewBox="0 0 96 96">
  <!-- Lucian (Classic) portrait: head and shoulders, facing the viewer. Short black hair, a short beard, his long dark coat with its high collar and pale trim; his silver-gold pistol raised at his side. Behind him the lantern's teal mist, its light on the right of his face. -->

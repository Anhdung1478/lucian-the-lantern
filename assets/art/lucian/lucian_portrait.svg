<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 96 96">
  <!-- Lucian HUD portrait: head and shoulders, front view. -->
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#3b3420"/>
      <stop offset="0.55" stop-color="#171b26"/>
      <stop offset="1" stop-color="#0b0d13"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a4532"/>
      <stop offset="1" stop-color="#4d3122"/>
    </linearGradient>
  </defs>
  <rect width="96" height="96" fill="url(#bg)"/>
  <!-- light behind him -->
  <circle cx="48" cy="38" r="30" fill="#ffe9a8" opacity="0.08"/>
  <!-- coat and shoulders -->
  <path d="M 8 96 Q 12 70 34 64 L 62 64 Q 84 70 88 96 Z" fill="#1d2230"/>
  <path d="M 34 64 L 48 84 L 62 64" fill="none" stroke="#c9d1dc" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 22 72 L 30 96 M 74 72 L 66 96" stroke="#c9d1dc" stroke-width="1.5" opacity="0.7"/>
  <path d="M 40 66 L 48 78 L 56 66 Z" fill="#e8ecf2"/>
  <!-- neck -->
  <path d="M 41 54 L 41 66 L 55 66 L 55 54 Z" fill="#4d3122"/>
  <!-- head -->
  <path d="M 31 34 Q 31 18 48 17 Q 65 18 65 34 L 64 44 Q 62 58 48 62 Q 34 58 32 44 Z" fill="url(#skin)"/>
  <!-- ears -->
  <ellipse cx="31" cy="40" rx="3" ry="5" fill="#4d3122"/>
  <ellipse cx="65" cy="40" rx="3" ry="5" fill="#4d3122"/>
  <!-- short hair -->
  <path d="M 31 33 Q 31 16 48 15 Q 65 16 65 33 Q 60 24 48 24 Q 36 24 31 33 Z" fill="#141010"/>
  <!-- brows and eyes -->
  <path d="M 36 35 L 45 36 M 51 36 L 60 35" stroke="#141010" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 38 40 L 44 40 M 52 40 L 58 40" stroke="#f2e6d0" stroke-width="2" stroke-linecap="round"/>
  <circle cx="41" cy="40" r="1.2" fill="#1a1210"/>
  <circle cx="55" cy="40" r="1.2" fill="#1a1210"/>
  <!-- nose -->
  <path d="M 48 41 L 46 48 L 50 48" fill="none" stroke="#3e271b" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- moustache and goatee -->
  <path d="M 42 52 Q 48 49 54 52" fill="none" stroke="#141010" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 44 56 Q 48 62 52 56 L 50 55 Q 48 57 46 55 Z" fill="#141010"/>
</svg>

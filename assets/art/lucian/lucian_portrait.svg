<svg xmlns="http://www.w3.org/2000/svg" width="384" height="384" viewBox="0 0 96 96">
  <!-- Classic Lucian (Sentinel of Light): painterly dark-fantasy 3/4 character bust facing slightly right, sculpted chiseled features, dynamic tapered locs crown, high crisp Sentinel navy-and-white collar with gold clasp, Shadow Isles teal mist + warm golden Sentinel backlight, and a sleek side-profile silver-gold Sentinel relic pistol angled across the foreground. -->
  <defs>
    <radialGradient id="bg" cx="0.58" cy="0.4" r="0.72">
      <stop offset="0" stop-color="#1f5354"/>
      <stop offset="0.4" stop-color="#0f252f"/>
      <stop offset="0.78" stop-color="#08131d"/>
      <stop offset="1" stop-color="#04070e"/>
    </radialGradient>
    <radialGradient id="goldBack" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff5cc" stop-opacity="0.75"/>
      <stop offset="0.35" stop-color="#f0be52" stop-opacity="0.34"/>
      <stop offset="0.72" stop-color="#bd8428" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#bd8428" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tealMist" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7ef5df" stop-opacity="0.48"/>
      <stop offset="0.5" stop-color="#32bda8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#145e5a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="muzzleGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.28" stop-color="#fff2bd" stop-opacity="0.92"/>
      <stop offset="0.62" stop-color="#f2ba48" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#f2ba48" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin" x1="0.06" y1="0.18" x2="0.96" y2="0.62">
      <stop offset="0" stop-color="#361f15"/>
      <stop offset="0.36" stop-color="#5c3826"/>
      <stop offset="0.72" stop-color="#7e4f36"/>
      <stop offset="1" stop-color="#a8704c"/>
    </linearGradient>
    <linearGradient id="neckSkin" x1="0" y1="0" x2="1" y2="0.5">
      <stop offset="0" stop-color="#2c1910"/>
      <stop offset="0.55" stop-color="#4e2f20"/>
      <stop offset="1" stop-color="#754932"/>
    </linearGradient>
    <linearGradient id="coat" x1="0" y1="0.1" x2="1" y2="0.9">
      <stop offset="0" stop-color="#0f1420"/>
      <stop offset="0.48" stop-color="#1c2639"/>
      <stop offset="0.85" stop-color="#2e3d59"/>
      <stop offset="1" stop-color="#192233"/>
    </linearGradient>
    <linearGradient id="collarLit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#364869"/>
      <stop offset="0.55" stop-color="#202c42"/>
      <stop offset="1" stop-color="#111724"/>
    </linearGradient>
    <linearGradient id="ivory" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#d2d9e6"/>
      <stop offset="1" stop-color="#8793a8"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff2b8"/>
      <stop offset="0.45" stop-color="#e3b652"/>
      <stop offset="1" stop-color="#8a5d19"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.38" stop-color="#dfe6f0"/>
      <stop offset="0.76" stop-color="#919eb2"/>
      <stop offset="1" stop-color="#525d6e"/>
    </linearGradient>
    <linearGradient id="hair" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#292529"/>
      <stop offset="0.48" stop-color="#141114"/>
      <stop offset="1" stop-color="#0a080a"/>
    </linearGradient>
  </defs>

  <!-- Shadow Isles mist + warm golden Sentinel backlight -->
  <rect width="96" height="96" fill="url(#bg)"/>
  <circle cx="22" cy="40" r="36" fill="url(#tealMist)"/>
  <circle cx="72" cy="34" r="34" fill="url(#goldBack)"/>
  <circle cx="50" cy="44" r="28" fill="url(#tealMist)" opacity="0.5"/>

  <!-- Painterly mist wisps & floating motes -->
  <path d="M 0 58 Q 18 47 36 55 Q 54 63 74 49 Q 86 41 96 47 L 96 74 Q 72 64 50 74 Q 24 82 0 70 Z" fill="#4ad4be" opacity="0.11"/>
  <path d="M 0 36 Q 15 28 30 35 Q 40 39 32 45 Q 16 42 0 48 Z" fill="#70ebd6" opacity="0.12"/>
  <path d="M 60 15 Q 76 11 92 20 Q 96 22 96 28 Q 78 21 64 25 Z" fill="#ffe6a3" opacity="0.13"/>
  <circle cx="14" cy="27" r="0.9" fill="#b8fff0" opacity="0.72"/>
  <circle cx="24" cy="17" r="0.65" fill="#b8fff0" opacity="0.52"/>
  <circle cx="76" cy="19" r="0.85" fill="#fff3c4" opacity="0.82"/>
  <circle cx="85" cy="31" r="0.7" fill="#fff3c4" opacity="0.68"/>

  <!-- Far/Right high Sentinel coat collar -->
  <path d="M 52 57 L 62.5 48.5 Q 67.5 52 68 60 L 63 72 L 52 69 Z" fill="#172030" stroke="#0c1018" stroke-width="0.6" stroke-linejoin="round"/>
  <path d="M 54 56.5 L 62 50 Q 65.8 52.8 66.2 59.5" fill="none" stroke="url(#ivory)" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Broad heroic 3/4 Sentinel shoulders -->
  <path d="M 0 96 C 2 78 13 68 27 64.5 L 40 61.5 L 58 62.5 L 72 67 C 84 71 92 80 96 96 Z" fill="url(#coat)" stroke="#0a0e16" stroke-width="0.75"/>
  <path d="M 5 96 C 8 81 17 72 30 67 L 36 74 C 24 79 18 87 17 96 Z" fill="#131a29"/>
  <path d="M 3 90 C 7 77 16 69.5 28 65.5" fill="none" stroke="#7ef5df" stroke-width="1.2" stroke-linecap="round" opacity="0.72"/>
  <path d="M 62 66 L 74 70 C 83 74 88 83 91 96 L 71 96 L 63 75 Z" fill="#293852"/>
  <path d="M 67 66 C 77 69.5 85 76 90 86" fill="none" stroke="#ffe7a8" stroke-width="1" stroke-linecap="round" opacity="0.75"/>

  <!-- Under-tunic, crisp ivory collar & ornate gold Sentinel clasp -->
  <path d="M 38 64 L 50 96 L 62 66 Q 50 70 38 64 Z" fill="#111622"/>
  <path d="M 41 63.8 L 49 76 L 57 65 L 54.2 63.8 L 49 71 L 43.8 63.2 Z" fill="url(#ivory)"/>
  <path d="M 49 72.2 L 52.8 76 L 49 80.4 L 45.2 76 Z" fill="url(#gold)" stroke="#1a140c" stroke-width="0.45" stroke-linejoin="round"/>
  <path d="M 49 74 L 50.8 76 L 49 78.2 L 47.2 76 Z" fill="#fff8dc"/>

  <!-- Sculpted lapels with white & gold Sentinel trim -->
  <path d="M 37 64 L 24.5 69.8 L 38.5 96 L 46.5 96 L 42 75 Z" fill="#1b2436" stroke="#0b0f17" stroke-width="0.55" stroke-linejoin="round"/>
  <path d="M 36.2 65 L 26.2 70.2 L 39.2 95.5" fill="none" stroke="url(#ivory)" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 29.8 72.2 L 40.5 94.5" fill="none" stroke="url(#gold)" stroke-width="0.6" opacity="0.9"/>

  <path d="M 58.5 65 L 69 70 L 57.5 96 L 50.5 96 L 55.5 76 Z" fill="url(#collarLit)" stroke="#0b0f17" stroke-width="0.55" stroke-linejoin="round"/>
  <path d="M 59 66 L 67.2 70.4 L 56.4 95.5" fill="none" stroke="url(#ivory)" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Neck & strong jaw cast shadow -->
  <path d="M 35.5 52 L 35 65.5 Q 45 70.5 54 66.5 L 53 53 Z" fill="url(#neckSkin)"/>
  <path d="M 35.5 53 C 38.5 58.5 45 63 53.2 60.2 L 53 53.5 Z" fill="#1b0e09" opacity="0.72"/>
  <path d="M 38 58 Q 41 64 46 67" fill="none" stroke="#28160d" stroke-width="1.1" stroke-linecap="round" opacity="0.55"/>

  <!-- Near/Left sweeping high Sentinel collar -->
  <path d="M 21.5 65.5 C 20.5 56 25.5 48.5 32.5 46.5 L 37.8 61 L 35.5 67 L 24.5 71 Z" fill="#172033" stroke="#0a0e16" stroke-width="0.6" stroke-linejoin="round"/>
  <path d="M 23 64.5 C 22.2 56.5 26.5 50 32.5 48" fill="none" stroke="url(#ivory)" stroke-width="1.35" stroke-linecap="round"/>
  <path d="M 22 63.5 C 21.4 57 25 51 30 49" fill="none" stroke="#7ef5df" stroke-width="0.75" stroke-linecap="round" opacity="0.78"/>
  <path d="M 25.5 67 L 35.2 64.2" fill="none" stroke="url(#gold)" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Chiseled 3/4 Head (sculpted brow ridge, cheekbone flare, crisp square jaw — NO flat vertical sides!) -->
  <path d="M 30.5 34.5 C 30 22.5 36.2 15.8 45.5 15.8 C 53.5 15.8 57.8 21.2 58.2 29.8 C 58.8 32.2 58.8 34.5 57.6 36.4 C 58.8 38.8 59.2 41.6 58 44.8 C 56.8 48.8 55.2 53.4 52.6 56.6 C 51 58.6 49.4 59.8 47.2 59.6 C 43 59.2 37.8 56.8 34.6 53 C 31.8 49.6 30.6 45 30.5 39.8 Z" fill="url(#skin)"/>
  <!-- Painterly facial structure: deep left shadow plane, brow shadow, cheekbone & jaw light -->
  <path d="M 38.5 17.2 C 33.5 19.8 30.5 26 30.5 34.8 L 30.5 40.5 C 30.8 46 32.2 50.5 35.2 53.8 C 38 56.8 41.8 58.6 45.2 59.2 L 42 54.5 C 38.8 50.8 37.6 46.2 38.2 41.8 C 38.6 38.2 37.4 34 38.4 29 C 39.4 24 41 20.2 43.6 16.4 Z" fill="#24130c" opacity="0.56"/>
  <!-- Warm sculpted brow ridge, cheekbone & nose-bridge highlights -->
  <path d="M 46.5 26.8 Q 54 27 57.4 31.4 Q 55 33.2 48.2 32.2 Z" fill="#b87e58" opacity="0.48"/>
  <path d="M 51.2 41.5 Q 55.8 40 58 42.8 Q 56.8 47.2 53.2 47.6 Q 51 45.4 51.2 41.5 Z" fill="#bd825a" opacity="0.46"/>
  <path d="M 40 42.2 Q 44.2 41.2 46.6 43.2 Q 45.2 46.4 41.2 45.8 Z" fill="#946042" opacity="0.4"/>
  <!-- Crisp golden rim-light along right brow & cheekbone/jaw -->
  <path d="M 55.8 21.8 C 57.8 24.8 58.4 29 58 33.6 M 57.8 37.6 C 58.8 40.6 58.4 44.2 56.8 48.8 C 55.4 52.4 53.6 55.4 51.2 57.6" fill="none" stroke="#ffeba8" stroke-width="1.1" stroke-linecap="round" opacity="0.92"/>
  <!-- Cool Shadow Isles teal rim on left jaw -->
  <path d="M 31 43 C 31.4 48 33.2 52 36.4 55.2" fill="none" stroke="#7ef5df" stroke-width="0.9" stroke-linecap="round" opacity="0.68"/>

  <!-- Near ear (sculpted with helix & teal rim) -->
  <path d="M 32.4 37.2 C 29 36 28 39.4 28.8 43 C 29.4 46 31.2 47.4 33.2 46.5 Z" fill="#44291c" stroke="#180e0a" stroke-width="0.45"/>
  <path d="M 30.4 39.2 Q 29.4 41.6 30.8 44.2" fill="none" stroke="#22120b" stroke-width="0.65" stroke-linecap="round"/>
  <path d="M 29.1 39 C 28.6 40.8 28.9 43.2 29.9 45" fill="none" stroke="#7ef5df" stroke-width="0.65" stroke-linecap="round" opacity="0.6"/>

  <!-- Dynamic Sentinel hair: swept layered short locs/twists breaking the silhouette cleanly -->
  <path d="M 29.6 37.5 C 27.4 31 27.6 22.8 31.6 17.5 L 30.4 16.5 C 33.5 13 38.5 11.4 44.2 11.4 L 46.2 10.6 C 51.5 11 56.2 13.8 58.5 18.2 L 59.6 20.5 C 59.6 23.6 59 26.2 58.4 28.2 L 57.4 26.8 C 56.6 23.2 54.4 21.8 51.2 21.8 C 47.8 21.8 43.8 22.2 39.8 23.4 C 35.8 24.6 34 27.4 33.8 32.4 L 33.6 37.8 Z" fill="url(#hair)"/>
  <!-- Layered locs crown ridges catching gold & teal light -->
  <path d="M 30.5 23 Q 35.5 15.8 43.8 14.5 M 34.5 18.8 Q 41 13.4 50 14.8 M 40.8 17.8 Q 48 15 55.6 18.4 M 32.6 27 Q 36.8 22.4 43 21.2" fill="none" stroke="#302b33" stroke-width="1.15" stroke-linecap="round"/>
  <path d="M 46.5 12.6 Q 53.8 14.2 57.6 19.6" fill="none" stroke="#edd082" stroke-width="0.9" stroke-linecap="round" opacity="0.72"/>
  <path d="M 29.8 28.5 C 28.8 23.5 30.6 18.2 34.8 14.8" fill="none" stroke="#70ebd6" stroke-width="0.85" stroke-linecap="round" opacity="0.6"/>
  <path d="M 32.2 34.2 L 32.8 44.2 L 34.6 44.8 L 34.2 34.2 Z" fill="#151010"/>

  <!-- Fierce 3/4 brows & eyes -->
  <path d="M 38 35.6 Q 42.8 33 47.8 35.2 L 47.2 36.8 Q 42.8 35.2 38.4 36.9 Z" fill="#120d0c"/>
  <path d="M 51.4 35.2 Q 54.8 33.2 57.8 35 L 57.4 36.5 Q 54.8 35.1 51.8 36.6 Z" fill="#120d0c"/>
  <path d="M 38.8 38.1 Q 43 36.1 47.2 38.1 M 51.8 37.9 Q 54.6 36.1 57.2 37.7" fill="none" stroke="#22120b" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M 39.4 38.8 Q 43.1 36.9 46.8 38.7 Q 43.2 40.3 39.4 38.8 Z" fill="#ede4d8"/>
  <path d="M 52 38.6 Q 54.6 36.9 57 38.5 Q 54.5 40.1 52 38.6 Z" fill="#f4ebdf"/>
  <circle cx="43.6" cy="38.6" r="1.45" fill="#2b180f"/>
  <circle cx="54.6" cy="38.5" r="1.35" fill="#321c12"/>
  <circle cx="43.6" cy="38.6" r="0.7" fill="#0b0604"/>
  <circle cx="54.6" cy="38.5" r="0.65" fill="#0b0604"/>
  <circle cx="44.2" cy="38" r="0.48" fill="#fffbe8"/>
  <circle cx="55.1" cy="37.9" r="0.48" fill="#fffbe8"/>
  <path d="M 39 38.7 Q 43.1 36.4 47.2 38.5 M 51.6 38.4 Q 54.6 36.4 57.3 38.3" fill="none" stroke="#120a07" stroke-width="0.95" stroke-linecap="round"/>
  <path d="M 40.2 40.6 Q 43.2 41.4 46.2 40.6 M 52.4 40.4 Q 54.5 41.1 56.5 40.4" fill="none" stroke="#3c2216" stroke-width="0.55" stroke-linecap="round"/>

  <!-- Sculpted 3/4 Nose -->
  <path d="M 49.6 37 Q 51.2 41.2 52.6 44.5" fill="none" stroke="#c28760" stroke-width="1.2" stroke-linecap="round" opacity="0.78"/>
  <path d="M 48.8 37.5 Q 48.2 41.6 47 45 L 49.4 47.2 L 53 46 Q 53 44.6 51.8 44.2" fill="#361f14" opacity="0.42"/>
  <path d="M 47.2 46 Q 49.4 47.6 52.2 46.6 Q 53.3 46 52.9 44.6" fill="none" stroke="#28150d" stroke-width="0.95" stroke-linecap="round"/>
  <ellipse cx="48.5" cy="46.2" rx="0.9" ry="0.48" fill="#1d0e09"/>

  <!-- Sculpted trimmed beard, moustache & resolute mouth -->
  <path d="M 33 42.8 C 33.4 49 35.8 54.2 39.6 57.4 C 42.6 59.6 46 60.2 49 59.6 C 52 59 54.4 56.4 56.2 52.6 L 57.2 46.4 L 56.1 46.8 C 55.4 50.6 54 53.4 52 55 Q 51.2 53 50.4 51.6 Q 49.8 54.4 47.8 55.4 Q 44.8 56 42.4 54 Q 41.2 52 40.8 50.6 Q 40.1 53.2 38.8 53.6 C 36.2 51.4 34.6 48 34.4 43.2 Z" fill="#161110"/>
  <path d="M 42.8 49.6 Q 46.6 47.8 49.6 48.6 Q 52.2 48 54.2 49.6 Q 52 49.4 49.6 50 Q 46.6 49.4 42.8 49.6 Z" fill="#161110"/>
  <path d="M 44.2 51.2 Q 48.6 52 53.2 50.8" fill="none" stroke="#22110c" stroke-width="0.85" stroke-linecap="round"/>
  <path d="M 45.6 52.2 Q 48.8 53.8 51.8 51.9 Q 48.8 52.7 45.6 52.2 Z" fill="#7c4a39"/>
  <path d="M 51 58 C 53.6 56.2 55.6 53.2 56.6 48.8" fill="none" stroke="#e0b267" stroke-width="0.75" stroke-linecap="round" opacity="0.7"/>

  <!-- DYNAMIC FOREGROUND SIDE-PROFILE SENTINEL RELIC PISTOL angled across lower-right -->
  <circle cx="84.5" cy="36" r="14" fill="url(#muzzleGlow)" opacity="0.85"/>
  <g transform="translate(71.5 64) rotate(29)">
    <!-- Trigger guard & trigger (unmistakably a pistol silhouette!) -->
    <path d="M -4.2 3.5 Q -10.5 4.5 -10 10.2 Q -9.5 14.5 -3.6 13.8" fill="none" stroke="#0d1118" stroke-width="2" stroke-linecap="round"/>
    <path d="M -4.2 3.5 Q -10.5 4.5 -10 10.2 Q -9.5 14.5 -3.6 13.8" fill="none" stroke="url(#gold)" stroke-width="0.95" stroke-linecap="round"/>
    <path d="M -5.2 6.8 Q -7 8.4 -5.8 10.6" fill="none" stroke="#d8dfe8" stroke-width="0.9" stroke-linecap="round"/>
    <!-- Angled Sentinel side-profile lower barrel & upper slide -->
    <path d="M -5.6 -26 L 2.2 -29 L 4.4 -27 L 4.4 6 L 6.4 8.2 L 5.8 12.2 L -5 12.2 L -5.6 3.5 Z" fill="url(#silver)" stroke="#0d1118" stroke-width="0.75" stroke-linejoin="round"/>
    <!-- Top sight blade & stepped back beaver-tail -->
    <path d="M 2 -27 L 4.8 -25.8 L 4.8 -22.5 L 2 -23.5 Z" fill="url(#gold)" stroke="#0d1118" stroke-width="0.5"/>
    <path d="M 4.4 4.5 L 8.2 3.2 L 7.2 7.4 L 4.4 7.4 Z" fill="url(#gold)" stroke="#0d1118" stroke-width="0.55" stroke-linejoin="round"/>
    <!-- Under-barrel shadowed rail & golden Sentinel inlays -->
    <path d="M -5.4 -24 L -2.2 -24 L -2.2 3.5 L -5.4 3.5 Z" fill="#2c374c"/>
    <path d="M -3.8 -22 L -3.8 -3" stroke="#ffe59e" stroke-width="2.1" stroke-linecap="round" opacity="0.55"/>
    <path d="M -3.8 -22 L -3.8 -3" stroke="#fffbe8" stroke-width="1.05" stroke-linecap="round"/>
    <path d="M -5.8 -14 L 4.6 -14 L 4.6 -11.4 L -5.8 -11.4 Z" fill="url(#gold)" stroke="#0d1118" stroke-width="0.45"/>
    <path d="M -5.6 -1.5 L 4.6 -1.5 L 4.6 2.2 L -5.6 2.2 Z" fill="url(#gold)" stroke="#0d1118" stroke-width="0.45"/>
    <path d="M 0.6 -25 L 0.6 4" stroke="#ffffff" stroke-width="0.95" stroke-linecap="round" opacity="0.88"/>
    <!-- Angled grip & sculpted hand wrapping around -->
    <path d="M -4.2 12 L 5.6 12 L 10.2 28 L 1.2 29.5 Z" fill="#1e2738" stroke="#0d1118" stroke-width="0.75" stroke-linejoin="round"/>
    <path d="M -5.6 12.6 Q 1.5 10.6 7.4 13 L 9.2 22.4 Q 2.4 25 -4.6 22.8 Z" fill="#5e3a28" stroke="#140c08" stroke-width="0.75" stroke-linejoin="round"/>
    <path d="M -5 15.6 Q 1.5 14.2 7.8 16 M -4.8 18.8 Q 1.6 17.6 8.4 19.2" fill="none" stroke="#301b11" stroke-width="0.65"/>
    <path d="M 5.6 13.4 L 7.8 21" stroke="#ffe9ab" stroke-width="0.85" stroke-linecap="round" opacity="0.85"/>
    <!-- Coat cuff -->
    <path d="M -5.8 23.4 Q 2 26.2 9.8 23.2 L 12.2 40 L -8 40 Z" fill="#1b2436" stroke="#0a0e16" stroke-width="0.8"/>
    <path d="M -5.8 23.4 Q 2 26.2 9.8 23.2" fill="none" stroke="url(#ivory)" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M -5.6 25.4 Q 2 28.2 9.8 25.2" fill="none" stroke="url(#gold)" stroke-width="0.75" stroke-linecap="round"/>
  </g>
  <!-- Luminous Sentinel muzzle flare -->
  <circle cx="85" cy="36.8" r="2.8" fill="#fffce8" opacity="0.95"/>
  <path d="M 85 31 L 85 42.6 M 79.2 36.8 L 90.8 36.8" stroke="#fff7d6" stroke-width="0.85" stroke-linecap="round" opacity="0.88"/>
</svg>

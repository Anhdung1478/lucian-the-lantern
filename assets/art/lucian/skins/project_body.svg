<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- PROJECT Lucian, top-down, facing +X. Angular neon-etched obsidian-carbon cyber-coat plates, chamfered pauldrons, glowing cyan spine node, sleek obsidian helmet with razor-sharp glowing neon-cyan visor top, chrome-cyan left pistol (muzzle at 46, -15) & boxy obsidian-cyan Senna cannon with twin cyan rings (muzzle at 46, 15). -->
  <defs>
    <radialGradient id="muzzle">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.38" stop-color="#80f6ff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#20d8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="senna_muzzle">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.38" stop-color="#38e8ff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#1494ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plate" gradientUnits="userSpaceOnUse" x1="-4" y1="0" x2="-50" y2="0">
      <stop offset="0" stop-color="#323b4d"/>
      <stop offset="0.55" stop-color="#1c222e"/>
      <stop offset="1" stop-color="#0f121a"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#bac5d4"/>
      <stop offset="1" stop-color="#586373"/>
    </linearGradient>
    <linearGradient id="cyberGun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4c586b"/>
      <stop offset="0.5" stop-color="#2b3340"/>
      <stop offset="1" stop-color="#171b24"/>
    </linearGradient>
  </defs>
  <g transform="translate(64 64)">
    <!-- Dark carbon under-frame between plates -->
    <path d="M -14 -2.5 L -46 -5.2 L -45 5.2 L -14 2.5 Z" fill="#090b10" stroke="#10141c" stroke-width="1.6" stroke-linejoin="round"/>
    <!-- Angular faceted obsidian-carbon cyber-coat tails (subtle asymmetric lead) -->
    <path d="M -3 -20.5 L -40.5 -33.5 L -48.5 -24.5 L -13.5 -13 Z" fill="url(#plate)" stroke="#0d1018" stroke-width="2" stroke-linejoin="round"/>
    <path d="M -14 -11.2 L -48.5 -21 L -49 -3.5 L -15.5 -2 Z" fill="url(#plate)" stroke="#0d1018" stroke-width="2" stroke-linejoin="round"/>
    <path d="M -6 20.5 L -40 32.8 L -47.5 24.2 L -14.5 13 Z" fill="url(#plate)" stroke="#0d1018" stroke-width="2" stroke-linejoin="round"/>
    <path d="M -15 11.2 L -47.5 20.6 L -48 3.6 L -15.5 2 Z" fill="url(#plate)" stroke="#0d1018" stroke-width="2" stroke-linejoin="round"/>
    <!-- Crisp neon-cyan edge etching & subtle magenta micro-accents -->
    <path d="M -6 -19.5 L -40 -31.4 L -46.2 -24.4" fill="none" stroke="#38e8ff" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M -8.5 19.6 L -39.5 30.8 L -45.4 24" fill="none" stroke="#38e8ff" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M -46.6 -19.5 L -47 -5 M -45.8 19.2 L -46.2 5" stroke="#5cf0ff" stroke-width="1.45" stroke-linecap="round"/>
    <path d="M -19 -8.8 L -36 -13.8 L -40 -8.8 M -19 8.8 L -35.5 13.6 L -39.5 8.8" fill="none" stroke="#38e8ff" stroke-width="0.95" stroke-linejoin="round" opacity="0.72"/>
    <path d="M -14 -17.5 L -29 -23 M -15 17.5 L -29 22.8" stroke="#ff42d8" stroke-width="0.95" stroke-linecap="round" opacity="0.68"/>
    <circle cx="-40" cy="-8.8" r="1.4" fill="#c8fcff"/>
    <circle cx="-39.5" cy="8.8" r="1.4" fill="#c8fcff"/>

    <!-- Angular carbon torso plate with glowing cyan spine node -->
    <path d="M -10 -21.5 L 4 -25.5 L 12.5 -18.5 L 13.2 -7.5 L 12.4 8 L 10.5 19 L 1.5 25.5 L -12.5 21.5 L -16 10 L -16 -10 Z" fill="#1a202b" stroke="#0d1018" stroke-width="2" stroke-linejoin="round"/>
    <path d="M -14.2 -7 L -14.2 7" stroke="#38e8ff" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M -14.2 -3 L -11.8 0 L -14.2 3 L -16.2 0 Z" fill="#e8feff" stroke="#2ee8ff" stroke-width="0.7"/>

    <!-- Cyber arms with neon seam & metallic gauntlets -->
    <path d="M 3 -20.5 L 18 -16" stroke="#0d1018" stroke-width="11" stroke-linecap="round"/>
    <path d="M 3 -20.5 L 18 -16" stroke="#1f2633" stroke-width="7.8" stroke-linecap="round"/>
    <path d="M 1 20.5 L 17 16.2" stroke="#0d1018" stroke-width="11" stroke-linecap="round"/>
    <path d="M 1 20.5 L 17 16.2" stroke="#1b212d" stroke-width="7.8" stroke-linecap="round"/>
    <path d="M 4.5 -23.6 L 14 -21 M 3 23.8 L 13 21.2" stroke="#38e8ff" stroke-width="1.25" stroke-linecap="round"/>
    <path d="M 15.6 -20.6 L 13.4 -12.2 M 14.8 20.8 L 12.6 12.4" stroke="#0d1018" stroke-width="4" stroke-linecap="round"/>
    <path d="M 15.6 -20.6 L 13.4 -12.2 M 14.8 20.8 L 12.6 12.4" stroke="#8593a6" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Chamfered armored pauldrons -->
    <path d="M -9.5 -20 L -0.5 -27.2 L 9 -23.8 L 7.2 -16 L -2.8 -14.8 Z" fill="#2c3545" stroke="#0d1018" stroke-width="1.75" stroke-linejoin="round"/>
    <path d="M -11 20 L -2.5 27.2 L 7 24.2 L 5.5 16.2 L -4.2 15 Z" fill="#272f3e" stroke="#0d1018" stroke-width="1.75" stroke-linejoin="round"/>
    <path d="M -7.5 -20.4 L -0.5 -25.4 L 7 -22.8 M -9 20.4 L -2.2 25.4 L 5.4 23" fill="none" stroke="#8cfaff" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M -2.2 -16.8 L 5.5 -18 M -3.5 17 L 4.2 18.2" stroke="#ff42d8" stroke-width="0.85" stroke-linecap="round" opacity="0.72"/>

    <!-- LEFT GUN (Lucian's): slim angular chrome-cyan pulse pistol, muzzle strictly at (46, -15) -->
    <path d="M 17 -18.2 L 41.2 -18.2 L 43.8 -16.4 L 43.8 -13.6 L 41.2 -11.8 L 17 -11.8 L 15.8 -15 Z" fill="url(#chrome)" stroke="#0d1018" stroke-width="1.75" stroke-linejoin="round"/>
    <path d="M 22.5 -18.2 L 22.5 -11.8 M 38 -18.2 L 38 -11.8" stroke="#1e242e" stroke-width="1"/>
    <path d="M 25.2 -15 L 36.2 -15" stroke="#2ee8ff" stroke-width="2.3" stroke-linecap="round"/>
    <path d="M 25.2 -15 L 36.2 -15" stroke="#ffffff" stroke-width="0.95" stroke-linecap="round"/>
    <rect x="43" y="-16.8" width="3" height="3.6" fill="#1e242e" stroke="#0d1018" stroke-width="0.8"/>

    <!-- RIGHT GUN (Senna's): boxy obsidian-carbon cyber cannon with cyan core & TWO glowing cyan rings, muzzle strictly at (46, 15) -->
    <rect x="25" y="6.2" width="16.5" height="17.6" rx="4" fill="#38e8ff" opacity="0.24"/>
    <path d="M 13 7.4 L 25 7.4 L 25 22.6 L 13 22.6 L 10 19.6 L 10 10.4 Z" fill="url(#cyberGun)" stroke="#0d1018" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M 11.6 10.4 L 13.8 9 L 23.6 9" fill="none" stroke="#24b6cc" stroke-width="1.15" stroke-linejoin="round"/>
    <rect x="11.6" y="13" width="4" height="4" fill="#8cfaff" stroke="#0d1018" stroke-width="0.95"/>
    <rect x="24" y="9.8" width="19" height="10.4" fill="url(#cyberGun)" stroke="#0d1018" stroke-width="1.8"/>
    <path d="M 25.6 11.6 L 41.4 11.6" stroke="#24b6cc" stroke-width="1.15"/>
    <rect x="27.5" y="7.4" width="3.5" height="15.2" fill="#8cfaff" stroke="#0d1018" stroke-width="1.15"/>
    <rect x="35" y="7.4" width="3.5" height="15.2" fill="#8cfaff" stroke="#0d1018" stroke-width="1.15"/>
    <path d="M 29.2 9 L 29.2 21 M 36.7 9 L 36.7 21" stroke="#ffffff" stroke-width="0.9" stroke-linecap="round"/>
    <rect x="42" y="9" width="4" height="12" fill="#141820" stroke="#0d1018" stroke-width="1.2"/>
    <path d="M 43.2 10.6 L 43.2 19.4" stroke="#38e8ff" stroke-width="0.9"/>

    <!-- Armored cyber-gloves -->
    <path d="M 16.5 -18.4 Q 20.5 -19.2 23.2 -17.4 Q 24.4 -15 23.2 -12.6 Q 20.5 -10.8 16.5 -11.6 Q 15.2 -15 16.5 -18.4 Z" fill="#1a202c" stroke="#0d1018" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M 16.5 11.6 Q 20.5 10.8 23.2 12.6 Q 24.4 15 23.2 17.4 Q 20.5 19.2 16.5 18.4 Q 15.2 15 16.5 11.6 Z" fill="#1a202c" stroke="#0d1018" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M 17.6 -17.4 L 22 -17.4 M 17.6 12.6 L 22 12.6" stroke="#38e8ff" stroke-width="1.05" stroke-linecap="round"/>

    <!-- Muzzle glows strictly at (46, -15) and (46, 15) -->
    <circle cx="46" cy="-15" r="7" fill="url(#muzzle)"/>
    <circle cx="46" cy="15" r="7" fill="url(#senna_muzzle)"/>

    <!-- High angular tech collar -->
    <path d="M 6.5 -12.2 L -3.5 -15.8 L -12 -11 L -15 0 L -12 11 L -3.5 15.8 L 6.5 12.2 L 4.8 8.8 L -2.8 11.8 L -8.8 8.4 L -10.8 0 L -8.8 -8.4 L -2.8 -11.8 L 4.8 -8.8 Z" fill="#272f3e" stroke="#0d1018" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M 3.5 -13.2 L -3.5 -14.2 L -10.4 -10 L -13.2 0 L -10.4 10 L -3.5 14.2 L 3.5 13.2" fill="none" stroke="#5cf0ff" stroke-width="1.15" stroke-linejoin="round"/>

    <!-- Angular obsidian-carbon PROJECT helmet seen from top-down with glowing neon-cyan visor -->
    <rect x="-0.8" y="-11.4" width="5" height="3.2" rx="1" fill="#272f3e" stroke="#0d1018" stroke-width="0.95"/>
    <rect x="-0.8" y="8.2" width="5" height="3.2" rx="1" fill="#272f3e" stroke="#0d1018" stroke-width="0.95"/>
    <path d="M -8.2 0 L -5.5 -8.2 L 3 -10 L 11 -6.5 L 12.4 0 L 11 6.5 L 3 10 L -5.5 8.2 Z" fill="#1a202c" stroke="#0d1018" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- Helmet angular crown facets & cyan circuit trace -->
    <path d="M -6.2 0 L -3.5 -5.8 L 4.5 -7 L 6.8 0 L 4.5 7 L -3.5 5.8 Z" fill="#2b3446"/>
    <path d="M -5 0 L 6.8 0" stroke="#0d1018" stroke-width="1.1"/>
    <path d="M -3.5 -5.8 L 4.5 -7 M -3.5 5.8 L 4.5 7" stroke="#38e8ff" stroke-width="0.9" stroke-linecap="round"/>
    <!-- Razor-sharp glowing neon-cyan optical visor across front -->
    <path d="M 6.8 -8.2 L 13 0 L 6.8 8.2" fill="none" stroke="#2ee8ff" stroke-width="5.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.34"/>
    <path d="M 6.8 -8.2 L 13 0 L 6.8 8.2" fill="none" stroke="#0a0d14" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 7.2 -7.6 L 12.4 0 L 7.2 7.6" fill="none" stroke="#b8fcff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 8 -6.6 L 12 0 L 8 6.6" fill="none" stroke="#ffffff" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>

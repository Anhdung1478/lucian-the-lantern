  <circle cx="83" cy="33" r="7" fill="url(#glow)"/>
  <g transform="rotate(6 83 60)">
    <path d="M 79.6 58 L 75 58 L 75 66 L 80 66" fill="none" stroke="#1a1d24" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M 79.6 58 L 75 58 L 75 66 L 80 66" fill="none" stroke="#38e8ff" stroke-width="0.9" stroke-linejoin="round"/>
    <path d="M 80.4 36 L 86 36 L 86 58 L 87.6 60 L 87.6 63 L 79.4 63 L 79.4 57 L 80.4 56 Z" fill="url(#chrome)" stroke="#1a1d24" stroke-width="0.8" stroke-linejoin="round"/>
    <rect x="80.8" y="33.4" width="4.6" height="3" fill="#2a3038" stroke="#1a1d24" stroke-width="0.6"/>
    <path d="M 83.2 39 L 83.2 53" stroke="#38e8ff" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 83.2 39 L 83.2 53" stroke="#e8feff" stroke-width="0.7" stroke-linecap="round"/>
    <path d="M 80 44 L 86.4 44 M 80 55 L 86.4 55" stroke="#2a3038" stroke-width="0.6"/>
    <path d="M 80.2 63 L 87.6 63 L 91.6 76 L 84.6 77.4 Z" fill="#1c2029" stroke="#1a1d24" stroke-width="0.8" stroke-linejoin="round"/>

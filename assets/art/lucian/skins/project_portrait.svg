  <rect x="10" y="29" width="4" height="1" fill="#38e8ff" opacity="0.8"/>
  <rect x="78" y="16" width="11" height="1.4" fill="#ff3ad8" opacity="0.6"/>
  <rect x="84" y="52" width="6" height="1.2" fill="#ff3ad8" opacity="0.6"/>
  <rect x="3" y="48" width="5" height="1" fill="#7ff4ff" opacity="0.7"/>

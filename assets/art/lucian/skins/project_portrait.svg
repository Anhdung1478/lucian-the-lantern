<svg xmlns="http://www.w3.org/2000/svg" width="384" height="384" viewBox="0 0 96 96">
  <!-- PROJECT Lucian: sleek cybernetic hunter 3/4 bust. Predatory angular obsidian-carbon helmet with razor-sharp V-angled glowing neon-cyan optical visor slit & armored metallic cheek/jaw plates framing his sculpted lower jaw and beard, layered dark-tech armor plates with crisp neon cyan circuit seams, dark holographic cyber-grid & cyan-magenta bokeh flares behind, angular side-profile chrome-cyan gun in foreground. -->
  <defs>

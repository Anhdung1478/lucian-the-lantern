  <path d="M 36 70 L 48.5 84 L 61 70" fill="none" stroke="#7ff4ff" stroke-width="1.1" stroke-linejoin="round"/>
  <path d="M 48.5 84 L 48.5 96 M 30 80 L 40 92 M 67 80 L 57 92" stroke="#38e8ff" stroke-width="0.8" opacity="0.8"/>
  <path d="M 48.5 81 L 51.5 84 L 48.5 87 L 45.5 84 Z" fill="#e8feff" stroke="#38e8ff" stroke-width="0.8"/>

  <path d="M 41 16.8 C 37 18.5 33.5 24 34 34 L 34 41 C 34 49 37 55 42 59.5 C 44 61.5 46 62.8 48 63 L 46.5 59.5 C 42.5 55.5 40.5 50 41 44.5 C 41.4 40 39.6 36.5 40 31.5 C 40.5 25.5 42.5 20.5 46 16.4 Z" fill="#3e271b" opacity="0.45"/>
  <path d="M 58.5 18.6 C 61.8 21.6 63.5 27 63.5 33 L 63.5 41 C 63.5 48.5 60.5 54.5 55.5 58.6" fill="none" stroke="#7ff4ff" stroke-width="1.1" stroke-linecap="round"/>
  <!-- short black hair with a lit line along the side -->
  <path d="M 33.6 34 C 32.8 22 39 14.4 48.5 14.4 C 58 14.4 64.2 22 63.9 34 L 62.6 30.5 C 62 26.5 60 24.6 57 23.9 C 54 23.3 51 23.7 48.5 23.7 C 46 23.7 43 23.3 40 23.9 C 37 24.6 35 26.5 34.6 30.5 Z" fill="#161110" stroke="#1a1d24" stroke-width="0.6"/>
  <path d="M 52 16.4 Q 58.6 17.8 61.6 23" fill="none" stroke="#4a6a78" stroke-width="1.1" stroke-linecap="round"/>
  <path d="M 57.5 19.5 L 61.5 25 L 62.6 30" fill="none" stroke="#38e8ff" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 34.6 30.5 L 34.4 37 L 36 37 L 36.2 31 Z M 62.6 30.5 L 62.8 37 L 61.2 37 L 61 31 Z" fill="#161110"/>
  <!-- nose -->
  <path d="M 47 42 Q 46.2 44.4 45.4 46" fill="none" stroke="#3e271b" stroke-width="0.9" stroke-linecap="round"/>
  <path d="M 44.6 46.4 Q 45.4 48.6 48.5 48 Q 51.6 48.6 52.4 46.4" fill="none" stroke="#3a2418" stroke-width="1" stroke-linecap="round"/>
  <ellipse cx="49.8" cy="45.6" rx="1.3" ry="0.9" fill="#8fd8e0" opacity="0.5"/>
  <!-- short beard and moustache -->
  <path d="M 34.2 40 C 34.4 48 37.5 54.5 42 59.5 C 44 61.5 46.5 63.2 48.5 63.2 C 50.5 63.2 52.5 61.5 55 59 C 60 55 63.3 49 63.3 40 L 62.2 41 C 62 47 59.8 52 55.6 56.4 Q 54.6 55.6 54.2 51.6 Q 53.6 54.8 52 56 Q 48.5 57.2 45 56 Q 43.4 54.8 42.8 51.6 Q 42.4 55.6 41.4 56.4 C 37.2 52 35.2 47 35.2 41 Z" fill="#1c1513"/>
  <path d="M 42.4 51 C 44.4 48.7 47 48.5 48.5 49.3 C 50 48.5 52.6 48.7 54.6 51 C 52.5 50.4 50.5 50.7 48.5 51.1 C 46.5 50.7 44.5 50.4 42.4 51 Z" fill="#1c1513"/>
  <path d="M 44.6 52.4 Q 48.5 53.5 52.4 52.4" fill="none" stroke="#2a1812" stroke-width="0.8" stroke-linecap="round"/>
  <path d="M 45.6 53.4 Q 48.5 55.4 51.4 53.4 Q 48.5 54.2 45.6 53.4 Z" fill="#7c4a3a"/>
  <path d="M 56.5 54 C 59.5 51.5 61.5 47 61.8 42" fill="none" stroke="#38e8ff" stroke-width="0.6" stroke-linecap="round" opacity="0.8"/>
  <!-- the visor: a glowing band across his eyes, wired to the earpiece -->
  <path d="M 30 39 Q 48.5 36 67 39" fill="none" stroke="#38e8ff" stroke-width="10" stroke-linecap="round" opacity="0.18"/>
  <path d="M 32 35.4 Q 48.5 33.4 65 35.4 L 65.6 41.2 Q 48.5 44.2 31.4 41.2 Z" fill="#10141c" stroke="#1a1d24" stroke-width="0.8" stroke-linejoin="round"/>
  <path d="M 33.4 36.6 Q 48.5 34.8 63.6 36.6 L 64 40.2 Q 48.5 42.8 33 40.2 Z" fill="url(#visor)"/>
  <path d="M 35 38.4 Q 48.5 36.6 62 38.4" fill="none" stroke="#ffffff" stroke-width="0.8" stroke-linecap="round"/>
  <path d="M 38.4 39.6 L 44.4 39.6 M 52.6 39.6 L 58.6 39.6" stroke="#1aa8d8" stroke-width="0.9" stroke-linecap="round" opacity="0.8"/>
  <rect x="62.6" y="36.6" width="5.6" height="9" rx="1.6" fill="#1c2029" stroke="#1a1d24" stroke-width="0.7"/>
  <circle cx="65.4" cy="41.2" r="1.7" fill="#7ff4ff" stroke="#1aa8d8" stroke-width="0.6"/>
  <rect x="28.8" y="36.6" width="4.6" height="8" rx="1.4" fill="#14171e" stroke="#1a1d24" stroke-width="0.7"/>
  <path d="M 31.1 38.4 L 31.1 43" stroke="#38e8ff" stroke-width="0.7" stroke-linecap="round"/>

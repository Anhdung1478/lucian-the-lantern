      <stop offset="0" stop-color="#0e2c4f"/>
      <stop offset="0.45" stop-color="#08162b"/>
      <stop offset="0.82" stop-color="#040b18"/>
      <stop offset="1" stop-color="#02050c"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="0.5" cy="0.5" r="0.5">

  <path d="M 6 88 L 12 77 L 27 71 L 30 78 L 16 84 Z" fill="#232833" stroke="#38e8ff" stroke-width="0.8" stroke-linejoin="round"/>
  <path d="M 90 88 L 84 77 L 69 71 L 66 78 L 80 84 Z" fill="#2e3544" stroke="#38e8ff" stroke-width="0.8" stroke-linejoin="round"/>

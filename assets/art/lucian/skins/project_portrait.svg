<svg xmlns="http://www.w3.org/2000/svg" width="384" height="384" viewBox="0 0 96 96">
  <!-- PROJECT Lucian portrait: facing the viewer in a cyan-lit armored suit. A glowing cyan visor across his eyes wired to an earpiece, short black hair with a lit line along the side, a short beard; a high armored collar and chest plates traced in neon; his chrome gun raised at his side. Behind him a neon grid with a holo ring and magenta glitches, cyan light on the right of his face. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1e3a"/>
      <stop offset="0.6" stop-color="#081428"/>
      <stop offset="1" stop-color="#050a16"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7ff4ff" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#38e8ff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#38e8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f3223"/>
      <stop offset="0.45" stop-color="#6a4532"/>
      <stop offset="1" stop-color="#7a5642"/>
    </linearGradient>
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0e1117"/>
      <stop offset="0.6" stop-color="#1c2029"/>
      <stop offset="1" stop-color="#2a3140"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8feff"/>
      <stop offset="0.45" stop-color="#7ff4ff"/>
      <stop offset="1" stop-color="#1aa8d8"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5e6875"/>
      <stop offset="0.5" stop-color="#f4f8fc"/>
      <stop offset="1" stop-color="#8d98a6"/>
    </linearGradient>
  </defs>
  <!-- neon grid -->
  <rect width="96" height="96" fill="url(#bg)"/>
  <path d="M 8 0 L 8 62 M 20 0 L 20 62 M 32 0 L 32 62 M 64 0 L 64 62 M 76 0 L 76 62 M 88 0 L 88 62 M 0 10 L 96 10 M 0 22 L 96 22 M 0 34 L 96 34 M 0 46 L 96 46 M 0 58 L 96 58" stroke="#38e8ff" stroke-width="0.4" opacity="0.25"/>
  <rect y="62" width="96" height="34" fill="#061226"/>
  <path d="M 0 62 L 96 62" stroke="#7ff4ff" stroke-width="0.9" opacity="0.8"/>
  <path d="M 0 65.5 L 96 65.5 M 0 70.5 L 96 70.5 M 0 78 L 96 78 M 0 89 L 96 89" stroke="#38e8ff" stroke-width="0.6" opacity="0.55"/>
  <path d="M 48 62 L -40 96 M 48 62 L -8 96 M 48 62 L 20 96 M 48 62 L 76 96 M 48 62 L 104 96 M 48 62 L 136 96" stroke="#38e8ff" stroke-width="0.6" opacity="0.55"/>
  <circle cx="48.5" cy="38" r="40" fill="url(#glow)"/>
  <circle cx="48.5" cy="38" r="27" fill="none" stroke="#7ff4ff" stroke-width="0.8" opacity="0.6"/>
  <path d="M 21.5 38 L 17 38 M 80 38 L 75.5 38 M 48.5 11 L 48.5 7" stroke="#7ff4ff" stroke-width="0.8" opacity="0.7"/>
  <path d="M 26 20 A 27 27 0 0 1 36 13.6" fill="none" stroke="#e8feff" stroke-width="1.4" stroke-linecap="round" opacity="0.8"/>

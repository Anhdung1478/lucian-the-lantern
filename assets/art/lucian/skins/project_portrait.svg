    <path d="M 78.6 64.4 Q 84 62.4 90 64.6 L 91.4 73 Q 85 75.6 79.4 73.6 Z" fill="#1c2029" stroke="#1a1d24" stroke-width="0.8" stroke-linejoin="round"/>
    <path d="M 79 67.2 Q 84.4 65.8 90.2 67.6 M 79.2 70.2 Q 84.6 69 90.6 70.6" fill="none" stroke="#38e8ff" stroke-width="0.5" opacity="0.8"/>
    <path d="M 78.6 74 Q 85 76.8 91.6 73.8 L 93 96 L 77 96 Z" fill="#1c2029" stroke="#1a1d24" stroke-width="0.8" stroke-linejoin="round"/>
    <path d="M 78.6 74 Q 85 76.8 91.6 73.8" fill="none" stroke="#7ff4ff" stroke-width="1"/>

<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Vampire Lucian (Gothic Hunter), top-down, facing +X. Aristocratic obsidian-black coat with tattered crimson-lined bat-wing cape tails & silver filigree rim, lace cuffs, sculpted high crimson-lined velvet collar, slicked-back dark hair with silver sheen & widow's peak, ornate silver-and-ruby left pistol (muzzle at 46, -15) & obsidian-iron crimson-ringed Senna cannon (muzzle at 46, 15). -->
  <defs>
    <radialGradient id="muzzle">
      <stop offset="0" stop-color="#fff0f2"/>
      <stop offset="0.38" stop-color="#ff5c72" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#e01434" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="senna_muzzle">
      <stop offset="0" stop-color="#fff0f2"/>
      <stop offset="0.38" stop-color="#ff2e4c" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#a80a22" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="capeTail" gradientUnits="userSpaceOnUse" x1="-4" y1="0" x2="-50" y2="0">
      <stop offset="0" stop-color="#2c1b29"/>
      <stop offset="0.55" stop-color="#190f18"/>
      <stop offset="1" stop-color="#0d070d"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#cfd5e0"/>
      <stop offset="1" stop-color="#68707d"/>
    </linearGradient>
    <linearGradient id="obsidianGun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3e303c"/>
      <stop offset="0.5" stop-color="#221922"/>
      <stop offset="1" stop-color="#100b10"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#110c12"/>
      <stop offset="0.55" stop-color="#241a24"/>
      <stop offset="1" stop-color="#332634"/>
    </linearGradient>
  </defs>
  <g transform="translate(64 64)">
    <!-- Deep blood-crimson cape lining in split -->
    <path d="M -14 -2.5 L -47 -5.8 L -46 6.2 L -14 2.5 Z" fill="#7a0a20" stroke="#110810" stroke-width="1.6" stroke-linejoin="round"/>
    <!-- Asymmetric tattered gothic bat-wing coat tails -->
    <path d="M -2 -20 C -13 -28 -29 -34 -43.5 -33.5 Q -40.5 -26.5 -48.5 -23 Q -43.5 -17.5 -50 -12.5 Q -44 -7.5 -48 -2.5 L -15 -1.5 Q -9 -10 -2 -20 Z" fill="url(#capeTail)" stroke="#0f070e" stroke-width="2" stroke-linejoin="round"/>
    <path d="M -5 20 C -15 28 -30 33.5 -42.5 33 Q -39.8 26.2 -47.5 22.8 Q -42.8 17.5 -49 12.5 Q -43.2 7.5 -47 2.8 L -15 1.5 Q -9.5 10 -5 20 Z" fill="url(#capeTail)" stroke="#0f070e" stroke-width="2" stroke-linejoin="round"/>
    <!-- Vivid blood-crimson lining peeking along tattered hem -->
    <path d="M -41.5 -31.2 Q -38.8 -26.2 -46 -23 Q -41.2 -17.6 -47.2 -12.6 Q -42 -7.8 -45.4 -4 L -16.5 -3" fill="none" stroke="#d41434" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M -40.8 30.8 Q -38.2 26 -45 22.8 Q -40.5 17.6 -46.2 12.6 Q -41.2 7.8 -44.6 4 L -16.5 3" fill="none" stroke="#d41434" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Velvet folds & silver filigree outer rim -->
    <path d="M -12 -11.5 Q -27.5 -16.8 -42 -18.2 M -9 -18.5 Q -23.5 -24.5 -38 -26.5" fill="none" stroke="#452f42" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M -13 11.5 Q -27.5 16.8 -41.5 18 M -11 18.5 Q -24 24.5 -37.5 26" fill="none" stroke="#452f42" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M -5 -19 C -15 -26 -29.5 -31.2 -42 -31.2 M -7 19 C -16.5 26 -29.5 30.8 -41.2 30.8" fill="none" stroke="#ebd8e2" stroke-width="1.35" stroke-linecap="round"/>

    <!-- Back & shoulders -->
    <path d="M -10 -21 Q -3 -27.5 6 -25 Q 13 -22.5 13.5 -15 L 13 -7 Q 13.8 0 12.6 8 L 11.8 16 Q 10 23.8 2.5 25.5 Q -6.5 27 -12.5 20.5 Q -16.5 10.5 -16 0 Q -15.5 -11 -10 -21 Z" fill="#1d131e" stroke="#0f070e" stroke-width="2" stroke-linejoin="round"/>

    <!-- Arms with blood-crimson cuffs & delicate silver-ivory lace -->
    <path d="M 3 -20.5 L 18 -16" stroke="#0f070e" stroke-width="11" stroke-linecap="round"/>
    <path d="M 3 -20.5 L 18 -16" stroke="#241825" stroke-width="7.8" stroke-linecap="round"/>
    <path d="M 1 20.5 L 17 16.2" stroke="#0f070e" stroke-width="11" stroke-linecap="round"/>
    <path d="M 1 20.5 L 17 16.2" stroke="#201521" stroke-width="7.8" stroke-linecap="round"/>
    <path d="M 4.5 -23.6 L 13.5 -21 M 3 23.8 L 13 21.2" stroke="#99778b" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M 14.8 -20.8 L 12.6 -12.4 M 14 21 L 11.8 12.6" stroke="#0f070e" stroke-width="4" stroke-linecap="round"/>
    <path d="M 14.8 -20.8 L 12.6 -12.4 M 14 21 L 11.8 12.6" stroke="#b8102c" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 17 -19.8 L 15.2 -13 M 16.2 20 L 14.4 13.2" stroke="#f2e6ea" stroke-width="1.9" stroke-linecap="round"/>

    <!-- Sculpted gothic velvet shoulders with silver filigree rim -->
    <path d="M -8.5 -21 Q -1 -27 7.5 -23.5 Q 8.5 -18.2 2 -16 Q -5.5 -15.5 -8.5 -21 Z" fill="#302032" stroke="#0f070e" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M -10.5 21 Q -3 26.8 5.5 23.8 Q 6.5 18.5 0 16.2 Q -7.5 15.8 -10.5 21 Z" fill="#2a1c2c" stroke="#0f070e" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M -7.5 -23 Q 0 -26.8 7.5 -24.2 M -9.5 23 Q -2 26.8 5.8 24.4" fill="none" stroke="#ebd8e2" stroke-width="1.3" stroke-linecap="round"/>

    <!-- LEFT GUN (Lucian's): ornate silver-and-ruby relic pistol, muzzle strictly at (46, -15) -->
    <path d="M 17 -18.2 L 41.2 -18.2 Q 43.6 -18 43.8 -16.2 L 43.8 -13.8 Q 43.6 -12 41.2 -11.8 L 17 -11.8 Q 15.2 -15 17 -18.2 Z" fill="url(#silver)" stroke="#0f070e" stroke-width="1.75" stroke-linejoin="round"/>
    <path d="M 30.2 -15 L 40.4 -15" stroke="#ff2e4c" stroke-width="2.1" stroke-linecap="round"/>
    <path d="M 30.2 -15 L 40.4 -15" stroke="#ffd8e0" stroke-width="0.85" stroke-linecap="round"/>
    <!-- Faceted ruby jewel on chamber -->
    <path d="M 21.4 -15 L 25.2 -18 L 29 -15 L 25.2 -12 Z" fill="#e61434" stroke="#0f070e" stroke-width="1" stroke-linejoin="round"/>
    <path d="M 23.6 -15.6 L 25.2 -17 L 26.6 -15.8" fill="none" stroke="#ffc4ce" stroke-width="0.85" stroke-linecap="round"/>
    <path d="M 43.2 -17 L 46 -16 L 46 -14 L 43.2 -13 Z" fill="#7d8491" stroke="#0f070e" stroke-width="0.9" stroke-linejoin="round"/>

    <!-- RIGHT GUN (Senna's): obsidian-iron gothic cannon with ruby core & TWO glowing crimson rings, muzzle strictly at (46, 15) -->
    <rect x="25" y="6.2" width="16.5" height="17.6" rx="5" fill="#ff2e4c" opacity="0.24"/>
    <path d="M 11 8.8 L 25 7.4 L 25 22.6 L 11 21.2 Q 7.4 15 11 8.8 Z" fill="url(#obsidianGun)" stroke="#0f070e" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M 11.8 10.4 L 23.6 9.2 M 11.8 19.6 L 23.6 20.8" stroke="#d41434" stroke-width="1.15" stroke-linecap="round"/>
    <circle cx="13.2" cy="15" r="2.3" fill="#ff3654" stroke="#0f070e" stroke-width="0.95"/>
    <circle cx="13.2" cy="15" r="1" fill="#ffd8e0"/>
    <rect x="24" y="9.8" width="19" height="10.4" rx="2" fill="url(#obsidianGun)" stroke="#0f070e" stroke-width="1.8"/>
    <path d="M 25.8 11.6 L 41.2 11.6" stroke="#d41434" stroke-width="1.15" stroke-linecap="round"/>
    <rect x="27.5" y="7.4" width="3.5" height="15.2" rx="1.3" fill="#ff3654" stroke="#0f070e" stroke-width="1.15"/>
    <rect x="35" y="7.4" width="3.5" height="15.2" rx="1.3" fill="#ff3654" stroke="#0f070e" stroke-width="1.15"/>
    <path d="M 29.2 9 L 29.2 21 M 36.7 9 L 36.7 21" stroke="#ffc4ce" stroke-width="0.95" stroke-linecap="round"/>
    <path d="M 42 9 L 46 11.5 L 46 18.5 L 42 21 Z" fill="#12090e" stroke="#0f070e" stroke-width="1.4" stroke-linejoin="round"/>

    <!-- Sculpted gripping hands -->
    <path d="M 16.5 -18.4 Q 20.5 -19.2 23.2 -17.4 Q 24.4 -15 23.2 -12.6 Q 20.5 -10.8 16.5 -11.6 Q 15.2 -15 16.5 -18.4 Z" fill="#593a31" stroke="#0f070e" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M 16.5 11.6 Q 20.5 10.8 23.2 12.6 Q 24.4 15 23.2 17.4 Q 20.5 19.2 16.5 18.4 Q 15.2 15 16.5 11.6 Z" fill="#593a31" stroke="#0f070e" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M 18.2 -17.4 Q 20.8 -17.8 22.2 -16 M 18.2 12.6 Q 20.8 12.2 22.2 14" fill="none" stroke="#8c5f54" stroke-width="1.1" stroke-linecap="round"/>

    <!-- Muzzle glows strictly at (46, -15) and (46, 15) -->
    <circle cx="46" cy="-15" r="7" fill="url(#muzzle)"/>
    <circle cx="46" cy="15" r="7" fill="url(#senna_muzzle)"/>

    <!-- Tailored high sculpted gothic velvet collar (black outside, crimson inside, silver filigree rim — sleek, not cartoonish) -->
    <path d="M 9 -14.8 Q 1 -19.2 -7.5 -16.8 Q -15.5 -12.5 -17.2 0 Q -15.5 12.5 -7.5 16.8 Q 1 19.2 8.5 14.8 L 4.5 10.2 Q -2.5 13 -7.8 8.6 Q -11 0 -7.8 -8.6 Q -2.5 -13 4.8 -10.2 Z" fill="#1d121d" stroke="#0f070e" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M 6 -13 Q -2.5 -15.8 -8.8 -11.6 Q -13.5 -5.8 -13.5 0 Q -13.5 5.8 -8.8 11.6 Q -2.5 15.8 5.6 13 L 4.5 10.2 Q -2.5 13 -7.8 8.6 Q -11 0 -7.8 -8.6 Q -2.5 -13 4.8 -10.2 Z" fill="#b8102c"/>
    <path d="M 5.5 -15.8 Q -2.5 -18 -9.5 -14.5 Q -15.4 -9.2 -15.8 0 Q -15.4 9.2 -9.5 14.5 Q -2.5 18 5 15.6" fill="none" stroke="#ebd8e2" stroke-width="1.15" stroke-linecap="round"/>

    <!-- Head: aristocratic slicked-back dark hair with silver moonlight sheen & widow's peak -->
    <ellipse cx="1.8" cy="-9.8" rx="2.3" ry="1.7" fill="#4a3028" stroke="#0f070e" stroke-width="0.95"/>
    <ellipse cx="1.5" cy="9.8" rx="2.3" ry="1.7" fill="#4a3028" stroke="#0f070e" stroke-width="0.95"/>
    <circle cx="2" cy="0" r="9.8" fill="#634034" stroke="#0f070e" stroke-width="1.8"/>
    <path d="M 8.5 -3.6 Q 9.8 0 8.5 3.6" fill="none" stroke="#8f6258" stroke-width="1.05" stroke-linecap="round"/>
    <path d="M 11.2 -1.7 Q 13.6 0 11.2 1.7 Z" fill="#4f3229" stroke="#0f070e" stroke-width="0.85" stroke-linejoin="round"/>
    <path d="M 4.4 -8.4 Q -1 -10.6 -6.8 -6 Q -9.4 0 -6.8 6 Q -1 10.6 4.4 8.4 Q 5.2 3.8 8.4 0 Q 5.2 -3.8 4.4 -8.4 Z" fill="url(#hair)"/>
    <path d="M 4 -3.6 Q -1 -4.6 -6 -3.4 M 4 3.6 Q -1 4.6 -6 3.4 M 5.8 0 L -5.5 0" fill="none" stroke="#756173" stroke-width="0.95" stroke-linecap="round"/>
  </g>
</svg>

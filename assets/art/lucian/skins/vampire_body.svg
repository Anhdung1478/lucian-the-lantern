<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Vampire Lucian, top-down, facing +X: crimson-and-black coat, a high collar with red lining, silver guns. Center of the image = center of his body. -->
  <defs>
    <radialGradient id="muzzle">
      <stop offset="0" stop-color="#fff0f0"/>
      <stop offset="0.4" stop-color="#ff6a78" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#d01830" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a0812"/>
      <stop offset="1" stop-color="#9a1628"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f6f9"/>
      <stop offset="1" stop-color="#8a929e"/>
    </linearGradient>
  </defs>
  <g transform="translate(64 64)">
    <!-- shadow -->
    <ellipse cx="-4" cy="3" rx="34" ry="30" fill="#000000" opacity="0.28"/>
    <!-- crimson coat flaring out behind him, black hem, red lining at the split -->
    <path d="M -4 -23 L -38 -33 Q -47 -16 -45 -3 L -16 -2 Z" fill="url(#coat)" stroke="#140609" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M -4 23 L -38 33 Q -47 16 -45 3 L -16 2 Z" fill="url(#coat)" stroke="#140609" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M -17 -3.5 L -43 -4.5 M -17 3.5 L -43 4.5" stroke="#ff3a50" stroke-width="2" stroke-linecap="round"/>
    <!-- arms reaching forward -->
    <path d="M 0 -20 L 20 -15" stroke="#1a0a10" stroke-width="10" stroke-linecap="round"/>
    <path d="M 0 20 L 20 15" stroke="#1a0a10" stroke-width="10" stroke-linecap="round"/>
    <path d="M 4 -21 L 18 -17" stroke="#c01830" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 4 21 L 18 17" stroke="#c01830" stroke-width="1.5" stroke-linecap="round"/>
    <!-- silver guns with a red gem -->
    <path d="M 18 -19 L 42 -18 L 44 -15 L 42 -12 L 18 -11 Z" fill="url(#silver)" stroke="#3a3a44" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M 18 19 L 42 18 L 44 15 L 42 12 L 18 11 Z" fill="url(#silver)" stroke="#3a3a44" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M 32 -15 L 40 -15" stroke="#6c7480" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 32 15 L 40 15" stroke="#6c7480" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="28" cy="-15" r="2.4" fill="#e01830"/>
    <circle cx="28" cy="15" r="2.4" fill="#e01830"/>
    <!-- hands -->
    <circle cx="20" cy="-15" r="4.5" fill="#5a3e36"/>
    <circle cx="20" cy="15" r="4.5" fill="#5a3e36"/>
    <!-- muzzle light -->
    <circle cx="46" cy="-15" r="7" fill="url(#muzzle)"/>
    <circle cx="46" cy="15" r="7" fill="url(#muzzle)"/>
    <!-- shoulders and torso -->
    <ellipse cx="0" cy="0" rx="15" ry="26" fill="#1a0a10" stroke="#c01830" stroke-width="2"/>
    <path d="M -10 -21 L -10 21" stroke="#5a0c18" stroke-width="3"/>
    <!-- the high collar standing around the back of his head: black outside, red lining -->
    <path d="M 7 -16 Q -14 -24 -17 0 Q -14 24 7 16 Q -9 12 -9 0 Q -9 -12 7 -16 Z" fill="#140609" stroke="#c01830" stroke-width="1"/>
    <path d="M 5 -14 Q -10 -17 -12 0 Q -10 17 5 14 Q -7 10 -7 0 Q -7 -10 5 -14 Z" fill="#e01830"/>
    <!-- head: slicked-back black hair -->
    <circle cx="2" cy="0" r="11" fill="#5a3e36"/>
    <circle cx="0" cy="0" r="9.5" fill="#100c10"/>
    <path d="M -6 -4 L 5 -2 M -6 4 L 5 2" stroke="#3a3040" stroke-width="1" stroke-linecap="round"/>
    <path d="M 9 -5 Q 12 0 9 5" fill="none" stroke="#6e5048" stroke-width="2"/>
  </g>
</svg>

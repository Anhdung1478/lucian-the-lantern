<svg xmlns="http://www.w3.org/2000/svg" width="384" height="384" viewBox="0 0 96 96">
  <!-- High Noon Lucian: menacing demon-outlaw 3/4 bust. Tilted wide-brim leather Stetson casting heavy shadow across his upper face, piercing burning ember eyes glowing from beneath the brim, tattered crimson bandana & scorched brown-brass duster collar, blazing hellfire sunset & drifting ash embers behind, side-profile demonic bronze revolver angled in foreground. -->
  <defs>
    <linearGradient id="sky" x1="0.1" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#1a060c"/>
      <stop offset="0.32" stop-color="#611618"/>
      <stop offset="0.62" stop-color="#c94618"/>
      <stop offset="0.85" stop-color="#f58d24"/>
      <stop offset="1" stop-color="#ffd470"/>
    </linearGradient>
    <radialGradient id="hellSun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff5c8" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#ff9929" stop-opacity="0.65"/>
      <stop offset="0.72" stop-color="#d4350c" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8a1406" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="emberGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6cc"/>
      <stop offset="0.35" stop-color="#ff8a1f" stop-opacity="0.9"/>
      <stop offset="0.75" stop-color="#cc2900" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#8a1400" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eyeFire" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff8cc"/>
      <stop offset="0.4" stop-color="#ff9922" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#d92b00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin" x1="0.05" y1="0.2" x2="0.95" y2="0.7">
      <stop offset="0" stop-color="#2e1910"/>
      <stop offset="0.4" stop-color="#523020"/>
      <stop offset="0.75" stop-color="#7a472c"/>
      <stop offset="1" stop-color="#ad673c"/>
    </linearGradient>
    <linearGradient id="duster" x1="0" y1="0.1" x2="1" y2="0.9">
      <stop offset="0" stop-color="#2b180f"/>
      <stop offset="0.48" stop-color="#4e2e1b"/>
      <stop offset="0.82" stop-color="#7a4929"/>
      <stop offset="1" stop-color="#3b2113"/>
    </linearGradient>
    <linearGradient id="hatLeather" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#6e4225"/>
      <stop offset="0.5" stop-color="#442716"/>
      <stop offset="1" stop-color="#1f1009"/>
    </linearGradient>
    <linearGradient id="bandana" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#661110"/>
      <stop offset="0.52" stop-color="#a81f19"/>
      <stop offset="1" stop-color="#de3f26"/>
    </linearGradient>
    <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe2a3"/>
      <stop offset="0.4" stop-color="#d68b3c"/>
      <stop offset="0.8" stop-color="#784218"/>
      <stop offset="1" stop-color="#381c0a"/>
    </linearGradient>
  </defs>

  <!-- Blazing hellfire sunset backdrop -->
  <rect width="96" height="96" fill="url(#sky)"/>
  <circle cx="72" cy="54" r="38" fill="url(#hellSun)"/>
  <circle cx="22" cy="58" r="26" fill="url(#hellSun)" opacity="0.45"/>
  <path d="M 0 64 L 8 64 L 11 56 L 23 56 L 26 64 L 44 64 L 44 78 L 0 78 Z" fill="#2b0a09" opacity="0.86"/>
  <path d="M 96 60 L 87 60 L 84 51 L 73 51 L 70 60 L 56 60 L 56 78 L 96 78 Z" fill="#3a100c" opacity="0.8"/>
  <path d="M 0 46 Q 22 40 46 47 Q 70 53 96 44 L 96 52 Q 70 59 46 53 Q 22 47 0 53 Z" fill="#ffad52" opacity="0.16"/>
  <path d="M 0 28 Q 20 22 40 27 Q 54 30 68 22 L 96 26 L 96 34 Q 70 30 48 36 Q 22 33 0 38 Z" fill="#1a0608" opacity="0.32"/>

  <!-- Floating hellfire ash & glowing sparks -->
  <circle cx="14" cy="24" r="2.2" fill="url(#emberGlow)"/>
  <circle cx="82" cy="18" r="2.5" fill="url(#emberGlow)"/>
  <circle cx="88" cy="40" r="1.8" fill="url(#emberGlow)"/>
  <circle cx="10" cy="48" r="1.9" fill="url(#emberGlow)"/>
  <circle cx="64" cy="12" r="1.4" fill="url(#emberGlow)"/>
  <path d="M 12 36 L 15 33 M 78 27 L 82 23 M 86 48 L 89 45" stroke="#ffd27d" stroke-width="0.7" stroke-linecap="round" opacity="0.78"/>

  <!-- Far duster collar -->
  <path d="M 52 57 L 64 51 Q 68 55 68 63 L 62 72 L 52 68 Z" fill="#2b180e" stroke="#120906" stroke-width="0.6" stroke-linejoin="round"/>
  <path d="M 54 57 L 63.5 52.5 Q 66.5 55.5 66.6 62" fill="none" stroke="#ff9d47" stroke-width="0.95" stroke-linecap="round" opacity="0.82"/>

  <!-- Shoulders & scorched leather duster -->
  <path d="M 0 96 C 2 78 13 68 27 64.5 L 40 61.5 L 58 62.5 L 72 67 C 84 71 92 80 96 96 Z" fill="url(#duster)" stroke="#120906" stroke-width="0.75"/>
  <path d="M 5 96 C 8 81 17 72 30 67 L 37 75 C 25 80 19 88 18 96 Z" fill="#301b10"/>
  <path d="M 4 89 C 8 77 16 70 28 66" fill="none" stroke="#ff9938" stroke-width="1.2" stroke-linecap="round" opacity="0.75"/>
  <path d="M 62 66 L 74 70 C 83 74 88 83 91 96 L 71 96 L 63 75 Z" fill="#633b21"/>
  <path d="M 67 66 C 77 69.5 85 76 90 86" fill="none" stroke="#ffd27d" stroke-width="1.15" stroke-linecap="round" opacity="0.88"/>

  <!-- Dark outlaw vest & wide stitched lapels -->
  <path d="M 38 64 L 50 96 L 62 66 Q 50 70 38 64 Z" fill="#1a0e09"/>
  <path d="M 37 64 L 24 69.8 L 38 96 L 46 96 L 42 75 Z" fill="#4f2e1b" stroke="#140a06" stroke-width="0.6" stroke-linejoin="round"/>
  <path d="M 58.5 65 L 69 70 L 57.5 96 L 50.5 96 L 55.5 76 Z" fill="#6e4225" stroke="#140a06" stroke-width="0.6" stroke-linejoin="round"/>
  <path d="M 27 71.5 L 39 94 M 66.5 71.5 L 56 94" fill="none" stroke="#e09a4c" stroke-width="0.65" stroke-dasharray="1.6 1.1"/>
  <circle cx="31.5" cy="72.5" r="1.05" fill="url(#bronze)" stroke="#140a06" stroke-width="0.4"/>
  <circle cx="62.5" cy="72.5" r="1.05" fill="url(#bronze)" stroke="#140a06" stroke-width="0.4"/>

  <!-- Neck & tattered crimson outlaw bandana -->
  <path d="M 35.5 53 L 35 65.5 Q 45 70.5 54 66.5 L 53 53 Z" fill="#382014"/>
  <path d="M 33.5 59 Q 45.5 65.5 57 60 L 59 68.5 Q 45.5 74.5 32 68.5 Z" fill="url(#bandana)" stroke="#140907" stroke-width="0.65" stroke-linejoin="round"/>
  <path d="M 37 68 L 54 68.5 L 48.5 87 L 45 83 L 41 86 Z" fill="#8f1914" stroke="#140907" stroke-width="0.65" stroke-linejoin="round"/>
  <path d="M 38.5 63.5 Q 45.5 67 54.5 63.5 M 41.5 71 L 47 82 M 51 71 L 48 82" fill="none" stroke="#4f0b09" stroke-width="0.75" stroke-linecap="round"/>
  <path d="M 47.5 66 Q 52.5 65 57 61.5" fill="none" stroke="#ff8f5c" stroke-width="0.85" stroke-linecap="round" opacity="0.88"/>
  <ellipse cx="47.5" cy="68.2" rx="2.7" ry="2.2" fill="#bd251c" stroke="#140907" stroke-width="0.55"/>

  <!-- Near duster collar -->
  <path d="M 21.5 66 C 20.5 57 25.5 50 32.5 48.5 L 37.5 61 L 35 67.5 L 24.5 71.5 Z" fill="#3d2314" stroke="#140906" stroke-width="0.65" stroke-linejoin="round"/>
  <path d="M 23 65 C 22.5 57.5 26.5 51.5 32 50" fill="none" stroke="#d98943" stroke-width="1" stroke-linecap="round"/>

  <!-- Chiseled 3/4 Head beneath Stetson -->
  <path d="M 30.5 35 C 30.2 24 36.5 18 45.5 18 C 54 18 57.8 23.5 58.2 31.5 C 58.6 34 58.6 36 57.6 37.8 C 58.8 40.4 59 43.2 57.8 46.4 C 56.6 50.2 55 54 52.6 57.2 C 51 59 49.4 60 47.2 59.8 C 43 59.4 37.8 57 34.6 53.2 C 31.8 49.8 30.6 45.2 30.5 40 Z" fill="url(#skin)"/>
  <path d="M 37.8 22 C 32.8 25 30.5 30 30.5 37 L 30.5 41 C 30.8 46.5 32.2 51 35.2 54.2 C 38 57.2 41.8 58.8 45.2 59.4 L 42 54.8 C 38.8 51.2 37.6 46.6 38.2 42 C 38.6 38.2 37.6 33.8 38.8 28.8 Z" fill="#1e0e08" opacity="0.58"/>
  <path d="M 51.2 41.8 Q 55.8 40.8 58 43.8 Q 56.8 47.8 53.2 48.2 Z" fill="#cf7d44" opacity="0.5"/>
  <path d="M 57.8 38.2 C 58.8 41.4 58.4 45 56.8 49.4 C 55.4 52.8 53.6 55.6 51.2 57.8" fill="none" stroke="#ffc26e" stroke-width="1.2" stroke-linecap="round" opacity="0.94"/>

  <!-- Near ear -->
  <path d="M 32.4 37.5 C 29.2 36.4 28.2 39.6 29 43.2 C 29.6 46.2 31.4 47.6 33.2 46.8 Z" fill="#3c2215" stroke="#140a07" stroke-width="0.45"/>
  <path d="M 32.2 34 L 32.8 44.2 L 34.6 44.8 L 34.2 34 Z" fill="#140d0c"/>

  <!-- Deep dramatic Stetson brim shadow across eyes -->
  <path d="M 30.4 29 L 58.8 29 L 58.6 40.5 Q 47.5 44.5 30.6 41.4 Z" fill="#110403" opacity="0.76"/>

  <!-- Piercing burning ember eyes glowing from the brim shadow! -->
  <circle cx="43.6" cy="39.1" r="3.8" fill="url(#eyeFire)"/>
  <circle cx="54.4" cy="38.9" r="3.5" fill="url(#eyeFire)"/>
  <path d="M 38.2 36.2 Q 43 34 47.8 36 L 47.2 37.4 Q 43 36 38.6 37.5 Z" fill="#0c0504"/>
  <path d="M 51.4 36 Q 54.8 34 57.8 35.8 L 57.4 37.1 Q 54.8 35.8 51.8 37.2 Z" fill="#0c0504"/>
  <path d="M 39.8 39.1 Q 43.4 37.4 46.8 39 Q 43.4 40.5 39.8 39.1 Z" fill="#ff731a"/>
  <path d="M 52 38.9 Q 54.5 37.3 56.9 38.8 Q 54.5 40.2 52 38.9 Z" fill="#ff731a"/>
  <ellipse cx="43.6" cy="39" rx="1.65" ry="0.9" fill="#fff6bd"/>
  <ellipse cx="54.4" cy="38.8" rx="1.45" ry="0.85" fill="#fff6bd"/>
  <path d="M 40.6 39 L 46.4 39 M 52.6 38.8 L 56.4 38.8" stroke="#ffffff" stroke-width="0.55" stroke-linecap="round" opacity="0.92"/>

  <!-- Sculpted Nose & Rugged Outlaw Beard -->
  <path d="M 49.6 38.5 Q 51.2 42 52.6 45" fill="none" stroke="#cf814a" stroke-width="1.2" stroke-linecap="round" opacity="0.75"/>
  <path d="M 47.2 46.2 Q 49.4 47.8 52.2 46.8 Q 53.3 46.2 52.9 44.8" fill="none" stroke="#22100a" stroke-width="0.95" stroke-linecap="round"/>

  <path d="M 33 43 C 33.4 49.2 35.8 54.4 39.6 57.6 C 42.6 59.8 46 60.4 49 59.8 C 52 59.2 54.4 56.6 56.2 52.8 L 57.2 46.6 L 56.1 47 C 55.4 50.8 54 53.6 52 55.2 Q 51.2 53.2 50.4 51.8 Q 49.8 54.6 47.8 55.6 Q 44.8 56.2 42.4 54.2 Q 41.2 52.2 40.8 50.8 Q 40.1 53.4 38.8 53.8 C 36.2 51.6 34.6 48.2 34.4 43.4 Z" fill="#160f0d"/>
  <path d="M 42.8 49.8 Q 46.6 48 49.6 48.8 Q 52.2 48.2 54.2 49.8 Q 52 49.6 49.6 50.2 Q 46.6 49.6 42.8 49.8 Z" fill="#160f0d"/>
  <path d="M 44.2 51.4 Q 48.6 52.2 53.2 51" fill="none" stroke="#22100b" stroke-width="0.85" stroke-linecap="round"/>
  <path d="M 45.6 52.4 Q 48.8 54 51.8 52.1 Q 48.8 52.9 45.6 52.4 Z" fill="#7d4634"/>
  <path d="M 51 58.2 C 53.6 56.4 55.6 53.4 56.6 49" fill="none" stroke="#f5984a" stroke-width="0.8" stroke-linecap="round" opacity="0.78"/>

  <!-- TILTED WIDE-BRIM WEATHERED LEATHER STETSON -->
  <g transform="translate(45.5 25.8) rotate(-7)">
    <path d="M -38 4.5 Q -18 -3 0 -1.5 Q 20 -3 39 5.5 Q 22 14.5 0 11.5 Q -22 14 -38 4.5 Z" fill="#1c0c07" stroke="#0d0604" stroke-width="0.75" stroke-linejoin="round"/>
    <path d="M -17 1 C -18 -9 -15.5 -17.5 -9.5 -19.5 Q -4 -17 0.5 -18.2 Q 5.5 -17 11 -19.5 C 16.5 -17 18.5 -9 17.5 1 Z" fill="url(#hatLeather)" stroke="#120906" stroke-width="0.8" stroke-linejoin="round"/>
    <path d="M 0 -17.5 Q -1.5 -11 0 -5" fill="none" stroke="#1b0d07" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M 8 -18.2 C 13 -16 15.5 -9.5 15.2 0" fill="none" stroke="#ffb057" stroke-width="1.25" stroke-linecap="round" opacity="0.88"/>
    <path d="M -14 -1 C -14.5 -8.5 -12.5 -15 -9.2 -17.4" fill="none" stroke="#8a5533" stroke-width="1.1" stroke-linecap="round" opacity="0.78"/>
    <path d="M -17.2 -4.5 Q 0 -0.2 17.6 -4.5 L 17.8 1.2 Q 0 5.5 -17.4 1.2 Z" fill="url(#bandana)" stroke="#140806" stroke-width="0.55"/>
    <rect x="4" y="-3.2" width="4.4" height="4.4" rx="0.8" fill="url(#bronze)" stroke="#140806" stroke-width="0.5"/>
    <rect x="5.3" y="-2" width="1.8" height="2" fill="#4a100c"/>
    <path d="M -39 4 Q -22 -4.5 -16 0.2 Q 0 4.5 17 0.2 Q 25 -4.2 40 5.2 Q 26 11.2 16.5 7.2 Q 0 11.2 -17 7 Q -26 10.5 -39 4 Z" fill="#4d2c19" stroke="#120805" stroke-width="0.8" stroke-linejoin="round"/>
    <path d="M -36 3.5 Q -21 -2.8 -15.5 1.2 Q 0 5.2 16.8 1.2 Q 24 -2.2 38 4.8" fill="none" stroke="#bd7a47" stroke-width="0.9" stroke-linecap="round"/>
    <path d="M 16 6.8 Q 26 9.5 38.5 5.4" fill="none" stroke="#ffc25e" stroke-width="1.1" stroke-linecap="round" opacity="0.92"/>
    <path d="M -37 4.2 Q -26 8.4 -16 6.4" fill="none" stroke="#ff7a29" stroke-width="0.8" stroke-linecap="round" opacity="0.78"/>
  </g>

  <!-- DYNAMIC FOREGROUND SIDE-PROFILE DEMONIC BRONZE REVOLVER -->
  <circle cx="84.5" cy="36" r="13.5" fill="url(#emberGlow)" opacity="0.88"/>
  <g transform="translate(71.5 64.5) rotate(29)">
    <path d="M -1 -33 Q -4 -39 1.5 -44" fill="none" stroke="#ffbd6e" stroke-width="1" stroke-linecap="round" opacity="0.48"/>
    <!-- Trigger guard & trigger -->
    <path d="M -4 5.5 Q -10.2 6.5 -9.8 11.8 Q -9.4 15.5 -3.6 14.8" fill="none" stroke="#120906" stroke-width="2" stroke-linecap="round"/>
    <path d="M -4 5.5 Q -10.2 6.5 -9.8 11.8 Q -9.4 15.5 -3.6 14.8" fill="none" stroke="url(#bronze)" stroke-width="0.9" stroke-linecap="round"/>
    <path d="M -5 8.5 Q -6.8 10 -5.6 12" fill="none" stroke="#e09a4c" stroke-width="0.85" stroke-linecap="round"/>
    <!-- Long vented bronze revolver barrel + under-barrel ejector rod + front blade sight -->
    <path d="M -4.2 -28.5 L -1.8 -28.5 L -1.8 -6 L -4.2 -6 Z" fill="#593114" stroke="#140906" stroke-width="0.6"/>
    <path d="M -2.2 -30.5 L 2.8 -30.5 L 3.6 -5 L -2.2 -5 Z" fill="url(#bronze)" stroke="#140906" stroke-width="0.75" stroke-linejoin="round"/>
    <!-- Front revolver blade sight -->
    <path d="M 2.6 -29.5 L 5.2 -26.5 L 3 -25.2 Z" fill="#3a1e0d" stroke="#140906" stroke-width="0.5" stroke-linejoin="round"/>
    <!-- Molten glowing vents along barrel -->
    <path d="M 0.4 -26.5 L 0.4 -9" stroke="#ff7e1f" stroke-width="2" stroke-linecap="round" opacity="0.65"/>
    <path d="M 0.4 -26.5 L 0.4 -9" stroke="#fff4bd" stroke-width="1" stroke-linecap="round"/>
    <!-- Fluted demonic revolver cylinder with glowing ember flutes -->
    <rect x="-5.4" y="-6.2" width="10.4" height="11.8" rx="2.4" fill="url(#bronze)" stroke="#140906" stroke-width="0.75"/>
    <path d="M -2.8 -4.6 L -2.8 4.2 M -0.2 -4.6 L -0.2 4.2 M 2.4 -4.6 L 2.4 4.2" stroke="#ff8a24" stroke-width="0.9" stroke-linecap="round"/>
    <path d="M -2.8 -4.6 L -2.8 4.2 M 2.4 -4.6 L 2.4 4.2" stroke="#472109" stroke-width="0.4" stroke-linecap="round"/>
    <!-- Receiver frame & cocked spur hammer -->
    <path d="M -4.4 5.2 L 5 5.2 L 6.2 11.2 L -4.4 11.2 Z" fill="#6b3b18" stroke="#140906" stroke-width="0.7" stroke-linejoin="round"/>
    <path d="M 4.8 3.6 L 9 1.2 L 8 5.8 Z" fill="#3b1d0b" stroke="#140906" stroke-width="0.55" stroke-linejoin="round"/>
    <!-- Grip & leather gloved hand -->
    <path d="M -3.8 11.2 L 5.8 11.2 L 10.2 27.5 L 1.2 29 Z" fill="#47210f" stroke="#140906" stroke-width="0.75" stroke-linejoin="round"/>
    <path d="M -5.6 12.6 Q 1.5 10.6 7.6 13 L 9.2 22.4 Q 2.5 25 -4.4 22.8 Z" fill="#3b2316" stroke="#120906" stroke-width="0.75" stroke-linejoin="round"/>
    <path d="M -5 15.6 Q 1.5 14.2 7.8 16 M -4.8 18.8 Q 1.6 17.6 8.4 19.2" fill="none" stroke="#1f110a" stroke-width="0.65"/>
    <path d="M 5.6 13.4 L 7.8 21" stroke="#ffc26e" stroke-width="0.85" stroke-linecap="round" opacity="0.85"/>
    <path d="M -5.8 23.4 Q 2 26.2 9.8 23.2 L 12.2 40 L -8 40 Z" fill="#4a2b18" stroke="#120906" stroke-width="0.8"/>
    <path d="M -5.8 23.4 Q 2 26.2 9.8 23.2" fill="none" stroke="#d9934c" stroke-width="1.3" stroke-linecap="round"/>
  </g>
  <circle cx="85.8" cy="36.8" r="2.7" fill="#fff6cc" opacity="0.94"/>
</svg>

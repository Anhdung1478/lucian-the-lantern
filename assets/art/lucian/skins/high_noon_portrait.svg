  <path d="M 60 35.8 Q 56 33.2 51.4 34.6 L 51.7 36.1 Q 56 35.3 59.6 37 Z" fill="#161110"/>
  <path d="M 38 40 Q 41.5 37.6 45 39.8 Q 41.5 41.4 38 40 Z" fill="#f2e2cc"/>
  <path d="M 52 39.8 Q 55.5 37.6 59 40 Q 55.5 41.4 52 39.8 Z" fill="#cdb8a4"/>
  <circle cx="41.6" cy="39.6" r="1.45" fill="#8a3010"/>
  <circle cx="55.4" cy="39.6" r="1.45" fill="#8a3010"/>
  <circle cx="41.6" cy="39.6" r="0.7" fill="#1a0a06"/>
  <circle cx="55.4" cy="39.6" r="0.7" fill="#1a0a06"/>
  <circle cx="42.1" cy="39.1" r="0.5" fill="#ffd08a"/>
  <circle cx="55.9" cy="39.1" r="0.5" fill="#ffd08a"/>
  <path d="M 37.8 40 Q 41.5 37.2 45.2 39.6 M 51.8 39.6 Q 55.5 37.2 59.2 40" fill="none" stroke="#1a1210" stroke-width="0.9" stroke-linecap="round"/>
  <path d="M 39 42.2 Q 41.5 43 44 42.2 M 53 42.2 Q 55.5 43 58 42.2" fill="none" stroke="#4d3122" stroke-width="0.6" stroke-linecap="round"/>
  <!-- nose -->
  <path d="M 50 40 Q 50.8 44 51.6 46" fill="none" stroke="#3e271b" stroke-width="0.9" stroke-linecap="round"/>
  <path d="M 44.6 46.4 Q 45.4 48.6 48.5 48 Q 51.6 48.6 52.4 46.4" fill="none" stroke="#3a2418" stroke-width="1" stroke-linecap="round"/>
  <ellipse cx="47.2" cy="45.6" rx="1.3" ry="0.9" fill="#a87050" opacity="0.8"/>
  <!-- short beard and moustache -->
  <path d="M 34.2 40 C 34.4 48 37.5 54.5 42 59.5 C 44 61.5 46.5 63.2 48.5 63.2 C 50.5 63.2 52.5 61.5 55 59 C 60 55 63.3 49 63.3 40 L 62.2 41 C 62 47 59.8 52 55.6 56.4 Q 54.6 55.6 54.2 51.6 Q 53.6 54.8 52 56 Q 48.5 57.2 45 56 Q 43.4 54.8 42.8 51.6 Q 42.4 55.6 41.4 56.4 C 37.2 52 35.2 47 35.2 41 Z" fill="#1c1513"/>
  <path d="M 42.4 51 C 44.4 48.7 47 48.5 48.5 49.3 C 50 48.5 52.6 48.7 54.6 51 C 52.5 50.4 50.5 50.7 48.5 51.1 C 46.5 50.7 44.5 50.4 42.4 51 Z" fill="#1c1513"/>
  <path d="M 44.6 52.4 Q 48.5 53.5 52.4 52.4" fill="none" stroke="#2a1812" stroke-width="0.8" stroke-linecap="round"/>
  <path d="M 45.6 53.4 Q 48.5 55.4 51.4 53.4 Q 48.5 54.2 45.6 53.4 Z" fill="#7c4a3a"/>
  <path d="M 41 54.4 C 38 51.5 36 47 35.6 42" fill="none" stroke="#8a5030" stroke-width="0.7" stroke-linecap="round" opacity="0.8"/>
  <!-- wide-brim hat: crown, red band, brim curled up at the sides -->
  <path d="M 34 28 C 33 18 35 10 40 8.5 Q 44 10.6 48.5 9.6 Q 53 10.6 57 8.5 C 62 10 64 18 63 28 Z" fill="#6b4528" stroke="#1a1d24" stroke-width="0.8" stroke-linejoin="round"/>
  <path d="M 36.5 26 C 36 18 37.5 12 40.5 10" fill="none" stroke="#a87448" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M 48.5 10.4 Q 47.4 15 48.5 20.6" fill="none" stroke="#3e2614" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M 56 10 C 59.6 12 61.4 18 61 26 L 63 28 C 64 18 62 10 57 8.5 Z" fill="#3e2614" opacity="0.6"/>
  <path d="M 33.8 22.6 Q 48.5 26.2 63.2 22.6 L 63.2 28 Q 48.5 31.6 33.8 28 Z" fill="#a02420" stroke="#1a1d24" stroke-width="0.6"/>
  <circle cx="40" cy="26.4" r="1.6" fill="#e8a85c" stroke="#1a1d24" stroke-width="0.5"/>
  <path d="M 5 30.5 Q 14 22.5 33 26.4 Q 48.5 30 64 26.4 Q 83 22.5 92 30.5 Q 83 36 64 32.6 Q 48.5 36.2 33 32.6 Q 14 36 5 30.5 Z" fill="#5e3d22" stroke="#1a1d24" stroke-width="0.8" stroke-linejoin="round"/>
  <path d="M 7 30 Q 15 24.4 33 28 Q 48.5 31.4 64 28 Q 80 24.6 90 30" fill="none" stroke="#c9915a" stroke-width="0.9"/>
  <path d="M 7 31.4 Q 15 34.6 33 31.6 Q 40 30.6 46 31.6" fill="none" stroke="#ffc878" stroke-width="0.8" stroke-linecap="round"/>
  <!-- bronze revolver raised at his side: fluted cylinder, long barrel, wooden grip -->
  <circle cx="83" cy="27" r="6" fill="url(#ember)" opacity="0.8"/>
  <g transform="rotate(6 83 60)">
    <path d="M 79.6 58 Q 74.6 58.6 74.8 63 Q 75.2 66.4 80 66" fill="none" stroke="#1a1d24" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 79.6 58 Q 74.6 58.6 74.8 63 Q 75.2 66.4 80 66" fill="none" stroke="#c7853e" stroke-width="1" stroke-linecap="round"/>
    <rect x="81" y="29" width="4" height="20" rx="0.6" fill="url(#bronze)" stroke="#1a1d24" stroke-width="0.7"/>
    <rect x="81.6" y="27" width="2.8" height="2.4" fill="#5a3416" stroke="#1a1d24" stroke-width="0.5"/>
    <path d="M 83 31 L 83 46" stroke="#fff0c8" stroke-width="1" stroke-linecap="round"/>
    <rect x="79.6" y="48" width="7.6" height="10" rx="2" fill="url(#bronze)" stroke="#1a1d24" stroke-width="0.7"/>
    <path d="M 81.8 49.4 L 81.8 56.6 M 83.4 49.4 L 83.4 56.6 M 85 49.4 L 85 56.6" stroke="#7a4a1e" stroke-width="0.6"/>
    <path d="M 79.8 57.6 L 87.6 57.6 L 88.6 62.4 L 79.8 62.4 Z" fill="#8a5524" stroke="#1a1d24" stroke-width="0.7" stroke-linejoin="round"/>
    <path d="M 87.4 56 L 90 54.4 L 89.6 58 Z" fill="#5a3416" stroke="#1a1d24" stroke-width="0.5" stroke-linejoin="round"/>
    <path d="M 80.2 62.4 L 88.6 62.4 L 92 76 L 84.6 77.4 Z" fill="#5a2e16" stroke="#1a1d24" stroke-width="0.8" stroke-linejoin="round"/>
    <!-- his gloved hand round the grip -->
    <path d="M 78.6 64.4 Q 84 62.4 90 64.6 L 91.4 73 Q 85 75.6 79.4 73.6 Z" fill="#4a3020" stroke="#1a1d24" stroke-width="0.8" stroke-linejoin="round"/>
    <path d="M 79 67.2 Q 84.4 65.8 90.2 67.6 M 79.2 70.2 Q 84.6 69 90.6 70.6" fill="none" stroke="#2e1c10" stroke-width="0.6"/>
    <path d="M 78.6 74 Q 85 76.8 91.6 73.8 L 93 96 L 77 96 Z" fill="#553620" stroke="#1a1d24" stroke-width="0.8" stroke-linejoin="round"/>
    <path d="M 78.6 74 Q 85 76.8 91.6 73.8" fill="none" stroke="#c9a26e" stroke-width="1"/>
  </g>
</svg>

  <path d="M 45 69 L 48.5 80 M 52 69 L 48.5 80" stroke="#6e1410" stroke-width="0.7"/>
  <circle cx="48.5" cy="67.6" r="2.4" fill="#c8302a" stroke="#1a1d24" stroke-width="0.6"/>
  <path d="M 39 61.5 Q 44 64.6 48 65" fill="none" stroke="#ff7a5a" stroke-width="0.9" stroke-linecap="round"/>
  <!-- ears -->
  <path d="M 34.5 36 C 31 34 30 37.5 30.8 41 C 31.5 44.5 33 46 35 45.5 Z" fill="#7a5038" stroke="#1a1d24" stroke-width="0.6"/>
  <path d="M 63 36 C 66.5 34 67.5 37.5 66.7 41 C 66 44.5 64.5 46 62.5 45.5 Z" fill="#4a2f21" stroke="#1a1d24" stroke-width="0.6"/>
  <!-- head -->
  <path d="M 34 34 C 33.5 24 39 16 48.5 16 C 58 16 63.5 23 63.5 33 L 63.5 41 C 63.5 49 60 55 55 59 C 52.5 61.5 50.5 63 48.5 63 C 46.5 63 44 61.5 42 59.5 C 37 55 34 49 34 41 Z" fill="url(#skin)" stroke="#1a1d24" stroke-width="0.8"/>
  <!-- shadow on the far side, the sun's light on the near side -->
  <path d="M 56 16.8 C 60 18.5 64 24 63.5 34 L 63.5 41 C 63.5 49 60.5 55 55.5 59.5 C 53.5 61.5 51 62.8 49 63 L 50.5 59.5 C 54.5 55.5 56.5 50 56 44.5 C 55.6 40 57.4 36.5 57 31.5 C 56.5 25.5 54.5 20.5 51 16.4 Z" fill="#2e1c12" opacity="0.5"/>
  <path d="M 38 19 C 35 22 33.8 27 33.8 33 L 34 41 C 34 48.5 37 54.5 42 58.8" fill="none" stroke="#ffd08a" stroke-width="1.2" stroke-linecap="round"/>

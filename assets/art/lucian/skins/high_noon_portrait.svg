<svg xmlns="http://www.w3.org/2000/svg" width="384" height="384" viewBox="0 0 96 96">
  <!-- High Noon Lucian portrait: wide-brim hat, red scarf, dusty brown duster and a bronze revolver, on a sunset. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1a34"/>
      <stop offset="0.35" stop-color="#a8392a"/>
      <stop offset="0.62" stop-color="#ec7a2c"/>
      <stop offset="0.8" stop-color="#ffb24a"/>
      <stop offset="1" stop-color="#ffd884"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff2c0" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#ffd27a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffb24a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a4532"/>
      <stop offset="1" stop-color="#4d3122"/>
    </linearGradient>
    <linearGradient id="duster" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a6240"/>
      <stop offset="1" stop-color="#4e331e"/>
    </linearGradient>
    <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a4a1e"/>
      <stop offset="0.45" stop-color="#e8a85c"/>
      <stop offset="1" stop-color="#8a5524"/>
    </linearGradient>
  </defs>
  <!-- sunset sky, the sun behind his head, mesas on the horizon -->
  <rect width="96" height="96" fill="url(#sky)"/>
  <circle cx="48" cy="46" r="40" fill="url(#sun)"/>
  <path d="M 0 60 L 5 60 L 7 55 L 17 55 L 19 61 L 24 70 L 0 70 Z" fill="#5a2418"/>
  <path d="M 96 58 L 89 58 L 87 53 L 79 53 L 77 61 L 72 70 L 96 70 Z" fill="#5a2418"/>
  <rect y="70" width="96" height="26" fill="#4a1e14"/>
  <!-- dusty duster and its wide lapels -->
  <path d="M 8 96 Q 12 70 34 64 L 62 64 Q 84 70 88 96 Z" fill="url(#duster)"/>
  <path d="M 36 65 L 44 74 L 40 96 L 28 96 L 30 72 Z" fill="#5e3e24" stroke="#c9a26e" stroke-width="1" stroke-linejoin="round"/>
  <path d="M 60 65 L 52 74 L 56 96 L 68 96 L 66 72 Z" fill="#5e3e24" stroke="#c9a26e" stroke-width="1" stroke-linejoin="round"/>
  <path d="M 44 74 L 52 74 L 56 96 L 40 96 Z" fill="#2e2018"/>
  <path d="M 16 80 L 22 96 M 80 80 L 74 96" stroke="#c9a26e" stroke-width="1" opacity="0.6"/>
  <!-- neck -->
  <path d="M 41 54 L 41 64 L 55 64 L 55 54 Z" fill="#4d3122"/>
  <!-- red scarf tied at the throat -->
  <path d="M 38 58 Q 48 64 58 58 L 59 66 Q 48 71 37 66 Z" fill="#b3261e"/>
  <path d="M 42 66 L 55 66 L 49 84 Z" fill="#9a1f19"/>
  <path d="M 45 68 L 49 80 M 52 68 L 49 80" stroke="#6e1410" stroke-width="0.8"/>
  <circle cx="48.5" cy="66.5" r="2.6" fill="#c8302a"/>
  <path d="M 39 61 Q 48 66 57 61" fill="none" stroke="#e05040" stroke-width="0.8" opacity="0.7"/>
  <!-- head -->
  <path d="M 31 34 Q 31 18 48 17 Q 65 18 65 34 L 64 44 Q 62 58 48 62 Q 34 58 32 44 Z" fill="url(#skin)"/>
  <!-- ears and sideburns -->
  <ellipse cx="31" cy="40" rx="3" ry="5" fill="#4d3122"/>
  <ellipse cx="65" cy="40" rx="3" ry="5" fill="#4d3122"/>
  <path d="M 31 31 L 34 31 L 34 42 Q 32 38 31 31 Z M 65 31 L 62 31 L 62 42 Q 64 38 65 31 Z" fill="#141010"/>
  <!-- shade from the brim -->
  <path d="M 31 31 L 65 31 L 65 36 Q 48 39 31 36 Z" fill="#000000" opacity="0.35"/>
  <!-- brows and eyes -->
  <path d="M 36 35 L 45 36 M 51 36 L 60 35" stroke="#141010" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 38 40 L 44 40 M 52 40 L 58 40" stroke="#f2e6d0" stroke-width="2" stroke-linecap="round"/>
  <circle cx="41" cy="40" r="1.2" fill="#1a1210"/>
  <circle cx="55" cy="40" r="1.2" fill="#1a1210"/>
  <!-- nose -->
  <path d="M 48 41 L 46 48 L 50 48" fill="none" stroke="#3e271b" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- moustache and goatee -->
  <path d="M 42 52 Q 48 49 54 52" fill="none" stroke="#141010" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 44 56 Q 48 62 52 56 L 50 55 Q 48 57 46 55 Z" fill="#141010"/>
  <!-- wide-brim hat: crown, red band, brim -->
  <path d="M 33 29 Q 32 11 40 9 Q 48 13 56 9 Q 64 11 63 29 Z" fill="#5e3d22"/>
  <path d="M 48 13 Q 47 19 48 25" fill="none" stroke="#3e2614" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 36 13 Q 40 11 43 13" fill="none" stroke="#8a5e36" stroke-width="1" stroke-linecap="round"/>
  <path d="M 33 23 Q 48 26 63 23 L 63 28 Q 48 31 33 28 Z" fill="#a02420"/>
  <circle cx="48" cy="27" r="1.6" fill="#e8a85c"/>
  <path d="M 6 31 Q 16 23 33 27 Q 48 31 63 27 Q 80 23 90 31 Q 80 36 63 32.5 Q 48 36.5 33 32.5 Q 16 36 6 31 Z" fill="#6b4528" stroke="#3e2614" stroke-width="0.8" stroke-linejoin="round"/>
  <path d="M 8 30.5 Q 18 24.5 33 28 Q 48 32 63 28 Q 78 24.5 88 30.5" fill="none" stroke="#c9915a" stroke-width="0.9"/>
  <!-- bronze revolver raised beside him -->
  <g transform="rotate(8 81 60)">
    <rect x="79" y="38" width="4" height="17" rx="1" fill="url(#bronze)" stroke="#3a2210" stroke-width="0.6"/>
    <rect x="80.2" y="36.4" width="1.6" height="2.2" fill="#3a2210"/>
    <rect x="77" y="54" width="8" height="9" rx="2" fill="url(#bronze)" stroke="#3a2210" stroke-width="0.6"/>
    <path d="M 79.5 55 L 79.5 62 M 82.5 55 L 82.5 62" stroke="#6a3e18" stroke-width="0.6"/>
    <path d="M 78 63 L 84 63 L 84 66 L 78 66 Z" fill="#8a5524" stroke="#3a2210" stroke-width="0.6"/>
    <path d="M 78 66 L 84 66 L 87 78 L 81 79 Z" fill="#5a2e16" stroke="#2a160a" stroke-width="0.6" stroke-linejoin="round"/>
    <path d="M 77 66 L 88 66 L 89 100 L 76 100 Z" fill="#6b4a2e" stroke="#2a1a10" stroke-width="0.6" stroke-linejoin="round"/>
    <path d="M 76.6 78 L 88.4 78" stroke="#c9a26e" stroke-width="1.2"/>
    <rect x="76.5" y="65" width="11" height="11" rx="3" fill="#4a3020" stroke="#2a1a10" stroke-width="0.6"/>
    <path d="M 76.8 68.5 L 82 68.5 M 76.8 71.5 L 82 71.5 M 76.8 74.5 L 82 74.5" stroke="#6e4a30" stroke-width="0.6" stroke-linecap="round"/>
  </g>
</svg>

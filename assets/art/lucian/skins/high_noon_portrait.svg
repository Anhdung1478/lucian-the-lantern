<svg xmlns="http://www.w3.org/2000/svg" width="384" height="384" viewBox="0 0 96 96">
  <!-- High Noon Lucian portrait: a hellfire gunslinger facing the viewer. A wide-brim hat with a red band shading his eyes, which hold an ember glint; a short beard, a red scarf at the throat, a leather duster; his bronze revolver raised at his side. Behind him a low sun in the dust over the mesas, embers in the air, its light on the left of his face. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1630"/>
      <stop offset="0.3" stop-color="#8e2e2a"/>
      <stop offset="0.55" stop-color="#e06a28"/>
      <stop offset="0.72" stop-color="#ffb04a"/>
      <stop offset="1" stop-color="#ffd27e"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6e0" stop-opacity="0.95"/>
      <stop offset="0.3" stop-color="#ffd27a" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ff9a3a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ember" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff0c0"/>
      <stop offset="0.35" stop-color="#ff8a2a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#c8300a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#4f3223"/>
      <stop offset="0.5" stop-color="#6a4532"/>
      <stop offset="1" stop-color="#8a5a3e"/>
    </linearGradient>
    <linearGradient id="duster" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8e6440"/>
      <stop offset="0.5" stop-color="#6b4528"/>
      <stop offset="1" stop-color="#4a2e1a"/>
    </linearGradient>
    <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8a85c"/>
      <stop offset="0.5" stop-color="#ffd08a"/>
      <stop offset="1" stop-color="#8a5524"/>
    </linearGradient>
  </defs>
  <!-- a low sun in the dust over the mesas -->
  <rect width="96" height="96" fill="url(#sky)"/>
  <circle cx="20" cy="62" r="34" fill="url(#sun)"/>
  <circle cx="20" cy="62" r="10" fill="#fff2c8" opacity="0.9"/>
  <path d="M 0 66 L 4 66 L 6 60 L 17 60 L 19 66 L 40 66 L 40 72 L 0 72 Z" fill="#6a2a1a" opacity="0.9"/>
  <path d="M 96 64 L 90 64 L 88 58 L 79 58 L 77 64 L 60 64 L 60 72 L 96 72 Z" fill="#5a2418"/>
  <rect y="70" width="96" height="26" fill="#4a1e14"/>
  <path d="M 0 52 Q 24 48 48 53 Q 72 58 96 52 L 96 57 Q 72 62 48 57 Q 24 52 0 57 Z" fill="#ffd8a0" opacity="0.18"/>
  <path d="M 0 74 Q 30 70 60 75 Q 80 78 96 74 L 96 80 Q 70 82 40 78 Q 18 76 0 80 Z" fill="#ffb070" opacity="0.15"/>
  <!-- embers in the air -->
  <circle cx="12" cy="30" r="2" fill="url(#ember)"/>
  <circle cx="24" cy="18" r="1.4" fill="url(#ember)"/>
  <circle cx="70" cy="14" r="1.8" fill="url(#ember)"/>
  <circle cx="90" cy="46" r="1.6" fill="url(#ember)"/>
  <circle cx="8" cy="46" r="1.3" fill="url(#ember)"/>
  <!-- duster: shoulders -->
  <path d="M 2 96 C 4 82 13 74 27 70.5 L 39 66.5 L 58 66.5 L 70 70.5 C 84 74 92 82 94 96 Z" fill="url(#duster)" stroke="#1a1d24" stroke-width="1"/>
  <path d="M 26.5 71 C 14 75 6 82 3.5 92" fill="none" stroke="#ffc878" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M 16 80 L 21 96 M 80 80 L 75 96" stroke="#3e2614" stroke-width="1"/>
  <!-- neck -->
  <path d="M 41.5 53 L 41 67 Q 48.5 70 56 67 L 55.5 53 Z" fill="#4a2f21"/>
  <!-- dark shirt, wide lapels -->
  <path d="M 39 66.5 L 48.5 96 L 58 66.5 Q 48.5 70 39 66.5 Z" fill="#2e2018"/>
  <path d="M 39 66.5 L 29 71 L 41 96 L 46 96 Z" fill="#7a5232" stroke="#1a1d24" stroke-width="0.8" stroke-linejoin="round"/>
  <path d="M 58 66.5 L 68 71 L 56 96 L 51 96 Z" fill="#553620" stroke="#1a1d24" stroke-width="0.8" stroke-linejoin="round"/>
  <path d="M 31 72 L 42 94 M 66 72 L 55 94" fill="none" stroke="#e0b47a" stroke-width="0.6" stroke-dasharray="1.4 1"/>

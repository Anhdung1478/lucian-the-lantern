<svg xmlns="http://www.w3.org/2000/svg" width="384" height="384" viewBox="0 0 96 96">
  <!-- Pulsefire Lucian portrait: white-blue armor with glowing cyan pulse cores, a holo visor and a white gun, on an electric blue background. -->
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.4" r="0.72">
      <stop offset="0" stop-color="#55b4ff"/>
      <stop offset="0.45" stop-color="#1a58e0"/>
      <stop offset="1" stop-color="#081c66"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a4532"/>
      <stop offset="1" stop-color="#4d3122"/>
    </linearGradient>
    <linearGradient id="armor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f9ff"/>
      <stop offset="1" stop-color="#a9bcd8"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#7ff8ff"/>
      <stop offset="0.6" stop-color="#2ee6ff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#2ee6ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="96" height="96" fill="url(#bg)"/>
  <!-- energy rings and electric arcs -->
  <circle cx="48" cy="40" r="31" fill="none" stroke="#bff4ff" stroke-width="1" opacity="0.35"/>
  <circle cx="48" cy="40" r="37" fill="none" stroke="#bff4ff" stroke-width="0.6" stroke-dasharray="3 4" opacity="0.3"/>
  <g fill="none" stroke="#dffaff" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" opacity="0.75">
    <path d="M 2 18 L 10 22 L 7 27 L 16 31"/>
    <path d="M 94 12 L 86 18 L 90 22 L 81 28"/>
    <path d="M 3 52 L 11 48 L 9 55 L 17 52"/>
    <path d="M 93 50 L 86 47 L 88 54 L 80 52"/>
  </g>
  <!-- white-blue armor: shoulder plates, conduits and pulse cores -->
  <path d="M 8 96 Q 12 70 34 64 L 62 64 Q 84 70 88 96 Z" fill="url(#armor)"/>
  <path d="M 8 96 Q 10 73 27 67 L 33 76 Q 21 81 19 96 Z" fill="#e2eaf6" stroke="#4a74b8" stroke-width="0.8" stroke-linejoin="round"/>
  <path d="M 88 96 Q 86 73 69 67 L 63 76 Q 75 81 77 96 Z" fill="#e2eaf6" stroke="#4a74b8" stroke-width="0.8" stroke-linejoin="round"/>
  <path d="M 36 66 L 48 79 L 60 66" fill="none" stroke="#4a74b8" stroke-width="1" stroke-linejoin="round"/>
  <path d="M 25 80 L 36 84 L 43 86 M 71 80 L 60 84 L 53 86" fill="none" stroke="#2ee6ff" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="22" cy="79" r="6" fill="url(#core)"/>
  <circle cx="74" cy="79" r="6" fill="url(#core)"/>
  <circle cx="48" cy="87" r="9" fill="url(#core)"/>
  <circle cx="48" cy="87" r="3.2" fill="none" stroke="#4a74b8" stroke-width="0.8"/>
  <!-- neck and high white collar -->
  <path d="M 41 54 L 41 64 L 55 64 L 55 54 Z" fill="#4d3122"/>
  <path d="M 37 57 Q 48 62 59 57 L 60 66 L 36 66 Z" fill="#eef3fb" stroke="#4a74b8" stroke-width="0.7" stroke-linejoin="round"/>
  <path d="M 39 62 Q 48 65 57 62" fill="none" stroke="#2ee6ff" stroke-width="0.9"/>
  <!-- head -->
  <path d="M 31 34 Q 31 18 48 17 Q 65 18 65 34 L 64 44 Q 62 58 48 62 Q 34 58 32 44 Z" fill="url(#skin)"/>
  <!-- short hair -->
  <path d="M 31 33 Q 31 16 48 15 Q 65 16 65 33 Q 60 24 48 24 Q 36 24 31 33 Z" fill="#141010"/>
  <!-- brows and eyes -->
  <path d="M 36 35 L 45 36 M 51 36 L 60 35" stroke="#141010" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 38 40 L 44 40 M 52 40 L 58 40" stroke="#f2e6d0" stroke-width="2" stroke-linecap="round"/>
  <circle cx="41" cy="40" r="1.2" fill="#1a1210"/>
  <circle cx="55" cy="40" r="1.2" fill="#1a1210"/>
  <!-- nose -->
  <path d="M 48 41 L 46 48 L 50 48" fill="none" stroke="#3e271b" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- moustache and goatee -->
  <path d="M 42 52 Q 48 49 54 52" fill="none" stroke="#141010" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 44 56 Q 48 62 52 56 L 50 55 Q 48 57 46 55 Z" fill="#141010"/>
  <!-- white headset and the see-through holo visor -->
  <path d="M 30 33 Q 30 24 36 21" fill="none" stroke="#eef3fb" stroke-width="2" stroke-linecap="round"/>
  <path d="M 66 33 Q 66 24 60 21" fill="none" stroke="#eef3fb" stroke-width="2" stroke-linecap="round"/>
  <rect x="26.5" y="34" width="7" height="12" rx="3" fill="#eef3fb" stroke="#4a74b8" stroke-width="0.7"/>
  <rect x="62.5" y="34" width="7" height="12" rx="3" fill="#eef3fb" stroke="#4a74b8" stroke-width="0.7"/>
  <circle cx="30" cy="40" r="1.6" fill="#2ee6ff"/>
  <circle cx="66" cy="40" r="1.6" fill="#2ee6ff"/>
  <path d="M 33 35.5 L 63 35.5 L 61.5 43.5 Q 48 45.5 34.5 43.5 Z" fill="#5ff4ff" fill-opacity="0.32" stroke="#bff8ff" stroke-width="0.7" stroke-linejoin="round"/>
  <path d="M 35 38 L 61 38 M 35.5 41.5 L 60.5 41.5" stroke="#e8fdff" stroke-width="0.4" opacity="0.7"/>
  <path d="M 57 36.5 L 60 36.5 L 60 39" fill="none" stroke="#ffffff" stroke-width="0.6"/>
  <!-- white gun with a pulse core, raised beside him -->
  <g transform="rotate(8 81 60)">
    <path d="M 78.5 38 L 83.5 38 L 85 42 L 85 62 L 77 62 L 77 42 Z" fill="#eef3fb" stroke="#4a74b8" stroke-width="0.7" stroke-linejoin="round"/>
    <path d="M 81 41 L 81 47 M 81 55 L 81 60" stroke="#2ee6ff" stroke-width="1" stroke-linecap="round"/>
    <circle cx="81" cy="51" r="5" fill="url(#core)"/>
    <path d="M 77 62 L 85 62 L 87 77 L 80.5 78 Z" fill="#c8d6ea" stroke="#4a74b8" stroke-width="0.7" stroke-linejoin="round"/>
    <path d="M 77 66 L 88 66 L 89 100 L 76 100 Z" fill="#e2eaf6" stroke="#4a74b8" stroke-width="0.6" stroke-linejoin="round"/>
    <path d="M 76.6 78 L 88.4 78" stroke="#2ee6ff" stroke-width="1.2"/>
    <rect x="76.5" y="65" width="11" height="11" rx="3" fill="#c8d6ea" stroke="#4a74b8" stroke-width="0.6"/>
    <path d="M 76.8 68.5 L 82 68.5 M 76.8 71.5 L 82 71.5 M 76.8 74.5 L 82 74.5" stroke="#4a74b8" stroke-width="0.6" stroke-linecap="round"/>
  </g>
</svg>

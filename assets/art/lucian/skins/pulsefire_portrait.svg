      <stop offset="0.55" stop-color="#e2eaf6"/>
      <stop offset="1" stop-color="#a8b8d2"/>
    </linearGradient>
    <linearGradient id="gun" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a8b8d2"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c8d6ea"/>
    </linearGradient>
  </defs>

    <radialGradient id="bg" cx="0.42" cy="0.4" r="0.75">
      <stop offset="0" stop-color="#3a64ff"/>
      <stop offset="0.35" stop-color="#1a2a8a"/>
      <stop offset="0.75" stop-color="#0a1040"/>
      <stop offset="1" stop-color="#050822"/>
    </radialGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.3" stop-color="#b4ecff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#7fd8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#4f3223"/>
      <stop offset="0.5" stop-color="#6a4532"/>
      <stop offset="1" stop-color="#7a5848"/>
    </linearGradient>
    <linearGradient id="white" x1="0" y1="0" x2="1" y2="0">

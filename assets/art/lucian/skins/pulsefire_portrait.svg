<svg xmlns="http://www.w3.org/2000/svg" width="384" height="384" viewBox="0 0 96 96">
  <!-- Pulsefire Lucian portrait: a time trooper facing the viewer. An open white helmet with a blue crest and glowing ear discs, a pale blue holo visor over his eyes, a short beard; white and blue chest armor with a glowing time core; his white gun raised at his side. Behind him a time rift: rings of pale blue light and a clock face round a white core, its light on the left of his face. -->

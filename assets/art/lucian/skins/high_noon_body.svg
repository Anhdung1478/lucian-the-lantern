<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- High Noon Lucian, top-down, facing +X: wide-brim hat, red scarf, dusty brown duster, his bronze revolver and Senna's dark iron gun. Center of the image = center of his body. -->
  <defs>
    <radialGradient id="muzzle">
      <stop offset="0" stop-color="#fff6e0"/>
      <stop offset="0.4" stop-color="#ffc870" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ff9a3a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="senna_muzzle">
      <stop offset="0" stop-color="#ffe2c8"/>
      <stop offset="0.4" stop-color="#ff6a2a" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#c8300a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a3220"/>
      <stop offset="1" stop-color="#7a5634"/>
    </linearGradient>
  </defs>
  <g transform="translate(64 64)">
    <!-- shadow -->
    <ellipse cx="-4" cy="3" rx="34" ry="30" fill="#000000" opacity="0.28"/>
    <!-- dusty duster flaring out behind him, split in the middle -->
    <path d="M -4 -23 L -38 -33 Q -47 -16 -45 -3 L -16 -2 Z" fill="url(#coat)" stroke="#c9a26e" stroke-width="2" stroke-linejoin="round"/>
    <path d="M -4 23 L -38 33 Q -47 16 -45 3 L -16 2 Z" fill="url(#coat)" stroke="#c9a26e" stroke-width="2" stroke-linejoin="round"/>
    <path d="M -24 -10 L -40 -14 M -24 10 L -40 14" stroke="#3a2616" stroke-width="1.5" stroke-linecap="round"/>
    <!-- arms reaching forward -->
    <path d="M 0 -20 L 20 -15" stroke="#5a3f28" stroke-width="10" stroke-linecap="round"/>
    <path d="M 0 20 L 20 15" stroke="#5a3f28" stroke-width="10" stroke-linecap="round"/>
    <path d="M 4 -21 L 18 -17" stroke="#c9a26e" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 4 21 L 18 17" stroke="#c9a26e" stroke-width="1.5" stroke-linecap="round"/>
    <!-- his own bronze revolver (left), with its cylinder -->
    <path d="M 18 -19 L 42 -18 L 44 -15 L 42 -12 L 18 -11 Z" fill="#8a5a2a" stroke="#e0a060" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="23" y="-20" width="7" height="10" rx="2.5" fill="#a86e34" stroke="#e0a060" stroke-width="1"/>
    <path d="M 31 -15 L 41 -15" stroke="#ffd28a" stroke-width="2" stroke-linecap="round"/>
    <!-- Senna's relic gun (right): a dark iron hand cannon. A heavy stock, a thick barrel, two ember-orange rings, a muzzle cap -->
    <rect x="25" y="6.5" width="16" height="17" rx="5" fill="#ff5a1a" opacity="0.2"/>
    <path d="M 12 9 L 25 7.5 L 25 22.5 L 12 21 Q 8.5 15 12 9 Z" fill="#433a35" stroke="#120d0a" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="24" y="10" width="19" height="10" rx="2" fill="#544a43" stroke="#120d0a" stroke-width="1.5"/>
    <rect x="27.5" y="7.5" width="3.5" height="15" rx="1.3" fill="#ff6a2a" stroke="#120d0a" stroke-width="1"/>
    <rect x="35" y="7.5" width="3.5" height="15" rx="1.3" fill="#ff6a2a" stroke="#120d0a" stroke-width="1"/>
    <path d="M 42 9 L 46 11.5 L 46 18.5 L 42 21 Z" fill="#262220" stroke="#120d0a" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- leather gloves -->
    <circle cx="20" cy="-15" r="4.5" fill="#4a3020"/>
    <circle cx="20" cy="15" r="4.5" fill="#4a3020"/>
    <!-- muzzle light -->
    <circle cx="46" cy="-15" r="7" fill="url(#muzzle)"/>
    <circle cx="46" cy="15" r="7" fill="url(#senna_muzzle)"/>
    <!-- shoulders and torso -->
    <ellipse cx="0" cy="0" rx="15" ry="26" fill="#5a3f28" stroke="#c9a26e" stroke-width="2"/>
    <path d="M -10 -21 L -10 21" stroke="#3e2a18" stroke-width="3"/>
    <!-- red scarf: tied at the neck, its tail blowing behind him -->
    <path d="M -6 -4 L -30 -9 L -25 -1 L -31 6 L -6 4 Z" fill="#b3261e" stroke="#6e1410" stroke-width="1" stroke-linejoin="round"/>
    <path d="M -7 -15 Q 6 0 -7 15" fill="none" stroke="#c8302a" stroke-width="4" stroke-linecap="round"/>
    <!-- wide-brim hat seen from above: brim, crown with its crease, red band -->
    <circle cx="1" cy="0" r="16.5" fill="#6b4528" stroke="#3e2614" stroke-width="1.5"/>
    <circle cx="1" cy="0" r="14.5" fill="none" stroke="#8a5e36" stroke-width="1"/>
    <ellipse cx="0" cy="0" rx="9.5" ry="9" fill="#a02420"/>
    <ellipse cx="0" cy="0" rx="8" ry="7.5" fill="#5e3d22"/>
    <path d="M -6 0 L 5 0" stroke="#3e2614" stroke-width="1.8" stroke-linecap="round"/>
  </g>
</svg>

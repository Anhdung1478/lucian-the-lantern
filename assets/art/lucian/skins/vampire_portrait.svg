<svg xmlns="http://www.w3.org/2000/svg" width="384" height="384" viewBox="0 0 96 96">
  <!-- Vampire Lucian (Gothic Hunter): aristocratic dark-gothic 3/4 bust. Asymmetric sculpted high obsidian-and-blood-crimson velvet collar with silver filigree trim (NO giant symmetrical red cardboard wings!), intense glowing crimson eyes, subtle dramatic silver moonlight rim across cheekbones, gothic pale-crimson blood moon & dark cathedral spires silhouettes behind, ornate side-profile silver-and-ruby relic pistol angled in foreground. -->
  <defs>

<svg xmlns="http://www.w3.org/2000/svg" width="384" height="384" viewBox="0 0 96 96">
  <!-- Vampire Lucian portrait: facing the viewer in a black coat with a tall flared collar, crimson inside. Slicked-back black hair with a widow's peak, red eyes, a short beard and a hint of a fang; a white cravat with a red gem; his silver gun with its red gem raised at his side. Behind him a blood moon, bats and gothic spires, its red light on the left of his face. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16060c"/>
      <stop offset="0.5" stop-color="#3a0a18"/>
      <stop offset="1" stop-color="#5a0e1e"/>
    </linearGradient>
    <radialGradient id="moonglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5a5a" stop-opacity="0.6"/>
      <stop offset="0.5" stop-color="#d01830" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#d01830" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moon" cx="0.4" cy="0.38" r="0.6">
      <stop offset="0" stop-color="#ffb0a0"/>
      <stop offset="0.6" stop-color="#e8483a"/>
      <stop offset="1" stop-color="#a81828"/>
    </radialGradient>
    <radialGradient id="redglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff6a78" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ff3a50" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#46291f"/>
      <stop offset="0.5" stop-color="#5e3e32"/>
      <stop offset="1" stop-color="#7a4a40"/>
    </linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2e1c26"/>
      <stop offset="0.5" stop-color="#1c1218"/>
      <stop offset="1" stop-color="#100a0e"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6c7480"/>
      <stop offset="0.5" stop-color="#f4f6f9"/>
      <stop offset="1" stop-color="#8a929e"/>
    </linearGradient>
  </defs>
  <!-- night sky, a blood moon, bats and spires -->

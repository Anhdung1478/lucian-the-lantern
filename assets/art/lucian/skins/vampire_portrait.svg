<svg xmlns="http://www.w3.org/2000/svg" width="384" height="384" viewBox="0 0 96 96">
  <!-- Vampire Lucian portrait: crimson-and-black coat with a high red-lined collar, a silver gun and a faint red eye glow, under a moon on dark purple. -->
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.42" r="0.72">
      <stop offset="0" stop-color="#4a2068"/>
      <stop offset="0.5" stop-color="#25103c"/>
      <stop offset="1" stop-color="#0b0514"/>
    </radialGradient>
    <radialGradient id="moon" cx="0.42" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#fff8e8"/>
      <stop offset="1" stop-color="#d8c8b0"/>
    </radialGradient>
    <radialGradient id="eyeglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff3040" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ff3040" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#674840"/>
      <stop offset="1" stop-color="#47302a"/>
    </linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a1628"/>
      <stop offset="1" stop-color="#4a0812"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6c7480"/>
      <stop offset="0.45" stop-color="#f4f6f9"/>
      <stop offset="1" stop-color="#8a929e"/>
    </linearGradient>
  </defs>
  <rect width="96" height="96" fill="url(#bg)"/>
  <!-- moon, stars and bats -->
  <circle cx="20" cy="19" r="17" fill="#f0e0ff" opacity="0.12"/>
  <circle cx="20" cy="19" r="11" fill="url(#moon)"/>
  <circle cx="16" cy="16" r="2.2" fill="#c8b69c" opacity="0.6"/>
  <circle cx="23" cy="23" r="1.6" fill="#c8b69c" opacity="0.6"/>
  <circle cx="24" cy="14" r="1" fill="#c8b69c" opacity="0.6"/>
  <g fill="#ffffff" opacity="0.7">
    <circle cx="78" cy="10" r="0.6"/>
    <circle cx="88" cy="26" r="0.5"/>
    <circle cx="70" cy="20" r="0.4"/>
    <circle cx="6" cy="44" r="0.5"/>
  </g>
  <path d="M 74 13 Q 77 10 79 13 L 80 12 L 81 13 Q 83 10 86 13 Q 83 12.5 81 15 L 80 14.5 L 79 15 Q 77 12.5 74 13 Z" fill="#0b0514"/>
  <path d="M 31 6 Q 33 4 35 6 L 35.7 5.3 L 36.4 6 Q 38 4 40 6 Q 38 5.6 36.4 7.4 L 35.7 7 L 35 7.4 Q 33 5.6 31 6 Z" fill="#0b0514"/>
  <!-- crimson coat with black lapels -->
  <path d="M 8 96 Q 12 70 34 64 L 62 64 Q 84 70 88 96 Z" fill="url(#coat)"/>
  <path d="M 37 65 L 45 75 L 41 96 L 29 96 L 30 72 Z" fill="#140609" stroke="#d0203a" stroke-width="0.8" stroke-linejoin="round"/>
  <path d="M 59 65 L 51 75 L 55 96 L 67 96 L 66 72 Z" fill="#140609" stroke="#d0203a" stroke-width="0.8" stroke-linejoin="round"/>
  <path d="M 45 75 L 51 75 L 55 96 L 41 96 Z" fill="#2a0c14"/>
  <path d="M 31 86 Q 48 92 65 86" fill="none" stroke="#c8ccd4" stroke-width="0.7" stroke-dasharray="1.2 0.8"/>
  <!-- the high collar: black outside, red lining inside -->
  <path d="M 39 66 L 19 31 Q 15 50 25 68 Z" fill="#140609"/>
  <path d="M 39 66 L 21 35 Q 20 52 28 66 Z" fill="#c01830"/>
  <path d="M 57 66 L 77 31 Q 81 50 71 68 Z" fill="#140609"/>
  <path d="M 57 66 L 75 35 Q 76 52 68 66 Z" fill="#c01830"/>
  <!-- neck, white cravat and red brooch -->
  <path d="M 41 54 L 41 64 L 55 64 L 55 54 Z" fill="#47302a"/>
  <path d="M 42 60 Q 48 64 54 60 L 52 74 Q 48 77 44 74 Z" fill="#ece6ee"/>
  <path d="M 46 66 L 47 74 M 50 66 L 49 74" stroke="#b8aec0" stroke-width="0.6"/>
  <circle cx="48" cy="64.5" r="2.4" fill="#d01830" stroke="#c8ccd4" stroke-width="0.7"/>
  <circle cx="47.3" cy="63.8" r="0.7" fill="#ff8090"/>
  <!-- head -->
  <path d="M 31 34 Q 31 18 48 17 Q 65 18 65 34 L 64 44 Q 62 58 48 62 Q 34 58 32 44 Z" fill="url(#skin)"/>
  <!-- ears -->
  <ellipse cx="31" cy="40" rx="3" ry="5" fill="#47302a"/>
  <ellipse cx="65" cy="40" rx="3" ry="5" fill="#47302a"/>
  <!-- slicked-back hair with a widow's peak -->
  <path d="M 31 33 Q 31 15 48 14 Q 65 15 65 33 Q 62 24 55 23 L 48 28 L 41 23 Q 34 24 31 33 Z" fill="#100c10"/>
  <path d="M 38 18 Q 46 15 56 17" fill="none" stroke="#3a3040" stroke-width="0.8" stroke-linecap="round"/>
  <!-- sharp brows and red-glowing eyes -->
  <circle cx="41" cy="40" r="4.5" fill="url(#eyeglow)"/>
  <circle cx="55" cy="40" r="4.5" fill="url(#eyeglow)"/>
  <path d="M 36 34 L 45 37 M 51 37 L 60 34" stroke="#100c10" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 38 40 L 44 40 M 52 40 L 58 40" stroke="#f4d8d8" stroke-width="2" stroke-linecap="round"/>
  <circle cx="41" cy="40" r="1.3" fill="#e01828"/>
  <circle cx="55" cy="40" r="1.3" fill="#e01828"/>
  <!-- nose -->
  <path d="M 48 41 L 46 48 L 50 48" fill="none" stroke="#3a2620" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- moustache and goatee -->
  <path d="M 42 52 Q 48 49 54 52" fill="none" stroke="#100c10" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 44 56 Q 48 62 52 56 L 50 55 Q 48 57 46 55 Z" fill="#100c10"/>
  <!-- silver gun raised beside him -->
  <g transform="rotate(8 81 60)">
    <rect x="79" y="38" width="4" height="17" rx="1" fill="url(#silver)" stroke="#2a2a32" stroke-width="0.6"/>
    <rect x="80.2" y="36.4" width="1.6" height="2.2" fill="#2a2a32"/>
    <path d="M 77 54 L 85 54 L 85 63 L 77 63 Z" fill="url(#silver)" stroke="#2a2a32" stroke-width="0.6"/>
    <circle cx="81" cy="58.5" r="1.8" fill="#d01830" stroke="#2a2a32" stroke-width="0.4"/>
    <path d="M 77 63 L 85 63 L 87.5 77 L 80.5 78 Z" fill="#140609" stroke="#c8ccd4" stroke-width="0.6" stroke-linejoin="round"/>
    <path d="M 77 66 L 88 66 L 89 100 L 76 100 Z" fill="#140609" stroke="#d0203a" stroke-width="0.6" stroke-linejoin="round"/>
    <path d="M 76.6 78 L 88.4 78" stroke="#d0203a" stroke-width="1.2"/>
    <rect x="76.5" y="65" width="11" height="11" rx="3" fill="#2a0c14" stroke="#d0203a" stroke-width="0.6"/>
    <path d="M 76.8 68.5 L 82 68.5 M 76.8 71.5 L 82 71.5 M 76.8 74.5 L 82 74.5" stroke="#d0203a" stroke-width="0.6" stroke-linecap="round"/>
  </g>
</svg>

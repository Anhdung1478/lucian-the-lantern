      <stop offset="0.4" stop-color="#53352f"/>
      <stop offset="0.76" stop-color="#724a43"/>
      <stop offset="1" stop-color="#996c68"/>
    </linearGradient>
    <linearGradient id="velvet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#291827"/>
      <stop offset="0.5" stop-color="#150c14"/>
      <stop offset="1" stop-color="#0a050a"/>

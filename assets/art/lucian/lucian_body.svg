<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Lucian, top-down, facing +X. Center of the image = center of his body. His own relic pistol is in his left hand (y = -15), Senna's relic gun in his right (y = +15). -->
  <defs>
    <radialGradient id="muzzle">
      <stop offset="0" stop-color="#fffbe8"/>
      <stop offset="0.4" stop-color="#ffe9a8" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffcf5a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="senna_muzzle">
      <stop offset="0" stop-color="#f0fffc"/>
      <stop offset="0.4" stop-color="#b8fff0" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#5fe8cf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#11141c"/>
      <stop offset="1" stop-color="#232a3a"/>
    </linearGradient>
  </defs>
  <g transform="translate(64 64)">
    <!-- shadow -->
    <ellipse cx="-4" cy="3" rx="34" ry="30" fill="#000000" opacity="0.28"/>
    <!-- long coat flaring out behind him, split in the middle -->
    <path d="M -4 -23 L -38 -33 Q -47 -16 -45 -3 L -16 -2 Z" fill="url(#coat)" stroke="#c9d1dc" stroke-width="2" stroke-linejoin="round"/>
    <path d="M -4 23 L -38 33 Q -47 16 -45 3 L -16 2 Z" fill="url(#coat)" stroke="#c9d1dc" stroke-width="2" stroke-linejoin="round"/>
    <!-- arms reaching forward -->
    <path d="M 0 -20 L 20 -15" stroke="#1d2230" stroke-width="10" stroke-linecap="round"/>
    <path d="M 0 20 L 20 15" stroke="#1d2230" stroke-width="10" stroke-linecap="round"/>
    <path d="M 4 -21 L 18 -17" stroke="#c9d1dc" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 4 21 L 18 17" stroke="#c9d1dc" stroke-width="1.5" stroke-linecap="round"/>
    <!-- his own relic pistol (left) -->
    <path d="M 18 -19 L 42 -18 L 44 -15 L 42 -12 L 18 -11 Z" fill="#3a404d" stroke="#9aa3b2" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M 26 -15 L 40 -15" stroke="#ffe9a8" stroke-width="2" stroke-linecap="round"/>
    <!-- Senna's relic gun (right): her cannon in small. A heavy stock, a thick gunmetal barrel, two glowing teal rings, a muzzle cap -->
    <rect x="25" y="6.5" width="16" height="17" rx="5" fill="#b8fff0" opacity="0.2"/>
    <path d="M 12 9 L 25 7.5 L 25 22.5 L 12 21 Q 8.5 15 12 9 Z" fill="#3a4650" stroke="#1a1d24" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="24" y="10" width="19" height="10" rx="2" fill="#4c5a64" stroke="#1a1d24" stroke-width="1.5"/>
    <rect x="27.5" y="7.5" width="3.5" height="15" rx="1.3" fill="#b8fff0" stroke="#1a1d24" stroke-width="1"/>
    <rect x="35" y="7.5" width="3.5" height="15" rx="1.3" fill="#b8fff0" stroke="#1a1d24" stroke-width="1"/>
    <path d="M 42 9 L 46 11.5 L 46 18.5 L 42 21 Z" fill="#2c363e" stroke="#1a1d24" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- hands -->
    <circle cx="20" cy="-15" r="4.5" fill="#5a3a2a"/>
    <circle cx="20" cy="15" r="4.5" fill="#5a3a2a"/>
    <!-- muzzle light -->
    <circle cx="46" cy="-15" r="7" fill="url(#muzzle)"/>
    <circle cx="46" cy="15" r="7" fill="url(#senna_muzzle)"/>
    <!-- shoulders and torso -->
    <ellipse cx="0" cy="0" rx="15" ry="26" fill="#1d2230" stroke="#c9d1dc" stroke-width="2"/>
    <path d="M -10 -21 L -10 21" stroke="#2f3850" stroke-width="3"/>
    <!-- high collar -->
    <path d="M -7 -15 Q 6 0 -7 15" fill="none" stroke="#c9d1dc" stroke-width="2.5" stroke-linecap="round"/>
    <!-- head: skin with short black hair seen from above -->
    <circle cx="2" cy="0" r="11" fill="#5a3a2a"/>
    <circle cx="0" cy="0" r="9.5" fill="#171313"/>
    <path d="M 9 -5 Q 12 0 9 5" fill="none" stroke="#6e4835" stroke-width="2"/>
  </g>
</svg>

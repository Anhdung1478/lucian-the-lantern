<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Classic Lucian (Dual Guns), top-down, facing +X. Dynamic heroic combat stance with layered Sentinel navy-and-white coat tails, gold shoulder clasps, slim silver-gold pistol in left hand (muzzle at 46, -15) and heavier gunmetal Senna relic cannon with twin teal rings in right hand (muzzle at 46, 15). -->
  <defs>
    <radialGradient id="muzzle">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#fff0b8" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#f2ba48" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="senna_muzzle">
      <stop offset="0" stop-color="#f2fffd"/>
      <stop offset="0.38" stop-color="#a8fff0" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#3cd8be" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coatTail" gradientUnits="userSpaceOnUse" x1="-4" y1="0" x2="-50" y2="0">
      <stop offset="0" stop-color="#2e3b54"/>
      <stop offset="0.55" stop-color="#1d2638"/>
      <stop offset="1" stop-color="#111622"/>
    </linearGradient>
    <linearGradient id="torso" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f3d57"/>
      <stop offset="0.6" stop-color="#1f283b"/>
      <stop offset="1" stop-color="#141a28"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#cfd6e2"/>
      <stop offset="1" stop-color="#6c7788"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0b3"/>
      <stop offset="0.5" stop-color="#e3b652"/>
      <stop offset="1" stop-color="#8f631c"/>
    </linearGradient>
    <linearGradient id="gunmetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#687a87"/>
      <stop offset="0.5" stop-color="#3e4b56"/>
      <stop offset="1" stop-color="#232c33"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d3534"/>
      <stop offset="0.55" stop-color="#1b1615"/>
      <stop offset="1" stop-color="#0e0b0b"/>
    </linearGradient>
  </defs>
  <g transform="translate(64 64)">
    <!-- Inner coat lining -->
    <path d="M -14 -2.5 L -47 -5.8 L -46 6.2 L -14 2.5 Z" fill="#0d111a" stroke="#11151f" stroke-width="1.6" stroke-linejoin="round"/>
    <!-- Dynamic asymmetric wind-swept Sentinel coat tails -->
    <path d="M -2 -20 C -13 -28 -29 -34 -43 -32.5 L -48.5 -24.5 Q -45.5 -18.5 -49.5 -12.5 Q -46 -7.5 -47.5 -2.5 L -15 -1.5 Q -9 -10 -2 -20 Z" fill="url(#coatTail)" stroke="#11151f" stroke-width="2" stroke-linejoin="round"/>
    <path d="M -5 20 C -15 28 -30 33.5 -42.5 32 L -47 24.5 Q -44.2 18.8 -48.2 13 Q -45 8 -46.8 2.8 L -15 1.5 Q -9.5 10 -5 20 Z" fill="url(#coatTail)" stroke="#11151f" stroke-width="2" stroke-linejoin="round"/>
    <!-- Folds & specular fabric highlights -->
    <path d="M -12 -11.5 Q -28 -17 -45.5 -18.5 M -16 -5 Q -30 -6.5 -45 -8" fill="none" stroke="#101520" stroke-width="1.7" stroke-linecap="round"/>
    <path d="M -13 11.5 Q -28 16.8 -44.5 18.2 M -16.5 5.2 Q -29.5 6.8 -44.5 8.2" fill="none" stroke="#101520" stroke-width="1.7" stroke-linecap="round"/>
    <path d="M -9 -18.5 Q -24 -25 -41 -26.5 M -11 18.5 Q -24.5 24.5 -40 25.8" fill="none" stroke="#415273" stroke-width="1.6" stroke-linecap="round"/>
    <!-- Crisp ivory Sentinel outer trim -->
    <path d="M -5 -19 C -15 -26 -30 -31.2 -41.8 -30.4 L -46 -24.5 Q -43.5 -18.8 -47 -12.8 Q -44 -8 -45.2 -4" fill="none" stroke="#dce3ee" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M -7 19 C -16.5 26 -30 30.8 -41.2 30 L -44.8 24.2 Q -42.4 18.8 -45.8 13.2 Q -43 8.2 -44.4 4.2" fill="none" stroke="#dce3ee" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Back & shoulders (subtle dynamic lead) -->
    <path d="M -10 -21 Q -3 -27.5 6 -25 Q 13 -22.5 13.5 -15 L 13 -7 Q 13.8 0 12.6 8 L 11.8 16 Q 10 23.8 2.5 25.5 Q -6.5 27 -12.5 20.5 Q -16.5 10.5 -16 0 Q -15.5 -11 -10 -21 Z" fill="url(#torso)" stroke="#11151f" stroke-width="2.1" stroke-linejoin="round"/>
    <path d="M -14.2 -6.5 Q -15.2 0 -14.2 6.5" fill="none" stroke="#dce3ee" stroke-width="1.3" stroke-linecap="round"/>

    <!-- Arms reaching forward with Sentinel cuffs & gold bands -->
    <path d="M 3 -20.5 L 18 -16" stroke="#11151f" stroke-width="11" stroke-linecap="round"/>
    <path d="M 3 -20.5 L 18 -16" stroke="#253045" stroke-width="7.8" stroke-linecap="round"/>
    <path d="M 1 20.5 L 17 16.2" stroke="#11151f" stroke-width="11" stroke-linecap="round"/>
    <path d="M 1 20.5 L 17 16.2" stroke="#232d42" stroke-width="7.8" stroke-linecap="round"/>
    <path d="M 4.5 -23.6 L 14.5 -20.8 M 3 23.8 L 13.5 21" stroke="#62769c" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M 16.4 -20.2 L 14.2 -12.2 M 15.6 20.4 L 13.4 12.4" stroke="#e4eaf2" stroke-width="2.1" stroke-linecap="round"/>
    <path d="M 14.4 -19.8 L 12.4 -12.8 M 13.6 20 L 11.6 13" stroke="url(#gold)" stroke-width="1" stroke-linecap="round"/>

    <!-- Layered shoulder pauldrons & golden clasps -->
    <path d="M -8.5 -21 Q -1 -27 7.5 -23.5 Q 8.5 -18.2 2 -16 Q -5.5 -15.5 -8.5 -21 Z" fill="#32415c" stroke="#11151f" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M -10.5 21 Q -3 26.8 5.5 23.8 Q 6.5 18.5 0 16.2 Q -7.5 15.8 -10.5 21 Z" fill="#2d3b54" stroke="#11151f" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M -7.5 -23 Q 0 -26.8 7.5 -24.2 M -9.5 23 Q -2 26.8 5.8 24.4" fill="none" stroke="#dce3ee" stroke-width="1.35" stroke-linecap="round"/>
    <circle cx="-1" cy="-21" r="1.6" fill="url(#gold)" stroke="#11151f" stroke-width="0.7"/>
    <circle cx="-2.5" cy="21" r="1.6" fill="url(#gold)" stroke="#11151f" stroke-width="0.7"/>

    <!-- LEFT GUN (Lucian's): slim silver-gold Sentinel pistol, muzzle strictly at (46, -15) -->
    <path d="M 17 -18.2 L 41.2 -18.2 Q 43.6 -18 43.8 -16.2 L 43.8 -13.8 Q 43.6 -12 41.2 -11.8 L 17 -11.8 Q 15.2 -15 17 -18.2 Z" fill="url(#silver)" stroke="#11151f" stroke-width="1.75" stroke-linejoin="round"/>
    <rect x="22.2" y="-18.8" width="2.6" height="7.6" rx="0.7" fill="url(#gold)" stroke="#11151f" stroke-width="0.85"/>
    <rect x="36.8" y="-18.5" width="2.1" height="7" rx="0.5" fill="url(#gold)" stroke="#11151f" stroke-width="0.75"/>
    <path d="M 26.2 -15 L 35.4 -15" stroke="#fff4c4" stroke-width="2" stroke-linecap="round"/>
    <path d="M 26.2 -15 L 35.4 -15" stroke="#ffffff" stroke-width="0.85" stroke-linecap="round"/>
    <path d="M 43.2 -17 L 46 -16 L 46 -14 L 43.2 -13 Z" fill="url(#gold)" stroke="#11151f" stroke-width="0.9" stroke-linejoin="round"/>

    <!-- RIGHT GUN (Senna's): heavier gunmetal relic cannon with teal core & TWO glowing teal rings, muzzle strictly at (46, 15) -->
    <rect x="25" y="6.2" width="16.5" height="17.6" rx="5" fill="#94fff0" opacity="0.22"/>
    <path d="M 11 8.8 L 25 7.4 L 25 22.6 L 11 21.2 Q 7.4 15 11 8.8 Z" fill="url(#gunmetal)" stroke="#11151f" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M 12.2 10.4 L 23.6 9.2" stroke="#7c93a3" stroke-width="1.3" stroke-linecap="round"/>
    <circle cx="13.2" cy="15" r="2.3" fill="#b8fff0" stroke="#11151f" stroke-width="0.95"/>
    <circle cx="13.2" cy="15" r="1" fill="#ffffff"/>
    <rect x="24" y="9.8" width="19" height="10.4" rx="2" fill="url(#gunmetal)" stroke="#11151f" stroke-width="1.8"/>
    <path d="M 26 11.8 L 41 11.8" stroke="#8aa3b3" stroke-width="1.3" stroke-linecap="round"/>
    <!-- Twin glowing teal relic rings -->
    <rect x="27.5" y="7.4" width="3.5" height="15.2" rx="1.3" fill="#9cfce8" stroke="#11151f" stroke-width="1.15"/>
    <rect x="35" y="7.4" width="3.5" height="15.2" rx="1.3" fill="#9cfce8" stroke="#11151f" stroke-width="1.15"/>
    <path d="M 29.2 9 L 29.2 21 M 36.7 9 L 36.7 21" stroke="#ffffff" stroke-width="0.9" stroke-linecap="round"/>
    <path d="M 42 9 L 46 11.5 L 46 18.5 L 42 21 Z" fill="#232c34" stroke="#11151f" stroke-width="1.4" stroke-linejoin="round"/>

    <!-- Sculpted gripping hands -->
    <path d="M 16.5 -18.4 Q 20.5 -19.2 23.2 -17.4 Q 24.4 -15 23.2 -12.6 Q 20.5 -10.8 16.5 -11.6 Q 15.2 -15 16.5 -18.4 Z" fill="#5e3d2c" stroke="#11151f" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M 16.5 11.6 Q 20.5 10.8 23.2 12.6 Q 24.4 15 23.2 17.4 Q 20.5 19.2 16.5 18.4 Q 15.2 15 16.5 11.6 Z" fill="#5e3d2c" stroke="#11151f" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M 18.2 -17.4 Q 20.8 -17.8 22.2 -16 M 18.2 12.6 Q 20.8 12.2 22.2 14" fill="none" stroke="#8f5f44" stroke-width="1.1" stroke-linecap="round"/>

    <!-- Muzzle glows strictly at (46, -15) and (46, 15) -->
    <circle cx="46" cy="-15" r="7" fill="url(#muzzle)"/>
    <circle cx="46" cy="15" r="7" fill="url(#senna_muzzle)"/>

    <!-- High sculpted Sentinel collar -->
    <path d="M 7.5 -12 Q -1.5 -17.5 -10 -12.8 Q -15.5 -6.8 -15.5 0 Q -15.5 6.8 -10 12.8 Q -1.5 17.5 7 12 L 5 8.8 Q -2 12.2 -7.5 9.2 Q -11.5 5.2 -11.5 0 Q -11.5 -5.2 -7.5 -9.2 Q -2 -12.2 5 -8.8 Z" fill="#28344a" stroke="#11151f" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M 3.5 -13.2 Q -3 -15.4 -9 -12 Q -13.8 -6.8 -13.8 0 Q -13.8 6.8 -9 12 Q -3 15.4 3.2 13" fill="none" stroke="#dce3ee" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Head -->
    <ellipse cx="1.8" cy="-9.8" rx="2.3" ry="1.7" fill="#4d3122" stroke="#11151f" stroke-width="0.95"/>
    <ellipse cx="1.5" cy="9.8" rx="2.3" ry="1.7" fill="#4d3122" stroke="#11151f" stroke-width="0.95"/>
    <circle cx="2" cy="0" r="9.8" fill="#6a4431" stroke="#11151f" stroke-width="1.8"/>
    <path d="M 11.2 -1.7 Q 13.6 0 11.2 1.7 Z" fill="#593827" stroke="#11151f" stroke-width="0.85" stroke-linejoin="round"/>
    <path d="M 9.2 -6 Q 11.2 -3.2 11.3 -1.3 M 9.2 6 Q 11.2 3.2 11.3 1.3" fill="none" stroke="#916146" stroke-width="1" stroke-linecap="round"/>
    <path d="M 5.4 -8.2 Q -1 -10.6 -6.8 -6 Q -9.4 0 -6.8 6 Q -1 10.6 5.4 8.2 Q 6.8 3.8 7 0 Q 6.8 -3.8 5.4 -8.2 Z" fill="url(#hair)"/>
    <path d="M -4 -5 Q 0 -7 4 -5.4 M -5.5 -1.5 Q -0.5 -2.5 4.2 -1.2 M -4.2 3.8 Q 0 5.4 3.8 4.2" fill="none" stroke="#473e3c" stroke-width="1.05" stroke-linecap="round"/>
    <path d="M 8.5 -3.6 Q 9.8 0 8.5 3.6" fill="none" stroke="#8f5f44" stroke-width="1.05" stroke-linecap="round"/>
  </g>
</svg>

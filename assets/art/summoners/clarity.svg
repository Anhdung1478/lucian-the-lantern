  <path d="M 41 27.5 C 43.5 30.5 45 33.4 45 36.2 C 45 43.2 39.2 48 32 48 C 29.5 48 27.2 47.5 25.3 46.6 C 34 45.5 40.8 40.8 41.2 34.5 C 41.4 31.8 41.3 29.5 41 27.5 Z" fill="#173a99" opacity="0.65"/>

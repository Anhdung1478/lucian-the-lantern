  <path d="M 32 14 C 36.2 21 45 28.5 45 36.2 C 45 43.2 39.2 48 32 48 C 24.8 48 19 43.2 19 36.2 C 19 28.5 27.8 21 32 14 Z" fill="none" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>

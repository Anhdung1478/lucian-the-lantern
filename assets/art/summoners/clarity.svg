    </linearGradient>
    <linearGradient id="swirl2" x1="56" y1="52" x2="10" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9beeff"/>
      <stop offset="0.5" stop-color="#3088f0"/>
      <stop offset="1" stop-color="#153799"/>
    </linearGradient>
    <radialGradient id="dropGrad" cx="28" cy="27" r="20" gradientUnits="userSpaceOnUse">

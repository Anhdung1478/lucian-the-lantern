<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64">
  <!-- Clarity: swirling sapphire-cyan arcane mana vortex encircling a gleaming luminous mana droplet -->
  <defs>
    <radialGradient id="aura" cx="32" cy="32" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#68ccff" stop-opacity="0.62"/>
      <stop offset="0.6" stop-color="#1448a8" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#1448a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="swirl1" x1="8" y1="12" x2="54" y2="50" gradientUnits="userSpaceOnUse">

<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64">
  <!-- Flash: brilliant golden-white teleportation starburst with trailing departure warp ring and sparkles -->
  <defs>
    <radialGradient id="aura" cx="32" cy="32" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe270" stop-opacity="0.62"/>
      <stop offset="0.6" stop-color="#cc8418" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#cc8418" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="burst" cx="41" cy="23" r="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#fff099" stop-opacity="0.88"/>
      <stop offset="0.72" stop-color="#ffbf38" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffbf38" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="depart" cx="17" cy="47" r="13" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe066" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffe066" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="starGrad" x1="25" y1="7" x2="56" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#fff2a6"/>
      <stop offset="1" stop-color="#f0a824"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#aura)"/>
  <!-- departure warp ring (bottom-left) -->
  <circle cx="17.5" cy="46.5" r="13" fill="url(#depart)"/>
  <ellipse cx="17.5" cy="46.5" rx="10.5" ry="6.2" transform="rotate(-38 17.5 46.5)" fill="none" stroke="#1a1d24" stroke-width="4.2" stroke-dasharray="10 5" stroke-linecap="round"/>
  <ellipse cx="17.5" cy="46.5" rx="10.5" ry="6.2" transform="rotate(-38 17.5 46.5)" fill="none" stroke="#ffd859" stroke-width="2" stroke-dasharray="10 5" stroke-linecap="round"/>
  <!-- warp speed streaks bridging departure to arrival -->
  <path d="M 18 41 L 31 28 M 23 45 L 34 34 M 15 36 L 24 27" stroke="#fff2a6" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  <!-- departure motes -->
  <circle cx="10.5" cy="48.5" r="2.2" fill="#ffe680" stroke="#1a1d24" stroke-width="1.2"/>
  <circle cx="23.5" cy="52.5" r="1.9" fill="#fff5bf" stroke="#1a1d24" stroke-width="1.1"/>
  <circle cx="14.5" cy="54.5" r="1.4" fill="#ffcf4a"/>
  <circle cx="28" cy="42.5" r="1.6" fill="#fff8d6"/>
  <!-- arrival teleportation starburst (upper-right) -->
  <circle cx="41" cy="23" r="20" fill="url(#burst)"/>
  <!-- diagonal secondary rays -->
  <path d="M 30.5 12.5 L 36.5 18.5 M 51.5 12.5 L 45.5 18.5 M 30.5 33.5 L 36.5 27.5 M 51.5 33.5 L 45.5 27.5" stroke="#1a1d24" stroke-width="4.6" stroke-linecap="round"/>
  <path d="M 30.5 12.5 L 36.5 18.5 M 51.5 12.5 L 45.5 18.5 M 30.5 33.5 L 36.5 27.5 M 51.5 33.5 L 45.5 27.5" stroke="#ffe57a" stroke-width="2.2" stroke-linecap="round"/>
  <!-- primary 4-point starburst -->
  <path d="M 41 4 L 44.8 19.2 L 60 23 L 44.8 26.8 L 41 42 L 37.2 26.8 L 22 23 L 37.2 19.2 Z" fill="url(#starGrad)" stroke="#1a1d24" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M 41 11.5 L 43 21 L 52.5 23 L 43 25 L 41 34.5 L 39 25 L 29.5 23 L 39 21 Z" fill="#ffffff"/>
  <circle cx="41" cy="23" r="4.2" fill="#ffffff"/>
  <!-- crisp mini sparkle -->
  <path d="M 15 21 L 16.1 23.9 L 19 25 L 16.1 26.1 L 15 29 L 13.9 26.1 L 11 25 L 13.9 23.9 Z" fill="#fff6cc"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64">
  <!-- Barrier: radiant golden-amber faceted arcane dome/hex shield enveloping a Sentinel silhouette core -->
  <defs>
    <radialGradient id="aura" cx="32" cy="32" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd561" stop-opacity="0.62"/>
      <stop offset="0.62" stop-color="#b86414" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#b86414" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="domeFill" cx="26" cy="22" r="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff8d6" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#ffcf54" stop-opacity="0.82"/>
      <stop offset="0.8" stop-color="#d97a16" stop-opacity="0.86"/>
      <stop offset="1" stop-color="#873e09" stop-opacity="0.95"/>
    </radialGradient>
    <linearGradient id="coreFig" x1="32" y1="20" x2="32" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5c3610"/>
      <stop offset="1" stop-color="#211408"/>
    </linearGradient>
    <linearGradient id="rimGold" x1="10" y1="10" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffbe6"/>
      <stop offset="0.45" stop-color="#ffcf54"/>
      <stop offset="1" stop-color="#a8560d"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#aura)"/>
  <!-- faceted hexagonal arcane barrier shell -->
  <polygon points="32,6 54,18.5 54,44.5 32,57.5 10,44.5 10,18.5" fill="url(#domeFill)" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- internal crystal facets -->
  <polygon points="32,6 54,18.5 32,27 10,18.5" fill="#fff6cc" opacity="0.38"/>
  <polygon points="54,18.5 54,44.5 32,57.5 32,27" fill="#9c4908" opacity="0.35"/>
  <!-- subtle protected Sentinel silhouette core inside dome -->
  <circle cx="32" cy="24.5" r="5" fill="url(#coreFig)" stroke="#ffe79e" stroke-width="1.2"/>
  <path d="M 22.5 46 C 23 36.5 26.5 31.5 32 31.5 C 37.5 31.5 41 36.5 41.5 46 L 32 51 Z" fill="url(#coreFig)" stroke="#ffe79e" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- faceted arcane lattice lines over the dome -->
  <path d="M 32 6 L 32 16 M 10 18.5 L 22 25 M 54 18.5 L 42 25 M 10 44.5 L 22 38 M 54 44.5 L 42 38 M 32 57.5 L 32 49" stroke="#fff4c4" stroke-width="1.4" stroke-linecap="round" opacity="0.8"/>
  <polygon points="32,12 48.5,21.5 48.5,41.5 32,51 15.5,41.5 15.5,21.5" fill="none" stroke="url(#rimGold)" stroke-width="1.8" stroke-linejoin="round" opacity="0.9"/>
  <!-- crisp top-left specular gleam -->
  <path d="M 14.5 21 L 32 10.8 L 43 17" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- bold dark outer outline -->
  <polygon points="32,6 54,18.5 54,44.5 32,57.5 10,44.5 10,18.5" fill="none" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- sparkles -->
  <path d="M 52 10 L 53.1 12.9 L 56 14 L 53.1 15.1 L 52 18 L 50.9 15.1 L 48 14 L 50.9 12.9 Z" fill="#fffbe0"/>
  <path d="M 11 49 L 11.9 51.1 L 14 52 L 11.9 52.9 L 11 55 L 10.1 52.9 L 8 52 L 10.1 51.1 Z" fill="#ffe07a"/>
</svg>

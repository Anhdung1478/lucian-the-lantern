<svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 56 56">
  <!-- Honeyfruit: a cluster of five golden fruits seen from above, shiny and round, on a low stalk with two broad leaves. -->
  <g transform="translate(28 29)">
    <ellipse cx="1" cy="3" rx="23" ry="21" fill="#000000" opacity="0.25"/>
    <!-- leaves -->
    <path d="M -2 2 Q -24 -6 -24 12 Q -10 16 -2 2 Z" fill="#4f8a2e" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 2 0 Q 22 -16 25 2 Q 12 10 2 0 Z" fill="#4f8a2e" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M -4 3 Q -15 3 -20 9 M 4 1 Q 14 -4 21 -1" fill="none" stroke="#7cbc45" stroke-width="1.5" stroke-linecap="round"/>
    <!-- fruits -->
    <circle cx="-8" cy="-9" r="8" fill="#e8a92a" stroke="#1a1d24" stroke-width="2.5"/>
    <circle cx="8" cy="-10" r="8" fill="#f0b632" stroke="#1a1d24" stroke-width="2.5"/>
    <circle cx="-10" cy="6" r="8" fill="#f0b632" stroke="#1a1d24" stroke-width="2.5"/>
    <circle cx="9" cy="7" r="8" fill="#e8a92a" stroke="#1a1d24" stroke-width="2.5"/>
    <circle cx="0" cy="-1" r="9" fill="#f7c84a" stroke="#1a1d24" stroke-width="2.5"/>
    <!-- shine -->
    <circle cx="-10" cy="-11" r="2.5" fill="#fff3c2"/>
    <circle cx="6" cy="-12" r="2.5" fill="#fff3c2"/>
    <circle cx="-12" cy="4" r="2.5" fill="#fff3c2"/>
    <circle cx="7" cy="5" r="2.5" fill="#fff3c2"/>
    <circle cx="-3" cy="-4" r="3" fill="#fff3c2"/>
    <!-- the stalk's tip -->
    <path d="M 0 -10 L 2 -15" stroke="#5a3b1e" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>

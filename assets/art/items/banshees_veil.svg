<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64">
  <!-- Banshee's Veil (legendary): a pale violet spectral hooded veil with a tattered hem around an empty dark void, a glowing cyan spell-shield gem at the throat. -->
  <defs>
    <radialGradient id="aura" cx="32" cy="32" r="31" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9a7bff" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#5a3fc0" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#5a3fc0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="veil" x1="10" y1="4" x2="54" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ece4ff"/>
      <stop offset="0.5" stop-color="#a28ce8"/>
      <stop offset="1" stop-color="#5a46a8"/>
    </linearGradient>
    <radialGradient id="void" cx="32" cy="23" r="13" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7a66f0"/>
      <stop offset="0.45" stop-color="#2c2170"/>
      <stop offset="1" stop-color="#0e0a26"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#aura)"/>
  <path d="M 32 3 C 46 3 50 15 48 27 C 52 39 56 49 59 60 L 51 55 L 47 62 L 40 55 L 34 63 L 29 55 L 22 62 L 17 55 L 10 61 C 12 49 14 39 16 27 C 14 15 18 3 32 3 Z" fill="url(#veil)" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- folds -->
  <path d="M 21 36 C 20 44 18 50 16 55 M 43 36 C 44 44 46 50 48 55 M 32 40 L 32 56" fill="none" stroke="#6a55b8" stroke-width="2" stroke-linecap="round"/>
  <path d="M 19 9 C 15 18 15 28 13 40" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
  <!-- hood opening: an empty void with a faint violet glow deep inside -->
  <path d="M 32 10 C 41.5 10 44 19.5 42 28.5 C 39 35 25 35 22 28.5 C 20 19.5 22.5 10 32 10 Z" fill="url(#void)" stroke="#1a1d24" stroke-width="2" stroke-linejoin="round"/>
  <path d="M 25 14.5 C 23.2 18.5 23 23 23.8 27" fill="none" stroke="#d8ccff" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  <!-- spell-shield gem at the throat -->
  <path d="M 32 32 L 37 37.5 L 32 43 L 27 37.5 Z" fill="#7feeff" stroke="#1a1d24" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M 32 34.6 L 34.6 37.5 L 32 40.4 L 29.4 37.5 Z" fill="#eaffff"/>
  <!-- sparkles -->
  <path d="M 54 9 L 55.2 12.3 L 58.5 13.5 L 55.2 14.7 L 54 18 L 52.8 14.7 L 49.5 13.5 L 52.8 12.3 Z" fill="#e6f6ff"/>
  <path d="M 9 20 L 9.9 22.1 L 12 23 L 9.9 23.9 L 9 26 L 8.1 23.9 L 6 23 L 8.1 22.1 Z" fill="#c4b0ff"/>

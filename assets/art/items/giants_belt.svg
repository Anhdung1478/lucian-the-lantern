<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64">
  <!-- Giant's Belt (fragment): a wide stitched leather belt buckled into a loop, seen from a little above so the inside of the far side shows, a big gold buckle in front and the strap end hanging out. -->
  <defs>
    <radialGradient id="aura" cx="32" cy="32" r="31" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6fcf6a" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#6fcf6a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leather" x1="5" y1="14" x2="59" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c98a4c"/>
      <stop offset="0.5" stop-color="#8a5327"/>
      <stop offset="1" stop-color="#5d3516"/>
    </linearGradient>
    <linearGradient id="inside" x1="8" y1="0" x2="56" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3a2214"/>
      <stop offset="0.55" stop-color="#5d3516"/>
      <stop offset="1" stop-color="#8a5327"/>
    </linearGradient>
    <linearGradient id="gold" x1="22" y1="29" x2="42" y2="49" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe7a3"/>
      <stop offset="0.5" stop-color="#e2a93b"/>
      <stop offset="1" stop-color="#a8641a"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#aura)"/>
  <g transform="rotate(-8 32 32)">
    <!-- outer face of the band, with the see-through gap -->
    <path d="M 5 20 A 27 12 0 0 1 59 20 L 59 34 A 27 12 0 0 1 5 34 Z M 10.07 27 A 27 12 0 0 1 53.93 27 A 27 12 0 0 1 10.07 27 Z" fill="url(#leather)" fill-rule="evenodd"/>
    <!-- inside of the far side -->
    <path d="M 5 20 A 27 12 0 0 1 59 20 A 27 12 0 0 1 5 20 Z M 10.07 27 A 27 12 0 0 1 53.93 27 A 27 12 0 0 1 10.07 27 Z" fill="url(#inside)" fill-rule="evenodd"/>
    <path d="M 10.07 27 A 27 12 0 0 1 53.93 27 A 27 12 0 0 1 10.07 27 Z" fill="none" stroke="#1a1d24" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M 5 20 A 27 12 0 0 0 59 20" fill="none" stroke="#1a1d24" stroke-width="2.2"/>
    <!-- stitching and the lit rim -->
    <path d="M 7 22.2 A 25 12 0 0 0 57 22.2 M 7 31.8 A 25 12 0 0 0 57 31.8" fill="none" stroke="#e6b47c" stroke-width="1.2" stroke-dasharray="2 1.6" opacity="0.85"/>
    <path d="M 8 18 C 11 12.5 19 9.4 28 8.7" fill="none" stroke="#f0c48e" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 5 20 A 27 12 0 0 1 59 20 L 59 34 A 27 12 0 0 1 5 34 Z" fill="none" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- strap end hanging out of the buckle -->
    <path d="M 38 35 C 45 35.5 49.5 38.5 51.5 43.5 L 54.5 51.5 C 55.2 53.6 54 55.4 51.8 55.2 L 49.2 54.8 C 47.4 49.5 45.2 46.2 38 45 Z" fill="url(#leather)" stroke="#1a1d24" stroke-width="2.2" stroke-linejoin="round"/>
    <circle cx="50" cy="47" r="1.1" fill="#2a160a"/>
    <circle cx="51.8" cy="51.2" r="1.1" fill="#2a160a"/>
    <!-- buckle -->
    <rect x="21" y="29" width="21" height="20" rx="3" fill="url(#gold)" stroke="#1a1d24" stroke-width="2.5"/>
    <rect x="25.5" y="33.5" width="12" height="11" rx="1" fill="#6b3f24" stroke="#a8641a" stroke-width="1.5"/>
    <path d="M 23.5 39 L 34.5 39" stroke="#1a1d24" stroke-width="3.6" stroke-linecap="round"/>
    <path d="M 23.5 39 L 34.5 39" stroke="#e8edf3" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 23.5 31 L 39 31" stroke="#fff3c9" stroke-width="1.3" stroke-linecap="round"/>
  </g>
</svg>

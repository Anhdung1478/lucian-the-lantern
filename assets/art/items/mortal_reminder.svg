<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64">
  <!-- Mortal Reminder: a heavy single-edged cleaver with a clipped tip, a venom-green edge and dripping poison -->
  <defs>
    <radialGradient id="aura" cx="32" cy="32" r="31" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7ae03a" stop-opacity="0.5"/>
      <stop offset="0.6" stop-color="#3a7a1a" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#3a7a1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blade" x1="24" y1="0" x2="46" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8a95a8"/>
      <stop offset="0.35" stop-color="#e8edf5"/>
      <stop offset="1" stop-color="#a8b4c4"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#aura)"/>
  <g transform="translate(1.6 1.6) scale(0.95) rotate(45 32 32)">
    <path d="M 24 2 L 34 2 C 44 9 47 25 45 40 L 24 40 Z" fill="url(#blade)" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- thick dark spine -->
    <path d="M 26.5 5 L 26.5 38" stroke="#4a5568" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 31 8 L 31 34" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>
    <!-- venom edge -->
    <path d="M 36 4 C 43 11 45 26 43 38" fill="none" stroke="#8aef3a" stroke-width="3" stroke-linecap="round"/>
    <path d="M 36.5 4.5 C 42 11 44 24 42.5 36" fill="none" stroke="#e6ffb0" stroke-width="1.2" stroke-linecap="round"/>
    <!-- guard, grip, pommel -->
    <path d="M 19 40 L 45 40 L 45 45 L 19 45 Z" fill="#4a5568" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 22 42 L 42 42" stroke="#a8b4c4" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M 28.5 45 L 35.5 45 L 35 56 L 29 56 Z" fill="#3a4a2a" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 29 48.5 L 35.2 47.5 M 29.2 52.5 L 35 51.5" stroke="#1f2a14" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="32" cy="59" r="3.6" fill="#5aa02a" stroke="#1a1d24" stroke-width="2.5"/>
    <circle cx="31" cy="58" r="1.1" fill="#d6ffa8"/>
  </g>
  <!-- drips -->
  <path d="M 50 38 C 52 41 54 42.5 54 45 C 54 47.5 52.2 49 50 49 C 47.8 49 46 47.5 46 45 C 46 42.5 48 41 50 38 Z" fill="#8aef3a" stroke="#1a1d24" stroke-width="1.8" stroke-linejoin="round"/>
  <circle cx="48.5" cy="45" r="1" fill="#e6ffb0"/>
  <path d="M 57 52 C 58.4 54 59.6 55 59.6 56.6 C 59.6 58.2 58.4 59.2 57 59.2 C 55.6 59.2 54.4 58.2 54.4 56.6 C 54.4 55 55.6 54 57 52 Z" fill="#8aef3a" stroke="#1a1d24" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M 12 12 L 12.9 14.1 L 15 15 L 12.9 15.9 L 12 18 L 11.1 15.9 L 9 15 L 11.1 14.1 Z" fill="#d6ffa8"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64">
  <!-- Black Cleaver: a black double-bitted battle axe on the diagonal, two crescent blades with red-hot glowing edges, a red rune on the socket and red bands on the haft -->
  <defs>
    <radialGradient id="aura" cx="32" cy="32" r="31" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff3a2a" stop-opacity="0.5"/>
      <stop offset="0.6" stop-color="#8a1a14" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8a1a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="iron" x1="0" y1="0" x2="64" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7a7584"/>
      <stop offset="0.5" stop-color="#46424f"/>
      <stop offset="1" stop-color="#25222b"/>
    </linearGradient>
    <linearGradient id="haft" x1="29" y1="0" x2="35" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5a5262"/>
      <stop offset="0.5" stop-color="#2f2a36"/>
      <stop offset="1" stop-color="#18151c"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#aura)"/>
  <g transform="rotate(45 32 32)">
    <!-- haft -->
    <path d="M 29 32 L 35 32 L 35 59.5 L 29 59.5 Z" fill="url(#haft)" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 29.6 42.5 L 34.4 40.5 M 29.6 47.5 L 34.4 45.5 M 29.6 52.5 L 34.4 50.5" stroke="#d8302a" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 30.4 38 L 30.4 57" stroke="#8a8094" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
    <!-- pommel spike -->
    <path d="M 32 57.5 L 35.8 61.3 L 32 65.3 L 28.2 61.3 Z" fill="#46424f" stroke="#1a1d24" stroke-width="2.2" stroke-linejoin="round"/>
    <circle cx="32" cy="61.3" r="1.2" fill="#ff4a3a"/>
    <!-- the head, drawn a size larger -->
    <g transform="translate(32 25.5) scale(1.1) translate(-32 -22.5)">
      <!-- red heat haze outside both edges -->
      <path d="M 47 7 Q 67 22.5 47 38 M 17 7 Q -3 22.5 17 38" fill="none" stroke="#ff2a1a" stroke-width="6.4" stroke-linecap="round" opacity="0.3"/>
      <!-- the two blades -->
      <path d="M 35 16 Q 42 15 47 7 Q 67 22.5 47 38 Q 42 30 35 29 Z" fill="url(#iron)" stroke="#1a1d24" stroke-width="2.3" stroke-linejoin="round"/>
      <path d="M 29 16 Q 22 15 17 7 Q -3 22.5 17 38 Q 22 30 29 29 Z" fill="url(#iron)" stroke="#1a1d24" stroke-width="2.3" stroke-linejoin="round"/>
      <!-- glowing edges -->
      <path d="M 47 7 Q 67 22.5 47 38 Q 60.5 22.5 47 7 Z" fill="#ff3a2a"/>
      <path d="M 17 7 Q -3 22.5 17 38 Q 3.5 22.5 17 7 Z" fill="#ff3a2a"/>
      <path d="M 49.5 12 Q 57.2 22.5 49.5 33 M 14.5 12 Q 6.8 22.5 14.5 33" fill="none" stroke="#ffc2a8" stroke-width="1.1" stroke-linecap="round"/>
      <!-- forged bevels and lit edge -->
      <path d="M 36 26.5 Q 43 27.5 47.5 33 M 28 26.5 Q 21 27.5 16.5 33" fill="none" stroke="#1c1a21" stroke-width="1.4" stroke-linecap="round" opacity="0.8"/>
      <path d="M 27.5 18 Q 22 17.5 18 11.5 M 9.5 18 Q 8 22.5 9.5 27" fill="none" stroke="#c9c4d4" stroke-width="1.3" stroke-linecap="round" opacity="0.8"/>
      <!-- socket, top spike and rune -->
      <path d="M 29 12.5 L 32 2.5 L 35 12.5 Z" fill="#5a5664" stroke="#1a1d24" stroke-width="2" stroke-linejoin="round"/>
      <rect x="28.3" y="11" width="7.4" height="22" rx="1.6" fill="#3d3945" stroke="#1a1d24" stroke-width="2.3"/>
      <path d="M 30 13.5 L 30 30.5" stroke="#7a7584" stroke-width="1.1" stroke-linecap="round"/>
      <path d="M 32 15.5 L 34.6 22 L 32 28.5 L 29.4 22 Z" fill="#ff3a2a" stroke="#6a0e0a" stroke-width="0.9" stroke-linejoin="round"/>
      <path d="M 32 18.5 L 33.2 22 L 32 25.5 L 30.8 22 Z" fill="#ffc8b4"/>
    </g>
  </g>
  <!-- sparkles -->
  <path d="M 10 7 L 11.4 10.6 L 15 12 L 11.4 13.4 L 10 17 L 8.6 13.4 L 5 12 L 8.6 10.6 Z" fill="#ffc9b0"/>
  <path d="M 54 51 L 54.9 53.1 L 57 54 L 54.9 54.9 L 54 57 L 53.1 54.9 L 51 54 L 53.1 53.1 Z" fill="#ff9a7a"/>
</svg>

      <stop offset="0" stop-color="#4f9bff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#4f9bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gem" x1="16" y1="10" x2="50" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a9dcff"/>
      <stop offset="0.5" stop-color="#4a92ea"/>
      <stop offset="1" stop-color="#244f9e"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#aura)"/>
  <path d="M 32 3 C 36 12 52 26 52 40 C 52 52 43 60 32 60 C 21 60 12 52 12 40 C 12 26 28 12 32 3 Z" fill="url(#gem)" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>

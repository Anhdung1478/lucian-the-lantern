<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64">
  <!-- Gunmetal Greaves: the Berserker's war boot rebuilt in dark gunmetal, side-on, toe to the right: a gold-edged steel greave with a forward knee point and a glowing ember gem, two spikes on a gold-trimmed spine, twin blades sweeping back from the heel, a gold cuff, a gold-edged toe cap, gold sparkles -->
  <defs>
    <radialGradient id="aura" cx="32" cy="32" r="31" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#c2531f" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#c2531f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gunmetal" x1="14" y1="10" x2="54" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9aa4b6"/>
      <stop offset="0.5" stop-color="#5c6678"/>
      <stop offset="1" stop-color="#2e3442"/>
    </linearGradient>
    <linearGradient id="steel" x1="2" y1="2" x2="44" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f4f7fb"/>
      <stop offset="0.5" stop-color="#b9c4d4"/>
      <stop offset="1" stop-color="#7c8799"/>
    </linearGradient>
    <linearGradient id="gold" x1="10" y1="0" x2="50" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe7a3"/>
      <stop offset="0.5" stop-color="#e2a93b"/>
      <stop offset="1" stop-color="#a8641a"/>
    </linearGradient>
    <linearGradient id="cap" x1="46" y1="34" x2="60" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f4f7fb"/>
      <stop offset="0.5" stop-color="#b9c4d4"/>
      <stop offset="1" stop-color="#7c8799"/>
    </linearGradient>
    <radialGradient id="glow" cx="35.6" cy="15" r="8" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ff6a2a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gem" x1="33" y1="11" x2="38" y2="19" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd0a0"/>
      <stop offset="0.45" stop-color="#ff5a3a"/>
      <stop offset="1" stop-color="#a0141e"/>
    </linearGradient>
    <linearGradient id="sole" x1="12" y1="48" x2="40" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4a505e"/>
      <stop offset="0.5" stop-color="#2c313c"/>
      <stop offset="1" stop-color="#1a1d24"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#aura)"/>
  <g transform="translate(-2.2 0.6)">
  <!-- twin heel blades and two calf spikes -->
  <g stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round">
    <path d="M 14 36.2 C 9.8 35.8 7.2 34 5.4 30.6 C 6 37 8.8 42 13.2 43.4 Z" fill="url(#steel)"/>
    <path d="M 12.4 43.4 C 9.4 44 7.2 43.4 5.2 42 C 6.4 46.6 9 49.2 12.6 49.4 Z" fill="url(#steel)"/>
    <path d="M 16.4 8.4 L 6 4.2 L 15.8 16.6 Z" fill="url(#steel)"/>
    <path d="M 15.8 18.2 L 5.6 19 L 15.2 26 Z" fill="url(#steel)"/>
  </g>
  <path d="M 12 38.2 C 9.4 37.6 7.8 36.2 6.6 34 M 10.8 45.6 C 9 45.6 7.6 45.2 6.6 44.4" fill="none" stroke="#e2a93b" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M 13.4 9.4 L 8.6 7.4 M 12.8 19.6 L 8.4 19.6" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>
  <!-- the gunmetal boot -->
  <path d="M 16.8 8.5 L 37 8.5 C 37.4 18 38 25 39.6 30 C 44.5 33 50.5 34.5 55.5 37.5 C 60 40.2 62 45 61 50 L 12 50 C 10 46 10.4 40.5 13.6 36.5 C 15.6 32 17.2 22 16.8 8.5 Z" fill="url(#gunmetal)" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 11.2 39.6 C 17.5 38.8 22 42.6 24 50" fill="none" stroke="#e2a93b" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 19.6 30 C 19.8 34 19.2 37 18.2 39" fill="none" stroke="#d6dde8" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 40.5 32.2 C 44 34 46 34.6 47.4 35" fill="none" stroke="#d6dde8" stroke-width="1.5" stroke-linecap="round"/>
  <!-- gold-trimmed spine -->
  <path d="M 15.2 8 L 19.6 8 C 19.8 18 19.4 27 17.6 34.6 L 13.6 33.4 C 15 26 15.4 18 15.2 8 Z" fill="url(#gold)" stroke="#1a1d24" stroke-width="2" stroke-linejoin="round"/>
  <path d="M 17 10 C 17.2 18 17 26 15.8 32" fill="none" stroke="#fff4d0" stroke-width="1.1" stroke-linecap="round"/>
  <!-- straps with gold buckles -->
  <g stroke="#1a1d24" stroke-width="2" stroke-linejoin="round">
    <path d="M 18.8 13.4 L 30.5 13.4 L 30.5 17.6 L 18.8 17.6 Z" fill="#3a2a22"/>
    <path d="M 18.6 22.6 L 30.5 22.6 L 30.5 26.8 L 18.4 26.8 Z" fill="#3a2a22"/>
    <path d="M 22 12.2 L 26.4 12.2 L 26.4 18.8 L 22 18.8 Z" fill="url(#gold)"/>
    <path d="M 21.8 21.4 L 26.2 21.4 L 26.2 28 L 21.8 28 Z" fill="url(#gold)"/>
  </g>
  <path d="M 23.2 13.8 L 23.2 17.2 M 23 23 L 23 26.4" stroke="#fff4d0" stroke-width="1.1" stroke-linecap="round"/>
  <!-- gold cuff -->
  <path d="M 15 5 L 38.8 5 L 39.4 11.4 L 14.8 11.4 Z" fill="url(#gold)" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 17 7.2 L 29 7.2" stroke="#fff4d0" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M 16.6 9.6 L 29 9.6" stroke="#a8641a" stroke-width="1.2" stroke-linecap="round"/>
  <!-- the greave: gold rim, steel plate, glowing gem -->
  <path d="M 28.4 6.4 C 30.6 3.2 35 2 40 2.2 L 47 1.8 C 44.4 3.4 42.6 4.4 42.2 7 L 42 26.8 L 35.6 34.6 L 29 27.6 Z" fill="url(#gold)" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 30.4 7.4 C 32.2 5 35.4 3.8 40 3.8 L 42.2 3.8 C 41.2 4.8 40.4 5.6 40.2 7.2 L 40 26.2 L 35.6 31.6 L 30.9 26.8 Z" fill="url(#steel)" stroke="#a8641a" stroke-width="1" stroke-linejoin="round"/>
  <path d="M 35.6 20 L 35.6 30" stroke="#5d6778" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 32.4 9 L 32.4 25.6" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
  <circle cx="35.6" cy="15" r="8" fill="url(#glow)"/>
  <path d="M 35.6 10.6 L 38.4 15 L 35.6 19.4 L 32.8 15 Z" fill="url(#gem)" stroke="#1a1d24" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M 35.2 12.4 L 34.2 14.6" stroke="#fff0e0" stroke-width="1.1" stroke-linecap="round"/>
  <!-- gold-edged toe cap -->
  <path d="M 46.4 34.6 C 50 39 50.8 45 49.2 50 L 61 50 C 62 45 60 40.2 55.5 37.5 C 52.5 35.8 49.6 35 46.4 34.6 Z" fill="url(#gold)" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 49.4 37.4 C 52.4 41 52.8 45.4 51.8 49 L 59.4 49 C 60 45 58.4 41.4 55 39.4 C 53.4 38.4 51.4 37.8 49.4 37.4 Z" fill="url(#cap)" stroke="#a8641a" stroke-width="1" stroke-linejoin="round"/>
  <path d="M 51.4 39.4 C 53.6 40 55.6 41.4 57 43.4" fill="none" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round"/>
  <!-- sole with gold welt line and studs -->
  <path d="M 9.6 49 L 58 49 C 62 49 63.2 52.2 62.6 54.4 C 62 56.6 60 57.6 57.5 57.6 L 34.5 57.6 C 32.4 57.6 31.8 54.6 29.8 54.6 L 27.6 54.6 L 27.2 57.6 L 11.6 57.6 C 10.2 57.6 9.6 56.8 9.6 55.4 Z" fill="url(#sole)" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 11.6 51.6 L 59.6 51.6" stroke="#e2a93b" stroke-width="1.2" stroke-linecap="round"/>
  <g fill="#e2a93b"><circle cx="15" cy="55.2" r="0.9"/><circle cx="19.5" cy="55.2" r="0.9"/><circle cx="24" cy="55.2" r="0.9"/><circle cx="38" cy="55.2" r="0.9"/><circle cx="43" cy="55.2" r="0.9"/><circle cx="48" cy="55.2" r="0.9"/><circle cx="53" cy="55.2" r="0.9"/></g>
  <!-- sparkles -->
  <path d="M 54 12 L 55.4 15.6 L 59 17 L 55.4 18.4 L 54 22 L 52.6 18.4 L 49 17 L 52.6 15.6 Z" fill="#fff4d0"/>
  <path d="M 58 27 L 58.8 29.2 L 61 30 L 58.8 30.8 L 58 33 L 57.2 30.8 L 55 30 L 57.2 29.2 Z" fill="#ffd36b"/>
  </g>
</svg>

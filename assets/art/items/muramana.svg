<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64">
  <!-- Muramana: a slender curved katana with a glowing blue edge, a round gold guard and a blue-wrapped hilt -->
  <defs>
    <radialGradient id="aura" cx="32" cy="32" r="31" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4a8cff" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#2a4aa8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2a4aa8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blade" x1="26" y1="0" x2="42" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f4fbff"/>
      <stop offset="0.5" stop-color="#9ac4ff"/>
      <stop offset="1" stop-color="#4a64b8"/>
    </linearGradient>
    <linearGradient id="gold" x1="20" y1="0" x2="44" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe7a3"/>
      <stop offset="0.5" stop-color="#e2a93b"/>
      <stop offset="1" stop-color="#a8641a"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#aura)"/>
  <g transform="rotate(45 32 32)">
    <path d="M 31 -2 C 42 10 41 30 39 42 L 28 42 C 31 30 28 12 31 -2 Z" fill="url(#blade)" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 30.5 6 C 33 16 33 28 31.5 40" fill="none" stroke="#3a8cff" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M 36 12 C 38 20 38 30 36.5 38" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" opacity="0.85"/>
    <!-- round guard -->
    <ellipse cx="33.5" cy="44" rx="11" ry="4.4" fill="url(#gold)" stroke="#1a1d24" stroke-width="2.5"/>
    <path d="M 26 42.6 C 30 41.2 36 41.2 40 42.6" fill="none" stroke="#fff4d0" stroke-width="1.4" stroke-linecap="round"/>
    <!-- hilt -->
    <path d="M 30 47 L 37 47 L 36.5 57 L 30.5 57 Z" fill="#2f4ed0" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 30.5 50 L 36.8 54 M 36.6 50 L 30.6 54" stroke="#9ab4ff" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="33.5" cy="60" r="3.2" fill="#e2a93b" stroke="#1a1d24" stroke-width="2.5"/>
    <circle cx="32.6" cy="59" r="1" fill="#ffe7a3"/>
  </g>
  <path d="M 52 12 L 53.4 15.6 L 57 17 L 53.4 18.4 L 52 22 L 50.6 18.4 L 47 17 L 50.6 15.6 Z" fill="#dceaff" transform="translate(0 -4)"/>
  <path d="M 10 48 L 10.9 50.1 L 13 51 L 10.9 51.9 L 10 54 L 9.1 51.9 L 7 51 L 9.1 50.1 Z" fill="#8ab4ff"/>
</svg>

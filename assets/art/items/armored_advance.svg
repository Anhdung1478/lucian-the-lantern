<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64">
  <!-- Armored Advance: the plated boot made heavier, side-on, toe to the right: a domed steel knee guard with a side flange and a glowing green stone over three gold-edged lames with gold rivets, a ridged gold-rimmed toe cap, a heavy sole, pale gold sparkles -->
  <defs>
    <radialGradient id="aura" cx="32" cy="32" r="31" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b8f0d0" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#5aa880" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#5aa880" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leather" x1="14" y1="10" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c98d52"/>
      <stop offset="0.5" stop-color="#8a5327"/>
      <stop offset="1" stop-color="#5d3516"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f7fb"/>
      <stop offset="0.5" stop-color="#b9c4d4"/>
      <stop offset="1" stop-color="#7c8799"/>
    </linearGradient>
    <linearGradient id="dome" x1="14" y1="0" x2="40" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#c3cddb"/>
      <stop offset="1" stop-color="#6e798c"/>
    </linearGradient>
    <linearGradient id="cap" x1="45" y1="35" x2="62" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f4f7fb"/>
      <stop offset="0.45" stop-color="#b9c4d4"/>
      <stop offset="1" stop-color="#6a7486"/>
    </linearGradient>
    <linearGradient id="gold" x1="10" y1="0" x2="60" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe7a3"/>
      <stop offset="0.5" stop-color="#e2a93b"/>
      <stop offset="1" stop-color="#a8641a"/>
    </linearGradient>
    <radialGradient id="glow" cx="27.4" cy="9.4" r="8" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c8ffe0" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#3ad88a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gem" x1="25" y1="7" x2="30" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e0fff0"/>
      <stop offset="0.45" stop-color="#3ad88a"/>
      <stop offset="1" stop-color="#147a48"/>
    </linearGradient>
    <linearGradient id="sole" x1="12" y1="48" x2="40" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5e5650"/>
      <stop offset="0.5" stop-color="#3c3632"/>
      <stop offset="1" stop-color="#24201e"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#aura)"/>
  <g transform="translate(-4.6 0.8)">
  <!-- the leather boot -->
  <path d="M 17 12 L 37 12 C 37.4 20 38 25 39.6 30 C 44.5 33 50.5 34.5 55.5 37.5 C 60 40.2 62 45 61 50 L 12 50 C 10 46 10.4 40.5 13.6 36.5 C 15.6 32 17.2 24 17 12 Z" fill="url(#leather)" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 11.4 40.6 C 17.5 39.8 22 43.4 24 50" fill="none" stroke="#5d3516" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 41 33 C 43 34 44.4 34.6 45.4 35" fill="none" stroke="#f0c48e" stroke-width="1.5" stroke-linecap="round"/>
  <!-- three gold-edged lames -->
  <g stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round">
    <path d="M 13.2 27.4 C 22 25.6 33 25.6 42.4 27.6 L 43 34.4 C 33 36.8 22 36.6 12.4 34.8 Z" fill="url(#steel)"/>
    <path d="M 13.6 19.8 C 22 18 32.8 18 41.6 20 L 42.2 28.4 C 32.8 30.6 22 30.4 13 28.6 Z" fill="url(#steel)"/>
    <path d="M 13.8 13 C 22 11.2 32.4 11.2 41 13.2 L 41.6 21.2 C 32.6 23.4 22 23.2 13.4 21.4 Z" fill="url(#steel)"/>
  </g>
  <g fill="none" stroke-linecap="round">
    <path d="M 14.8 33.4 C 22 34.8 32 35 41.6 33" stroke="url(#gold)" stroke-width="2"/>
    <path d="M 15.2 27.2 C 22 28.6 32 28.8 40.8 26.8" stroke="url(#gold)" stroke-width="2"/>
    <path d="M 15.4 20 C 22 21.4 32 21.6 40.2 19.6" stroke="url(#gold)" stroke-width="2"/>
    <path d="M 16.4 15 C 23 13.8 31 13.8 38 15 M 16.2 22 C 23 20.8 31 20.8 38.6 22 M 15.8 29.4 C 23 28.2 31 28.2 39.6 29.6" stroke="#ffffff" stroke-width="1.3"/>
  </g>
  <g fill="url(#gold)" stroke="#1a1d24" stroke-width="1.2">
    <circle cx="17.6" cy="17.4" r="1.5"/><circle cx="37.8" cy="17.6" r="1.5"/>
    <circle cx="17.4" cy="24.6" r="1.5"/><circle cx="38.2" cy="24.8" r="1.5"/>
    <circle cx="17" cy="31.8" r="1.5"/><circle cx="38.8" cy="31.8" r="1.5"/>
  </g>
  <!-- the domed knee guard with a side flange -->
  <path d="M 26 13.6 C 31 10 38.6 9.6 44.6 12.6 C 42.6 15.4 39.4 17 35.4 17.2 Z" fill="url(#steel)" stroke="#1a1d24" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M 11.4 14.6 C 11 6.6 17.6 1.4 27.2 1.4 C 36.8 1.4 43.4 6.6 43 14.6 C 33 16.8 21.4 16.8 11.4 14.6 Z" fill="url(#dome)" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 12.6 13.6 C 22 15.4 32.6 15.4 41.8 13.6" fill="none" stroke="url(#gold)" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M 15 8.6 C 16.6 5.4 20.4 3.6 24.6 3.4" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M 37.6 5 C 39.8 6.8 41 9 41.2 11.4" fill="none" stroke="#5d6778" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="27.4" cy="9.4" r="8" fill="url(#glow)"/>
  <path d="M 27.4 5.8 L 30.4 9.4 L 27.4 13 L 24.4 9.4 Z" fill="url(#gem)" stroke="#1a1d24" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M 27 7.4 L 26 9.2" stroke="#ffffff" stroke-width="1" stroke-linecap="round"/>
  <!-- ridged, gold-rimmed toe cap -->
  <path d="M 44.6 50 C 44 42.4 47.6 35.8 53.8 35.4 C 59 35.2 63 39.8 62.8 45.4 L 62.2 50 Z" fill="url(#gold)" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 46.8 49 C 46.6 43 49.4 37.8 54 37.6 C 58 37.4 61 41 60.8 45.4 L 60.4 49 Z" fill="url(#cap)" stroke="#a8641a" stroke-width="1" stroke-linejoin="round"/>
  <path d="M 50.4 48.6 C 50.2 44 51.6 40.4 54.4 38.6 M 55 48.6 C 55.2 44.6 56.2 41.6 58 39.8" fill="none" stroke="#5d6778" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 48.4 44 C 48.8 41 50.4 39 52.6 38.6" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <!-- heavy sole -->
  <path d="M 9.6 49 L 61.6 49 C 63 49 63.8 50 63.8 51.6 L 63.8 55.8 C 63.8 56.9 63 57.6 61.8 57.6 L 11.4 57.6 C 10.3 57.6 9.6 56.9 9.6 55.8 Z" fill="url(#sole)" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 11.6 51.4 L 61.6 51.4" stroke="url(#gold)" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M 24.6 52.8 L 24.6 57.2" stroke="#24201e" stroke-width="1.6" stroke-linecap="round"/>
  <!-- sparkles -->
  <path d="M 54 14 L 55.4 17.6 L 59 19 L 55.4 20.4 L 54 24 L 52.6 20.4 L 49 19 L 52.6 17.6 Z" fill="#fff4d0"/>
  <path d="M 61 27 L 61.8 29.2 L 64 30 L 61.8 30.8 L 61 33 L 60.2 30.8 L 58 30 L 60.2 29.2 Z" fill="#c8ffe0"/>
  </g>
</svg>

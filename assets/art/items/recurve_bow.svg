<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64">
  <!-- Recurve Bow: an upright wooden bow, limbs sweeping out from a leather grip and curling back at gold-capped tips, a taut string on the right -->
  <defs>
    <radialGradient id="aura" cx="32" cy="32" r="31" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f0c040" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#f0c040" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="grip" x1="13" y1="0" x2="23" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b9793f"/>
      <stop offset="0.5" stop-color="#8a5327"/>
      <stop offset="1" stop-color="#5d3516"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#aura)"/>
  <!-- string, its ends tucked behind the curled tips -->
  <path d="M 47 12 L 47 52" stroke="#1a1d24" stroke-width="4.2" stroke-linecap="round"/>
  <path d="M 47 12 L 47 52" stroke="#f3ead2" stroke-width="1.8" stroke-linecap="round"/>
  <!-- the limbs: outline, wood, shade on the lower right, light on the upper left -->
  <path d="M 34 6 C 44 5 48 11.5 44 16.2 C 36 23.6 18 22.7 18 32 C 18 41.3 36 40.4 44 47.8 C 48 52.5 44 59 34 58" fill="none" stroke="#1a1d24" stroke-width="8.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 34 6 C 44 5 48 11.5 44 16.2 C 36 23.6 18 22.7 18 32 C 18 41.3 36 40.4 44 47.8 C 48 52.5 44 59 34 58" fill="none" stroke="#a8682f" stroke-width="5.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 34 6 C 44 5 48 11.5 44 16.2 C 36 23.6 18 22.7 18 32 C 18 41.3 36 40.4 44 47.8 C 48 52.5 44 59 34 58" fill="none" stroke="#6b3f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(1.1 0.8)"/>
  <path d="M 34 6 C 44 5 48 11.5 44 16.2 C 36 23.6 18 22.7 18 32 C 18 41.3 36 40.4 44 47.8 C 48 52.5 44 59 34 58" fill="none" stroke="#dca066" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" transform="translate(-1 -0.7)"/>
  <path d="M 35 6.6 C 43 6 46.6 11 43.4 15.2 C 35.6 22.6 19 22.2 17.8 30 M 18 35 C 18.6 40.6 27 41.2 34 43.4" fill="none" stroke="#fff0d6" stroke-width="1" stroke-linecap="round" transform="translate(-1.6 -1.1)" opacity="0.9"/>
  <!-- gold tip caps -->
  <circle cx="33.6" cy="6" r="3.3" fill="#e2a93b" stroke="#1a1d24" stroke-width="2"/>
  <circle cx="32.6" cy="5" r="1.1" fill="#ffe7a3"/>
  <circle cx="33.6" cy="58" r="3.3" fill="#e2a93b" stroke="#1a1d24" stroke-width="2"/>
  <circle cx="32.6" cy="57" r="1.1" fill="#ffe7a3"/>
  <!-- leather grip -->
  <rect x="13.2" y="25" width="9.6" height="14" rx="2.8" fill="url(#grip)" stroke="#1a1d24" stroke-width="2.5"/>
  <path d="M 14.4 29 L 21.6 27.8 M 14.4 32.8 L 21.6 31.6 M 14.4 36.6 L 21.6 35.4" stroke="#5d3516" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M 15.1 27 L 15.1 36.6" stroke="#e0b07a" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
</svg>

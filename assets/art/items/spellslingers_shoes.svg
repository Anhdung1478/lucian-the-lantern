<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64">
  <!-- Spellslinger's Shoes: the curled wizard shoe made grand, side-on, in deep indigo: a tall back collar curling out to a gold bead, a gold-trimmed collar hanging in three long points tipped with gold beads, a gold band where the toe curls up into a hook holding a glowing violet orb, a large and a small gold star, a gold-edged sole, violet sparkles -->
  <defs>
    <radialGradient id="aura" cx="32" cy="32" r="31" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c49cff" stop-opacity="0.58"/>
      <stop offset="0.6" stop-color="#6f42d8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#6f42d8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloth" x1="14" y1="20" x2="56" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8670ee"/>
      <stop offset="0.5" stop-color="#4a2cb4"/>
      <stop offset="1" stop-color="#22125a"/>
    </linearGradient>
    <linearGradient id="collar" x1="12" y1="14" x2="40" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5e40c0"/>
      <stop offset="0.5" stop-color="#3c2690"/>
      <stop offset="1" stop-color="#22145a"/>
    </linearGradient>
    <linearGradient id="gold" x1="10" y1="14" x2="60" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe7a3"/>
      <stop offset="0.5" stop-color="#e2a93b"/>
      <stop offset="1" stop-color="#a8641a"/>
    </linearGradient>
    <radialGradient id="glow" cx="51.4" cy="27.4" r="9.5" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f0d8ff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#a04aff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb" cx="50.2" cy="26.2" r="5" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#d4a8ff"/>
      <stop offset="1" stop-color="#7a2ae0"/>
    </radialGradient>
    <linearGradient id="sole" x1="12" y1="48" x2="40" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4a3a78"/>
      <stop offset="0.5" stop-color="#2e2252"/>
      <stop offset="1" stop-color="#1c1436"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#aura)"/>
  <g transform="translate(-3 0)">
  <!-- the shoe and its curling toe -->
  <path d="M 13.6 22.4 C 21 21 31 21 39 22.6 C 40 28.4 43 32.6 47.4 34.8 C 51.4 36.6 55.2 35.4 56.6 32.4 C 57.6 30.2 56.8 27.4 54.4 26.8 C 53.2 26.4 52.2 27 52 28 C 50.8 25.2 52.8 21.6 56.6 21.8 C 60.8 22 63.4 26.4 63 31.4 C 62.4 40.4 57.4 50.8 47.8 50.8 L 12 50.8 C 10.2 46.4 11 40.8 12.6 36.4 C 13.8 32 14 27.4 13.6 22.4 Z" fill="url(#cloth)" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 44 37.6 C 49 40 54.6 39 58.4 34.6" fill="none" stroke="#1e1250" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M 42.2 30.6 C 44 33 46 34.6 48.6 35.4" fill="none" stroke="#e4dbff" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 15.6 33 C 15.6 37 15 40.4 14 43" fill="none" stroke="#d6c8ff" stroke-width="1.5" stroke-linecap="round"/>
  <!-- gold band where the toe curls -->
  <path d="M 57.2 30 C 59.2 29.2 61.6 29 63 29.6 L 62.6 34.4 C 61 33.8 59 34 57.4 34.8 C 57.8 33.2 57.8 31.6 57.2 30 Z" fill="url(#gold)" stroke="#1a1d24" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M 55.6 23.6 C 57.4 23.4 58.8 23.9 59.8 24.8" fill="none" stroke="#e4dbff" stroke-width="1.5" stroke-linecap="round"/>
  <!-- glowing orb on the hook -->
  <circle cx="51.4" cy="27.4" r="9.5" fill="url(#glow)"/>
  <circle cx="51.4" cy="27.4" r="4.2" fill="url(#orb)" stroke="#1a1d24" stroke-width="2"/>
  <circle cx="50.2" cy="26.2" r="1.2" fill="#ffffff"/>
  <!-- gold stars -->
  <path d="M 28.6 32 L 30.6 36.2 L 35.2 36.8 L 31.8 40 L 32.7 44.6 L 28.6 42.4 L 24.5 44.6 L 25.4 40 L 22 36.8 L 26.6 36.2 Z" fill="url(#gold)" stroke="#1a1d24" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M 27.6 35 L 26.8 37" stroke="#fff4d0" stroke-width="1" stroke-linecap="round"/>
  <path d="M 40.4 39.4 L 41.4 41.4 L 43.6 41.7 L 42 43.2 L 42.4 45.4 L 40.4 44.4 L 38.4 45.4 L 38.8 43.2 L 37.2 41.7 L 39.4 41.4 Z" fill="url(#gold)" stroke="#1a1d24" stroke-width="1.3" stroke-linejoin="round"/>
  <!-- tall back collar, curling out to a gold-tipped point -->
  <path d="M 12.6 18.4 C 11 14 9.6 10.4 7.4 6.6 C 12.4 8 16.8 11.4 20.6 16.6 Z" fill="url(#collar)" stroke="#1a1d24" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M 12.6 15.2 C 11.6 12.4 10.6 10.4 9.2 8.4" fill="none" stroke="url(#gold)" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="7.6" cy="6.8" r="2" fill="url(#gold)" stroke="#1a1d24" stroke-width="1.4"/>
  <!-- collar with three long points, gold trim and gold beads -->
  <path d="M 12.2 16.6 C 21 15 31.8 15 40.8 16.8 L 40.6 22.6 L 36.8 31 L 33 23.2 L 28.2 31.6 L 24.2 23.2 L 19.6 31 L 16.2 23 L 12.4 27 Z" fill="url(#collar)" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 13.6 19.2 C 22 17.6 31 17.6 39.6 19.4" fill="none" stroke="#1a1d24" stroke-width="4.4" stroke-linecap="round"/>
  <path d="M 13.6 19.2 C 22 17.6 31 17.6 39.6 19.4" fill="none" stroke="url(#gold)" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M 15 18.4 C 18 17.8 21 17.5 23 17.4" fill="none" stroke="#fff4d0" stroke-width="1" stroke-linecap="round"/>
  <g fill="url(#gold)" stroke="#1a1d24" stroke-width="1.4"><circle cx="19.6" cy="31.8" r="1.9"/><circle cx="28.2" cy="32.4" r="1.9"/><circle cx="36.8" cy="31.8" r="1.9"/><circle cx="12.6" cy="27.6" r="1.5"/></g>
  <!-- thin sole with a gold edge -->
  <path d="M 10.4 50 L 47.8 50 C 53.6 50 58.6 46.6 61.4 41.6 C 61.6 49.4 56.8 57.6 48 57.6 L 12.2 57.6 C 11 57.6 10.4 56.8 10.4 55.6 Z" fill="url(#sole)" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 12.4 52.4 L 48 52.4 C 52.4 52.4 56 50.4 58.4 47.6" fill="none" stroke="url(#gold)" stroke-width="1.3" stroke-linecap="round"/>
  <!-- sparkles -->
  <path d="M 44 6 L 45.4 9.6 L 49 11 L 45.4 12.4 L 44 16 L 42.6 12.4 L 39 11 L 42.6 9.6 Z" fill="#f4e8ff"/>
  <path d="M 28 4 L 28.8 6.2 L 31 7 L 28.8 7.8 L 28 10 L 27.2 7.8 L 25 7 L 27.2 6.2 Z" fill="#d4a8ff"/>
  <circle cx="58" cy="14" r="1.3" fill="#e0c4ff"/>
  </g>
</svg>

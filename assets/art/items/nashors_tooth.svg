<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64">
  <!-- Nashor's Tooth (legendary): a huge curved ivory fang hanging point down, its root held in a jagged violet cap with a gold rim and a glowing magenta gem. -->
  <defs>
    <radialGradient id="aura" cx="32" cy="32" r="31" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c070ff" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#6a30c0" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#6a30c0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ivory" x1="14" y1="0" x2="50" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffaee"/>
      <stop offset="0.5" stop-color="#eadcbc"/>
      <stop offset="1" stop-color="#ad9670"/>
    </linearGradient>
    <linearGradient id="cap" x1="14" y1="2" x2="48" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c58cff"/>
      <stop offset="0.5" stop-color="#8640e0"/>
      <stop offset="1" stop-color="#46198e"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#aura)"/>
  <!-- fang -->
  <path d="M 17 17 L 48 17 C 51 37 40 54 10 61.5 C 21 48 24 31 17 17 Z" fill="url(#ivory)" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 42.5 22 C 44 36 36 49 18 57.5" fill="none" stroke="#b09a70" stroke-width="2" stroke-linecap="round"/>
  <path d="M 21.5 21 C 25.5 31 25 43 17.5 54" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  <!-- jagged violet root cap -->
  <path d="M 13 21.5 C 11.5 16 12 11 15 6.5 C 16.5 9 18 10.5 20 11 C 21 6.5 24 3.5 28.5 2 C 28.5 5.5 29.5 7.5 31.5 8.5 C 34 5 38 3 43 3.5 C 41.5 6.5 41.5 9 43 11 C 46 9.5 48.5 9.5 51 10.5 C 52.5 14 52.5 18 51 21.5 C 41 26 23 26 13 21.5 Z" fill="url(#cap)" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 15 13.5 C 15.5 11.5 16 10 16.5 9.3 M 22.5 9 C 23.5 7.2 25 5.8 26.5 5" fill="none" stroke="#e6c8ff" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 14.5 21.2 C 24 24.6 40 24.6 49.5 21.2" fill="none" stroke="#e2a93b" stroke-width="2.2" stroke-linecap="round"/>
  <!-- glowing gem -->
  <path d="M 32 9.5 L 37 15 L 32 20.5 L 27 15 Z" fill="#ff8cf0" stroke="#1a1d24" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M 32 12.2 L 34.5 15 L 32 17.8 L 29.5 15 Z" fill="#ffe0fb"/>
  <!-- sparkles -->
  <path d="M 54 30 L 55.1 33 L 58.1 34.1 L 55.1 35.2 L 54 38.2 L 52.9 35.2 L 49.9 34.1 L 52.9 33 Z" fill="#f2e0ff"/>
  <path d="M 8 26 L 8.9 28.1 L 11 29 L 8.9 29.9 L 8 32 L 7.1 29.9 L 5 29 L 7.1 28.1 Z" fill="#d0a8ff"/>
  <circle cx="49" cy="50" r="1.3" fill="#e0b8ff"/>
</svg>

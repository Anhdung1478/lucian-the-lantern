<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64">
  <!-- Guardian Angel: an upright sword between two spread golden feathered wings, a glowing halo above its tip -->
  <defs>
    <radialGradient id="aura" cx="32" cy="32" r="31" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd35a" stop-opacity="0.6"/>
      <stop offset="0.6" stop-color="#b07a1a" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#b07a1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="2" y1="6" x2="30" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff0b8"/>
      <stop offset="0.5" stop-color="#e8b240"/>
      <stop offset="1" stop-color="#a8641a"/>
    </linearGradient>
    <linearGradient id="blade" x1="27" y1="0" x2="37" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f4f7fb"/>
      <stop offset="0.5" stop-color="#b9c4d4"/>
      <stop offset="1" stop-color="#7c8799"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#aura)"/>
  <!-- wings: a smooth leading edge on top, five feather tips fanning down the outside -->
  <g>
    <path d="M 30 21 C 23 12 13 6 4 7 Q 2 14 9.5 16 Q 2.5 22 10 26 Q 5 33.5 13.5 35.5 Q 11 43 20 43 Q 21.5 49.5 29.5 45 Z" fill="url(#gold)" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 9.5 16 L 17.5 19.5 M 10 26 L 19 27.5 M 13.5 35.5 L 21.5 34.5 M 20 43 L 25.5 39.5" fill="none" stroke="#a8641a" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 27.5 18.6 C 21.5 12.6 14 8.8 7.5 8.9" fill="none" stroke="#fff8dc" stroke-width="1.6" stroke-linecap="round"/>
  </g>
  <g transform="translate(64 0) scale(-1 1)">
    <path d="M 30 21 C 23 12 13 6 4 7 Q 2 14 9.5 16 Q 2.5 22 10 26 Q 5 33.5 13.5 35.5 Q 11 43 20 43 Q 21.5 49.5 29.5 45 Z" fill="url(#gold)" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 9.5 16 L 17.5 19.5 M 10 26 L 19 27.5 M 13.5 35.5 L 21.5 34.5 M 20 43 L 25.5 39.5" fill="none" stroke="#a8641a" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 27.5 18.6 C 21.5 12.6 14 8.8 7.5 8.9" fill="none" stroke="#fff8dc" stroke-width="1.6" stroke-linecap="round" opacity="0.55"/>
  </g>
  <!-- sword -->
  <path d="M 32 11 L 37 17 L 36.5 40 L 27.5 40 L 27 17 Z" fill="url(#blade)" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 32 16 L 32 38" stroke="#7c8799" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 29.4 19 L 29.4 37" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>
  <path d="M 21 39 L 43 39 L 43 44 L 21 44 Z" fill="url(#gold)" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 23 40.8 L 41 40.8" stroke="#fff4d0" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M 29.5 44 L 34.5 44 L 34.2 55 L 29.8 55 Z" fill="#8a5327" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 30 47.5 L 34.2 46.7 M 30 51.3 L 34.2 50.5" stroke="#5d3516" stroke-width="1.4" stroke-linecap="round"/>
  <circle cx="32" cy="58" r="3.4" fill="#e8b240" stroke="#1a1d24" stroke-width="2.5"/>
  <circle cx="31" cy="57" r="1" fill="#fff0b8"/>
  <!-- halo -->
  <ellipse cx="32" cy="5.5" rx="9" ry="3" fill="none" stroke="#1a1d24" stroke-width="5.5"/>
  <ellipse cx="32" cy="5.5" rx="9" ry="3" fill="none" stroke="#fff0b8" stroke-width="2.4"/>
  <!-- sparkles -->
  <path d="M 52 50 L 53.2 53 L 56 54 L 53.2 55 L 52 58 L 50.8 55 L 48 54 L 50.8 53 Z" fill="#fff4d0"/>
  <path d="M 11 51 L 11.9 53.1 L 14 54 L 11.9 54.9 L 11 57 L 10.1 54.9 L 8 54 L 10.1 53.1 Z" fill="#ffd36b"/>

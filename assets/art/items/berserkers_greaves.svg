<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64">
  <!-- Berserker's Greaves: an amber leather war boot side-on, toe to the right: a steel greave strapped over the shin that rises into a forward knee point, three steel spikes raking back from a spine down the calf, gold-buckled straps, a steel toe cap and a hobnailed sole -->
  <defs>
    <radialGradient id="aura" cx="32" cy="32" r="31" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffcf5a" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#e2a93b" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#e2a93b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leather" x1="14" y1="10" x2="54" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f7c46c"/>
      <stop offset="0.5" stop-color="#d08a2a"/>
      <stop offset="1" stop-color="#8a4a14"/>
    </linearGradient>
    <linearGradient id="steel" x1="6" y1="2" x2="44" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f4f7fb"/>
      <stop offset="0.5" stop-color="#b9c4d4"/>
      <stop offset="1" stop-color="#7c8799"/>
    </linearGradient>
    <linearGradient id="cap" x1="46" y1="34" x2="60" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f4f7fb"/>
      <stop offset="0.5" stop-color="#b9c4d4"/>
      <stop offset="1" stop-color="#7c8799"/>
    </linearGradient>
    <linearGradient id="sole" x1="12" y1="48" x2="40" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5a3a24"/>
      <stop offset="0.5" stop-color="#3a2416"/>
      <stop offset="1" stop-color="#22150c"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#aura)"/>
  <g transform="translate(-2.2 0.6)">
  <!-- spikes raking back from the calf -->
  <g stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round">
    <path d="M 16.4 8.6 L 6 5.2 L 15.8 16.4 Z" fill="url(#steel)"/>
    <path d="M 15.8 18 L 5.4 19 L 15.2 25.4 Z" fill="url(#steel)"/>
    <path d="M 15 27.2 L 7.4 31 L 14.4 33.6 Z" fill="url(#steel)"/>
  </g>
  <path d="M 13.6 9.6 L 8.6 7.6 M 13 19.6 L 8.2 19.6" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.9"/>
  <!-- the leather boot -->
  <path d="M 16.8 8.5 L 37 8.5 C 37.4 18 38 25 39.6 30 C 44.5 33 50.5 34.5 55.5 37.5 C 60 40.2 62 45 61 50 L 12 50 C 10 46 10.4 40.5 13.6 36.5 C 15.6 32 17.2 22 16.8 8.5 Z" fill="url(#leather)" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 11.2 39.6 C 17.5 38.8 22 42.6 24 50" fill="none" stroke="#8a4a14" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 19.4 30 C 19.6 34 19 37 18 39" fill="none" stroke="#ffe2a8" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>
  <path d="M 40.5 32.2 C 44 34 46 34.6 47.4 35" fill="none" stroke="#ffe2a8" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>
  <!-- steel spine down the back of the calf -->
  <path d="M 15.2 8 L 19.6 8 C 19.8 18 19.4 27 17.6 34.6 L 13.6 33.4 C 15 26 15.4 18 15.2 8 Z" fill="url(#steel)" stroke="#1a1d24" stroke-width="2" stroke-linejoin="round"/>
  <path d="M 17 10 C 17.2 18 17 26 15.8 32" fill="none" stroke="#ffffff" stroke-width="1.1" stroke-linecap="round"/>
  <!-- straps with gold buckles -->
  <g stroke="#1a1d24" stroke-width="2" stroke-linejoin="round">
    <path d="M 18.8 13.4 L 30.5 13.4 L 30.5 17.6 L 18.8 17.6 Z" fill="#6b3a16"/>
    <path d="M 18.6 22.6 L 30.5 22.6 L 30.5 26.8 L 18.4 26.8 Z" fill="#6b3a16"/>
    <path d="M 22 12.2 L 26.4 12.2 L 26.4 18.8 L 22 18.8 Z" fill="#e2a93b"/>
    <path d="M 21.8 21.4 L 26.2 21.4 L 26.2 28 L 21.8 28 Z" fill="#e2a93b"/>
  </g>
  <path d="M 23.2 13.8 L 23.2 17.2 M 23 23 L 23 26.4" stroke="#ffe7a3" stroke-width="1.1" stroke-linecap="round"/>
  <!-- cuff -->
  <path d="M 15 5 L 38.8 5 L 39.4 11.4 L 14.8 11.4 Z" fill="#6b3a16" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 17 7.2 L 29 7.2" stroke="#b06a28" stroke-width="1.3" stroke-linecap="round"/>
  <!-- the shin greave with its knee point -->
  <path d="M 28.4 6.4 C 30.6 3.2 35 2 40 2.2 L 46.2 1.8 C 44 3.4 42.6 4.4 42.2 7 L 42 26.8 L 35.6 34.4 L 29 27.6 Z" fill="url(#steel)" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 35.6 5 L 35.6 31.6" stroke="#5d6778" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 31 8.4 C 32 6.2 34 5 37 4.4 M 31.4 10 L 31.4 26" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M 39.4 7 L 39.4 26.4" stroke="#7c8799" stroke-width="1.4" stroke-linecap="round"/>
  <!-- steel toe cap -->
  <path d="M 46.4 34.6 C 50 39 50.8 45 49.2 50 L 61 50 C 62 45 60 40.2 55.5 37.5 C 52.5 35.8 49.6 35 46.4 34.6 Z" fill="url(#cap)" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 49.4 36.4 C 53 37.2 56 38.8 58 41.4" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
  <circle cx="53.4" cy="44.6" r="1.6" fill="#e2a93b" stroke="#1a1d24" stroke-width="1.2"/>
  <!-- hobnailed sole -->
  <path d="M 9.6 49 L 58 49 C 62 49 63.2 52.2 62.6 54.4 C 62 56.6 60 57.6 57.5 57.6 L 34.5 57.6 C 32.4 57.6 31.8 54.6 29.8 54.6 L 27.6 54.6 L 27.2 57.6 L 11.6 57.6 C 10.2 57.6 9.6 56.8 9.6 55.4 Z" fill="url(#sole)" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 11.6 51.6 L 59.6 51.6" stroke="#8a6040" stroke-width="1.1" stroke-linecap="round"/>
  <g fill="#b9c4d4"><circle cx="15" cy="55.2" r="0.9"/><circle cx="19.5" cy="55.2" r="0.9"/><circle cx="24" cy="55.2" r="0.9"/><circle cx="38" cy="55.2" r="0.9"/><circle cx="43" cy="55.2" r="0.9"/><circle cx="48" cy="55.2" r="0.9"/><circle cx="53" cy="55.2" r="0.9"/></g>
  </g>
</svg>

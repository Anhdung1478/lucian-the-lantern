<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64">
  <!-- Stormrazor: a straight single-edged razor-sword with a clipped point, two yellow lightning bolts crackling along it -->
  <defs>
    <radialGradient id="aura" cx="32" cy="32" r="31" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe03a" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#a07a1a" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#a07a1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blade" x1="22" y1="0" x2="42" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7c8799"/>
      <stop offset="0.3" stop-color="#f4f7fb"/>
      <stop offset="1" stop-color="#b9c4d4"/>
    </linearGradient>
    <linearGradient id="gold" x1="16" y1="0" x2="48" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe7a3"/>
      <stop offset="0.5" stop-color="#e2a93b"/>
      <stop offset="1" stop-color="#a8641a"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#aura)"/>
  <!-- bolts behind the blade -->
  <path d="M 6 32 L 14 24 L 12 29 L 22 19 L 20 24 L 29 14" fill="none" stroke="#1a1d24" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 6 32 L 14 24 L 12 29 L 22 19 L 20 24 L 29 14" fill="none" stroke="#ffe03a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 36 56 L 44 48 L 42 53 L 52 43 L 50 48 L 58 40" fill="none" stroke="#1a1d24" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 36 56 L 44 48 L 42 53 L 52 43 L 50 48 L 58 40" fill="none" stroke="#ffe03a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="rotate(45 32 32)">
    <path d="M 24 2 C 34 6 41 14 40 22 L 39 40 L 24 40 Z" fill="url(#blade)" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 26.5 6 L 26.5 38" stroke="#5d6778" stroke-width="3" stroke-linecap="round"/>
    <path d="M 37 12 C 37.5 18 37 28 36.5 38" fill="none" stroke="#ffe03a" stroke-width="2" stroke-linecap="round"/>
    <path d="M 31 10 L 31 36" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" opacity="0.9"/>
    <path d="M 18 40 L 46 40 L 46 45 L 18 45 Z" fill="url(#gold)" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 21 42 L 43 42" stroke="#fff4d0" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M 28.5 45 L 35.5 45 L 35 56 L 29 56 Z" fill="#3a3a52" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 29 48.5 L 35.2 47.5 M 29.2 52.5 L 35 51.5" stroke="#1e1e30" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="32" cy="59" r="3.6" fill="#ffe03a" stroke="#1a1d24" stroke-width="2.5"/>
    <circle cx="31" cy="58" r="1.1" fill="#fffbd0"/>
  </g>
  <path d="M 54 20 L 55.4 23.6 L 59 25 L 55.4 26.4 L 54 30 L 52.6 26.4 L 49 25 L 52.6 23.6 Z" fill="#fff8c0" transform="translate(-6 -12)"/>

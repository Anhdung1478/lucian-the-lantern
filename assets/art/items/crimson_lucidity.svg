  <path d="M 19.8 8 L 34.6 8 C 34.8 16.5 35.2 24 36.8 30 C 40 34.4 46 37 51.8 39.4 C 56 41 59.8 40 62.8 36.4 C 63.6 44 59.4 50.6 53.4 50.6 L 14.6 50.6 C 12.8 46.6 13.6 41.4 16.4 37.6 C 18.8 33 20 22.5 19.8 8 Z" fill="none" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>

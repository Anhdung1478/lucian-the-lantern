      <stop offset="1" stop-color="#3a8cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gem" x1="27" y1="1" x2="35" y2="11" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e8f4ff"/>
      <stop offset="0.45" stop-color="#4a9aff"/>
      <stop offset="1" stop-color="#1a3c90"/>
    </linearGradient>
    <linearGradient id="sole" x1="12" y1="48" x2="40" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5a2a36"/>
      <stop offset="0.5" stop-color="#3a1620"/>
      <stop offset="1" stop-color="#220a10"/>
    </linearGradient>

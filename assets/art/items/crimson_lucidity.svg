      <stop offset="0" stop-color="#ff6a7a" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#a8202f" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#a8202f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloth" x1="16" y1="8" x2="56" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f05a6a"/>
      <stop offset="0.5" stop-color="#b42234"/>
      <stop offset="1" stop-color="#64101b"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="2" x2="40" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8ccaff"/>
      <stop offset="0.5" stop-color="#3a7fe0"/>
      <stop offset="1" stop-color="#1f4a9a"/>
    </linearGradient>
    <linearGradient id="gold" x1="14" y1="2" x2="62" y2="52" gradientUnits="userSpaceOnUse">

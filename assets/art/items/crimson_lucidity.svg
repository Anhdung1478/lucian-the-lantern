<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64">
  <!-- Crimson Lucidity: the slender Ionian boot dyed crimson, side-on with its upturned toe tipped in gold: three slanting blue bands, a flared gold cuff crowned with a glowing sapphire, three long blue ribbon tails streaming back from a gold knot, blue sparkles -->

<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64">
  <!-- Thornmail (legendary): an olive-green cuirass with rounded shoulder plates and a bronze collar, big bone-pale thorns jutting from the shoulders, sides and hem and a row of thorns down the chest ridge, a glowing green gem at the collar. -->
  <defs>
    <radialGradient id="aura" cx="32" cy="32" r="31" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b8d86a" stop-opacity="0.5"/>
      <stop offset="0.6" stop-color="#5f7a2a" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#5f7a2a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plate" x1="12" y1="10" x2="52" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c2d1a0"/>
      <stop offset="0.5" stop-color="#83965f"/>
      <stop offset="1" stop-color="#404e2c"/>
    </linearGradient>
    <linearGradient id="pauldron" x1="4" y1="8" x2="60" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#cad8aa"/>
      <stop offset="0.5" stop-color="#8a9c66"/>
      <stop offset="1" stop-color="#4a5934"/>
    </linearGradient>
    <linearGradient id="thorn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbf8e4"/>
      <stop offset="0.45" stop-color="#e3dcb4"/>
      <stop offset="0.55" stop-color="#a6a072"/>
      <stop offset="1" stop-color="#7a7550"/>
    </linearGradient>
    <linearGradient id="bronze" x1="20" y1="0" x2="44" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f2c27a"/>
      <stop offset="0.5" stop-color="#c47f32"/>
      <stop offset="1" stop-color="#7f4a18"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#aura)"/>
  <!-- rim thorns, behind the cuirass -->
  <g fill="url(#thorn)" stroke="#1a1d24" stroke-width="2.2" stroke-linejoin="round">
    <path d="M 5 17 Q 5.2 10.1 1 1 Q 9.6 7 17 8.5 Z"/>
    <path d="M 59 17 Q 58.8 10.1 63 1 Q 54.4 7 47 8.5 Z"/>
    <path d="M 16 27.5 Q 10.7 32.5 1 35.5 Q 10.8 37.9 16.5 42.5 Z"/>
    <path d="M 48 27.5 Q 53.3 32.5 63 35.5 Q 53.1 37.9 47.5 42.5 Z"/>
    <path d="M 26.5 55 Q 30 58.1 32 63.5 Q 34 58.1 37.5 55 Z"/>
  </g>
  <!-- cuirass -->
  <path d="M 22 9 C 26 16.5 38 16.5 42 9 L 52 12.5 C 56 14 57 19 54 22.5 C 51 25 49 28 48.5 31 C 48.5 38 48 44 45 49 C 41 54 36 57 32 58 C 28 57 23 54 19 49 C 16 44 15.5 38 15.5 31 C 15 28 13 25 10 22.5 C 7 19 8 14 12 12.5 Z" fill="url(#plate)" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 32 17 L 32 56 M 17 35 C 24 38.5 40 38.5 47 35 M 20 48 C 26 50.5 38 50.5 44 48" fill="none" stroke="#3a4628" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 18.5 27 C 18.8 33 18.6 40 21 46" fill="none" stroke="#eef4d8" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>
  <!-- shoulder plates -->
  <g stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round" fill="url(#pauldron)">
    <path d="M 4.5 21.5 C 3.5 13.5 9.5 8.5 19 9.5 C 22 13 21.5 20 17.5 23.5 C 13 25.5 8 25 4.5 21.5 Z"/>
    <path d="M 59.5 21.5 C 60.5 13.5 54.5 8.5 45 9.5 C 42 13 42.5 20 46.5 23.5 C 51 25.5 56 25 59.5 21.5 Z"/>
  </g>
  <path d="M 7 14.5 C 9 11.8 12.5 10.8 16 11.2" fill="none" stroke="#f2f8e0" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M 7 21 C 10.5 22.8 14.5 22.6 17.5 20.5 M 57 21 C 53.5 22.8 49.5 22.6 46.5 20.5" fill="none" stroke="#3a4628" stroke-width="1.6" stroke-linecap="round"/>
  <!-- bronze collar and its gem -->
  <path d="M 21.5 7.5 C 25.5 15.5 38.5 15.5 42.5 7.5 L 45 9.2 C 40.5 19.5 23.5 19.5 19 9.2 Z" fill="url(#bronze)" stroke="#1a1d24" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M 32 13 L 35.5 17 L 32 21 L 28.5 17 Z" fill="#b8f070" stroke="#1a1d24" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M 32 15.1 L 33.6 17 L 32 18.9 L 30.4 17 Z" fill="#f4ffd8"/>
  <!-- thorns down the chest ridge -->
  <g fill="url(#thorn)" stroke="#1a1d24" stroke-width="2" stroke-linejoin="round">
    <path d="M 26.5 36 Q 30 31 32 22 Q 34 31 37.5 36 Z"/>
    <path d="M 27 50 Q 30.2 45.5 32 37.5 Q 33.8 45.5 37 50 Z"/>
  </g>
  <!-- sparkles -->
  <path d="M 57 44 L 57.9 46.1 L 60 47 L 57.9 47.9 L 57 50 L 56.1 47.9 L 54 47 L 56.1 46.1 Z" fill="#eaf6c8"/>
  <path d="M 7 46 L 7.8 47.8 L 9.6 48.6 L 7.8 49.4 L 7 51.2 L 6.2 49.4 L 4.4 48.6 L 6.2 47.8 Z" fill="#c8e48a"/>
</svg>

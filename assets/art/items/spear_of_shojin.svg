<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64">
  <!-- Spear of Shojin: a long golden spear with a jade leaf-shaped head, a glowing core and a red tassel -->
  <defs>
    <radialGradient id="aura" cx="32" cy="32" r="31" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4ae0b0" stop-opacity="0.5"/>
      <stop offset="0.6" stop-color="#2a7a58" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#2a7a58" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="jade" x1="22" y1="0" x2="42" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d0ffec"/>
      <stop offset="0.5" stop-color="#3ac890"/>
      <stop offset="1" stop-color="#1a7a58"/>
    </linearGradient>
    <linearGradient id="gold" x1="28" y1="0" x2="36" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe7a3"/>
      <stop offset="0.5" stop-color="#e2a93b"/>
      <stop offset="1" stop-color="#a8641a"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#aura)"/>
  <g transform="rotate(45 32 32)">
    <!-- shaft -->
    <path d="M 29.5 28 L 34.5 28 L 34.5 58 L 29.5 58 Z" fill="url(#gold)" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 30 36 L 34 36 M 30 44 L 34 44 M 30 52 L 34 52" stroke="#a8641a" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 32 62.5 L 28.5 57 L 35.5 57 Z" fill="#e2a93b" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- tassel -->
    <path d="M 32 31 C 40 34 42 42 38 48 C 36 44 36 40 32 36 Z" fill="#d03a40" stroke="#1a1d24" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 35 36 C 38 39 39 43 37.5 46" fill="none" stroke="#ff9aa0" stroke-width="1.4" stroke-linecap="round"/>
    <!-- head -->
    <path d="M 32 -2 C 43 8 45 20 38 28 L 26 28 C 19 20 21 8 32 -2 Z" fill="url(#jade)" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 32 4 L 32 26" stroke="#1a7a58" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 26.5 12 C 25 17 26 21 28 24" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>
    <path d="M 32 11 L 35 16 L 32 21 L 29 16 Z" fill="#ffe08a" stroke="#a8641a" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- socket -->
    <path d="M 26 27 L 38 27 L 36 33 L 28 33 Z" fill="url(#gold)" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
  </g>
  <path d="M 52 12 L 53.4 15.6 L 57 17 L 53.4 18.4 L 52 22 L 50.6 18.4 L 47 17 L 50.6 15.6 Z" fill="#d8fff0" transform="translate(0 -6)"/>
  <path d="M 10 46 L 10.9 48.1 L 13 49 L 10.9 49.9 L 10 52 L 9.1 49.9 L 7 49 L 9.1 48.1 Z" fill="#8af0c8"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64">
  <!-- Galeforce: a white-silver bow drawn on the diagonal, its arrow loosed to the upper right and splitting into three cyan-tipped missiles -->
  <defs>
    <radialGradient id="aura" cx="32" cy="32" r="31" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5fe0ff" stop-opacity="0.5"/>
      <stop offset="0.6" stop-color="#1a6a90" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#1a6a90" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bow" x1="8" y1="22" x2="40" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#d2e6f0"/>
      <stop offset="1" stop-color="#8fb4c8"/>
    </linearGradient>
    <linearGradient id="shaft" x1="-2" y1="0" x2="2" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#a9c0d0"/>
    </linearGradient>
    <linearGradient id="tip" x1="-6" y1="0" x2="6" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e6fdff"/>
      <stop offset="0.5" stop-color="#6fe8ff"/>
      <stop offset="1" stop-color="#22a8d0"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#aura)"/>
  <!-- the gale: wind arcs whirling round the bow -->
  <path d="M 5.7 19.7 A 29 29 0 0 1 22.1 4.7 M 59.3 41.9 A 29 29 0 0 1 46.5 57.1" fill="none" stroke="#5fe0ff" stroke-width="2.8" stroke-linecap="round" opacity="0.75"/>
  <!-- drawn string -->
  <path d="M 7 23 L 12 52 L 41 57" fill="none" stroke="#1a1d24" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 7 23 L 12 52 L 41 57" fill="none" stroke="#eafcff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- bow -->
  <path d="M 7 23 Q 40 24 41 57 Q 30 34 7 23 Z" fill="url(#bow)" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 10 24.5 Q 34.2 29.8 39.5 54" fill="none" stroke="#3fc8e8" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 10.5 23 Q 33 24.6 37.6 42" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="7" cy="23" r="2.6" fill="#5fe0ff" stroke="#1a1d24" stroke-width="1.8"/>
  <circle cx="41" cy="57" r="2.6" fill="#5fe0ff" stroke="#1a1d24" stroke-width="1.8"/>
  <!-- two missiles splitting off at the bow, comet trails behind them -->
  <g transform="translate(30 34) rotate(21)">
    <path d="M -3 -17 C -2.4 -10 -0.6 -5 0 -1 C 0.6 -5 2.4 -10 3 -17 Z" fill="#6fe8ff" opacity="0.8"/>
    <path d="M 0 -30 L 6 -16.5 L 0 -19.5 L -6 -16.5 Z" fill="url(#tip)" stroke="#1a1d24" stroke-width="2.3" stroke-linejoin="round"/>
    <path d="M -0.8 -26.5 L -2.8 -19.4" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round"/>
  </g>
  <g transform="translate(30 34) rotate(69)">
    <path d="M -3 -17 C -2.4 -10 -0.6 -5 0 -1 C 0.6 -5 2.4 -10 3 -17 Z" fill="#6fe8ff" opacity="0.8"/>
    <path d="M 0 -30 L 6 -16.5 L 0 -19.5 L -6 -16.5 Z" fill="url(#tip)" stroke="#1a1d24" stroke-width="2.3" stroke-linejoin="round"/>
    <path d="M -0.8 -26.5 L -2.8 -19.4" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round"/>
  </g>
  <!-- the loosed arrow -->
  <g transform="translate(12 52) rotate(45)">
    <path d="M -1.8 -2 L 1.8 -2 L 1.8 -47 L -1.8 -47 Z" fill="url(#shaft)" stroke="#1a1d24" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M -1.8 -3 L -6.5 1.5 L -6.5 -7 L -1.8 -11.5 Z M 1.8 -3 L 6.5 1.5 L 6.5 -7 L 1.8 -11.5 Z" fill="#5fe0ff" stroke="#1a1d24" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 0 -61 L 7 -45 L 0 -48.5 L -7 -45 Z" fill="url(#tip)" stroke="#1a1d24" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M -0.9 -57 L -3.4 -48.4" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
  </g>
  <!-- sparkles -->
  <path d="M 23 14 L 24 16.6 L 26.6 17.6 L 24 18.6 L 23 21.2 L 22 18.6 L 19.4 17.6 L 22 16.6 Z" fill="#e6fbff"/>
  <path d="M 48 41 L 48.8 42.9 L 50.7 43.7 L 48.8 44.5 L 48 46.4 L 47.2 44.5 L 45.3 43.7 L 47.2 42.9 Z" fill="#8af0ff"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64">
  <!-- Rapid Firecannon: a brass hand cannon tilted up to the right, a thick muzzle lip, glowing blue energy coils round the barrel, a wooden pistol grip, and a burst of fire at the mouth -->
  <defs>
    <radialGradient id="aura" cx="32" cy="32" r="31" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.5"/>
      <stop offset="0.6" stop-color="#b0601a" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#b0601a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brass" x1="0" y1="21" x2="0" y2="37" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe7a3"/>
      <stop offset="0.45" stop-color="#e2a93b"/>
      <stop offset="1" stop-color="#8a5016"/>
    </linearGradient>
    <linearGradient id="wood" x1="7" y1="0" x2="22" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b57c4a"/>
      <stop offset="0.5" stop-color="#8a5a34"/>
      <stop offset="1" stop-color="#5a351d"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#aura)"/>
  <g transform="translate(-3.6 -3.8) rotate(-30 32 32)">
    <!-- pistol grip and trigger guard -->
    <path d="M 12 34 L 22.5 34.5 L 16.5 52.5 C 15.5 55 7.5 54.5 7 52 Z" fill="url(#wood)" stroke="#1a1d24" stroke-width="2.6" stroke-linejoin="round"/>
    <path d="M 12.5 41 L 19.5 42 M 11 46.5 L 17.8 47.5" stroke="#3a2214" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M 11.5 37 L 8.6 50.5" stroke="#d6a070" stroke-width="1.3" stroke-linecap="round" opacity="0.8"/>
    <path d="M 23 35.5 C 23 45 31.5 45 32 35.5" fill="none" stroke="#1a1d24" stroke-width="5.4" stroke-linecap="round"/>
    <path d="M 23 35.5 C 23 45 31.5 45 32 35.5" fill="none" stroke="#c98a3a" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 27 35 L 26 40" stroke="#1a1d24" stroke-width="2.2" stroke-linecap="round"/>
    <!-- muzzle flash -->
    <path d="M 70 29 L 63.51 27.55 L 66.01 22.99 L 61.45 25.49 L 60 20.5 L 58.55 25.49 L 53.99 22.99 L 56.49 27.55 L 51.5 29 L 56.49 30.45 L 53.99 35.01 L 58.55 32.51 L 60 37.5 L 61.45 32.51 L 66.01 35.01 L 63.51 30.45 Z" fill="#ff9a2a" stroke="#1a1d24" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M 70 29 L 63.51 27.55 L 66.01 22.99 L 61.45 25.49 L 60 20.5 L 58.55 25.49 L 53.99 22.99 L 56.49 27.55 L 51.5 29 L 56.49 30.45 L 53.99 35.01 L 58.55 32.51 L 60 37.5 L 61.45 32.51 L 66.01 35.01 L 63.51 30.45 Z" fill="#fff3b0" transform="translate(59 29) scale(0.55) translate(-59 -29)"/>
    <!-- barrel, breech knob and muzzle lip -->
    <circle cx="9" cy="29" r="3.3" fill="#e2a93b" stroke="#1a1d24" stroke-width="2.4"/>
    <path d="M 11 22 L 44 23.5 L 44 34.5 L 11 36 C 8.5 33 8.5 25 11 22 Z" fill="url(#brass)" stroke="#1a1d24" stroke-width="2.6" stroke-linejoin="round"/>
    <path d="M 43 20.5 L 52 20.5 C 53.6 24 53.6 34 52 37.5 L 43 37.5 C 44.2 33 44.2 25 43 20.5 Z" fill="url(#brass)" stroke="#1a1d24" stroke-width="2.6" stroke-linejoin="round"/>
    <ellipse cx="52" cy="29" rx="2.2" ry="6.6" fill="#4a2a10" stroke="#1a1d24" stroke-width="2"/>
    <path d="M 46.5 22.6 L 46.5 35.4" stroke="#a8641a" stroke-width="1.5" stroke-linecap="round"/>
    <!-- glowing coils -->
    <path d="M 20 22.6 L 20 35.6 M 28 23 L 28 35.2 M 36 23.3 L 36 34.9" stroke="#1a1d24" stroke-width="5" stroke-linecap="round"/>
    <path d="M 20 22.6 L 20 35.6 M 28 23 L 28 35.2 M 36 23.3 L 36 34.9" stroke="#5ac8ff" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M 20 24 L 20 29 M 28 24.3 L 28 29 M 36 24.6 L 36 29" stroke="#e6faff" stroke-width="1.1" stroke-linecap="round"/>
    <!-- lit top edge -->
    <path d="M 12 25 L 17.5 25.3 M 22.5 25.5 L 25.5 25.6 M 30.5 25.8 L 33.5 25.9 M 38.5 26 L 42.5 26.1 M 45 22.6 L 50.5 22.6" stroke="#fff4d0" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <!-- sparkles -->
  <path d="M 52 44 L 53.2 47 L 56 48 L 53.2 49 L 52 52 L 50.8 49 L 48 48 L 50.8 47 Z" fill="#fff0b0"/>
  <path d="M 13 9 L 13.9 11.1 L 16 12 L 13.9 12.9 L 13 15 L 12.1 12.9 L 10 12 L 12.1 11.1 Z" fill="#ffc870"/>
</svg>

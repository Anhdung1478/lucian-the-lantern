<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64">
  <!-- Jak'Sho, The Protean (legendary): a spiked void-purple chitin shield with a glowing magenta eye in the middle. -->
  <defs>
    <radialGradient id="aura" cx="32" cy="32" r="31" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c05af0" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#7a2fb0" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7a2fb0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chitin" x1="8" y1="6" x2="54" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b57ee8"/>
      <stop offset="0.5" stop-color="#6a2fa8"/>
      <stop offset="1" stop-color="#321458"/>
    </linearGradient>
    <radialGradient id="iris" cx="30" cy="28" r="6" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffb0f0"/>
      <stop offset="1" stop-color="#d03cd8"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#aura)"/>
  <g stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round">
    <path d="M 8 14 L 4 2 L 19 9 Z" fill="#8f4fd0"/>
    <path d="M 56 14 L 60 2 L 45 9 Z" fill="#6a2fa8"/>
    <path d="M 32 3 C 44 8 54 8 58 10 C 58 34 50 52 32 62 C 14 52 6 34 6 10 C 10 8 20 8 32 3 Z" fill="url(#chitin)"/>
  </g>
  <!-- plate ridges -->
  <path d="M 32 6 L 32 20 M 32 38 L 32 59 M 11 16 C 18 18 25 18 28 17 M 53 16 C 46 18 39 18 36 17 M 12 42 C 20 44 26 46 32 52 M 52 42 C 44 44 38 46 32 52" fill="none" stroke="#2a0f4a" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 10 14 C 10 28 14 40 20 49" fill="none" stroke="#e2c4ff" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
  <!-- eye -->
  <path d="M 15 29 C 22 18 42 18 49 29 C 42 40 22 40 15 29 Z" fill="#ffe0f8" stroke="#1a1d24" stroke-width="2.2" stroke-linejoin="round"/>
  <circle cx="32" cy="29" r="6.4" fill="url(#iris)" stroke="#1a1d24" stroke-width="1.6"/>
  <ellipse cx="32" cy="29" rx="1.9" ry="4.8" fill="#1a0a2e"/>
  <circle cx="29.8" cy="26.2" r="1.3" fill="#ffffff"/>
  <!-- sparkles -->

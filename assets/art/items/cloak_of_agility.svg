<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64">
  <!-- Cloak of Agility: Graceful billowing wind-swept golden-ivory rogue's cape/mantle fastened with a gleaming gold clasp, trailing crisp motion ribbons -->
  <defs>
    <radialGradient id="aura" cx="32" cy="32" r="31" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd56b" stop-opacity="0.46"/>
      <stop offset="0.6" stop-color="#c48a28" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#8c5812" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ivory" x1="16" y1="8" x2="50" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffcf2"/>
      <stop offset="0.45" stop-color="#f0e1bd"/>
      <stop offset="0.82" stop-color="#cbb07c"/>
      <stop offset="1" stop-color="#9e7f4b"/>
    </linearGradient>
    <linearGradient id="goldLining" x1="20" y1="24" x2="48" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f7c85c"/>
      <stop offset="0.5" stop-color="#c98524"/>
      <stop offset="1" stop-color="#78420c"/>
    </linearGradient>
    <linearGradient id="claspGold" x1="26" y1="10" x2="40" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff4bf"/>
      <stop offset="0.5" stop-color="#e5ae3e"/>
      <stop offset="1" stop-color="#965a14"/>
    </linearGradient>
    <linearGradient id="windRibbon" x1="4" y1="36" x2="58" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff8de" stop-opacity="0.15"/>
      <stop offset="0.55" stop-color="#fff5cf" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#aura)"/>

  <!-- Crisp wind-motion ribbons trailing behind & sweeping past the cape -->
  <path d="M 4 25 C 12 20 20 19 27 21" fill="none" stroke="url(#windRibbon)" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M 5 44 C 14 42 22 44 29 48" fill="none" stroke="url(#windRibbon)" stroke-width="2" stroke-linecap="round"/>
  <path d="M 41 56 C 48 54 54 50 59 44" fill="none" stroke="url(#windRibbon)" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Rich burnished-gold inner lining billowing underneath -->
  <path d="M 26 20 L 44 22 C 47 36 48 48 54 55 C 43 58 32 56 20 53 C 23 44 25 32 26 20 Z" fill="url(#goldLining)" stroke="#1a1d24" stroke-width="2.3" stroke-linejoin="round"/>
  <!-- Deep fold shadows inside the lining -->
  <path d="M 33 26 C 32 37 29 46 25 53 M 41 27 C 42 38 44 47 48 54" fill="none" stroke="#663608" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>

  <!-- Main sweeping wind-blown golden-ivory rogue's cape -->
  <path d="M 22 14 C 18 24 14 36 8 46 C 15 47 20 45 25 41 C 21 47 18 53 15 58 C 27 56 37 48 43 39 C 47 45 52 50 57 52 C 53 40 50 28 46 15 C 42 12 27 11 22 14 Z" fill="url(#ivory)" stroke="#1a1d24" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- Ornate golden trim along the fluttering cape hem -->
  <path d="M 10.5 45 C 16 45 20.5 43.2 25 39.5 M 18 56.2 C 28 54 37 46.8 42.5 38.2 M 44.5 39.5 C 48.2 44.2 52 48 55.2 50" fill="none" stroke="#dca134" stroke-width="2" stroke-linecap="round"/>
  <!-- Painted sculptural cloth fold shadows -->
  <path d="M 30 20 C 26 30 21 38 15 44 C 22 39 27 32 32 22 Z" fill="#bfa36e" opacity="0.85"/>
  <path d="M 38 20 C 37 31 32 42 23 52 C 33 44 40 34 41 21 Z" fill="#b39359" opacity="0.8"/>

  <!-- High-Collared Rogue's Shoulder Mantle (gives unmistakable cape silhouette) -->
  <path d="M 21 12 C 23 6 41 6 43 12 C 47 14 49 18 48 22 C 42 20 37 19 33 17 C 29 19 22 21 17 22 C 16 17 18 14 21 12 Z" fill="url(#ivory)" stroke="#1a1d24" stroke-width="2.3" stroke-linejoin="round"/>
  <!-- Dark shadowed neck opening inside collar -->
  <path d="M 24 11.5 C 27 8.8 37 8.8 40 11.5 C 37 14.2 27 14.2 24 11.5 Z" fill="#3a2818" stroke="#1a1d24" stroke-width="1.6"/>
  <!-- Mantle gold lapel trim -->
  <path d="M 19 20 C 24 19 28.5 17.5 32.5 15.8 M 46 20 C 42 18.8 37.5 17.5 33.5 15.8" fill="none" stroke="#dca134" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Gleaming Ornate Gold Cloak Clasp pinned at the throat -->
  <circle cx="33" cy="16.5" r="4.4" fill="url(#claspGold)" stroke="#1a1d24" stroke-width="2"/>
  <circle cx="33" cy="16.5" r="1.9" fill="#ffe899" stroke="#8f5414" stroke-width="1"/>
  <circle cx="31.7" cy="15.2" r="1.1" fill="#ffffff"/>

  <!-- Crisp sunlit cloth edge highlights -->
  <path d="M 23.5 10 C 27 7.8 33 7.6 37 8.4" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>
  <path d="M 22.5 19 C 19 28 15 36 11 43" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.88"/>
  <path d="M 45.5 22 C 48.5 31 51 40 54 47.5" fill="none" stroke="#fff7df" stroke-width="1.4" stroke-linecap="round" opacity="0.8"/>

  <!-- Agility sparkles -->
  <path d="M 54 14 L 54.9 16.1 L 57 17 L 54.9 17.9 L 54 20 L 53.1 17.9 L 51 17 L 53.1 16.1 Z" fill="#fff4c4"/>
  <path d="M 10 13 L 10.8 14.8 L 12.6 15.6 L 10.8 16.4 L 10 18.2 L 9.2 16.4 L 7.4 15.6 L 9.2 14.8 Z" fill="#ffe082"/>
</svg>

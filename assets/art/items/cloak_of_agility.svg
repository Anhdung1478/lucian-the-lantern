<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64">
  <!-- Cloak of Agility: a cream cape hung from a gold clasp at the upper right, billowing back to the left in three waves, its ochre lining turned out, wind streaks behind it -->
  <defs>
    <radialGradient id="aura" cx="32" cy="32" r="31" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f0c040" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#f0c040" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloth" x1="14" y1="8" x2="50" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff6e2"/>
      <stop offset="0.5" stop-color="#eadbb8"/>
      <stop offset="1" stop-color="#c2a978"/>
    </linearGradient>
    <linearGradient id="lining" x1="44" y1="14" x2="58" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ecbc5a"/>
      <stop offset="0.5" stop-color="#c68a2e"/>
      <stop offset="1" stop-color="#8f5a1c"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#aura)"/>
  <!-- wind streaks behind the cape -->
  <path d="M 3.5 24 L 12 24 M 4 40 L 15.5 40 M 12 55.5 L 22.5 55.5" stroke="#1a1d24" stroke-width="5" stroke-linecap="round"/>
  <path d="M 3.5 24 L 12 24 M 4 40 L 15.5 40 M 12 55.5 L 22.5 55.5" stroke="#e8f2ff" stroke-width="2.2" stroke-linecap="round"/>
  <!-- cape body -->
  <path d="M 20 9 C 13 9 9 13 11 18 C 12.5 21 16 22.5 19 23 C 13 26 10 31 13 35 C 15 38 18 38.5 22 39 C 16 42 15 48 19 51 C 22 53 25 53 28 53 C 29 56 31 58.5 35 60 C 47 53 57 38 59 22 C 59.5 17 57.5 12 53.5 10 C 44 6 30 6 20 9 Z" fill="url(#cloth)" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- shadow under each fold -->
  <path d="M 49 13 C 40 12 28 14 19.5 22.5 C 29 18 40 16.5 49 15.5 Z" fill="#cdb684"/>
  <path d="M 49.5 17 C 42 22 31 30 22.5 38.5 C 32 33 42 25.5 50 20 Z" fill="#cdb684"/>
  <path d="M 50.5 21 C 45 32 36 44 28.5 52 C 37 46 46 35 51.5 24 Z" fill="#cdb684"/>
  <!-- fold lines from the clasp -->
  <path d="M 49 13 C 40 12 28 14 19.5 22.5 M 49.5 17 C 42 22 31 30 22.5 38.5 M 50.5 21 C 45 32 36 44 28.5 52" fill="none" stroke="#a88f5e" stroke-width="2" stroke-linecap="round"/>
  <!-- lining turned out along the front edge -->
  <path d="M 35 60 C 47 53 57 38 59 22 C 59.5 17 57.5 12 53.5 10 C 54.5 26 47 44 35 60 Z" fill="url(#lining)" stroke="#1a1d24" stroke-width="2" stroke-linejoin="round"/>
  <!-- lit edges -->
  <path d="M 22 10.2 C 31 7.8 43 7.8 50.5 10.2" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" opacity="0.9"/>
  <path d="M 17.5 11 C 14 11.5 12.2 14 12.8 17 M 16 26 C 13.4 28.4 12.6 31 13.6 33.4 M 19.6 42.5 C 17.4 44.6 17.2 47.6 19 49.6" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" opacity="0.85"/>
  <!-- clasp -->
  <circle cx="53" cy="13.5" r="4.4" fill="#e2a93b" stroke="#1a1d24" stroke-width="2"/>
  <circle cx="53" cy="13.5" r="1.9" fill="none" stroke="#a8641a" stroke-width="1.2"/>
  <circle cx="51.6" cy="12.1" r="1.1" fill="#ffe7a3"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64">
  <!-- Archangel's Staff (legendary): an upright silver staff with gold bands; at its head a glowing blue crystal in a gold collar between two wide white wings. -->
  <defs>
    <radialGradient id="aura" cx="32" cy="32" r="31" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6cbcff" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#2f6fd0" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2f6fd0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="silver" x1="29" y1="0" x2="35" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f4f7fb"/>
      <stop offset="0.5" stop-color="#b9c4d4"/>
      <stop offset="1" stop-color="#7c8799"/>
    </linearGradient>
    <linearGradient id="gold" x1="23" y1="0" x2="41" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe7a3"/>
      <stop offset="0.5" stop-color="#e2a93b"/>
      <stop offset="1" stop-color="#a8641a"/>
    </linearGradient>
    <linearGradient id="wingL" x1="4" y1="4" x2="28" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#e2ebf7"/>
      <stop offset="1" stop-color="#a3b6d4"/>
    </linearGradient>
    <linearGradient id="wingR" x1="36" y1="4" x2="60" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#dbe5f4"/>
      <stop offset="1" stop-color="#97abcc"/>
    </linearGradient>
    <linearGradient id="crystal" x1="25" y1="2" x2="39" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e2f6ff"/>
      <stop offset="0.45" stop-color="#4fb0ff"/>
      <stop offset="1" stop-color="#1d4fb8"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#aura)"/>
  <!-- shaft -->
  <g stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round">
    <path d="M 29 28 L 35 28 L 35 57 L 29 57 Z" fill="url(#silver)"/>
    <path d="M 27.5 41 L 36.5 41 L 36.5 45.5 L 27.5 45.5 Z" fill="url(#gold)"/>
    <path d="M 27.5 55 L 36.5 55 L 32 62.5 Z" fill="url(#gold)"/>
  </g>
  <path d="M 30.6 31 L 30.6 39 M 30.6 48 L 30.6 53.5" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
  <!-- wings -->
  <g stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round">
    <path d="M 29 24.6 C 25.4 15.2 15.8 6.8 2.6 3.2 C 4.4 8 6.2 10.4 9.2 12.2 C 5.6 12.2 4.4 12.8 3.2 14 C 6.8 17.6 10.4 19.4 14 20 C 11.6 20.6 10.4 21.8 9.8 23.6 C 15.8 27.2 23 27.8 29 27.8 Z" fill="url(#wingL)"/>
    <path d="M 35 24.6 C 38.6 15.2 48.2 6.8 61.4 3.2 C 59.6 8 57.8 10.4 54.8 12.2 C 58.4 12.2 59.6 12.8 60.8 14 C 57.2 17.6 53.6 19.4 50 20 C 52.4 20.6 53.6 21.8 54.2 23.6 C 48.2 27.2 41 27.8 35 27.8 Z" fill="url(#wingR)"/>
  </g>
  <path d="M 25.4 22.6 C 19.4 20.6 13.4 16.4 9.2 12.2 M 26.6 25.6 C 21.8 24.4 16.4 22.4 14 20 M 38.6 22.6 C 44.6 20.6 50.6 16.4 54.8 12.2 M 37.4 25.6 C 42.2 24.4 47.6 22.4 50 20" fill="none" stroke="#8ea3c6" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 24 15 C 19 10.5 13 7 7.5 5.4" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <!-- gold collar -->
  <path d="M 24.5 21.5 L 39.5 21.5 L 37 29.5 L 27 29.5 Z" fill="url(#gold)" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 26.5 23.6 L 37.5 23.6" stroke="#fff3c9" stroke-width="1.4" stroke-linecap="round"/>
  <!-- crystal -->
  <path d="M 32 1.5 L 39 10 L 37.5 18.5 L 32 24 L 26.5 18.5 L 25 10 Z" fill="url(#crystal)" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 32 4.5 L 32 21.5 M 26.8 10.4 L 32 13 L 37.2 10.4" fill="none" stroke="#2a66c8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 32 4.5 L 27 10.2 L 32 12.8 Z" fill="#f2fbff" opacity="0.85"/>
  <path d="M 28.4 13 L 29.6 18" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
  <!-- sparkles -->
  <path d="M 50 26 L 51.2 29.3 L 54.5 30.5 L 51.2 31.7 L 50 35 L 48.8 31.7 L 45.5 30.5 L 48.8 29.3 Z" fill="#e6f6ff"/>
  <path d="M 15 44 L 15.9 46.1 L 18 47 L 15.9 47.9 L 15 50 L 14.1 47.9 L 12 47 L 14.1 46.1 Z" fill="#9fd4ff"/>
</svg>

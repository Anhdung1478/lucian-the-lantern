<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64">
  <!-- Sorcerer's Shoes: a low violet cloth wizard shoe side-on, its long toe curling up and back into a hook tipped with a pale pompom, a deep violet collar hanging in three points with small beads, a gold star stitched on the side, on a thin soft sole -->
  <defs>
    <radialGradient id="aura" cx="32" cy="32" r="31" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b48cff" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#6f52c8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#6f52c8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloth" x1="14" y1="20" x2="56" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b09af4"/>
      <stop offset="0.5" stop-color="#7356d0"/>
      <stop offset="1" stop-color="#3f2c7c"/>
    </linearGradient>
    <linearGradient id="collar" x1="12" y1="16" x2="40" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6a4cc4"/>
      <stop offset="0.5" stop-color="#46309a"/>
      <stop offset="1" stop-color="#2a1a66"/>
    </linearGradient>
    <linearGradient id="gold" x1="22" y1="32" x2="34" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe7a3"/>
      <stop offset="0.5" stop-color="#e2a93b"/>
      <stop offset="1" stop-color="#a8641a"/>
    </linearGradient>
    <linearGradient id="sole" x1="12" y1="48" x2="40" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4a3a78"/>
      <stop offset="0.5" stop-color="#2e2252"/>
      <stop offset="1" stop-color="#1c1436"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#aura)"/>
  <g transform="translate(-4.8 0)">
  <!-- the shoe and its curling toe -->
  <path d="M 13.6 22.4 C 21 21 31 21 39 22.6 C 40 28.4 43 32.6 47.4 34.8 C 51.4 36.6 55.2 35.4 56.6 32.4 C 57.6 30.2 56.8 27.4 54.4 26.8 C 53.2 26.4 52.2 27 52 28 C 50.8 25.2 52.8 21.6 56.6 21.8 C 60.8 22 63.4 26.4 63 31.4 C 62.4 40.4 57.4 50.8 47.8 50.8 L 12 50.8 C 10.2 46.4 11 40.8 12.6 36.4 C 13.8 32 14 27.4 13.6 22.4 Z" fill="url(#cloth)" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 44 37.6 C 49 40 54.6 39 58.4 34.6" fill="none" stroke="#2f2160" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M 42.2 30.6 C 44 33 46 34.6 48.6 35.4" fill="none" stroke="#e4dbff" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 55.6 23.6 C 58.6 23.6 60.8 26 61 29.4" fill="none" stroke="#e4dbff" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 15.6 33 C 15.6 37 15 40.4 14 43" fill="none" stroke="#d6c8ff" stroke-width="1.5" stroke-linecap="round"/>
  <!-- pompom on the hook -->
  <circle cx="52.2" cy="28.6" r="3.4" fill="#ece4ff" stroke="#1a1d24" stroke-width="2"/>
  <circle cx="51.2" cy="27.6" r="1.1" fill="#ffffff"/>
  <!-- gold star -->
  <path d="M 28.6 32 L 30.6 36.2 L 35.2 36.8 L 31.8 40 L 32.7 44.6 L 28.6 42.4 L 24.5 44.6 L 25.4 40 L 22 36.8 L 26.6 36.2 Z" fill="url(#gold)" stroke="#1a1d24" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M 27.6 35 L 26.8 37" stroke="#fff4d0" stroke-width="1" stroke-linecap="round"/>
  <!-- collar hanging in three points -->
  <path d="M 12.4 17.8 C 21 16.4 31.6 16.4 40.6 18.2 L 40.4 23.4 L 36.6 29.6 L 33 23.8 L 28.2 30 L 24.2 23.8 L 19.6 29.6 L 16.4 23.6 L 12.6 26.4 Z" fill="url(#collar)" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 14.4 20 C 22 18.8 31 18.8 38.6 20.2" fill="none" stroke="#a48af0" stroke-width="1.5" stroke-linecap="round"/>
  <g fill="#ece4ff" stroke="#1a1d24" stroke-width="1.4"><circle cx="19.6" cy="30.2" r="1.6"/><circle cx="28.2" cy="30.6" r="1.6"/><circle cx="36.6" cy="30.2" r="1.6"/></g>
  <!-- thin soft sole -->
  <path d="M 10.4 50 L 47.8 50 C 53.6 50 58.6 46.6 61.4 41.6 C 61.6 49.4 56.8 57.6 48 57.6 L 12.2 57.6 C 11 57.6 10.4 56.8 10.4 55.6 Z" fill="url(#sole)" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 12.4 52.4 L 48 52.4 C 52.4 52.4 56 50.4 58.4 47.6" fill="none" stroke="#7a68b8" stroke-width="1.1" stroke-linecap="round"/>
  </g>
</svg>

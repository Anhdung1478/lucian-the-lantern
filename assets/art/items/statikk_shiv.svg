<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64">
  <!-- Statikk Shiv: a short crooked dagger whose blade is a bolt of blue-white lightning, arcs crackling off it -->
  <defs>
    <radialGradient id="aura" cx="32" cy="32" r="31" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5ac0ff" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#2a4ab0" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2a4ab0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bolt" x1="18" y1="0" x2="46" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#8ad4ff"/>
      <stop offset="1" stop-color="#3a74d8"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#aura)"/>
  <!-- arcs -->
  <path d="M 6 24 L 12 20 L 11 25 L 17 21" fill="none" stroke="#1a1d24" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 6 24 L 12 20 L 11 25 L 17 21" fill="none" stroke="#bfe8ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 58 42 L 52 46 L 53 41 L 47 45" fill="none" stroke="#1a1d24" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 58 42 L 52 46 L 53 41 L 47 45" fill="none" stroke="#bfe8ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="rotate(45 32 32)">
    <!-- lightning blade -->
    <path d="M 34 -2 L 20 20 L 30 20 L 24 41 L 46 15 L 35 15 L 41 3 Z" fill="url(#bolt)" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 33 3 L 25 17 M 29 24 L 27 33" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>
    <!-- guard, grip, pommel -->
    <path d="M 17 41 L 41 41 L 41 46 L 17 46 Z" fill="#5a6580" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 20 43 L 38 43" stroke="#b9c4d4" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M 26 46 L 32 46 L 31.6 56 L 26.4 56 Z" fill="#4a3a90" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 26.5 49.5 L 31.7 48.5 M 26.6 53 L 31.6 52" stroke="#2a2060" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="29" cy="59" r="3.6" fill="#5ac8ff" stroke="#1a1d24" stroke-width="2.5"/>
    <circle cx="28" cy="58" r="1.1" fill="#ffffff"/>
  </g>
  <path d="M 52 12 L 53.4 15.6 L 57 17 L 53.4 18.4 L 52 22 L 50.6 18.4 L 47 17 L 50.6 15.6 Z" fill="#e0f4ff" transform="translate(0 -4)"/>
</svg>

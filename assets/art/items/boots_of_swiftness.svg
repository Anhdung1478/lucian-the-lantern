<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64">
  <!-- Boots of Swiftness: a light, low white leather boot side-on, toe to the right, laced like a sandal with teal straps over the ankle and instep, on a thin pale sole, with a big three-feathered white wing sweeping up and back from the ankle -->
  <defs>
    <radialGradient id="aura" cx="32" cy="32" r="31" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9ff3ea" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#4fc9c0" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#4fc9c0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leather" x1="14" y1="18" x2="54" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#dde5ee"/>
      <stop offset="1" stop-color="#99a7ba"/>
    </linearGradient>
    <linearGradient id="feather" x1="4" y1="4" x2="26" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#d4ecf2"/>
      <stop offset="1" stop-color="#8ab8c8"/>
    </linearGradient>
    <linearGradient id="teal" x1="16" y1="18" x2="46" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7ff0e0"/>
      <stop offset="0.5" stop-color="#2fbfb0"/>
      <stop offset="1" stop-color="#18786f"/>
    </linearGradient>
    <linearGradient id="sole" x1="12" y1="48" x2="40" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9aa6ba"/>
      <stop offset="0.5" stop-color="#6a7588"/>
      <stop offset="1" stop-color="#434c5c"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#aura)"/>
  <g transform="translate(-2.5 0)">
  <!-- the light boot -->
  <path d="M 18.6 19.6 C 24.5 18.4 30.5 19.4 36.4 21.4 C 37 26.4 38.6 30.4 41.2 33.4 C 46.2 36 52 37.6 56.6 40.4 C 60.6 42.8 62.4 46.6 61.6 51 L 13.2 51 C 11.6 47 12.4 41.6 15.4 37.6 C 17.6 32.6 18.8 26.6 18.6 19.6 Z" fill="url(#leather)" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 13 41 C 18.5 40.4 22.4 44 24 51" fill="none" stroke="#8794a8" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M 44.2 37 C 50 38.4 54.6 40 58 43" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
  <!-- teal sandal straps: collar, ankle, instep -->
  <g fill="none" stroke-linecap="round">
    <path d="M 18.8 21.2 C 25 20 31 21 36.6 23 M 16.4 35 C 24 33.6 32 33.4 40.4 32.8 M 45.2 36.2 C 44.2 41 43.8 46 44.4 50.6" stroke="#1a1d24" stroke-width="5.4"/>
    <path d="M 18.8 21.2 C 25 20 31 21 36.6 23 M 16.4 35 C 24 33.6 32 33.4 40.4 32.8 M 45.2 36.2 C 44.2 41 43.8 46 44.4 50.6" stroke="url(#teal)" stroke-width="3"/>
    <path d="M 20 20.4 C 25 19.6 29 20 32 20.8 M 18 34.2 C 22 33.4 25 33.2 27 33.1 M 44.6 38.4 C 44.2 40.6 44 42.6 44 44" stroke="#c8fbf2" stroke-width="1" opacity="0.9"/>
  </g>
  <!-- the wing: three primaries and a covert over their roots -->
  <g transform="translate(3 0)">
  <g stroke="#1a1d24" stroke-width="2.2" stroke-linejoin="round">
    <path d="M 24.2 29.4 C 19 29.6 14 29.4 9.2 27.8 C 6.6 27 5.6 29.8 7.4 31.2 C 12 34 17.6 35 23.6 34.4 Z" fill="url(#feather)"/>
    <path d="M 24 26 C 17.6 24.6 11.6 22.4 5.8 19.4 C 3 18.4 1.8 21.2 3.6 22.8 C 9 27 15 29.8 23.4 31 Z" fill="url(#feather)"/>
    <path d="M 25 22.8 C 19 18.4 13 14 6.6 10.2 C 4 8.8 2.4 11 4 13.2 C 8.6 18.4 14 22.8 23.6 28 Z" fill="url(#feather)"/>
    <path d="M 26.8 20.6 C 23 15 19.2 9.6 12.6 3.6 C 10.2 1.6 7.4 2.4 7.8 5.2 C 8.8 10.4 13 16.4 23.6 25.4 Z" fill="url(#feather)"/>
    <path d="M 31.4 23.8 C 28.8 20.4 23.6 20 20.6 22.8 C 18 25.4 18.4 30 21.4 32.4 C 24.6 34.8 29.4 33.6 31.2 30.2 Z" fill="url(#feather)"/>
  </g>
  <path d="M 22.6 22.2 C 18.4 16.6 14.4 11.6 10 7 M 21.6 25 C 16.6 20.6 11.6 16.6 6.4 13 M 20.6 28.4 C 15.4 26.4 10.4 24.2 5.6 21.6 M 21 31.6 C 16.6 31.4 12.6 30.8 8.8 29.6" fill="none" stroke="#7fb2c4" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M 25 19.8 C 21.6 15 18 10.6 13.4 6.4" fill="none" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M 21 26 C 21.8 23.6 24 22.2 26.8 22.4" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
  <circle cx="26.2" cy="28" r="2.4" fill="url(#teal)" stroke="#1a1d24" stroke-width="1.6"/>
  <circle cx="25.6" cy="27.3" r="0.7" fill="#e6fffb"/>
  </g>
  <!-- thin pale sole -->
  <path d="M 11.6 50 L 58.6 50 C 62.4 50 63.6 52.6 63 54.6 C 62.4 56.6 60.6 57.6 58 57.6 L 34.6 57.6 C 32.6 57.6 32 55.6 30 55.6 L 26.8 55.6 L 26.4 57.6 L 13.4 57.6 C 12.2 57.6 11.6 56.8 11.6 55.6 Z" fill="url(#sole)" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 13.6 52.4 L 60 52.4" stroke="#c9d3e2" stroke-width="1.1" stroke-linecap="round"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64">
  <!-- Infinity Edge: a long golden greatsword on the diagonal, a bevelled gold blade, wings of the crossguard swept up toward the point, a glowing blue gem at their heart -->
  <defs>
    <radialGradient id="aura" cx="32" cy="32" r="31" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffcf5a" stop-opacity="0.58"/>
      <stop offset="0.6" stop-color="#b07a1a" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#b07a1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="10" y1="0" x2="54" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe7a3"/>
      <stop offset="0.5" stop-color="#e2a93b"/>
      <stop offset="1" stop-color="#a8641a"/>
    </linearGradient>
    <radialGradient id="gemglow" cx="32" cy="40" r="9" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8fe0ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#4fc8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gem" cx="30.5" cy="38.5" r="5.5" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#eafaff"/>
      <stop offset="0.45" stop-color="#4fc8ff"/>
      <stop offset="1" stop-color="#1450b0"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#aura)"/>
  <g transform="rotate(45 32 32)">
    <!-- blade: shaded half, then the lit half -->
    <path d="M 32 -4 L 38.8 6 L 39.6 37 L 24.4 37 L 25.2 6 Z" fill="#cf9a3a" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 26.4 6.4 L 32 -1.8 L 32 36 L 25.6 36 Z" fill="#ffe6a0"/>
    <path d="M 32 0 L 32 35" stroke="#8a5a18" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M 26.7 8 L 26.1 34.5 M 27.2 5.6 L 30.8 0.4" stroke="#fffbe8" stroke-width="1.4" stroke-linecap="round"/>
    <!-- winged crossguard, swept up toward the point -->
    <path d="M 32 36 C 25 36 17 33 10 26 C 10 34 15 41 22 43.5 L 42 43.5 C 49 41 54 34 54 26 C 47 33 39 36 32 36 Z" fill="url(#gold)" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 12.5 30.5 C 17 35 23 37.5 30 38.2" fill="none" stroke="#fff4d0" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 15 36 C 19 39.5 23 40.8 27 41.2 M 49 36 C 45 39.5 41 40.8 37 41.2" fill="none" stroke="#a8641a" stroke-width="1.5" stroke-linecap="round"/>
    <!-- grip and pommel -->
    <path d="M 29 43.5 L 35 43.5 L 34.6 53.5 L 29.4 53.5 Z" fill="#6a2418" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 29.6 47 L 34.6 46 M 29.7 50.6 L 34.5 49.6" stroke="#3a1008" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="32" cy="57" r="3.6" fill="#e2a93b" stroke="#1a1d24" stroke-width="2.5"/>
    <circle cx="31" cy="56" r="1.1" fill="#ffe7a3"/>
    <!-- glowing blue gem -->
    <circle cx="32" cy="40" r="9" fill="url(#gemglow)"/>
    <circle cx="32" cy="40" r="4.6" fill="url(#gem)" stroke="#1a1d24" stroke-width="1.8"/>
    <circle cx="30.6" cy="38.6" r="1.2" fill="#ffffff"/>
  </g>
  <!-- sparkles -->
  <path d="M 11 24 L 12.4 27.6 L 16 29 L 12.4 30.4 L 11 34 L 9.6 30.4 L 6 29 L 9.6 27.6 Z" fill="#fff4d0"/>
  <path d="M 52 48 L 52.9 50.1 L 55 51 L 52.9 51.9 L 52 54 L 51.1 51.9 L 49 51 L 51.1 50.1 Z" fill="#ffd36b"/>
</svg>

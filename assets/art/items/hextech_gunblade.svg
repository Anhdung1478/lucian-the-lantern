<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64">
  <!-- Hextech Gunblade (legendary): a brass pistol seen from the side, barrel up and to the right, a long steel blade fixed under the barrel and past the muzzle, a glowing cyan hex crystal in the frame and a dark wooden grip. -->
  <defs>
    <radialGradient id="aura" cx="32" cy="32" r="31" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#44e0e8" stop-opacity="0.5"/>
      <stop offset="0.6" stop-color="#1f8f9c" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#1f8f9c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="steel" x1="0" y1="27" x2="0" y2="37" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f4f7fb"/>
      <stop offset="0.5" stop-color="#b9c4d4"/>
      <stop offset="1" stop-color="#7c8799"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="16" x2="0" y2="33" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe7a3"/>
      <stop offset="0.5" stop-color="#e2a93b"/>
      <stop offset="1" stop-color="#a8641a"/>
    </linearGradient>
    <linearGradient id="wood" x1="10" y1="0" x2="25" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8a5a34"/>
      <stop offset="0.5" stop-color="#6b3f24"/>
      <stop offset="1" stop-color="#3a2214"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#aura)"/>
  <g transform="translate(3 2) rotate(-30 32 32)" stroke="#1a1d24" stroke-linejoin="round">
    <!-- blade under the barrel -->
    <path d="M 24 27.5 L 64 27.5 L 52 37 L 26 37 Z" fill="url(#steel)" stroke-width="2.5"/>
    <path d="M 27 35.6 L 52 35.6 L 60.5 29" fill="none" stroke="#e8eef6" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 28 33.6 L 51.5 33.6 L 58.5 28.6" fill="none" stroke="#5d6778" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 30 30 L 58 30" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
    <!-- hammer -->
    <path d="M 14 19 L 8.5 13 L 12.5 11 L 17.5 17 Z" fill="#a8641a" stroke-width="2"/>
    <!-- grip and trigger guard -->
    <path d="M 26 31 Q 26 40.5 33 39.5 L 33 32" fill="none" stroke="#1a1d24" stroke-width="4.6" stroke-linecap="round"/>
    <path d="M 26 31 Q 26 40.5 33 39.5 L 33 32" fill="none" stroke="#e2a93b" stroke-width="2" stroke-linecap="round"/>
    <path d="M 14 30 L 26 31 L 22.5 50 L 10 48 Z" fill="url(#wood)" stroke-width="2.5"/>
    <path d="M 14.2 36 L 23.8 36.8 M 13.1 41.5 L 22.8 42.4" fill="none" stroke="#3a2214" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 9.5 46.5 L 23 48.6 L 22.4 52 L 9 50 Z" fill="#e2a93b" stroke-width="2"/>
    <!-- barrel -->
    <path d="M 28 19.5 L 50 19.5 L 50 28 L 28 28 Z" fill="url(#brass)" stroke-width="2.5"/>
    <path d="M 49 18 L 55 18 L 55 29.5 L 49 29.5 Z" fill="#c48530" stroke-width="2.2"/>
    <path d="M 31 25 L 47 25" stroke="#3ee6f0" stroke-width="2" stroke-linecap="round"/>
    <path d="M 30 21.6 L 48 21.6" stroke="#fff3c9" stroke-width="1.4" stroke-linecap="round"/>
    <!-- frame with the hex crystal -->
    <rect x="11" y="16.5" width="21" height="16" rx="3" fill="url(#brass)" stroke-width="2.5"/>
    <path d="M 14 18.8 L 29 18.8" stroke="#fff3c9" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M 21.5 18.5 L 27 21.5 L 27 27.5 L 21.5 30.5 L 16 27.5 L 16 21.5 Z" fill="#3ee6f0" stroke-width="2"/>
    <path d="M 21.5 21.6 L 24.3 23.2 L 24.3 26.3 L 21.5 27.9 L 18.7 26.3 L 18.7 23.2 Z" fill="#dcfdff" stroke="none"/>
  </g>
  <!-- sparkles -->
  <path d="M 13 9 L 14.2 12.3 L 17.5 13.5 L 14.2 14.7 L 13 18 L 11.8 14.7 L 8.5 13.5 L 11.8 12.3 Z" fill="#d8fcff"/>
  <path d="M 54 46 L 54.9 48.1 L 57 49 L 54.9 49.9 L 54 52 L 53.1 49.9 L 51 49 L 53.1 48.1 Z" fill="#8ff0f5"/>
</svg>

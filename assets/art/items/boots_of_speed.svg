<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64">
  <!-- Boots of Speed: a plain brown leather lace-up ankle boot side-on, toe to the right: padded collar, a tongue, cream laces crossing down the front to a bow, toe-cap and heel seams, a stitched welt, a stacked heel and a leather sole -->
  <defs>
    <radialGradient id="aura" cx="32" cy="32" r="31" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c4efe8" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#c4efe8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leather" x1="14" y1="12" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d0965a"/>
      <stop offset="0.5" stop-color="#a0642f"/>
      <stop offset="1" stop-color="#5d3516"/>
    </linearGradient>
    <linearGradient id="tongue" x1="31" y1="5" x2="40" y2="15" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e2ad74"/>
      <stop offset="1" stop-color="#9a5f2c"/>
    </linearGradient>
    <linearGradient id="sole" x1="12" y1="48" x2="40" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#74503a"/>
      <stop offset="0.5" stop-color="#4a2f1c"/>
      <stop offset="1" stop-color="#2b1a0f"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#aura)"/>
  <g transform="translate(-4 0)">
  <!-- tongue, behind the laces -->
  <path d="M 30.5 16 C 30.5 10.5 31.5 6.5 34.5 5.2 C 37.2 4.2 40 5.2 40.5 7.6 C 41 10.5 40 13.5 39 17 Z" fill="url(#tongue)" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 33 13 C 33 10 33.6 8 35.2 7.2" fill="none" stroke="#f6d3a6" stroke-width="1.5" stroke-linecap="round"/>
  <!-- the upper -->
  <path d="M 15 11.5 C 21 9.8 28 10.6 33.5 13.2 L 36.5 13.6 C 37 20 37.6 26 39.5 30.5 C 44.5 33 50.5 34.5 55.5 37.5 C 60 40.2 62 45 61 50 L 11.5 50 C 9.5 46 10 40.5 13 36.5 C 15.2 32.5 15.5 22 15 11.5 Z" fill="url(#leather)" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- heel counter and toe cap seams -->
  <path d="M 11 39.5 C 17.5 38.6 22 42.5 24 50" fill="none" stroke="#5d3516" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 46.5 34.2 C 50 38.5 50.8 44.5 49.2 50" fill="none" stroke="#5d3516" stroke-width="1.8" stroke-linecap="round"/>
  <!-- lace facing and eyelets -->
  <path d="M 31.5 13 C 32 20 32.8 26 35 31.5 C 37.5 34.5 41 35.5 44.5 36" fill="none" stroke="#6e3f19" stroke-width="2" stroke-linecap="round"/>
  <g fill="#e2a93b" stroke="#5d3516" stroke-width="0.8"><circle cx="33" cy="16.5" r="1.1"/><circle cx="33.5" cy="21" r="1.1"/><circle cx="34.4" cy="25.5" r="1.1"/><circle cx="36" cy="29.8" r="1.1"/><circle cx="39" cy="33.2" r="1.1"/></g>
  <!-- laces crossing the front -->
  <g stroke-linecap="round" fill="none">
    <path d="M 33 16.5 L 37.6 15.4 M 33.5 21 L 38 20.2 M 34.4 25.5 L 38.8 25.4 M 36 29.8 L 40.4 30.6 M 39 33.2 L 43 32.8" stroke="#1a1d24" stroke-width="3.1"/>
    <path d="M 33 16.5 L 37.6 15.4 M 33.5 21 L 38 20.2 M 34.4 25.5 L 38.8 25.4 M 36 29.8 L 40.4 30.6 M 39 33.2 L 43 32.8" stroke="#f2e2bf" stroke-width="1.5"/>
  </g>
  <!-- bow -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <path d="M 37.2 13 C 38.4 15.8 39 18.4 40.6 21 M 37.2 13 C 39.4 15.6 41.4 17.6 43.6 19.4" fill="none" stroke="#1a1d24" stroke-width="3.1"/>
    <path d="M 37.2 13 C 38.4 15.8 39 18.4 40.6 21 M 37.2 13 C 39.4 15.6 41.4 17.6 43.6 19.4" fill="none" stroke="#d9c49b" stroke-width="1.5"/>
    <path d="M 37.2 12.8 C 39.6 8.2 44.6 7.2 45.4 9.6 C 46 11.8 41.6 13.2 37.2 12.8 Z" fill="#f2e2bf" stroke="#1a1d24" stroke-width="2"/>
    <path d="M 39.6 11.6 C 41.2 10.2 43 9.8 43.8 10.2" fill="none" stroke="#b89a6a" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="37.2" cy="12.9" r="2" fill="#f2e2bf" stroke="#1a1d24" stroke-width="1.8"/>
  </g>
  <!-- padded collar -->
  <path d="M 15.2 11.6 C 21 10 27.5 10.8 32.5 13" fill="none" stroke="#1a1d24" stroke-width="5.6" stroke-linecap="round"/>
  <path d="M 15.2 11.6 C 21 10 27.5 10.8 32.5 13" fill="none" stroke="#c48a50" stroke-width="3" stroke-linecap="round"/>
  <path d="M 16 10.9 C 21 9.7 26 10.2 30 11.6" fill="none" stroke="#f0c896" stroke-width="1.1" stroke-linecap="round"/>
  <!-- highlights on the lit edges -->
  <path d="M 17.6 16 C 18 24 17.6 31 16 36" fill="none" stroke="#f6d3a6" stroke-width="1.6" stroke-linecap="round" opacity="0.9"/>
  <path d="M 44.5 35.6 C 48.5 36.6 52 37.6 55.4 39.6" fill="none" stroke="#f6d3a6" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>
  <!-- sole: welt, stacked heel, leather sole with toe spring -->
  <path d="M 9.5 49 L 58 49 C 62 49 63.2 52.2 62.6 54.4 C 62 56.6 60 57.6 57.5 57.6 L 34.5 57.6 C 32.4 57.6 31.8 54.6 29.8 54.6 L 27.6 54.6 L 27.2 57.6 L 11.6 57.6 C 10.2 57.6 9.5 56.8 9.5 55.4 Z" fill="url(#sole)" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 11.5 51.8 L 59.5 51.8" stroke="#2b1a0f" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 12.5 50.4 L 58 50.4" stroke="#b08a66" stroke-width="1" stroke-linecap="round" stroke-dasharray="1.6 1.4"/>
  <path d="M 11.5 54.7 L 26.5 54.7" stroke="#6e4a2e" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64">
  <!-- Hextech Rocketbelt (legendary): a brass belt curving round the waist with a glowing cyan hex gem in a hex buckle, two steel rocket thrusters hanging below it, cyan flames pointing down. -->
  <defs>
    <radialGradient id="aura" cx="32" cy="32" r="31" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#44e0e8" stop-opacity="0.5"/>
      <stop offset="0.6" stop-color="#1f8f9c" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#1f8f9c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="band" x1="10" y1="8" x2="54" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe7a3"/>
      <stop offset="0.5" stop-color="#d89a36"/>
      <stop offset="1" stop-color="#8a5418"/>
    </linearGradient>
    <linearGradient id="rocket" x1="8" y1="0" x2="26" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f4f7fb"/>
      <stop offset="0.5" stop-color="#b9c4d4"/>
      <stop offset="1" stop-color="#7c8799"/>
    </linearGradient>
    <linearGradient id="gold" x1="4" y1="0" x2="60" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe7a3"/>
      <stop offset="0.5" stop-color="#e2a93b"/>
      <stop offset="1" stop-color="#a8641a"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="46" x2="0" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f4feff"/>
      <stop offset="0.5" stop-color="#4fe6f0"/>
      <stop offset="1" stop-color="#1f8fd0"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#aura)"/>
  <!-- flames -->
  <path d="M 11.5 46 C 11 54 16 60 16 62 C 16 60 21 54 20.5 46 Z" fill="url(#flame)" stroke="#1a1d24" stroke-width="2" stroke-linejoin="round"/>
  <path d="M 43.5 46 C 43 54 48 60 48 62 C 48 60 53 54 52.5 46 Z" fill="url(#flame)" stroke="#1a1d24" stroke-width="2" stroke-linejoin="round"/>
  <!-- rockets -->
  <g stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round">
    <path d="M 9 24 L 23 24 L 22 41 L 10 41 Z" fill="url(#rocket)"/>
    <path d="M 10 41 L 22 41 L 20.5 46 L 11.5 46 Z" fill="#3a4358"/>
    <path d="M 41 24 L 55 24 L 54 41 L 42 41 Z" fill="url(#rocket)"/>
    <path d="M 42 41 L 54 41 L 52.5 46 L 43.5 46 Z" fill="#3a4358"/>
  </g>
  <path d="M 12 28 L 12 38 M 44 28 L 44 38" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
  <path d="M 10 33 L 22 33 M 42 33 L 54 33" fill="none" stroke="#e2a93b" stroke-width="2.6" stroke-linecap="round"/>
  <!-- brass belt band, curving round the waist -->
  <path d="M 2.5 10 C 20 17.5 44 17.5 61.5 10 L 61.5 24 C 44 31.5 20 31.5 2.5 24 Z" fill="url(#band)" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 5 13 C 20 19.5 44 19.5 59 13" fill="none" stroke="#fff3c9" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M 5 21.6 C 20 28 44 28 59 21.6" fill="none" stroke="#7a4a14" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="9" cy="17.5" r="1.4" fill="#fff0c0" stroke="#7a4a14" stroke-width="0.8"/>
  <circle cx="55" cy="17.5" r="1.4" fill="#fff0c0" stroke="#7a4a14" stroke-width="0.8"/>
  <!-- hex buckle and glowing hex gem -->
  <path d="M 32 9 L 42 14.75 L 42 26.25 L 32 32 L 22 26.25 L 22 14.75 Z" fill="url(#gold)" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 32 13.5 L 38 17 L 38 24 L 32 27.5 L 26 24 L 26 17 Z" fill="#3ee6f0" stroke="#1a1d24" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M 32 16.5 L 35 18.3 L 35 22.7 L 32 24.5 L 29 22.7 L 29 18.3 Z" fill="#e2feff"/>
  <path d="M 27.6 17.6 L 31.4 15.4" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
</svg>

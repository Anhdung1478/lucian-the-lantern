<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64">
  <!-- Mercury's Treads: a chunky violet leather boot side-on, toe to the right, on a thick midsole with six big tread lugs, a padded collar piped in magenta, magenta laces, and a steel warding ring with a magenta rune disc on the ankle -->
  <defs>
    <radialGradient id="aura" cx="32" cy="32" r="31" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c78cf2" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#8a4ad0" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#8a4ad0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leather" x1="14" y1="10" x2="54" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a284e8"/>
      <stop offset="0.5" stop-color="#6446b8"/>
      <stop offset="1" stop-color="#36226e"/>
    </linearGradient>
    <linearGradient id="ring" x1="20" y1="22" x2="34" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f4f7fb"/>
      <stop offset="0.5" stop-color="#b9c4d4"/>
      <stop offset="1" stop-color="#7c8799"/>
    </linearGradient>
    <linearGradient id="rune" x1="23" y1="25" x2="31" y2="33" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff9ae0"/>
      <stop offset="0.5" stop-color="#d43aa8"/>
      <stop offset="1" stop-color="#8a1a6a"/>
    </linearGradient>
    <linearGradient id="tread" x1="10" y1="44" x2="40" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7a7090"/>
      <stop offset="0.5" stop-color="#504662"/>
      <stop offset="1" stop-color="#2e2838"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#aura)"/>
  <g transform="translate(-4.6 0)">
  <!-- tread lugs -->
  <g fill="url(#tread)" stroke="#1a1d24" stroke-width="2.2" stroke-linejoin="round">
    <path d="M 10.6 50 L 17.6 50 L 17.2 57 C 17.2 57.8 16.6 58.4 15.8 58.4 L 12 58.4 C 11.2 58.4 10.6 57.8 10.6 57 Z"/>
    <path d="M 20.2 50 L 27 50 L 26.8 57 C 26.8 57.8 26.2 58.4 25.4 58.4 L 21.6 58.4 C 20.8 58.4 20.2 57.8 20.2 57 Z"/>
    <path d="M 29.6 50 L 36.4 50 L 36.2 57 C 36.2 57.8 35.6 58.4 34.8 58.4 L 31 58.4 C 30.2 58.4 29.6 57.8 29.6 57 Z"/>
    <path d="M 39 50 L 45.8 50 L 45.6 57 C 45.6 57.8 45 58.4 44.2 58.4 L 40.4 58.4 C 39.6 58.4 39 57.8 39 57 Z"/>
    <path d="M 48.4 50 L 55.2 50 L 55 57 C 55 57.8 54.4 58.4 53.6 58.4 L 49.8 58.4 C 49 58.4 48.4 57.8 48.4 57 Z"/>
    <path d="M 57.6 49.6 L 62.6 49.6 C 63.4 52 62.4 55.6 60.2 56.8 L 58 57 Z"/>
  </g>
  <!-- the chunky boot -->
  <path d="M 16.6 11.5 L 38.4 11.5 C 38.8 18 39.4 23.6 41 28 C 46 30.2 52.4 31.4 57 34.4 C 61.4 37.2 62.8 41.6 61.8 45.8 L 12.4 45.8 C 11 41.6 11.8 36.8 14.6 33.4 C 16.6 28.8 17 21 16.6 11.5 Z" fill="url(#leather)" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 46.6 31 C 50.4 34.4 51.4 40 50.4 45.4" fill="none" stroke="#2a1858" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 42.6 30.2 C 47.4 31.8 52.6 32.8 56.6 35.6" fill="none" stroke="#d6c6ff" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 19.4 16 C 19.6 22 19.2 27 17.8 31" fill="none" stroke="#d6c6ff" stroke-width="1.5" stroke-linecap="round"/>
  <!-- magenta laces -->
  <g fill="none" stroke-linecap="round">
    <path d="M 34.4 16.4 L 39.4 15.4 M 34.6 20.6 L 39.6 20 M 35.2 24.8 L 40.2 24.8 M 37 28.8 L 41.8 29.6" stroke="#1a1d24" stroke-width="3.1"/>
    <path d="M 34.4 16.4 L 39.4 15.4 M 34.6 20.6 L 39.6 20 M 35.2 24.8 L 40.2 24.8 M 37 28.8 L 41.8 29.6" stroke="#ff7ad6" stroke-width="1.5"/>
  </g>
  <!-- warding ring on the ankle -->
  <circle cx="26.4" cy="30.4" r="7.4" fill="url(#ring)" stroke="#1a1d24" stroke-width="2.5"/>
  <circle cx="26.4" cy="30.4" r="4.6" fill="url(#rune)" stroke="#1a1d24" stroke-width="1.8"/>
  <path d="M 26.4 27.4 L 28.4 30.4 L 26.4 33.4 L 24.4 30.4 Z" fill="#ffe0f6"/>
  <path d="M 26.4 22.6 L 26.4 24.2 M 26.4 36.6 L 26.4 38.2 M 18.6 30.4 L 20.2 30.4 M 32.6 30.4 L 34.2 30.4" stroke="#5d6778" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M 21 27 C 22 25 23.6 23.8 25.6 23.4" fill="none" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round"/>
  <!-- padded collar -->
  <path d="M 15 6.6 C 22 5.4 32 5.4 39.8 6.6 L 40.2 14 L 15 14 Z" fill="#43307f" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 16.6 9 C 23 8 31 8 38.6 9" fill="none" stroke="#ff7ad6" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 16.8 11.8 L 38.6 11.8" stroke="#2a1858" stroke-width="1.4" stroke-linecap="round"/>
  <!-- midsole -->
  <path d="M 10.2 44.8 L 58.8 44.8 C 62.6 44.8 64 47 63.6 49 C 63.2 50.6 61.8 51.4 60 51.4 L 10.2 51.4 Z" fill="#6e6482" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 12.2 47 L 59 47" stroke="#a89cc0" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</svg>

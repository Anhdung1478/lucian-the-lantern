<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64">
  <!-- Swiftmarch: the winged white sandal-boot made grand, side-on, toe to the right: a fuller five-feathered wing with a gold leading edge and a glowing cyan gem at its root, a second small wing at the heel, a gold collar strap and teal ankle and instep straps, a gold toe cap, cyan sparkles -->
  <defs>
    <radialGradient id="aura" cx="32" cy="32" r="31" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9ff3ea" stop-opacity="0.58"/>
      <stop offset="0.6" stop-color="#2fbfb0" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2fbfb0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leather" x1="14" y1="18" x2="54" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#dde5ee"/>
      <stop offset="1" stop-color="#99a7ba"/>
    </linearGradient>
    <linearGradient id="feather" x1="2" y1="2" x2="28" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#d4f0f2"/>
      <stop offset="1" stop-color="#84bcc8"/>
    </linearGradient>
    <linearGradient id="teal" x1="16" y1="18" x2="46" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7ff0e0"/>
      <stop offset="0.5" stop-color="#2fbfb0"/>
      <stop offset="1" stop-color="#18786f"/>
    </linearGradient>
    <linearGradient id="gold" x1="14" y1="16" x2="62" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe7a3"/>
      <stop offset="0.5" stop-color="#e2a93b"/>
      <stop offset="1" stop-color="#a8641a"/>
    </linearGradient>
    <radialGradient id="glow" cx="26.2" cy="27.8" r="8.5" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b8fff6" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#3fe0d0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gem" x1="24" y1="25" x2="29" y2="31" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#eafffc"/>
      <stop offset="0.45" stop-color="#3fe0d0"/>
      <stop offset="1" stop-color="#127a70"/>
    </linearGradient>
    <linearGradient id="sole" x1="12" y1="48" x2="40" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9aa6ba"/>
      <stop offset="0.5" stop-color="#6a7588"/>
      <stop offset="1" stop-color="#434c5c"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#aura)"/>
  <g transform="translate(-2.5 0.6)">
  <!-- the light boot -->
  <path d="M 18.6 19.6 C 24.5 18.4 30.5 19.4 36.4 21.4 C 37 26.4 38.6 30.4 41.2 33.4 C 46.2 36 52 37.6 56.6 40.4 C 60.6 42.8 62.4 46.6 61.6 51 L 13.2 51 C 11.6 47 12.4 41.6 15.4 37.6 C 17.6 32.6 18.8 26.6 18.6 19.6 Z" fill="url(#leather)" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 13 41 C 18.5 40.4 22.4 44 24 51" fill="none" stroke="#8794a8" stroke-width="1.6" stroke-linecap="round"/>
  <!-- gold toe cap -->
  <path d="M 48.4 37.4 C 51.4 41 52 46.4 51 51 L 61.6 51 C 62.4 46.6 60.6 42.8 56.6 40.4 C 54 38.8 51.2 37.9 48.4 37.4 Z" fill="url(#gold)" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 51 39 C 54 39.8 56.8 41.4 58.6 44" fill="none" stroke="#fff4d0" stroke-width="1.4" stroke-linecap="round"/>
  <!-- straps: gold collar, teal ankle and instep -->
  <g fill="none" stroke-linecap="round">
    <path d="M 18.8 21.2 C 25 20 31 21 36.6 23 M 16.4 35 C 24 33.6 32 33.4 40.4 32.8 M 45.2 36.2 C 44.2 41 43.8 46 44.4 50.6" stroke="#1a1d24" stroke-width="5.4"/>
    <path d="M 16.4 35 C 24 33.6 32 33.4 40.4 32.8 M 45.2 36.2 C 44.2 41 43.8 46 44.4 50.6" stroke="url(#teal)" stroke-width="3"/>
    <path d="M 18.8 21.2 C 25 20 31 21 36.6 23" stroke="url(#gold)" stroke-width="3"/>
    <path d="M 20 20.4 C 25 19.6 29 20 32 20.8" stroke="#fff4d0" stroke-width="1" opacity="0.9"/>
    <path d="M 18 34.2 C 22 33.4 25 33.2 27 33.1 M 44.6 38.4 C 44.2 40.6 44 42.6 44 44" stroke="#c8fbf2" stroke-width="1" opacity="0.9"/>
  </g>
  <!-- the wing: five primaries and a covert -->
  <g transform="translate(3 0)">
  <g stroke="#1a1d24" stroke-width="2.2" stroke-linejoin="round">
    <path d="M 24.2 30.6 C 19.4 31.6 14.6 32 9.8 31.4 C 7.2 31.2 6.8 34 8.6 35 C 13 37 18.4 37.2 23.8 35.4 Z" fill="url(#feather)"/>
    <path d="M 24.2 28.4 C 18.6 27.6 12.8 26 7 23.4 C 4.4 22.4 3.2 25.2 5 26.6 C 10.4 30.6 16.4 32.6 23.6 33.2 Z" fill="url(#feather)"/>
    <path d="M 24.6 25.4 C 18.4 22.6 12.2 19 6 14.6 C 3.6 13 1.8 15.6 3.4 17.6 C 8.4 23 14.6 27.6 23.4 30.4 Z" fill="url(#feather)"/>
    <path d="M 25.4 22.8 C 20 17.8 14.6 12.6 9.2 7.2 C 7.2 5.2 4.8 6.6 5.6 9.4 C 8.6 15.6 14.6 21.6 23.6 27.4 Z" fill="url(#feather)"/>
    <path d="M 27.4 20.4 C 24.4 14.6 21.4 9 16.4 3 C 14.6 0.8 11.6 1.2 11.6 4 C 12 9.8 16 16.4 23.8 24.6 Z" fill="url(#feather)"/>
    <path d="M 32 23.6 C 29.4 20 23.8 19.4 20.6 22.4 C 17.8 25.2 18.2 30.4 21.4 32.8 C 24.8 35.2 30 34 31.8 30.2 Z" fill="url(#feather)"/>
  </g>
  <path d="M 24.8 20.4 C 22.4 15.4 19.6 10.6 15.6 5.8 M 22.4 23.6 C 18 18.8 13.6 14.4 8.6 9.6 M 21 26.6 C 16 23.8 11 20.6 5.8 16.6 M 20.6 30 C 15.6 28.8 10.8 27 6.6 25 M 21 33.4 C 17 33.8 13 33.8 9.6 33.2" fill="none" stroke="#6fb0c0" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M 26.2 19.2 C 23.6 14.2 20.8 9.8 16.4 4.6 M 31.2 23.4 C 28.6 20.8 24.6 20.6 22 22.4" fill="none" stroke="url(#gold)" stroke-width="1.8" stroke-linecap="round"/>
  <!-- glowing gem at the wing root -->
  <circle cx="26.2" cy="27.8" r="8.5" fill="url(#glow)"/>
  <circle cx="26.2" cy="27.8" r="3" fill="url(#gem)" stroke="#1a1d24" stroke-width="1.8"/>
  <circle cx="25.3" cy="26.9" r="0.9" fill="#ffffff"/>
  </g>
  <!-- a second, smaller wing at the heel -->
  <g transform="translate(3.4 0)">
  <g stroke="#1a1d24" stroke-width="2.2" stroke-linejoin="round">
    <path d="M 14.8 45.4 C 11 46 7.2 46 3.6 45.2 C 1.8 44.8 1.4 47 2.8 47.8 C 6.4 49.4 10.4 49.6 14.6 48.6 Z" fill="url(#feather)"/>
    <path d="M 15.6 42.4 C 11.6 41.8 7.6 40.6 4 38.6 C 2.2 37.8 1.2 39.8 2.6 41 C 5.8 43.8 10 45.2 14.8 45.4 Z" fill="url(#feather)"/>
    <path d="M 18.4 42.4 C 16.4 40.6 13.2 41.2 12.4 43.6 C 11.8 46 13.8 48.6 16.4 48 C 18.4 47.6 19.4 45.2 18.4 42.4 Z" fill="url(#feather)"/>
  </g>
  <path d="M 12.6 43.4 C 9.6 42.8 7 41.8 4.6 40.4 M 12.6 47 C 9.6 47.4 7 47.4 4.4 46.8" fill="none" stroke="#6fb0c0" stroke-width="1.1" stroke-linecap="round"/>
  <path d="M 14.6 41.6 C 11 40.8 7.6 39.6 4.4 37.8" fill="none" stroke="url(#gold)" stroke-width="1.6" stroke-linecap="round"/>
  </g>
  <!-- thin pale sole -->
  <path d="M 11.6 50 L 58.6 50 C 62.4 50 63.6 52.6 63 54.6 C 62.4 56.6 60.6 57.6 58 57.6 L 34.6 57.6 C 32.6 57.6 32 55.6 30 55.6 L 26.8 55.6 L 26.4 57.6 L 13.4 57.6 C 12.2 57.6 11.6 56.8 11.6 55.6 Z" fill="url(#sole)" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 13.6 52.4 L 60 52.4" stroke="#e2a93b" stroke-width="1.2" stroke-linecap="round"/>
  <!-- sparkles -->
  <path d="M 50 8 L 51.4 11.6 L 55 13 L 51.4 14.4 L 50 18 L 48.6 14.4 L 45 13 L 48.6 11.6 Z" fill="#e6fffb"/>
  <path d="M 58 22 L 58.8 24.2 L 61 25 L 58.8 25.8 L 58 28 L 57.2 25.8 L 55 25 L 57.2 24.2 Z" fill="#9ff3ea"/>
  <circle cx="40" cy="12" r="1.2" fill="#c8fbf2"/>
  </g>
</svg>

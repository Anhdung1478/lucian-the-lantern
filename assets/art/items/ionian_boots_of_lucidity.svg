<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64">
  <!-- Ionian Boots of Lucidity: a tall, slender pale cloth boot side-on with a pointed, upturned toe, wrapped in three slanting blue bands, a white cuff set with a small sapphire, a forked blue ribbon streaming back from the cuff, on a thin sole -->
  <defs>
    <radialGradient id="aura" cx="32" cy="32" r="31" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8fc2ff" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#3f7fe0" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#3f7fe0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloth" x1="16" y1="8" x2="56" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#d6e2f4"/>
      <stop offset="1" stop-color="#8ea2c6"/>
    </linearGradient>
    <linearGradient id="blue" x1="2" y1="2" x2="40" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7cc0ff"/>
      <stop offset="0.5" stop-color="#3a7fe0"/>
      <stop offset="1" stop-color="#1f4a9a"/>
    </linearGradient>
    <linearGradient id="sole" x1="12" y1="48" x2="40" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5a7ab8"/>
      <stop offset="0.5" stop-color="#34508a"/>
      <stop offset="1" stop-color="#1c2c52"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#aura)"/>
  <g transform="translate(-2 0)">
  <!-- ribbon tails streaming back -->
  <g transform="translate(3.4 0)">
  <g stroke="#1a1d24" stroke-width="2.2" stroke-linejoin="round">
    <path d="M 19.4 9.2 C 15 11.4 12 16.6 6.4 16.2 L 1.6 16.8 L 4.2 20.4 L 2.8 24.4 L 7.2 22 C 13.8 22.6 17 17.2 20 14.6 Z" fill="url(#blue)"/>
    <path d="M 19.6 4.8 C 15 2 11 6 6 3.6 L 2.4 2.2 L 4.2 6.2 L 2.4 10.4 L 6.4 9.6 C 11.6 11.8 15.6 7.8 19.8 10.2 Z" fill="url(#blue)"/>
  </g>
  <path d="M 17 7.2 C 13.6 6 11 7.6 7.4 6.6 M 17 12.6 C 14.6 14.6 12.6 17.6 8.6 18.6" fill="none" stroke="#bfe0ff" stroke-width="1.2" stroke-linecap="round"/>
  </g>
  <!-- the slender boot with an upturned toe -->
  <path d="M 19.8 8 L 34.6 8 C 34.8 16.5 35.2 24 36.8 30 C 40 34.4 46 37 51.8 39.4 C 55.8 41 59.4 41.4 62.4 39.8 C 62.6 45.4 59.2 50.6 53.4 50.6 L 14.6 50.6 C 12.8 46.6 13.6 41.4 16.4 37.6 C 18.8 33 20 22.5 19.8 8 Z" fill="url(#cloth)"/>
  <!-- slanting blue bands -->
  <g fill="url(#blue)">
    <path d="M 19.8 13.4 L 34.7 17.4 L 34.8 22.2 L 19.8 18.2 Z"/>
    <path d="M 19.7 24.4 L 35.2 28 L 36.2 31.6 L 19 29.2 Z"/>
    <path d="M 16.4 37.6 C 17 36.6 17.6 35.6 18 34.6 L 42 36.4 C 43.4 37.2 44.8 37.8 46.4 38.4 L 45.6 42 Z"/>
  </g>
  <path d="M 19.8 18.2 L 34.8 22.2 M 19 29.2 L 36.2 31.6 M 16.4 37.6 L 45.6 42" fill="none" stroke="#173a80" stroke-width="1.5"/>
  <path d="M 21 14.2 L 33 17.4 M 21 25.2 L 33.6 28" fill="none" stroke="#bfe0ff" stroke-width="1.1" stroke-linecap="round"/>
  <!-- outline over the bands -->
  <path d="M 19.8 8 L 34.6 8 C 34.8 16.5 35.2 24 36.8 30 C 40 34.4 46 37 51.8 39.4 C 55.8 41 59.4 41.4 62.4 39.8 C 62.6 45.4 59.2 50.6 53.4 50.6 L 14.6 50.6 C 12.8 46.6 13.6 41.4 16.4 37.6 C 18.8 33 20 22.5 19.8 8 Z" fill="none" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 22 21 C 22.2 28 21.6 34 20 38" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 48 43.6 C 52.6 45 56.6 44.8 60 43.2" fill="none" stroke="#8ea2c6" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 48.6 40.6 C 52.6 42.2 56.4 42.6 59.6 41.6" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
  <!-- cuff with a sapphire and the ribbon knot -->
  <path d="M 18.4 3.6 L 36 3.6 L 36.2 10 L 18.2 10 Z" fill="url(#cloth)" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 20 5.6 L 34 5.6" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M 19.6 8.4 L 34.8 8.4" stroke="#8ea2c6" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M 32.6 3.6 L 35.4 6.8 L 32.6 10 L 29.8 6.8 Z" fill="url(#blue)" stroke="#1a1d24" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M 32.2 5.4 L 31.2 6.8" stroke="#e8f4ff" stroke-width="1" stroke-linecap="round"/>
  <path d="M 17 5.4 C 19.4 5 21.4 6.4 21.4 8 C 21.4 9.8 19.2 11 17 10.4 C 15.8 9.2 15.8 6.6 17 5.4 Z" fill="url(#blue)" stroke="#1a1d24" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- thin sole -->
  <path d="M 12.8 49.8 L 53.4 49.8 C 58.2 49.8 61.6 46.6 63 43.4 C 63.6 48.6 61.8 57.6 55 57.6 L 14.4 57.6 C 13.2 57.6 12.8 56.8 12.8 55.6 Z" fill="url(#sole)" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 14.8 52 L 53.4 52 C 57 52 59.6 50 61 47.8" fill="none" stroke="#8fb0ea" stroke-width="1.1" stroke-linecap="round"/>
  <path d="M 26.4 53.6 L 26.4 57.2" stroke="#1c2c52" stroke-width="1.4" stroke-linecap="round"/>
  </g>
</svg>

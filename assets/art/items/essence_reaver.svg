<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64">
  <!-- Essence Reaver: a scythe with a long glowing blue blade, a dark steel snath and a mana orb at the joint -->
  <defs>
    <radialGradient id="aura" cx="32" cy="32" r="31" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3a9cff" stop-opacity="0.5"/>
      <stop offset="0.6" stop-color="#1f5ab0" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#1f5ab0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="30" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#eafcff"/>
      <stop offset="0.5" stop-color="#6ac8ff"/>
      <stop offset="1" stop-color="#2c6ab0"/>
    </linearGradient>
    <linearGradient id="pole" x1="28" y1="0" x2="36" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8e9bb0"/>
      <stop offset="1" stop-color="#3a4254"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#aura)"/>
  <g transform="rotate(45 32 32)">
    <!-- snath -->
    <path d="M 29.5 12 L 34.5 12 L 34.5 58 L 29.5 58 Z" fill="url(#pole)" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 29.5 44 L 34.5 44 M 29.5 50 L 34.5 50" stroke="#2a3040" stroke-width="1.5"/>
    <circle cx="32" cy="60" r="2.8" fill="#6ac8ff" stroke="#1a1d24" stroke-width="1.8"/>
    <!-- blade sweeping to the left and curling down -->
    <path d="M 34 4 C 18 -1 4 8 3 28 L 6 36 C 8 22 18 16 34 17 Z" fill="url(#blade)" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 9 22 C 12 13 22 8 31 9" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" opacity="0.9"/>
    <path d="M 7 32 C 9 24 18 19 31 18.5" fill="none" stroke="#2c6ab0" stroke-width="1.5" stroke-linecap="round"/>
    <!-- socket and mana orb -->
    <path d="M 28 9 L 37 9 L 37 18 L 28 18 Z" fill="#8e9bb0" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="32.5" cy="13.5" r="3.6" fill="#7fd3ff" stroke="#1a1d24" stroke-width="1.8"/>
    <circle cx="31.5" cy="12.5" r="1.1" fill="#ffffff"/>
  </g>
  <path d="M 52 12 L 53.4 15.6 L 57 17 L 53.4 18.4 L 52 22 L 50.6 18.4 L 47 17 L 50.6 15.6 Z" fill="#d6f2ff"/>
  <path d="M 14 50 L 14.9 52.1 L 17 53 L 14.9 53.9 L 14 56 L 13.1 53.9 L 11 53 L 13.1 52.1 Z" fill="#8ad4ff"/>
</svg>

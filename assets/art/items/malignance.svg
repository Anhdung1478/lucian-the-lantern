<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64">
  <!-- Malignance (legendary): a dark demon mask with magenta horns, a flame crown and glowing slanted eyes. -->
  <defs>
    <radialGradient id="aura" cx="32" cy="32" r="31" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff4fb0" stop-opacity="0.5"/>
      <stop offset="0.6" stop-color="#a02a80" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#a02a80" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mask" x1="12" y1="14" x2="52" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7a5a9e"/>
      <stop offset="0.5" stop-color="#43285f"/>
      <stop offset="1" stop-color="#1f0f36"/>
    </linearGradient>
    <linearGradient id="horn" x1="4" y1="2" x2="22" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff8cc4"/>
      <stop offset="0.5" stop-color="#e03088"/>
      <stop offset="1" stop-color="#90185c"/>
    </linearGradient>
    <linearGradient id="flame" x1="32" y1="1" x2="32" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd36b"/>
      <stop offset="0.5" stop-color="#ff6aa8"/>
      <stop offset="1" stop-color="#d02a80"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#aura)"/>
  <g stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round">
    <path d="M 15 20 C 6 17 2 9 6 2 C 13 5 19 9 24 15 Z" fill="url(#horn)"/>
    <path d="M 49 20 C 58 17 62 9 58 2 C 51 5 45 9 40 15 Z" fill="#b82474"/>
    <path d="M 23 16 C 25 8 29 9 32 1 C 35 9 39 8 41 16 Z" fill="url(#flame)"/>
    <path d="M 13 17 C 22 12 42 12 51 17 L 53 35 C 51 47 41 57 32 62 C 23 57 13 47 11 35 Z" fill="url(#mask)"/>
  </g>
  <!-- crack and brow -->
  <path d="M 32 15 L 30 24 L 33 30 L 31 37" fill="none" stroke="#ff6aa8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 16 23 L 27 27 M 48 23 L 37 27" fill="none" stroke="#2a1244" stroke-width="2" stroke-linecap="round"/>
  <!-- eyes -->
  <path d="M 16 29 L 28 32 L 26 37.5 L 17.5 35 Z" fill="#ff8cd0" stroke="#fff0fa" stroke-width="0.9" stroke-linejoin="round"/>
  <path d="M 48 29 L 36 32 L 38 37.5 L 46.5 35 Z" fill="#ff8cd0" stroke="#fff0fa" stroke-width="0.9" stroke-linejoin="round"/>
  <!-- mouth slit -->
  <path d="M 24 48 L 32 53 L 40 48" fill="none" stroke="#ff6aa8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 15 24 C 14 33 16 40 20 46" fill="none" stroke="#b894e0" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <!-- sparkles -->
  <path d="M 55 38 L 56 40.6 L 58.6 41.6 L 56 42.6 L 55 45.2 L 54 42.6 L 51.4 41.6 L 54 40.6 Z" fill="#ffd6ee"/>
  <path d="M 8 44 L 8.9 46.1 L 11 47 L 8.9 47.9 L 8 50 L 7.1 47.9 L 5 47 L 7.1 46.1 Z" fill="#ff9acb"/>
</svg>

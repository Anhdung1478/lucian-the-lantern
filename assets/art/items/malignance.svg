<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64">
  <!-- Malignance: Sinister corrupted Void-iron plague mask / arcane visage in obsidian & cracked magenta-violet filigree with burning violet eye fissures and dark hatefog wisps -->
  <defs>
    <radialGradient id="aura" cx="32" cy="32" r="31" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c94dff" stop-opacity="0.52"/>
      <stop offset="0.58" stop-color="#6b188f" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#2c0842" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="obsidian" x1="16" y1="10" x2="48" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5a4978"/>
      <stop offset="0.38" stop-color="#291d3d"/>
      <stop offset="0.75" stop-color="#140d21"/>
      <stop offset="1" stop-color="#090512"/>
    </linearGradient>
    <linearGradient id="crownIron" x1="14" y1="4" x2="50" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7c689e"/>
      <stop offset="0.5" stop-color="#35254d"/>
      <stop offset="1" stop-color="#140c21"/>
    </linearGradient>
    <linearGradient id="voidFire" x1="32" y1="6" x2="32" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd4ff"/>
      <stop offset="0.45" stop-color="#e345ff"/>
      <stop offset="1" stop-color="#8b14c9"/>
    </linearGradient>
    <linearGradient id="fog" x1="6" y1="54" x2="58" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#300d4a" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#7c1fb0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d44dff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#aura)"/>

  <!-- Dark swirling Hatefog Wisps curling behind the mask -->
  <path d="M 18 52 C 7 49 4 38 10 29 C 12 36 16 39 21 38 Z" fill="url(#fog)"/>
  <path d="M 46 52 C 57 48 60 36 53 26 C 52 33 48 38 43 39 Z" fill="url(#fog)"/>
  <path d="M 10 56 C 18 54 22 48 25 43 M 54 55 C 46 53 42 47 39 42" fill="none" stroke="#9929d6" stroke-width="2.2" stroke-linecap="round" opacity="0.65"/>

  <!-- Jagged Gothic Void-Iron Crown Spires (sinister angular silhouette) -->
  <path d="M 21 21 L 13 6 L 26 15 Z" fill="url(#crownIron)" stroke="#120c1a" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M 43 21 L 51 6 L 38 15 Z" fill="#231736" stroke="#120c1a" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M 27 16 L 32 3 L 37 16 Z" fill="url(#crownIron)" stroke="#120c1a" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Outer flared jaw-barbs -->
  <path d="M 15 31 L 9 23 L 18 25 Z M 49 31 L 55 23 L 46 25 Z" fill="#3a2854" stroke="#120c1a" stroke-width="2" stroke-linejoin="round"/>

  <!-- Elongated Corrupted Obsidian Plague-Visage / Arcane Mask -->
  <path d="M 32 11 L 46 19 L 49 33 L 42 48 L 32 61 L 22 48 L 15 33 L 18 19 Z" fill="url(#obsidian)" stroke="#120c1a" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- Lit left obsidian bevel facet -->
  <path d="M 32 13 L 19.5 20.5 L 17 33 L 23.5 47 L 32 58.5 Z" fill="#635085" opacity="0.34"/>
  <!-- Central pointed plague-beak / vented lower jaw ridge -->
  <path d="M 32 33 L 39 43 L 32 59.5 L 25 43 Z" fill="#170f26" stroke="#120c1a" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M 32 34 L 32 58" stroke="#8570ab" stroke-width="1.2" opacity="0.7"/>

  <!-- Cracked Magenta-Violet Void Fissures & Arcane Filigree -->
  <path d="M 32 12 L 30.2 21 L 33.4 26 L 31.6 32" fill="none" stroke="url(#voidFire)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 31 19 L 25 22 M 33 25 L 39 22" fill="none" stroke="#d44dff" stroke-width="1.3" stroke-linecap="round"/>
  <!-- Vented plague-jaw glowing slits -->
  <path d="M 27.2 46 L 29.8 48.2 M 28.4 50.5 L 30.4 52.4 M 36.8 46 L 34.2 48.2 M 35.6 50.5 L 33.6 52.4" stroke="#e345ff" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Burning Violet Eye Fissures -->
  <path d="M 18.5 27.5 L 29 31.5 L 26.8 35.5 L 19.5 32.5 Z" fill="#cf38ff" stroke="#120c1a" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M 45.5 27.5 L 35 31.5 L 37.2 35.5 L 44.5 32.5 Z" fill="#cf38ff" stroke="#120c1a" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M 20.5 29.6 L 27.6 32.8 M 43.5 29.6 L 36.4 32.8" stroke="#fff0ff" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Cold obsidian edge rim highlights -->
  <path d="M 15.8 10.5 L 20.5 18.5 M 19.5 21 L 17.4 32 M 23.2 46.5 L 29.5 55.5" fill="none" stroke="#a692cc" stroke-width="1.4" stroke-linecap="round" opacity="0.82"/>

  <!-- Corrupted Void sparkles -->
  <path d="M 55 44 L 56 46.4 L 58.4 47.4 L 56 48.4 L 55 50.8 L 54 48.4 L 51.6 47.4 L 54 46.4 Z" fill="#f2b8ff"/>
  <path d="M 8 43 L 8.9 45.1 L 11 46 L 8.9 46.9 L 8 49 L 7.1 46.9 L 5 46 L 7.1 45.1 Z" fill="#d45eff"/>
</svg>

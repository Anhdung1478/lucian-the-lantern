    <linearGradient id="leather" x1="18" y1="52" x2="46" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b9793f"/>
      <stop offset="0.5" stop-color="#8a5327"/>
      <stop offset="1" stop-color="#5d3516"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#aura)"/>
  <path d="M 19 5 L 26 5 C 28 11 36 11 38 5 L 45 5 L 59 14 L 53 29 L 46 26 L 46 58 L 18 58 L 18 26 L 11 29 L 5 14 Z" fill="url(#mail)" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>

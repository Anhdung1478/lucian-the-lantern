  <path d="M 20 20 q 2 2.6 4 0 t 4 0 t 4 0 t 4 0 t 4 0 t 4 0 M 20 27 q 2 2.6 4 0 t 4 0 t 4 0 t 4 0 t 4 0 t 4 0 M 20 34 q 2 2.6 4 0 t 4 0 t 4 0 t 4 0 t 4 0 t 4 0 M 20 41 q 2 2.6 4 0 t 4 0 t 4 0 t 4 0 t 4 0 t 4 0 M 20 48 q 2 2.6 4 0 t 4 0 t 4 0 t 4 0 t 4 0 t 4 0" fill="none" stroke="#6b7689" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 9 16 q 2 2.6 4 0 t 4 0 M 47 16 q 2 2.6 4 0 t 4 0 M 11 22 q 2 2.6 4 0 t 3 0 M 46 22 q 2 2.6 4 0 t 3 0" fill="none" stroke="#6b7689" stroke-width="1.5" stroke-linecap="round"/>
  <!-- neck opening -->
  <path d="M 26 5 C 28 11 36 11 38 5 L 36 5 C 34 8 30 8 28 5 Z" fill="#3b4354" stroke="#1a1d24" stroke-width="1.5" stroke-linejoin="round"/>

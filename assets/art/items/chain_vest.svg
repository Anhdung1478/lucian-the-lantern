<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64">
  <!-- Chain Vest (fragment): a plain steel chainmail shirt with a leather hem, facing the viewer. -->
  <defs>
    <radialGradient id="aura" cx="32" cy="32" r="31" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9fb0c6" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#9fb0c6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mail" x1="8" y1="6" x2="54" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f4f7fb"/>
      <stop offset="0.5" stop-color="#b9c4d4"/>

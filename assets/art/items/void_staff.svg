<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64">
  <!-- Void Staff (legendary): a dark iron staff whose claw holds a swirling black-violet void orb with a magenta rim, on the diagonal. -->
  <defs>
    <radialGradient id="aura" cx="32" cy="32" r="31" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d04af0" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#7a2fb0" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7a2fb0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="iron" x1="26" y1="0" x2="38" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8a8fb0"/>
      <stop offset="0.5" stop-color="#4a4a6c"/>
      <stop offset="1" stop-color="#25253c"/>
    </linearGradient>
    <radialGradient id="orb" cx="30" cy="12" r="12" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8a2ab0"/>
      <stop offset="0.55" stop-color="#2a0f48"/>
      <stop offset="1" stop-color="#0e0420"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#aura)"/>
  <g transform="rotate(45 32 32)" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round">
    <path d="M 29.5 28 L 34.5 28 L 34.5 56 L 29.5 56 Z" fill="url(#iron)"/>
    <path d="M 30.8 32 L 30.8 52" fill="none" stroke="#c0c4e0" stroke-width="1.4" stroke-linecap="round" opacity="0.85"/>
    <path d="M 29.5 40 L 34.5 40 M 29.5 47 L 34.5 47" fill="none" stroke="#25253c" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 28 55 L 36 55 L 32 63 Z" fill="url(#iron)"/>
    <!-- claw -->
    <path d="M 32 33 C 12 33 11 11 19 0 C 17 13 24 24 32 24 C 40 24 47 13 45 0 C 53 11 52 33 32 33 Z" fill="url(#iron)"/>
    <!-- orb -->
    <circle cx="32" cy="13" r="11" fill="url(#orb)" stroke="#d84ae8" stroke-width="2"/>
    <path d="M 32 5 C 40 6 41 14 35 15 C 30 16 29 11 32 10.5" fill="none" stroke="#f0a0ff" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 25 10 C 26 7 28 5.8 30.5 5.2" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>
  </g>
  <!-- sparkles -->
  <path d="M 55 14 L 56.1 17 L 59.1 18.1 L 56.1 19.2 L 55 22.2 L 53.9 19.2 L 50.9 18.1 L 53.9 17 Z" fill="#f6d8ff"/>
  <path d="M 10 46 L 10.9 48.1 L 13 49 L 10.9 49.9 L 10 52 L 9.1 49.9 L 7 49 L 9.1 48.1 Z" fill="#e090f5"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64">
  <!-- Death's Dance: a curved dark-steel sabre with a glowing crimson edge, a gold guard and a long red ribbon streaming from the pommel -->
  <defs>
    <radialGradient id="aura" cx="32" cy="32" r="31" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d03050" stop-opacity="0.5"/>
      <stop offset="0.6" stop-color="#7a1a3a" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7a1a3a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blade" x1="26" y1="0" x2="50" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d6dbe6"/>
      <stop offset="0.5" stop-color="#8a92a8"/>
      <stop offset="1" stop-color="#4a5066"/>
    </linearGradient>
    <linearGradient id="gold" x1="18" y1="0" x2="46" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe7a3"/>
      <stop offset="0.5" stop-color="#e2a93b"/>
      <stop offset="1" stop-color="#a8641a"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#aura)"/>
  <!-- ribbon behind everything -->
  <path d="M 24 52 C 12 50 6 56 8 62 C 12 58 16 58 22 60 C 14 56 14 52 24 54 Z" fill="#d02a42" stroke="#1a1d24" stroke-width="2" stroke-linejoin="round"/>
  <g transform="rotate(45 32 32)">
    <path d="M 29 1 C 53 11 52 34 43 42 L 28 42 C 38 32 40 14 29 1 Z" fill="url(#blade)" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 29 1 C 40 14 38 32 28 42 L 32.5 42 C 42.5 32 44 14 29 1 Z" fill="#e0364e"/>
    <path d="M 31.5 6.5 C 39.5 17 38.5 31 31.5 40" fill="none" stroke="#ff9aa8" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M 40 12 C 47 20 46 32 41 38" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
    <!-- guard -->
    <path d="M 18 41 L 46 41 L 44 47 L 20 47 Z" fill="url(#gold)" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 21 43.2 L 43 43.2" stroke="#fff4d0" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 29 47 L 35 47 L 34.5 56 L 29.5 56 Z" fill="#4a1a2a" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 29.6 50 L 34.6 49 M 29.7 53.5 L 34.5 52.5" stroke="#2a0e18" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="32" cy="59" r="3.6" fill="#e2a93b" stroke="#1a1d24" stroke-width="2.5"/>
    <circle cx="31" cy="58" r="1.1" fill="#ffe7a3"/>
  </g>
  <path d="M 52 8 L 53.4 11.6 L 57 13 L 53.4 14.4 L 52 18 L 50.6 14.4 L 47 13 L 50.6 11.6 Z" fill="#ffc2cd"/>
  <path d="M 8 28 L 8.9 30.1 L 11 31 L 8.9 31.9 L 8 34 L 7.1 31.9 L 5 31 L 7.1 30.1 Z" fill="#ff8aa0"/>
</svg>

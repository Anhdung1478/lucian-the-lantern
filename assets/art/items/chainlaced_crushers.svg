<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64">
  <!-- Chainlaced Crushers: the treaded violet boot made heavy, side-on, toe to the right: bound in two thick steel chains with a loose end dangling at the back, the warding ring now glowing magenta, a gold collar set with a magenta stone, a gold-rimmed midsole on bigger tread lugs, violet sparkles -->
  <defs>
    <radialGradient id="aura" cx="32" cy="32" r="31" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d08cff" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#7a3ad0" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7a3ad0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leather" x1="14" y1="10" x2="54" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a284e8"/>
      <stop offset="0.5" stop-color="#6446b8"/>
      <stop offset="1" stop-color="#36226e"/>
    </linearGradient>
    <linearGradient id="ring" x1="20" y1="22" x2="34" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f4f7fb"/>
      <stop offset="0.5" stop-color="#b9c4d4"/>
      <stop offset="1" stop-color="#7c8799"/>
    </linearGradient>
    <linearGradient id="rune" x1="23" y1="25" x2="31" y2="33" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffb4ea"/>
      <stop offset="0.5" stop-color="#e64ab8"/>
      <stop offset="1" stop-color="#8a1a6a"/>
    </linearGradient>
    <radialGradient id="glow" cx="26.4" cy="29.6" r="9" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd0f2" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ff4ad0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="10" y1="4" x2="60" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe7a3"/>
      <stop offset="0.5" stop-color="#e2a93b"/>
      <stop offset="1" stop-color="#a8641a"/>
    </linearGradient>
    <linearGradient id="tread" x1="10" y1="44" x2="40" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7a7090"/>
      <stop offset="0.5" stop-color="#504662"/>
      <stop offset="1" stop-color="#2e2838"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#aura)"/>
  <g transform="translate(-3.6 0)">
  <!-- the loose chain end dangling at the back -->
  <g fill="none" stroke-linecap="round">
    <g stroke="#1a1d24" stroke-width="3.8"><ellipse cx="12.6" cy="24.4" rx="1.9" ry="3.1" transform="rotate(20 12.6 24.4)"/><path d="M 11.2 28.4 L 10.2 31.6"/><ellipse cx="9.6" cy="35" rx="1.9" ry="3.1" transform="rotate(12 9.6 35)"/></g>
    <g stroke="#c9d2de" stroke-width="2"><ellipse cx="12.6" cy="24.4" rx="1.9" ry="3.1" transform="rotate(20 12.6 24.4)"/><path d="M 11.2 28.4 L 10.2 31.6"/><ellipse cx="9.6" cy="35" rx="1.9" ry="3.1" transform="rotate(12 9.6 35)"/></g>
  </g>
  <!-- tread lugs -->
  <g fill="url(#tread)" stroke="#1a1d24" stroke-width="2.2" stroke-linejoin="round">
    <path d="M 10.4 50 L 17.6 50 L 17.2 57.6 C 17.2 58.4 16.6 59 15.8 59 L 11.8 59 C 11 59 10.4 58.4 10.4 57.6 Z"/>
    <path d="M 20 50 L 27 50 L 26.8 57.6 C 26.8 58.4 26.2 59 25.4 59 L 21.4 59 C 20.6 59 20 58.4 20 57.6 Z"/>
    <path d="M 29.4 50 L 36.4 50 L 36.2 57.6 C 36.2 58.4 35.6 59 34.8 59 L 30.8 59 C 30 59 29.4 58.4 29.4 57.6 Z"/>
    <path d="M 38.8 50 L 45.8 50 L 45.6 57.6 C 45.6 58.4 45 59 44.2 59 L 40.2 59 C 39.4 59 38.8 58.4 38.8 57.6 Z"/>
    <path d="M 48.2 50 L 55.2 50 L 55 57.6 C 55 58.4 54.4 59 53.6 59 L 49.6 59 C 48.8 59 48.2 58.4 48.2 57.6 Z"/>
    <path d="M 57.6 49.6 L 62.8 49.6 C 63.6 52.2 62.6 56 60.2 57.2 L 58 57.4 Z"/>
  </g>
  <!-- the chunky boot -->
  <path d="M 16.6 11.5 L 38.4 11.5 C 38.8 18 39.4 23.6 41 28 C 46 30.2 52.4 31.4 57 34.4 C 61.4 37.2 62.8 41.6 61.8 45.8 L 12.4 45.8 C 11 41.6 11.8 36.8 14.6 33.4 C 16.6 28.8 17 21 16.6 11.5 Z" fill="url(#leather)" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 46.6 31 C 50.4 34.4 51.4 40 50.4 45.4" fill="none" stroke="#2a1858" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 42.6 30.2 C 47.4 31.8 52.6 32.8 56.6 35.6" fill="none" stroke="#d6c6ff" stroke-width="1.5" stroke-linecap="round"/>
  <!-- the warding ring, glowing -->
  <circle cx="26.4" cy="29.6" r="6.8" fill="url(#ring)" stroke="#1a1d24" stroke-width="2.5"/>
  <circle cx="26.4" cy="29.6" r="4.2" fill="url(#rune)" stroke="#1a1d24" stroke-width="1.8"/>
  <circle cx="26.4" cy="29.6" r="9" fill="url(#glow)"/>
  <path d="M 26.4 26.8 L 28.3 29.6 L 26.4 32.4 L 24.5 29.6 Z" fill="#ffffff"/>
  <path d="M 21.4 26.4 C 22.4 24.6 23.8 23.6 25.6 23.2" fill="none" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round"/>
  <!-- two chains around the shaft -->
  <g fill="none" stroke-linecap="round">
    <g transform="rotate(8 28 19.6)" stroke="#1a1d24" stroke-width="3.8"><ellipse cx="18.6" cy="19.6" rx="3.2" ry="2"/><path d="M 21.8 19.6 L 25.2 19.6"/><ellipse cx="28.4" cy="19.6" rx="3.2" ry="2"/><path d="M 31.6 19.6 L 35 19.6"/><ellipse cx="38.2" cy="19.6" rx="3.2" ry="2"/></g>
    <g transform="rotate(8 28 19.6)" stroke="#c9d2de" stroke-width="2"><ellipse cx="18.6" cy="19.6" rx="3.2" ry="2"/><path d="M 21.8 19.6 L 25.2 19.6"/><ellipse cx="28.4" cy="19.6" rx="3.2" ry="2"/><path d="M 31.6 19.6 L 35 19.6"/><ellipse cx="38.2" cy="19.6" rx="3.2" ry="2"/></g>
    <g transform="rotate(-6 30 40.6)" stroke="#1a1d24" stroke-width="3.8"><ellipse cx="16.6" cy="40.6" rx="3.2" ry="2"/><path d="M 19.8 40.6 L 23.2 40.6"/><ellipse cx="26.4" cy="40.6" rx="3.2" ry="2"/><path d="M 29.6 40.6 L 33 40.6"/><ellipse cx="36.2" cy="40.6" rx="3.2" ry="2"/><path d="M 39.4 40.6 L 42.8 40.6"/><ellipse cx="46" cy="40.6" rx="3.2" ry="2"/></g>
    <g transform="rotate(-6 30 40.6)" stroke="#c9d2de" stroke-width="2"><ellipse cx="16.6" cy="40.6" rx="3.2" ry="2"/><path d="M 19.8 40.6 L 23.2 40.6"/><ellipse cx="26.4" cy="40.6" rx="3.2" ry="2"/><path d="M 29.6 40.6 L 33 40.6"/><ellipse cx="36.2" cy="40.6" rx="3.2" ry="2"/><path d="M 39.4 40.6 L 42.8 40.6"/><ellipse cx="46" cy="40.6" rx="3.2" ry="2"/></g>
    <g transform="rotate(8 28 19.6)" stroke="#ffffff" stroke-width="1"><path d="M 16.4 18.4 C 17.2 17.9 18.2 17.8 19 17.9 M 26.2 18.4 C 27 17.9 28 17.8 28.8 17.9 M 36 18.4 C 36.8 17.9 37.8 17.8 38.6 17.9"/></g>
    <g transform="rotate(-6 30 40.6)" stroke="#ffffff" stroke-width="1"><path d="M 14.4 39.4 C 15.2 38.9 16.2 38.8 17 38.9 M 24.2 39.4 C 25 38.9 26 38.8 26.8 38.9 M 34 39.4 C 34.8 38.9 35.8 38.8 36.6 38.9 M 43.8 39.4 C 44.6 38.9 45.6 38.8 46.4 38.9"/></g>
  </g>
  <!-- gold collar with a magenta stone -->
  <path d="M 15 6.4 C 22 5.2 32 5.2 39.8 6.4 L 40.2 14 L 15 14 Z" fill="url(#gold)" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 16.6 8.6 C 20 8 23 7.8 24.4 7.8" fill="none" stroke="#fff4d0" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M 16.8 12 L 38.6 12" stroke="#a8641a" stroke-width="1.3" stroke-linecap="round"/>
  <circle cx="30.4" cy="9.8" r="2.6" fill="url(#rune)" stroke="#1a1d24" stroke-width="1.6"/>
  <circle cx="29.7" cy="9.1" r="0.8" fill="#ffffff"/>
  <!-- gold-rimmed midsole -->
  <path d="M 10 44.8 L 58.8 44.8 C 62.8 44.8 64.2 47 63.8 49.2 C 63.4 50.8 62 51.6 60.2 51.6 L 10 51.6 Z" fill="#4e4462" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 11.8 47 L 59.4 47" stroke="url(#gold)" stroke-width="2" stroke-linecap="round"/>
  <!-- sparkles -->
  <path d="M 52 9 L 53.4 12.6 L 57 14 L 53.4 15.4 L 52 19 L 50.6 15.4 L 47 14 L 50.6 12.6 Z" fill="#f4e0ff"/>
  <path d="M 59 22 L 59.8 24.2 L 62 25 L 59.8 25.8 L 59 28 L 58.2 25.8 L 56 25 L 58.2 24.2 Z" fill="#e0a0ff"/>
  <circle cx="7" cy="16" r="1.2" fill="#e0a0ff"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64">
  <!-- Needlessly Large Rod (fragment): a thick dark-wood rod on the diagonal with gold bands and a gold pommel, carrying a far too big violet orb in a gold claw cup at the top right. -->
  <defs>
    <radialGradient id="aura" cx="32" cy="32" r="31" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9c7cff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#9c7cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wood" x1="27" y1="0" x2="37" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8a5a34"/>
      <stop offset="0.5" stop-color="#6b3f24"/>
      <stop offset="1" stop-color="#3a2214"/>
    </linearGradient>
    <linearGradient id="gold" x1="25" y1="0" x2="39" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe7a3"/>
      <stop offset="0.5" stop-color="#e2a93b"/>
      <stop offset="1" stop-color="#a8641a"/>
    </linearGradient>
    <linearGradient id="cup" x1="16" y1="0" x2="48" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe7a3"/>
      <stop offset="0.5" stop-color="#e2a93b"/>
      <stop offset="1" stop-color="#a8641a"/>
    </linearGradient>
    <radialGradient id="orb" cx="40" cy="13" r="22" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f1eaff"/>
      <stop offset="0.28" stop-color="#b39aff"/>
      <stop offset="0.68" stop-color="#6a45d6"/>
      <stop offset="1" stop-color="#2e1a7e"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#aura)"/>
  <!-- the rod, drawn upright and turned onto the diagonal -->
  <g transform="rotate(45 32 32)" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round">
    <path d="M 27.5 31 L 36.5 31 L 36.5 62 L 27.5 62 Z" fill="url(#wood)"/>
    <path d="M 29.6 35 L 29.6 59" fill="none" stroke="#b07a4a" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M 34.2 36 L 34.2 49" fill="none" stroke="#3a2214" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 26 39 L 38 39 L 38 44.5 L 26 44.5 Z" fill="url(#gold)"/>
    <path d="M 26 50.5 L 38 50.5 L 38 56 L 26 56 Z" fill="url(#gold)"/>
    <path d="M 28 40.6 L 31 40.6 M 28 52.1 L 31 52.1" fill="none" stroke="#fff3c9" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="32" cy="65" r="4.6" fill="url(#gold)"/>
    <path d="M 26.5 29.5 L 37.5 29.5 L 36.5 35 L 27.5 35 Z" fill="url(#gold)"/>
  </g>
  <!-- the orb -->
  <circle cx="45" cy="19" r="14" fill="url(#orb)" stroke="#1a1d24" stroke-width="2.5"/>
  <!-- gold claw cup gripping the orb from below -->
  <g transform="rotate(45 32 32)">
    <path d="M 16.56 12.25 L 15.56 19.59 A 17.5 17.5 0 0 0 48.44 19.59 L 47.44 12.25 L 43.42 18.92 A 12.6 12.6 0 0 1 20.58 18.92 Z" fill="url(#cup)" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 19 21.1 A 15 15 0 0 0 29.4 28.37" fill="none" stroke="#fff3c9" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <!-- shine on the glass -->
  <ellipse cx="40.5" cy="12.5" rx="5" ry="3" fill="#ffffff" opacity="0.9" transform="rotate(-38 40.5 12.5)"/>
  <circle cx="49.5" cy="9.5" r="1.3" fill="#ffffff" opacity="0.8"/>
</svg>

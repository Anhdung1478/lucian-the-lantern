<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64">
  <!-- Kaenic Rookern: Commanding runic silver-and-obsidian fortress helm / carved rook-crest ward glowing with deep amethyst anti-magic barrier runes -->
  <defs>
    <radialGradient id="aura" cx="32" cy="32" r="31" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a566ff" stop-opacity="0.55"/>
      <stop offset="0.58" stop-color="#5826b8" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#281066" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="obsidian" x1="20" y1="12" x2="44" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#485168"/>
      <stop offset="0.45" stop-color="#222736"/>
      <stop offset="1" stop-color="#0f121b"/>
    </linearGradient>
    <linearGradient id="silverPlate" x1="10" y1="8" x2="54" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f5f8ff"/>
      <stop offset="0.42" stop-color="#b4c0d6"/>
      <stop offset="0.78" stop-color="#66738c"/>
      <stop offset="1" stop-color="#363e52"/>
    </linearGradient>
    <linearGradient id="amethyst" x1="32" y1="22" x2="32" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f7ebff"/>
      <stop offset="0.42" stop-color="#bd78ff"/>
      <stop offset="1" stop-color="#6220cf"/>
    </linearGradient>
    <radialGradient id="runeGlow" cx="32" cy="35" r="15" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d29eff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#6c28d9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#aura)"/>

  <!-- Subtle hexagonal anti-magic barrier ward ring -->
  <polygon points="32,4 56,18 56,46 32,60 8,46 8,18" fill="none" stroke="#9f66ff" stroke-width="1.6" stroke-dasharray="10 6" opacity="0.65"/>

  <!-- Commanding Fortress Helm / Carved Rook-Crest Core Body (Obsidian) -->
  <path d="M 14 7 L 23 7 L 23 14 L 27.5 14 L 27.5 6 L 36.5 6 L 36.5 14 L 41 14 L 41 7 L 50 7 L 50 22 L 47 47 L 32 59 L 17 47 L 14 22 Z" fill="url(#obsidian)" stroke="#1a1d24" stroke-width="2.4" stroke-linejoin="round"/>

  <!-- Sculpted Silver-Steel Fortress Buttress Cheek-Plates & Crown Battlements -->
  <!-- Left silver bastion merlon & cheek wing -->
  <path d="M 14 7 L 23 7 L 23 18 L 26 24 L 25 46 L 19 49 L 14 22 Z" fill="url(#silverPlate)" stroke="#1a1d24" stroke-width="2.1" stroke-linejoin="round"/>
  <!-- Right silver bastion merlon & cheek wing -->
  <path d="M 50 7 L 41 7 L 41 18 L 38 24 L 39 46 L 45 49 L 50 22 Z" fill="#68758f" stroke="#1a1d24" stroke-width="2.1" stroke-linejoin="round"/>
  <!-- Center armored brow keystone -->
  <path d="M 27.5 6 L 36.5 6 L 36.5 19 L 32 23.5 L 27.5 19 Z" fill="url(#silverPlate)" stroke="#1a1d24" stroke-width="2.1" stroke-linejoin="round"/>
  <!-- Heavy forged bastion chin/gorget base -->
  <path d="M 16 46 L 25 46 L 32 52 L 39 46 L 48 46 L 45 53 L 32 60 L 19 53 Z" fill="url(#silverPlate)" stroke="#1a1d24" stroke-width="2.1" stroke-linejoin="round"/>

  <!-- Amethyst Anti-Magic Barrier Rune Glow & Carved Runic Sigil -->
  <circle cx="32" cy="35" r="15" fill="url(#runeGlow)"/>
  <!-- Central glowing amethyst diamond ward rune -->
  <path d="M 32 24.5 L 39 35 L 32 46.5 L 25 35 Z" fill="url(#amethyst)" stroke="#1a1d24" stroke-width="2" stroke-linejoin="round"/>
  <path d="M 32 28.5 L 35.6 35 L 32 42 L 28.4 35 Z" fill="#f7eeff"/>
  <!-- Glowing etched side-ward rune brackets -->
  <path d="M 21 27 L 23 30 L 23 40 L 21 43 M 43 27 L 41 30 L 41 40 L 43 43" fill="none" stroke="#c78cff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Crown rune slit -->
  <path d="M 32 9.5 L 32 17.5" stroke="#c78cff" stroke-width="2" stroke-linecap="round"/>
  <path d="M 32 10.5 L 32 16.5" stroke="#f7eeff" stroke-width="0.9" stroke-linecap="round"/>

  <!-- Crisp metallic silver specular edge highlights -->
  <path d="M 16.8 10 L 16.8 21 L 20.5 44 M 29.8 8.5 L 29.8 18" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>
  <path d="M 20 50.5 L 30.5 56.5" fill="none" stroke="#eef4ff" stroke-width="1.4" stroke-linecap="round" opacity="0.85"/>

  <!-- Amethyst ward sparkles -->
  <path d="M 56 26 L 57 28.4 L 59.4 29.4 L 57 30.4 L 56 32.8 L 55 30.4 L 52.6 29.4 L 55 28.4 Z" fill="#f0d9ff"/>
  <path d="M 8 34 L 8.9 36.1 L 11 37 L 8.9 37.9 L 8 40 L 7.1 37.9 L 5 37 L 7.1 36.1 Z" fill="#c080ff"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64">
  <!-- Fimbulwinter (legendary): a cluster of frost crystals, a tall central one with a glowing pale core, two small ones beside it. -->
  <defs>
    <radialGradient id="aura" cx="32" cy="32" r="31" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7fd6ff" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#2f8fd0" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2f8fd0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ice" x1="10" y1="4" x2="54" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f2fcff"/>
      <stop offset="0.5" stop-color="#9edcff"/>
      <stop offset="1" stop-color="#3f86cc"/>
    </linearGradient>
    <linearGradient id="icedark" x1="10" y1="20" x2="54" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b7e6ff"/>
      <stop offset="1" stop-color="#2f6fb5"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#aura)"/>
  <g stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round">
    <path d="M 4 36 L 13 24 L 23 35 L 23 55 L 12 60 L 4 52 Z" fill="url(#icedark)"/>
    <path d="M 60 38 L 51 26 L 41 37 L 41 55 L 52 60 L 60 52 Z" fill="url(#icedark)"/>
    <path d="M 32 2 L 43 14 L 43 46 L 32 61 L 21 46 L 21 14 Z" fill="url(#ice)"/>
  </g>
  <!-- shade half of the central crystal -->
  <path d="M 32 4 L 42 15 L 42 46 L 32 59 Z" fill="#2f6fb5" opacity="0.4"/>
  <path d="M 32 4 L 32 59 M 21 14 L 32 24 L 43 14" fill="none" stroke="#3c7fc2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 13 26 L 13 56 M 51 28 L 51 56" fill="none" stroke="#3c7fc2" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  <!-- glowing core -->
  <path d="M 32 28 L 36.5 37 L 32 46 L 27.5 37 Z" fill="#f4feff" stroke="#8fe0ff" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- highlights -->
  <path d="M 25 18 L 25 40" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  <path d="M 8 38 L 8 48" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/>
  <!-- sparkles -->
  <path d="M 53 8 L 54.2 11.3 L 57.5 12.5 L 54.2 13.7 L 53 17 L 51.8 13.7 L 48.5 12.5 L 51.8 11.3 Z" fill="#f4feff"/>
  <path d="M 10 12 L 10.9 14.1 L 13 15 L 10.9 15.9 L 10 18 L 9.1 15.9 L 7 15 L 9.1 14.1 Z" fill="#b7e6ff"/>
</svg>

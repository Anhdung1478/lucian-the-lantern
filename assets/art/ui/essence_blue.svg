<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64">
  <!-- Blue Essence V2.2: Luminous Sentinel Sapphire crystal shard with sculpted facets and azure motes -->
  <defs>
    <radialGradient id="aura" cx="32" cy="32" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#66c2ff" stop-opacity="0.62"/>
      <stop offset="0.52" stop-color="#2c7be5" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#1a4ca8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1="18" y1="6" x2="46" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e3f7ff"/>
      <stop offset="0.32" stop-color="#6cc3ff"/>
      <stop offset="0.72" stop-color="#2670d8"/>
      <stop offset="1" stop-color="#123278"/>
    </linearGradient>
    <linearGradient id="leftFacet" x1="20" y1="10" x2="32" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="0.5" stop-color="#9ee0ff" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#3688e8" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="rightFacet" x1="32" y1="12" x2="46" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4ba2ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0d2259" stop-opacity="0.88"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="32" cy="29" r="14" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#9ee7ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3a9bff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="29" fill="url(#aura)"/>
  <!-- subtle orbiting azure motes -->
  <circle cx="14" cy="22" r="2" fill="#b3ecff" opacity="0.85"/>
  <circle cx="51" cy="41" r="1.8" fill="#8ad8ff" opacity="0.8"/>
  <circle cx="48" cy="15" r="1.4" fill="#ffffff" opacity="0.75"/>
  <g transform="rotate(10 32 32)">
    <!-- outer sculpted crystal silhouette -->
    <polygon points="32,3 44,18 46,35 39,51 32,61 25,51 18,35 20,18" fill="url(#bodyGrad)" stroke="#0e1b33" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- dark right shadow facets -->
    <polygon points="32,3 44,18 32,27" fill="#73caff" opacity="0.55"/>
    <polygon points="32,27 44,18 46,35 37,43" fill="url(#rightFacet)"/>
    <polygon points="32,61 39,51 46,35 37,43 32,48" fill="#0d2154" opacity="0.82"/>
    <!-- bright left lit facets -->
    <polygon points="32,3 20,18 32,27" fill="#f0fbff" opacity="0.9"/>
    <polygon points="20,18 18,35 27,43 32,27" fill="url(#leftFacet)"/>
    <polygon points="18,35 25,51 32,61 32,48 27,43" fill="#1e59ba" opacity="0.75"/>
    <!-- central floating inner crystal prism -->
    <polygon points="32,12 38,24 36,44 32,52 28,44 26,24" fill="url(#coreGlow)"/>
    <polygon points="32,14 27.5,25 29,43 32,49" fill="#ffffff" opacity="0.72"/>
    <!-- crisp internal facet ridges -->
    <path d="M 32 4 L 32 60 M 20 18 L 32 27 L 44 18 M 18 35 L 27 43 L 32 48 L 37 43 L 46 35" fill="none" stroke="#c8f2ff" stroke-width="1.15" stroke-linejoin="round" opacity="0.65"/>
    <!-- specular gleam -->
    <path d="M 24.5 18 L 28.5 11.5" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" opacity="0.92"/>
    <path d="M 22.5 26 L 23.5 34" stroke="#e8faff" stroke-width="1.6" stroke-linecap="round" opacity="0.75"/>
    <!-- crisp outer ink rim -->
    <polygon points="32,3 44,18 46,35 39,51 32,61 25,51 18,35 20,18" fill="none" stroke="#0d192e" stroke-width="2.2" stroke-linejoin="round"/>
  </g>
</svg>

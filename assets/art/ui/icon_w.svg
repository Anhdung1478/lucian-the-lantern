<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64">
  <!-- Ardent Blaze (W): Radiant tapered 4-pointed Sentinel light star / fiery cross-sigil exploding outward with layered warm gold-amber flare blades, glowing white core, and starburst sparks -->
  <defs>
    <radialGradient id="aura" cx="32" cy="32" r="31" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffcf54" stop-opacity="0.62"/>
      <stop offset="0.55" stop-color="#ff6a18" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#b83208" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreglow" cx="32" cy="32" r="17" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.42" stop-color="#ffe98f" stop-opacity="0.95"/>
      <stop offset="0.78" stop-color="#ff8c24" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff5a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bladeV" x1="32" y1="3" x2="32" y2="61" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff6214"/>
      <stop offset="0.28" stop-color="#ffb638"/>
      <stop offset="0.5" stop-color="#fff4b8"/>
      <stop offset="0.72" stop-color="#ffb638"/>
      <stop offset="1" stop-color="#ff5210"/>
    </linearGradient>
    <linearGradient id="bladeH" x1="3" y1="32" x2="61" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff5210"/>
      <stop offset="0.28" stop-color="#ffb638"/>
      <stop offset="0.5" stop-color="#fff4b8"/>
      <stop offset="0.72" stop-color="#ffb638"/>
      <stop offset="1" stop-color="#ff6214"/>
    </linearGradient>
    <linearGradient id="innerStar" x1="16" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#fff0a6"/>
      <stop offset="1" stop-color="#ffc247"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#aura)"/>

  <!-- Runic Sentinel sigil arcs behind the fiery star -->
  <g fill="none" stroke="#ff9d2e" stroke-width="2" stroke-linecap="round" opacity="0.75">
    <path d="M 19 19 A 18.5 18.5 0 0 1 25 14.8"/>
    <path d="M 39 14.8 A 18.5 18.5 0 0 1 45 19"/>
    <path d="M 49.2 25 A 18.5 18.5 0 0 1 49.2 39"/>
    <path d="M 45 45 A 18.5 18.5 0 0 1 39 49.2"/>
    <path d="M 25 49.2 A 18.5 18.5 0 0 1 19 45"/>
    <path d="M 14.8 39 A 18.5 18.5 0 0 1 14.8 25"/>
  </g>

  <!-- Secondary diagonal flame darts -->
  <path d="M 15.5 15.5 L 27.5 23.5 L 23.5 27.5 Z M 48.5 15.5 L 40.5 27.5 L 36.5 23.5 Z M 48.5 48.5 L 36.5 40.5 L 40.5 36.5 Z M 15.5 48.5 L 23.5 36.5 L 27.5 40.5 Z" fill="#ff7f1f" stroke="#1a1d24" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M 18 18 L 26.5 24 L 24 26.5 Z M 46 18 L 40 26.5 L 37.5 24 Z M 46 46 L 37.5 40 L 40 37.5 Z M 18 46 L 24 37.5 L 26.5 40 Z" fill="#ffd970"/>

  <!-- Main 4-pointed Sentinel light star / fiery cross blades -->
  <path d="M 32 3 C 34.8 14 37.8 22.8 41.2 22.8 C 41.2 26.2 50 29.2 61 32 C 50 34.8 41.2 37.8 41.2 41.2 C 37.8 41.2 34.8 50 32 61 C 29.2 50 26.2 41.2 22.8 41.2 C 22.8 37.8 14 34.8 3 32 C 14 29.2 22.8 26.2 22.8 22.8 C 26.2 22.8 29.2 14 32 3 Z" fill="url(#bladeV)" stroke="#1a1d24" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Horizontal flame warmth glaze -->
  <path d="M 5.5 32 C 15.5 29.6 23.5 27 24.4 24.4 L 39.6 24.4 C 40.5 27 48.5 29.6 58.5 32 C 48.5 34.4 40.5 37 39.6 39.6 L 24.4 39.6 C 23.5 37 15.5 34.4 5.5 32 Z" fill="url(#bladeH)" opacity="0.72"/>

  <!-- Inner blazing golden-white Sentinel star -->
  <path d="M 32 10 L 36.2 27.8 L 54 32 L 36.2 36.2 L 32 54 L 27.8 36.2 L 10 32 L 27.8 27.8 Z" fill="url(#innerStar)"/>
  <!-- Crisp sunlit blade ridge highlights -->
  <path d="M 32 10 L 32 54 M 10 32 L 54 32" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" opacity="0.9"/>

  <!-- Glowing incandescent white-gold core -->
  <circle cx="32" cy="32" r="17" fill="url(#coreglow)"/>
  <path d="M 32 23.5 L 40.5 32 L 32 40.5 L 23.5 32 Z" fill="#fffdf2" stroke="#ffad33" stroke-width="1.4" stroke-linejoin="round"/>
  <circle cx="32" cy="32" r="4.2" fill="#ffffff"/>

  <!-- Fine starburst sparks & embers -->
  <path d="M 11 11 L 12 13.4 L 14.4 14.4 L 12 15.4 L 11 17.8 L 10 15.4 L 7.6 14.4 L 10 13.4 Z" fill="#fff2b8"/>
  <path d="M 53 10 L 53.9 12.1 L 56 13 L 53.9 13.9 L 53 16 L 52.1 13.9 L 50 13 L 52.1 12.1 Z" fill="#ffd266"/>
  <path d="M 52 50 L 53 52.4 L 55.4 53.4 L 53 54.4 L 52 56.8 L 51 54.4 L 48.6 53.4 L 51 52.4 Z" fill="#fff2b8"/>
  <path d="M 12 49 L 12.9 51.1 L 15 52 L 12.9 52.9 L 12 55 L 11.1 52.9 L 9 52 L 11.1 51.1 Z" fill="#ffb84d"/>
  <circle cx="20" cy="8" r="1.4" fill="#ffe180"/>
  <circle cx="56" cy="21" r="1.3" fill="#ff9e38"/>
  <circle cx="44" cy="56" r="1.4" fill="#ffe180"/>
  <circle cx="8" cy="43" r="1.3" fill="#ff9e38"/>
</svg>

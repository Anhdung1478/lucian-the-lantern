<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Orange essence: two crossed crystal shards with an ember core where they meet -->
  <defs>
    <radialGradient id="glow"><stop offset="0" stop-color="#ffa040" stop-opacity="0.55"/><stop offset="1" stop-color="#ffa040" stop-opacity="0"/></radialGradient>
    <radialGradient id="ember"><stop offset="0" stop-color="#ffffff"/><stop offset="0.3" stop-color="#fff0b0"/><stop offset="0.65" stop-color="#ff7a1a" stop-opacity="0.8"/><stop offset="1" stop-color="#ff5a10" stop-opacity="0"/></radialGradient>
    <linearGradient id="shard" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd6a3"/><stop offset="0.45" stop-color="#ffa040"/><stop offset="1" stop-color="#b8561a"/></linearGradient>
    <g id="shard_shape">
      <path d="M 32 3 L 40 15 L 38 49 L 32 61 L 26 49 L 24 15 Z" fill="url(#shard)" stroke="#1a1d24" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M 32 9 L 28 17 L 29 47 L 32 54 Z" fill="#ffe8c8" opacity="0.8"/>
    </g>
  </defs>
  <circle cx="32" cy="32" r="28" fill="url(#glow)"/>
  <use href="#shard_shape" transform="rotate(-28 32 32)"/>
  <use href="#shard_shape" transform="rotate(28 32 32)"/>
  <circle cx="32" cy="32" r="12" fill="url(#ember)"/>
  <circle cx="32" cy="32" r="3.5" fill="#fffbe8"/>
</svg>

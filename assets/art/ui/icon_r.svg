<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64">
  <!-- The Culling (R): Twin relic gun muzzles unleashing a relentless converging barrage of blazing golden-and-teal light-bolt streaks diagonally across the frame -->
  <defs>
    <radialGradient id="aura" cx="34" cy="30" r="31" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd966" stop-opacity="0.54"/>
      <stop offset="0.55" stop-color="#3cded6" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#175c6e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldBolt" x1="20" y1="42" x2="60" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff9922" stop-opacity="0.15"/>
      <stop offset="0.45" stop-color="#ffd454"/>
      <stop offset="1" stop-color="#fffef5"/>
    </linearGradient>
    <linearGradient id="tealBolt" x1="22" y1="48" x2="62" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#15a0a8" stop-opacity="0.15"/>
      <stop offset="0.45" stop-color="#4af2e6"/>
      <stop offset="1" stop-color="#f2ffff"/>
    </linearGradient>
    <radialGradient id="flareGold" cx="18" cy="37" r="9" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#ffdf75" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff991f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="flareTeal" cx="25" cy="48" r="9" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#5efff2" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#14a8a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="silverGun" x1="4" y1="38" x2="20" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f4f8fc"/>
      <stop offset="0.55" stop-color="#aebbd0"/>
      <stop offset="1" stop-color="#59657a"/>
    </linearGradient>
    <linearGradient id="darkGun" x1="10" y1="48" x2="26" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6c7b91"/>
      <stop offset="0.55" stop-color="#353f52"/>
      <stop offset="1" stop-color="#191f2a"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#aura)"/>

  <!-- Background velocity speed wash behind the volley -->
  <path d="M 18 33 L 58 4 L 61 12 L 26 48 Z" fill="#ffe17d" opacity="0.14"/>
  <path d="M 24 44 L 62 12 L 62 24 L 30 53 Z" fill="#4af2e6" opacity="0.14"/>

  <!-- Relentless converging barrage of blazing gold & teal light-bolts -->
  <!-- Row 1 (upper gold lane) -->
  <polygon points="21,31 35,20 36.2,21.8 22.2,32.5" fill="#ffb838" opacity="0.85"/>
  <polygon points="36,18 52,5.5 53.6,7.8 37.4,19.8" fill="url(#goldBolt)"/>
  <path d="M 41 15 L 52.6 6.7" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Row 2 (upper-mid teal lane) -->
  <polygon points="26,34.5 41,23 42.6,25 27.5,36.2" fill="url(#tealBolt)"/>
  <path d="M 32 30.8 L 41.8 24" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="44,20 60.5,7.8 62,10.2 45.5,22" fill="url(#tealBolt)"/>
  <path d="M 50 16.5 L 61.2 9" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Row 3 (central blistering gold lane) -->
  <polygon points="23,41 37,30.5 38.6,32.8 24.4,42.8" fill="url(#goldBolt)"/>
  <path d="M 28.5 37.5 L 37.8 31.6" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round"/>
  <polygon points="40,28.5 57.5,15.5 59.2,18 41.6,30.6" fill="url(#goldBolt)"/>
  <path d="M 46.5 24.4 L 58.3 16.7" stroke="#ffffff" stroke-width="1.9" stroke-linecap="round"/>

  <!-- Row 4 (lower-mid teal lane) -->
  <polygon points="30,43.5 46,32 47.6,34.2 31.5,45.2" fill="url(#tealBolt)"/>
  <path d="M 36.5 39.6 L 46.8 33.1" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
  <polygon points="49,29.5 61.5,20.8 62.6,22.9 50.4,31.2" fill="url(#tealBolt)"/>
  <path d="M 53.5 27 L 62 21.8" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Row 5 (lower gold lane) -->
  <polygon points="32,49 46.5,39 47.8,40.9 33.2,50.5" fill="url(#goldBolt)"/>
  <path d="M 38.5 45.2 L 47.1 39.9" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="48.5,37.2 59.5,29.8 60.6,31.5 49.8,38.6" fill="#ffd966" opacity="0.9"/>

  <!-- Twin Muzzle Flares -->
  <circle cx="18" cy="37" r="9" fill="url(#flareGold)"/>
  <path d="M 18 30 L 19.4 35.6 L 25 37 L 19.4 38.4 L 18 44 L 16.6 38.4 L 11 37 L 16.6 35.6 Z" fill="#fffdf0"/>

  <circle cx="25" cy="48" r="9" fill="url(#flareTeal)"/>
  <path d="M 25 41 L 26.4 46.6 L 32 48 L 26.4 49.4 L 25 55 L 23.6 49.4 L 18 48 L 23.6 46.6 Z" fill="#f0ffff"/>

  <!-- Upper Sentinel Gun Muzzle (silver-gold) -->
  <g transform="translate(8 45) rotate(-37)">
    <path d="M -7 -4.6 L 10.5 -4.6 L 14 -2.2 L 13 2.4 L -7 2.4 Z" fill="url(#silverGun)" stroke="#1a1d24" stroke-width="2" stroke-linejoin="round"/>
    <path d="M -6 -4.6 L 10 -4.6 L 12.6 -2.5 L -6 -2.5 Z" fill="#e5ae3e"/>
    <path d="M -2 -1.2 L 8.5 -1.2 L 9.5 0 L 8.5 1 L -2 1 Z" fill="#ffe67a"/>
    <path d="M -4 -3.6 L 8.5 -3.6" stroke="#ffffff" stroke-width="1.1" stroke-linecap="round"/>
  </g>

  <!-- Lower Sentinel Gun Muzzle (gunmetal-teal) -->
  <g transform="translate(15 55.5) rotate(-37)">
    <path d="M -7 -4.6 L 10.5 -4.6 L 14 -2.2 L 13 2.4 L -7 2.4 Z" fill="url(#darkGun)" stroke="#1a1d24" stroke-width="2" stroke-linejoin="round"/>
    <path d="M -6 -4.6 L 10 -4.6 L 12.6 -2.5 L -6 -2.5 Z" fill="#7c8da6" opacity="0.55"/>
    <path d="M -2 -1.2 L 8.5 -1.2 L 9.5 0 L 8.5 1 L -2 1 Z" fill="#4cf5e6"/>
    <path d="M -4 -3.6 L 8.5 -3.6" stroke="#d9ecff" stroke-width="1.1" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Crisp speed sparks -->
  <path d="M 32 10 L 32.9 12.1 L 35 13 L 32.9 13.9 L 32 16 L 31.1 13.9 L 29 13 L 31.1 12.1 Z" fill="#fff2ba"/>
  <path d="M 55 41 L 55.8 42.8 L 57.6 43.6 L 55.8 44.4 L 55 46.2 L 54.2 44.4 L 52.4 43.6 L 54.2 42.8 Z" fill="#8ffff6"/>
  <circle cx="24" cy="21" r="1.3" fill="#ffe07a"/>
  <circle cx="44" cy="49" r="1.3" fill="#70fff5"/>
</svg>

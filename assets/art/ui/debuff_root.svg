<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Root: green vines bind a boot to the ground -->
  <rect width="64" height="64" fill="#13221a"/>
  <!-- ground -->
  <rect x="4" y="51" width="56" height="9" rx="3" fill="#4a3a28" stroke="#1a1d24" stroke-width="3"/>
  <!-- boot -->
  <path d="M 18 8 L 32 8 L 32 30 L 46 35 C 51 37 51 44 46 44 L 18 44 Z" fill="#8a96a8" stroke="#1a1d24" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 19 39 L 49 39" stroke="#5a6474" stroke-width="2.4"/>
  <!-- vines out of the ground, crossed over the ankle -->
  <path d="M 10 53 C 10 40 30 34 38 22" fill="none" stroke="#1a1d24" stroke-width="8" stroke-linecap="round"/>
  <path d="M 54 53 C 52 42 26 36 12 22" fill="none" stroke="#1a1d24" stroke-width="8" stroke-linecap="round"/>
  <path d="M 10 53 C 10 40 30 34 38 22" fill="none" stroke="#4fd060" stroke-width="4" stroke-linecap="round"/>
  <path d="M 54 53 C 52 42 26 36 12 22" fill="none" stroke="#4fd060" stroke-width="4" stroke-linecap="round"/>
  <!-- leaves -->
  <path d="M 38 22 C 44 16 50 18 50 18 C 46 24 40 24 38 22 Z" fill="#4fd060" stroke="#1a1d24" stroke-width="2" stroke-linejoin="round"/>
  <path d="M 12 22 C 8 15 3 16 3 16 C 5 23 10 24 12 22 Z" fill="#4fd060" stroke="#1a1d24" stroke-width="2" stroke-linejoin="round"/>
</svg>
